<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Beast AR — Step 2.2 Ember Dragon</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
body{position:fixed;inset:0}
a-scene{position:fixed!important;inset:0;width:100%!important;height:100%!important}
video{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;z-index:0!important}
.a-canvas,canvas{background:transparent!important}
#ui{position:fixed;z-index:20;top:18px;left:0;width:100%;text-align:center;pointer-events:none}
.logo{font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000}
.logo span{color:#b75cff}
#status{
 display:inline-block;margin-top:12px;padding:10px 20px;border:1px solid #b75cff;
 border-radius:30px;color:#68ff9b;background:rgba(5,0,12,.72);font-weight:800
}
#info{
 position:fixed;z-index:20;left:5%;right:5%;bottom:20px;padding:14px 18px;
 border:1px solid #7d35b8;border-radius:24px;background:rgba(5,0,12,.80);
 color:#fff;text-align:center;font-size:17px;line-height:1.45;pointer-events:none
}
.ok{color:#68ff9b}.err{color:#ff6b6b}
</style>
</head>

<body>

<div id="ui">
  <div class="logo">CARD <span>BEAST</span> AR</div>
  <div id="status">INITIALISING AR…</div>
</div>

<div id="info">
  Point the rear camera at <b>DR-001 Ember Dragon</b>.
</div>

<a-scene
 id="scene"
 embedded
 vr-mode-ui="enabled:false"
 device-orientation-permission-ui="enabled:false"
 renderer="alpha:true; colorManagement:true"
 mindar-image="imageTargetSrc:./targets.mind; autoStart:true; uiScanning:false; uiLoading:false; uiError:false"
 loading-screen="enabled:false">

 <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

 <a-entity id="target" mindar-image-target="targetIndex:0">

   <!-- STEP 2.2: EMBER DRAGON -->
   <a-entity id="dragon" visible="false" position="0 0 0.08" scale="0.72 0.72 0.72">

     <!-- aura -->
     <a-torus rotation="90 0 0" radius="0.72" radius-tubular="0.018"
       color="#8b35ff" opacity="0.55"
       material="transparent:true;shader:flat"
       animation="property:rotation;to:90 360 0;dur:4200;loop:true;easing:linear">
     </a-torus>

     <a-sphere radius="0.78" color="#7a2cff" opacity="0.08"
       material="transparent:true;shader:flat"
       animation="property:scale;to:1.12 1.12 1.12;dir:alternate;dur:800;loop:true">
     </a-sphere>

     <!-- dragon body -->
     <a-sphere position="0 -0.02 0" scale="0.34 0.48 0.28"
       color="#35105f" material="roughness:0.45;metalness:0.35">
     </a-sphere>

     <!-- neck -->
     <a-cylinder position="0 0.30 0" radius="0.16" height="0.52"
       color="#4a147d" material="roughness:0.42;metalness:0.3"
       animation="property:rotation;from:-4 0 0;to:4 0 0;dir:alternate;dur:1100;loop:true">
     </a-cylinder>

     <!-- head -->
     <a-sphere position="0 0.60 0.01" scale="0.28 0.24 0.25"
       color="#54188f" material="roughness:0.38;metalness:0.32">
     </a-sphere>

     <!-- snout -->
     <a-cone position="0 0.57 0.25" rotation="90 0 0"
       radius-bottom="0.15" radius-top="0.035" height="0.30"
       color="#6c20aa">
     </a-cone>

     <!-- horns -->
     <a-cone position="-0.17 0.78 0" rotation="0 0 -22"
       radius-bottom="0.055" radius-top="0" height="0.28" color="#d6a4ff">
     </a-cone>
     <a-cone position="0.17 0.78 0" rotation="0 0 22"
       radius-bottom="0.055" radius-top="0" height="0.28" color="#d6a4ff">
     </a-cone>

     <!-- eyes -->
     <a-sphere position="-0.105 0.65 0.225" radius="0.035" color="#ff8cff"
       material="shader:flat">
     </a-sphere>
     <a-sphere position="0.105 0.65 0.225" radius="0.035" color="#ff8cff"
       material="shader:flat">
     </a-sphere>

     <!-- wings -->
     <a-triangle position="-0.36 0.30 0" rotation="0 0 8"
       vertex-a="-0.02 0.45 0" vertex-b="-0.02 -0.12 0" vertex-c="-0.58 0.10 0"
       color="#7625c9" opacity="0.86" material="side:double;transparent:true;shader:flat"
       animation="property:rotation;from:0 0 5;to:0 0 13;dir:alternate;dur:850;loop:true">
     </a-triangle>

     <a-triangle position="0.36 0.30 0" rotation="0 0 -8"
       vertex-a="0.02 0.45 0" vertex-b="0.02 -0.12 0" vertex-c="0.58 0.10 0"
       color="#7625c9" opacity="0.86" material="side:double;transparent:true;shader:flat"
       animation="property:rotation;from:0 0 -5;to:0 0 -13;dir:alternate;dur:850;loop:true">
     </a-triangle>

     <!-- chest glow -->
     <a-sphere position="0 0.16 0.275" radius="0.10"
       color="#b75cff" opacity="0.9" material="shader:flat"
       animation="property:scale;to:1.25 1.25 1.25;dir:alternate;dur:650;loop:true">
     </a-sphere>

     <!-- tail segments -->
     <a-sphere position="0 -0.32 -0.05" scale="0.22 0.18 0.25" color="#451276"></a-sphere>
     <a-sphere position="0.12 -0.47 -0.02" scale="0.17 0.14 0.20" color="#5b1a91"></a-sphere>
     <a-sphere position="0.27 -0.57 0.01" scale="0.12 0.10 0.15" color="#7625b8"></a-sphere>
     <a-cone position="0.38 -0.64 0.02" rotation="0 0 -58"
       radius-bottom="0.10" radius-top="0" height="0.28" color="#a34cff">
     </a-cone>

     <!-- floating ember orbs -->
     <a-sphere position="-0.62 0.15 0.02" radius="0.035" color="#d08cff"
       animation="property:position;to:-0.62 0.32 0.02;dir:alternate;dur:900;loop:true">
     </a-sphere>
     <a-sphere position="0.62 0.02 0.03" radius="0.025" color="#b75cff"
       animation="property:position;to:0.62 0.20 0.03;dir:alternate;dur:1100;loop:true">
     </a-sphere>

     <!-- small title plate -->
     <a-plane position="0 -0.88 0" width="1.25" height="0.18"
       color="#12051f" opacity="0.88" material="transparent:true;shader:flat">
     </a-plane>

     <a-text value="EMBER DRAGON"
       position="0 -0.88 0.015"
       align="center"
       color="#e5b6ff"
       width="1.7"
       side="double">
     </a-text>

   </a-entity>
 </a-entity>
</a-scene>

<script>
(function(){
 const scene=document.getElementById('scene');
 const target=document.getElementById('target');
 const dragon=document.getElementById('dragon');
 const status=document.getElementById('status');
 const info=document.getElementById('info');

 function statusText(t,c){status.textContent=t;status.className=c||''}
 function infoText(t){info.innerHTML=t}

 scene.addEventListener('loaded',()=>{
   statusText('AR INITIALISING…');
   infoText('Loading <b>DR-001 Ember Dragon</b> target…');
 });

 scene.addEventListener('arReady',()=>{
   statusText('CAMERA ACTIVE ✓','ok');
   infoText('Point the rear camera at <b>DR-001 Ember Dragon</b>.');
 });

 target.addEventListener('targetFound',()=>{
   dragon.setAttribute('visible','true');
   statusText('CARD CONFIRMED • DR-001','ok');
   infoText('🔥 <b>EMBER DRAGON DETECTED</b><br>🟣 Step 2.2 monster overlay active.');
 });

 target.addEventListener('targetLost',()=>{
   dragon.setAttribute('visible','false');
   statusText('CAMERA ACTIVE ✓','ok');
   infoText('Point the rear camera at <b>DR-001 Ember Dragon</b>.');
 });

 scene.addEventListener('arError',()=>{
   statusText('AR ERROR','err');
   infoText('MindAR gagal dimulakan.');
 });
})();
</script>

</body>
</html>
