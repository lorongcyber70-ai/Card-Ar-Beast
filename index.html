<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Beast AR — Step 2.3</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
body{position:fixed;inset:0}
a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important;background:transparent!important}
canvas{background:transparent!important}
#ui{position:fixed;z-index:20;top:18px;left:0;width:100%;text-align:center;pointer-events:none}
.logo{font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000}
.logo span{color:#b75cff}
#status{display:inline-block;margin-top:12px;padding:10px 20px;border:1px solid #b75cff;border-radius:30px;color:#68ff9b;background:rgba(5,0,12,.82);font-weight:800}
#info{position:fixed;z-index:20;left:5%;right:5%;bottom:20px;padding:14px 18px;border:1px solid #7d35b8;border-radius:24px;background:rgba(5,0,12,.84);color:#fff;text-align:center;font-size:17px;line-height:1.45;pointer-events:none}
</style>
</head>

<body>
<div id="ui">
  <div class="logo">CARD <span>BEAST</span> AR</div>
  <div id="status">INITIALISING…</div>
</div>

<div id="info">Point the rear camera at <b>DR-001 Ember Dragon</b>.</div>

<a-scene
  id="scene"
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true;antialias:true;colorManagement:true"
  mindar-image="imageTargetSrc:./targets.mind;autoStart:true;uiScanning:false;uiLoading:false;uiError:false"
  loading-screen="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex:0">

    <!-- STEP 2.3: smaller, centered Ember Dragon -->
    <a-entity id="beast" visible="false" position="0 0 0.16" scale="0.62 0.62 0.62">

      <!-- Purple aura -->
      <a-sphere
        radius="0.92"
        material="shader:flat;color:#742cff;transparent:true;opacity:0.18"
        animation="property:scale;from:0.94 0.94 0.94;to:1.08 1.08 1.08;dir:alternate;dur:850;loop:true">
      </a-sphere>

      <!-- Main body -->
      <a-sphere
        position="0 -0.03 0.08"
        scale="0.72 0.46 0.40"
        material="shader:flat;color:#35106e">
      </a-sphere>

      <!-- Belly -->
      <a-sphere
        position="0 -0.05 0.42"
        scale="0.47 0.30 0.18"
        material="shader:flat;color:#7024c7">
      </a-sphere>

      <!-- Neck -->
      <a-cylinder
        position="0 0.34 0.08"
        radius="0.20"
        height="0.58"
        material="shader:flat;color:#50109a">
      </a-cylinder>

      <!-- Head -->
      <a-sphere
        position="0 0.68 0.10"
        scale="0.39 0.32 0.34"
        material="shader:flat;color:#7828db">
      </a-sphere>

      <!-- Snout -->
      <a-sphere
        position="0 0.61 0.40"
        scale="0.25 0.14 0.20"
        material="shader:flat;color:#a54bff">
      </a-sphere>

      <!-- Horns -->
      <a-cone position="-0.21 0.94 0.08" radius-bottom="0.10" radius-top="0" height="0.34"
        rotation="0 0 -18" material="shader:flat;color:#d995ff"></a-cone>
      <a-cone position="0.21 0.94 0.08" radius-bottom="0.10" radius-top="0" height="0.34"
        rotation="0 0 18" material="shader:flat;color:#d995ff"></a-cone>

      <!-- Eyes -->
      <a-sphere position="-0.14 0.71 0.38" radius="0.047" material="shader:flat;color:#fff"></a-sphere>
      <a-sphere position="0.14 0.71 0.38" radius="0.047" material="shader:flat;color:#fff"></a-sphere>

      <!-- Wings -->
      <a-triangle
        position="-0.54 0.17 0"
        vertex-a="0 0.62 0"
        vertex-b="-0.68 -0.12 0"
        vertex-c="0.04 -0.18 0"
        material="shader:flat;color:#8d32e8;side:double;opacity:0.90">
      </a-triangle>

      <a-triangle
        position="0.54 0.17 0"
        vertex-a="0 0.62 0"
        vertex-b="0.68 -0.12 0"
        vertex-c="-0.04 -0.18 0"
        material="shader:flat;color:#8d32e8;side:double;opacity:0.90">
      </a-triangle>

      <!-- Wing highlights -->
      <a-cylinder position="-0.67 0.33 0.04" radius="0.025" height="0.66"
        rotation="0 0 -62" material="shader:flat;color:#d995ff"></a-cylinder>
      <a-cylinder position="0.67 0.33 0.04" radius="0.025" height="0.66"
        rotation="0 0 62" material="shader:flat;color:#d995ff"></a-cylinder>

      <!-- Tail -->
      <a-torus
        position="0 -0.31 -0.03"
        radius="0.38"
        radius-tubular="0.065"
        rotation="90 0 0"
        arc="285"
        material="shader:flat;color:#6420bd">
      </a-torus>

      <!-- Core -->
      <a-sphere
        position="0 0.00 0.50"
        radius="0.11"
        material="shader:flat;color:#ff5cff"
        animation="property:scale;from:0.88 0.88 0.88;to:1.18 1.18 1.18;dir:alternate;dur:520;loop:true">
      </a-sphere>

      <!-- Fire particles -->
      <a-sphere position="-0.42 0.52 0.18" radius="0.035"
        material="shader:flat;color:#f0b8ff"
        animation="property:position;to:-0.48 0.66 0.18;dir:alternate;dur:720;loop:true"></a-sphere>

      <a-sphere position="0.42 0.52 0.18" radius="0.035"
        material="shader:flat;color:#f0b8ff"
        animation="property:position;to:0.48 0.66 0.18;dir:alternate;dur:720;loop:true"></a-sphere>

      <!-- Subtle floating animation: whole dragon breathes without changing tracking -->
      <a-entity
        animation="property:position;from:0 -0.025 0.16;to:0 0.025 0.16;dir:alternate;dur:1200;loop:true">
      </a-entity>

    </a-entity>
  </a-entity>
</a-scene>

<script>
(function(){
  const scene=document.getElementById('scene');
  const target=document.getElementById('target');
  const beast=document.getElementById('beast');
  const status=document.getElementById('status');
  const info=document.getElementById('info');

  scene.addEventListener('loaded',()=>{
    status.textContent='AR INITIALISING…';
    info.innerHTML='Loading MindAR target <b>DR-001</b>…';
  });

  scene.addEventListener('arReady',()=>{
    status.textContent='CAMERA ACTIVE ✓';
    info.innerHTML='Point the rear camera at <b>DR-001 Ember Dragon</b>.';
  });

  target.addEventListener('targetFound',()=>{
    beast.setAttribute('visible','true');
    status.textContent='CARD CONFIRMED • DR-001';
    info.innerHTML='🔥 <b>EMBER DRAGON DETECTED</b><br>🟣 Step 2.3 — centered AR monster active.';
  });

  target.addEventListener('targetLost',()=>{
    beast.setAttribute('visible','false');
    status.textContent='CAMERA ACTIVE ✓';
    info.innerHTML='Point the rear camera at <b>DR-001 Ember Dragon</b>.';
  });

  scene.addEventListener('arError',()=>{
    status.textContent='AR ERROR';
    info.innerHTML='MindAR gagal dimulakan.';
  });
})();
</script>
</body>
</html>
