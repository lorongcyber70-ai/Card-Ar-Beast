<script>

/* =========================================================
   CARD BEAST AR v66.4

   ABYSS TIGER FIRE SWIRL

   NO GLB CHANGE
   NO TARGET CHANGE
   NO CAMERA CHANGE
========================================================= */

const beasts = [

    {
        id:"DR-001",
        name:"Ember Dragon",
        emoji:"🔥",
        target:0,
        model:"dragonModel"
    },

    {

    },

    {
        id:"DR-005",
        name:"Tidal Leviathan",
        emoji:"🌊",
        target:4,
        model:"leviathanModel"
    }

];


const state = beasts.map(() => ({
    found:false,
    loaded:false,
    loadCount:0
}));


const scene =
    document.getElementById("scene");

const mainStatus =
    document.getElementById("mainStatus");

const bottom =
    document.getElementById("bottom");


/* =========================================================
   CREATE FIRE TEXTURE
========================================================= */

function createFireTexture(){

    const canvas =
        document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 512;

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        512,
        512
    );

    ctx.save();

    ctx.translate(256,256);

    /*
     * DARK INNER BRUSH STROKES
     */

    for(let i=0;i<9;i++){

        ctx.beginPath();

        const start =
            Math.random()*Math.PI*2;

        const length =
            1.3 + Math.random()*1.5;

        const radius =
            60 + Math.random()*80;

        for(
            let p=0;
            p<30;
            p++
        ){

            const t=p/29;

            const angle =
                start +
                t*length;

            const r =
                radius +
                Math.sin(t*10+i)*18 +
                t*45;

            const x =
                Math.cos(angle)*r;

            const y =
                Math.sin(angle)*r;

            if(p===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);
        }

        ctx.strokeStyle =
            "rgba(20,4,2,.8)";

        ctx.lineWidth =
            3 + Math.random()*5;

        ctx.lineCap="round";

        ctx.stroke();
    }


    /*
     * ORANGE FIRE SWIRLS
     */

    for(let i=0;i<13;i++){

        ctx.beginPath();

        const start =
            Math.random()*Math.PI*2;

        const direction =
            i%2===0 ? 1 : -1;

        const length =
            1.0 +
            Math.random()*2.0;

        const baseRadius =
            45 +
            Math.random()*105;

        for(
            let p=0;
            p<42;
            p++
        ){

            const t=p/41;

            const angle =
                start +
                direction*
                t*length;

            const wave =
                Math.sin(
                    t*16+i*1.7
                )*12;

            const r =
                baseRadius +
                t*65 +
                wave;

            const x =
                Math.cos(angle)*r;

            const y =
                Math.sin(angle)*r;

            if(p===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);
        }

        /*
         * outer glow
         */

        ctx.shadowColor =
            "rgba(255,75,0,.9)";

        ctx.shadowBlur =
            16;

        ctx.strokeStyle =
            i%3===0
            ? "rgba(255,245,180,.95)"
            : "rgba(255,105,15,.95)";

        ctx.lineWidth =
            3 +
            Math.random()*6;

        ctx.lineCap="round";

        ctx.stroke();

        ctx.shadowBlur=0;
    }


    /*
     * WHITE HOT CORE
     */

    for(let i=0;i<7;i++){

        ctx.beginPath();

        const start =
            Math.random()*Math.PI*2;

        const radius =
            25 +
            Math.random()*45;

        for(
            let p=0;
            p<25;
            p++
        ){

            const t=p/24;

            const angle =
                start +
                t*
                (0.8+
                 Math.random()*.7);

            const r =
                radius +
                t*30;

            const x =
                Math.cos(angle)*r;

            const y =
                Math.sin(angle)*r;

            if(p===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);
        }

        ctx.shadowColor =
            "#ff6a00";

        ctx.shadowBlur=25;

        ctx.strokeStyle =
            "rgba(255,245,210,.95)";

        ctx.lineWidth =
            3+
            Math.random()*4;

        ctx.stroke();

        ctx.shadowBlur=0;
    }

    ctx.restore();

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.needsUpdate=true;

    return texture;
}


/* =========================================================
   ABYSS FIRE SWIRL COMPONENT
========================================================= */

AFRAME.registerComponent(
"abyss-fire-swirl",
{

init:function(){

    this.active=false;

    this.time=0;

    this.layers=[];

    this.sparks=[];

    this.createVFX();

},


createVFX:function(){

    const texture =
        createFireTexture();


    /*
     * MAIN SWIRL LAYERS
     */

    const settings = [

        {
            scale:1.05,
            opacity:.95,
            speed:1.15,
            y:0.01,
            z:0
        },

        {
            scale:.82,
            opacity:.85,
            speed:-1.65,
            y:0.025,
            z:0.01
        },

        {
            scale:.63,
            opacity:.95,
            speed:2.0,
            y:0.04,
            z:0.015
        },

        {
            scale:1.28,
            opacity:.40,
            speed:-.65,
            y:0.00,
            z:-.01
        }

    ];


    settings.forEach(
    (s,index)=>{

        const mesh =
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    1,
                    1
                ),

                new THREE.MeshBasicMaterial({

                    map:texture,

                    transparent:true,

                    opacity:s.opacity,

                    depthWrite:false,

                    depthTest:false,

                    blending:
                        THREE.AdditiveBlending,

                    side:
                        THREE.DoubleSide

                })

            );


        mesh.rotation.x =
            -Math.PI/2;

        mesh.position.y =
            s.y;

        mesh.position.z =
            s.z;

        mesh.scale.set(
            s.scale,
            s.scale,
            s.scale
        );


        mesh.userData.speed =
            s.speed;

        mesh.userData.base =
            s.scale;

        mesh.userData.index =
            index;


        mesh.visible=false;

        this.el.object3D.add(
            mesh
        );

        this.layers.push(
            mesh
        );

    });


    /*
     * SPARKS
     */

    for(let i=0;i<28;i++){

        const geometry =
            new THREE.SphereGeometry(
                0.006+
                Math.random()*.012,
                5,
                5
            );


        const material =
            new THREE.MeshBasicMaterial({

                color:
                    i%4===0
                    ?0xffffff
                    :0xff8a16,

                transparent:true,

                opacity:
                    .4+
                    Math.random()*.6,

                depthWrite:false,

                depthTest:false,

                blending:
                    THREE.AdditiveBlending

            });


        const spark =
            new THREE.Mesh(
                geometry,
                material
            );


        spark.userData.angle =
            Math.random()*
            Math.PI*2;

        spark.userData.radius =
            .22+
            Math.random()*.55;

        spark.userData.height =
            .02+
            Math.random()*.10;

        spark.userData.speed =
            .35+
            Math.random()*1.5;

        spark.userData.phase =
            Math.random()*Math.PI*2;

        spark.visible=false;

        this.el.object3D.add(
            spark
        );

        this.sparks.push(
            spark
        );

    }


    /*
     * CENTRAL GLOW
     */

    const glow =
        new THREE.Mesh(

            new THREE.CircleGeometry(
                .20,
                32
            ),

            new THREE.MeshBasicMaterial({

                color:0xff7200,

                transparent:true,

                opacity:.22,

                depthWrite:false,

                depthTest:false,

                blending:
                    THREE.AdditiveBlending,

                side:
                    THREE.DoubleSide

            })

        );

    glow.rotation.x =
        -Math.PI/2;

    glow.position.y=.005;

    glow.visible=false;

    this.el.object3D.add(
        glow
    );

    this.glow=glow;

},


setActive:function(active){

    this.active=active;

    this.el.object3D.visible=
        active;

    this.layers.forEach(
        mesh=>{
            mesh.visible=active;
        }
    );

    this.sparks.forEach(
        spark=>{
            spark.visible=active;
        }
    );

    if(this.glow)
        this.glow.visible=active;

},


tick:function(time,delta){

    if(!this.active)
        return;

    this.time +=
        delta*.001;

    const t=
        this.time;


    /*
     * SWIRL ROTATION
     */

    this.layers.forEach(
        mesh=>{

            mesh.rotation.z +=
                mesh.userData.speed*
                delta*.001;


            const pulse =
                1+
                Math.sin(
                    t*3+
                    mesh.userData.index
                )*.055;

            const size =
                mesh.userData.base*
                pulse;

            mesh.scale.x=size;
            mesh.scale.y=size;

        }
    );


    /*
     * CENTRAL GLOW PULSE
     */

    if(this.glow){

        const pulse =
            1+
            Math.sin(t*5)*.15;

        this.glow.scale.set(
            pulse,
            pulse,
            pulse
        );

        this.glow.material.opacity =
            .18+
            (
                Math.sin(t*4)+1
            )*.06;

    }


    /*
     * SPARK MOVEMENT
     */

    this.sparks.forEach(
    spark=>{

        const d =
            spark.userData;

        const angle =
            d.angle+
            t*d.speed;

        const radius =
            d.radius+
            Math.sin(
                t*2+
                d.phase
            )*.025;

        spark.position.x =
            Math.cos(angle)*
            radius;

        spark.position.z =
            Math.sin(angle)*
            radius;

        spark.position.y =
            d.height+
            (
                Math.sin(
                    t*2.5+
                    d.phase
                )+1
            )*.08;

        const scale =
            .7+
            (
                Math.sin(
                    t*6+
                    d.phase
                )+1
            )*.3;

        spark.scale.set(
            scale,
            scale,
            scale
        );

    });

}

}
);


/* =========================================================
   CAMERA LAYER
========================================================= */

function forceCameraLayer(){

    document
    .querySelectorAll("video")
    .forEach(video=>{

        video.classList.add(
            "mindar-video"
        );

        video.style.setProperty(
            "position",
            "fixed",
            "important"
        );

        video.style.setProperty(
            "top",
            "0",
            "important"
        );

        video.style.setProperty(
            "left",
            "0",
            "important"
        );

        video.style.setProperty(
            "width",
            "100vw",
            "important"
        );

        video.style.setProperty(
            "height",
            "100vh",
            "important"
        );

        video.style.setProperty(
            "object-fit",
            "cover",
            "important"
        );

        video.style.setProperty(
            "display",
            "block",
            "important"
        );

        video.style.setProperty(
            "visibility",
            "visible",
            "important"
        );

        video.style.setProperty(
            "opacity",
            "1",
            "important"
        );

        video.style.setProperty(
            "z-index",
            "0",
            "important"
        );

        video.style.setProperty(
            "pointer-events",
            "none",
            "important"
        );

        if(
            video.paused &&
            video.srcObject
        ){

            video.play()
            .catch(()=>{});

        }

    });


    const canvas =
        document.querySelector(
            "a-scene canvas"
        );

    if(canvas){

        canvas.style.setProperty(
            "position",
            "fixed",
            "important"
        );

        canvas.style.setProperty(
            "inset",
            "0",
            "important"
        );

        canvas.style.setProperty(
            "width",
            "100vw",
            "important"
        );

        canvas.style.setProperty(
            "height",
            "100vh",
            "important"
        );

        canvas.style.setProperty(
            "background",
            "transparent",
            "important"
        );

        canvas.style.setProperty(
            "z-index",
            "1",
            "important"
        );

    }


    try{

        if(
            scene &&
            scene.renderer
        ){

            scene.renderer.setClearColor(
                0x000000,
                0
            );

        }

    }
    catch(e){}

}


/* =========================================================
   BADGE
========================================================= */

function setBadge(
    index,
    text,
    cls
){

    const el =
        document.getElementById(
            "target"+index
        );

    if(!el)return;

    el.textContent=text;
    el.className=cls;

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    const active =
        beasts.filter(
            (b,i)=>
                state[i].found
        );


    if(!active.length){

        mainStatus.textContent =
            "CAMERA READY • SEARCHING";

        bottom.textContent =
            "📷 Point camera at any Card Beast target.";

        return;

    }


    if(active.length===1){

        const b=active[0];

        mainStatus.textContent =
            `${b.id} FOUND • ${b.name.toUpperCase()}`;

        bottom.innerHTML =
            `${b.emoji} <b>${b.name.toUpperCase()} ACTIVE</b> • ${b.id}`;

        return;

    }


    mainStatus.textContent =
        `${active.length} CARDS ACTIVE • `+
        active.map(
            b=>b.id
        ).join(" + ");

    bottom.innerHTML =
        active.map(
            b=>b.emoji+" "+b.id
        ).join(" + ")+
        " ACTIVE";

}


/* =========================================================
   PRELOAD
========================================================= */

function setupPreload(){

    beasts.forEach(
    (beast,index)=>{

        const model =
            document.getElementById(
                beast.model
            );

        if(!model)return;


        model.addEventListener(
            "model-loaded",
            ()=>{

                if(
                    state[index].loaded
                )return;

                state[index].loaded=true;

                state[index].loadCount++;

                console.log(
                    beast.id+
                    " GLB PRELOADED ONCE"
                );

            },
            {once:true}
        );


        model.addEventListener(
            "model-error",
            e=>{

                console.error(
                    beast.id+
                    " GLB LOAD ERROR",
                    e
                );

                setBadge(
                    index,
                    "GLB ERROR",
                    "err"
                );

            }
        );

    });

}


/* =========================================================
   TARGETS
========================================================= */

function setupTarget(index){

    const beast =
        beasts[index];

    const target =
        document.getElementById(
            "beast"+index
        );

    if(!target)return;


    target.addEventListener(
        "targetFound",
        ()=>{

            state[index].found=true;

            target.setAttribute(
                "visible",
                "true"
            );


            /*
             * ABYSS TIGER VFX ONLY
             */

            if(index===1){

                const vfx =
                    document.getElementById(
                        "abyssVFX"
                    );

                if(
                    vfx &&
                    vfx.components[
                        "abyss-fire-swirl"
                    ]
                ){

                    vfx.components[
                        "abyss-fire-swirl"
                    ].setActive(true);

                }

            }


            setBadge(
                index,
                "FOUND",
                "on"
            );

            updateUI();

            console.log(
                beast.id+
                " targetFound"
            );

        }
    );


    target.addEventListener(
        "targetLost",
        ()=>{

            state[index].found=false;

            target.setAttribute(
                "visible",
                "false"
            );


            if(index===1){

                const vfx =
                    document.getElementById(
                        "abyssVFX"
                    );

                if(
                    vfx &&
                    vfx.components[
                        "abyss-fire-swirl"
                    ]
                ){

                    vfx.components[
                        "abyss-fire-swirl"
                    ].setActive(false);

                }

            }


            setBadge(
                index,
                "LOST",
                "wait"
            );

            updateUI();

            console.log(
                beast.id+
                " targetLost"
            );

        }
    );

}


/* =========================================================
   SCENE LOADED
========================================================= */

scene.addEventListener(
"loaded",
()=>{

    beasts.forEach(
        (_,i)=>
            setupTarget(i)
    );

    setupPreload();

    forceCameraLayer();

    console.log(
        "CARD BEAST AR v66.4 READY"
    );

});


/* =========================================================
   AR READY
========================================================= */

scene.addEventListener(
"arReady",
()=>{

    const cameraState =
        document.getElementById(
            "cameraState"
        );

    if(cameraState){

        cameraState.textContent="READY";
        cameraState.className="on";

    }

    mainStatus.textContent =
        "CAMERA READY • SEARCHING";

    bottom.textContent =
        "📷 Point camera at any Card Beast target.";

    forceCameraLayer();

    setTimeout(
        forceCameraLayer,
        100
    );

    setTimeout(
        forceCameraLayer,
        300
    );

    setTimeout(
        forceCameraLayer,
        700
    );

    setTimeout(
        forceCameraLayer,
        1200
    );

    setTimeout(
        forceCameraLayer,
        2000
    );

});


/* =========================================================
   AR ERROR
========================================================= */

scene.addEventListener(
"arError",
e=>{

    console.error(
        "MINDAR AR ERROR",
        e
    );

    const cameraState =
        document.getElementById(
            "cameraState"
        );

    if(cameraState){

        cameraState.textContent="ERROR";
        cameraState.className="err";

    }

    mainStatus.textContent =
        "CAMERA ERROR";

    bottom.textContent =
        "Camera could not start.";

});


/* =========================================================
   CAMERA OBSERVER
========================================================= */

const videoObserver =
    new MutationObserver(
        ()=>forceCameraLayer()
    );

videoObserver.observe(
    document.body,
    {
        childList:true,
        subtree:true
    }
);


/* =========================================================
   WINDOW LOAD
========================================================= */

window.addEventListener(
"load",
()=>{

    forceCameraLayer();

    setTimeout(
        forceCameraLayer,
        300
    );

    setTimeout(
        forceCameraLayer,
        800
    );

    setTimeout(
        forceCameraLayer,
        1500
    );

});


/* =========================================================
   CONTINUOUS PROTECTION
========================================================= */

setInterval(
    forceCameraLayer,
    1000
);


/* =========================================================
   INITIAL BADGES
========================================================= */

beasts.forEach(
    (_,i)=>
        setBadge(
            i,
            "WAIT",
            "wait"
        )
);

</script>

</body>
</html>
