<!doctype html>
<html lang="ms">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Card Beast AR — DR-001 Baseline v46</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* =========================================
   CAMERA
========================================= */

video{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;
}

/* =========================================
   A-FRAME
========================================= */

a-scene{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;
}

.a-canvas,
canvas{
  background:transparent!important;
}

/* =========================================
   TOP UI
========================================= */

#ui{
  position:fixed;

  z-index:20;

  top:18px;
  left:0;

  width:100%;

  text-align:center;

  pointer-events:none;
}

.logo{
  font-size:28px;
  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px #000;
}

.logo span{
  color:#b75cff;
}

#status{

  display:inline-block;

  margin-top:12px;

  padding:10px 20px;

  border:1px solid #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.72);

  font-weight:800;

  box-shadow:
    0 0 12px rgba(183,92,255,.25);
}

/* =========================================
   INFO
========================================= */

#info{

  position:fixed;

  z-index:20;

  left:5%;
  right:5%;

  bottom:20px;

  padding:14px 18px;

  border:1px solid #7d35b8;

  border-radius:24px;

  background:rgba(5,0,12,.84);

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;

  box-shadow:
    0 0 18px rgba(125,53,184,.2);
}

.ok{
  color:#68ff9b;
}

.err{
  color:#ff6b6b;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

  .logo{
    font-size:27px;
  }

  #status{
    font-size:15px;
    padding:10px 18px;
  }

  #info{
    font-size:16px;
    left:5%;
    right:5%;
    bottom:18px;
  }

}

</style>
</head>


<body>


<!-- =========================================
     TOP UI
========================================= -->

<div id="ui">

  <div class="logo">
    CARD <span>BEAST</span> AR
  </div>

  <div id="status">
    INITIALISING CAMERA…
  </div>

</div>


<!-- =========================================
     INFO
========================================= -->

<div id="info">
  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.
</div>


<!-- =========================================
     A-FRAME + MINDAR
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind?v46;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="
    enabled:false
  "

>


  <!-- =======================================
       CAMERA
  ======================================== -->

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>


  <!-- =======================================
       DR-001 TARGET
  ======================================== -->

  <a-entity
    id="target"
    mindar-image-target="targetIndex:0"
  >


    <!-- =====================================
         BEAST PARENT

         POSITION:
         CENTER X = 0
         Y = -0.25
         Z = 0

         ROTATION:
         0 0 0

         FINAL SCALE:
         2.5
    ====================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 -0.25 0"

      rotation="0 0 0"

      scale="0.15 0.15 0.15"

    >


      <!-- ===================================
           DRAGON MODEL

           BASE ROTATION:
           90 0 0

           KEKAL

           POSITION:
           0 0 0

           SCALE:
           1 1 1
      ==================================== -->

      <a-entity

        id="dragonModel"

        gltf-model="./models/ember-dragon.glb?v46"

        position="0 0 0"

        rotation="90 0 0"

        scale="1 1 1"

      >
      </a-entity>


    </a-entity>


  </a-entity>


</a-scene>


<script>

(function(){

  /* =========================================
     ELEMENTS
  ========================================= */

  const scene =
    document.getElementById('scene');

  const target =
    document.getElementById('target');

  const beast =
    document.getElementById('beast');

  const dragonModel =
    document.getElementById('dragonModel');

  const status =
    document.getElementById('status');

  const info =
    document.getElementById('info');


  /* =========================================
     BASELINE SETTINGS
     
     JANGAN UBAH ROTATION
  ========================================= */

  const BASE_X = 0;

  const BASE_Y = -0.25;

  const BASE_Z = 0;

  const FINAL_SCALE = 2.5;


  /*
    Dragon rotation:

    90 0 0

    KEKAL
  */

  const DRAGON_ROTATION = "90 0 0";


  /* =========================================
     ANIMATION SETTINGS
     
     SCALE SAHAJA
     
     TIADA Z EMERGENCE
     
     SUPAYA NAGA TIDAK TERAPUNG
  ========================================= */

  const START_SCALE = 0.12;

  const GROW_SCALE = 2.72;

  const FINAL_SCALE_VALUE = 2.5;


  let modelLoaded = false;

  let isTracked = false;

  let emergencePlayed = false;


  /* =========================================
     STATUS
  ========================================= */

  function setStatus(text, cls){

    status.textContent = text;

    status.className = cls || '';

  }


  /* =========================================
     INFO
  ========================================= */

  function setInfo(html){

    info.innerHTML = html;

  }


  /* =========================================
     RESET POSITION
  ========================================= */

  function resetBeastPosition(){

    beast.object3D.position.set(

      BASE_X,

      BASE_Y,

      BASE_Z

    );

  }


  /* =========================================
     RESET DRAGON ROTATION
     
     IMPORTANT:
     
     JANGAN UBAH
  ========================================= */

  function resetDragonRotation(){

    dragonModel.setAttribute(
      'rotation',
      DRAGON_ROTATION
    );

  }


  /* =========================================
     SET SCALE
  ========================================= */

  function setBeastScale(value){

    beast.object3D.scale.set(

      value,
      value,
      value

    );

  }


  /* =========================================
     EPIC EMERGENCE
     
     PLAY ONCE PER TARGET FOUND
     
     SCALE SAHAJA
     
     NAGA KEKAL ATAS KAD
  ========================================= */

  function playEpicEmergence(){

    if(emergencePlayed){

      return;

    }

    emergencePlayed = true;


    /*
      Pastikan kedudukan
      kembali ke tengah kad.
    */

    resetBeastPosition();


    /*
      Pastikan rotation naga
      kekal 90 0 0.
    */

    resetDragonRotation();


    /*
      Mulakan kecil.
    */

    setBeastScale(
      START_SCALE
    );


    /*
      STEP 1
      Small → medium
    */

    beast.object3D.scale.set(
      START_SCALE,
      START_SCALE,
      START_SCALE
    );


    beast.object3D.scale.lerp(

      {
        x:GROW_SCALE,
        y:GROW_SCALE,
        z:GROW_SCALE
      },

      0

    );


    /*
      A-Frame animation:
      membesar dengan sedikit overshoot.
    */

    beast.setAttribute(

      'animation__emerge',

      {

        property:'scale',

        from:
          START_SCALE +
          ' ' +
          START_SCALE +
          ' ' +
          START_SCALE,

        to:
          GROW_SCALE +
          ' ' +
          GROW_SCALE +
          ' ' +
          GROW_SCALE,

        dur:900,

        easing:'easeOutCubic'

      }

    );


    /*
      STEP 2
      Bounce kecil kembali
      ke 2.5
    */

    setTimeout(function(){

      beast.setAttribute(

        'animation__bounce',

        {

          property:'scale',

          from:
            GROW_SCALE +
            ' ' +
            GROW_SCALE +
            ' ' +
            GROW_SCALE,

          to:
            FINAL_SCALE_VALUE +
            ' ' +
            FINAL_SCALE_VALUE +
            ' ' +
            FINAL_SCALE_VALUE,

          dur:280,

          easing:'easeOutBack'

        }

      );

    },900);


    /*
      Pastikan posisi tidak
      berubah ketika animation.
    */

    resetBeastPosition();


    setInfo(

      '🔥 <b>EMBER DRAGON EMERGING</b><br>' +

      '🟣 Epic Emergence active.<br>' +

      'Position: Center of card<br>' +

      'Y: -0.25'

    );


    console.log(
      'Epic Emergence started.'
    );

  }


  /* =========================================
     A-FRAME LOADED
  ========================================= */

  scene.addEventListener(

    'loaded',

    function(){

      setStatus(
        'CAMERA / AR INITIALISING…'
      );


      setInfo(
        'Loading MindAR target <b>DR-001</b>…'
      );


      console.log(
        'A-Frame loaded.'
      );

    }

  );


  /* =========================================
     AR READY
  ========================================= */

  scene.addEventListener(

    'arReady',

    function(){

      setStatus(
        'CAMERA ACTIVE ✓',
        'ok'
      );


      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );


      console.log(
        'MindAR arReady.'
      );

    }

  );


  /* =========================================
     MODEL LOADED
  ========================================= */

  dragonModel.addEventListener(

    'model-loaded',

    function(){

      modelLoaded = true;


      /*
        Baseline orientation.
      */

      resetDragonRotation();


      /*
        Baseline position.
      */

      resetBeastPosition();


      /*
        Hide kecil sebelum targetFound.
      */

      setBeastScale(
        START_SCALE
      );


      console.log(
        '========================================'
      );

      console.log(
        'CARD BEAST AR — BASELINE v46'
      );

      console.log(
        '========================================'
      );

      console.log(
        'Target: DR-001'
      );

      console.log(
        'Target index: 0'
      );

      console.log(
        'Target file: ./targets.mind?v46'
      );

      console.log(
        'Model: ./models/ember-dragon.glb?v46'
      );

      console.log(
        'Position X:',
        BASE_X
      );

      console.log(
        'Position Y:',
        BASE_Y
      );

      console.log(
        'Position Z:',
        BASE_Z
      );

      console.log(
        'Dragon rotation:',
        DRAGON_ROTATION
      );

      console.log(
        'Final scale:',
        FINAL_SCALE
      );

      console.log(
        'Epic emergence: SCALE ONLY'
      );

      console.log(
        '========================================'
      );


      setInfo(

        '🟣 <b>DRAGON MODEL READY</b><br>' +

        'Waiting for DR-001 card…'

      );

    }

  );


  /* =========================================
     MODEL ERROR
  ========================================= */

  dragonModel.addEventListener(

    'model-error',

    function(event){

      modelLoaded = false;


      console.error(
        'GLB model error:',
        event
      );


      setStatus(
        'MODEL ERROR',
        'err'
      );


      setInfo(

        '❌ Failed to load ' +

        '<b>ember-dragon.glb</b>.<br>' +

        'Check the models folder and filename.'

      );

    }

  );


  /* =========================================
     TARGET FOUND
  ========================================= */

  target.addEventListener(

    'targetFound',

    function(){

      isTracked = true;


      /*
        Jangan tampilkan model
        sebelum GLB siap.
      */

      if(!modelLoaded){

        console.warn(
          'Target found tetapi GLB belum loaded.'
        );

        return;

      }


      /*
        RESET BASELINE
      */

      resetBeastPosition();

      resetDragonRotation();


      /*
        Tunjukkan beast.
      */

      beast.setAttribute(
        'visible',
        'true'
      );


      /*
        Epic emergence
        hanya sekali.
      */

      playEpicEmergence();


      setStatus(

        'CARD CONFIRMED • DR-001',

        'ok'

      );


      console.log(
        'DR-001 targetFound.'
      );

    }

  );


  /* =========================================
     TARGET LOST
  ========================================= */

  target.addEventListener(

    'targetLost',

    function(){

      isTracked = false;


      /*
        Hilangkan terus.
      */

      beast.setAttribute(
        'visible',
        'false'
      );


      /*
        Reset animation state
        supaya targetFound berikutnya
        boleh main sekali lagi.
      */

      emergencePlayed = false;


      /*
        Reset scale kecil.
      */

      setBeastScale(
        START_SCALE
      );


      /*
        Reset position.
      */

      resetBeastPosition();


      /*
        Rotation kekal.
      */

      resetDragonRotation();


      setStatus(

        'CAMERA ACTIVE ✓',

        'ok'

      );


      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );


      console.log(
        'DR-001 targetLost.'
      );

    }

  );


  /* =========================================
     AR ERROR
  ========================================= */

  scene.addEventListener(

    'arError',

    function(event){

      console.error(
        'MindAR error:',
        event
      );


      setStatus(
        'AR ERROR',
        'err'
      );


      setInfo(

        'MindAR gagal dimulakan. ' +

        'Kamera mungkin tidak tersedia.'

      );

    }

  );


  /* =========================================
     CAMERA VIDEO FIX
  ========================================= */

  function fixVideoLayer(){

    document
      .querySelectorAll('video')
      .forEach(

        function(video){

          video.setAttribute(
            'playsinline',
            ''
          );


          video.setAttribute(
            'autoplay',
            ''
          );


          video.muted = true;


          Object.assign(

            video.style,

            {

              position:'fixed',

              inset:'0',

              width:'100%',

              height:'100%',

              objectFit:'cover',

              zIndex:'0',

              display:'block',

              background:'#000'

            }

          );

        }

      );

  }


  /* =========================================
     WATCH MINDAR VIDEO
  ========================================= */

  new MutationObserver(

    fixVideoLayer

  ).observe(

    document.documentElement,

    {

      childList:true,

      subtree:true

    }

  );


  /* =========================================
     INITIAL VIDEO FIX
  ========================================= */

  fixVideoLayer();


  /* =========================================
     DEBUG
  ========================================= */

  console.log(
    '========================================'
  );

  console.log(
    'CARD BEAST AR — DR-001 BASELINE v46'
  );

  console.log(
    '========================================'
  );

  console.log(
    'CENTER POSITION'
  );

  console.log(
    'X = 0'
  );

  console.log(
    'Y = -0.25'
  );

  console.log(
    'Z = 0'
  );

  console.log(
    'ROTATION = 90 0 0'
  );

  console.log(
    'FINAL SCALE = 2.5'
  );

  console.log(
    'EPIC EMERGENCE = SCALE ONLY'
  );

  console.log(
    'TRACKING = MindAR'
  );

  console.log(
    'CACHE = v46'
  );

  console.log(
    '========================================'
  );


})();
</script>

</body>
</html>
