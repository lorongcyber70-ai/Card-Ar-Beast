<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Card Beast AR — v65.5 Camera Diagnostic</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:fixed;
    inset:0;
}

/*
 * Keep the A-Frame/MindAR camera rendering untouched.
 * Only the diagnostic UI is layered above it.
 */

#diagnostic{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    width:min(420px,calc(100vw - 28px));
    padding:14px 16px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:16px;
    background:rgba(0,0,0,.55);
    color:#fff;
    text-align:center;
    backdrop-filter:blur(6px);
    pointer-events:none;
}

#title{
    font-size:20px;
    font-weight:900;
}

#title span{
    color:#b83cff;
}

#status{
    margin-top:8px;
    font-size:14px;
    font-weight:900;
    color:#ffd84a;
}

#details{
    margin-top:7px;
    font-size:11px;
    color:#ccc;
    line-height:1.5;
}

.ok{
    color:#59ff9b!important;
}

.error{
    color:#ff6565!important;
}

#bottom{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    z-index:1000;
    width:min(500px,calc(100vw - 36px));
    padding:11px 14px;
    border:1px solid rgba(184,60,255,.75);
    border-radius:16px;
    background:rgba(0,0,0,.5);
    color:#fff;
    text-align:center;
    font-size:13px;
    pointer-events:none;
}

a-scene{
    width:100vw!important;
    height:100vh!important;
}
</style>
</head>

<body>

<div id="diagnostic">
    <div id="title">
        CARD <span>BEAST</span> AR
    </div>

    <div id="status">
        STARTING CAMERA...
    </div>

    <div id="details">
        Camera diagnostic v65.5<br>
        No targets • No GLB • No tracking test
    </div>
</div>

<div id="bottom">
    📷 Allow camera permission if requested.
</div>


<a-scene
    id="scene"

    embedded

    mindar-image="
        imageTargetSrc:./targets.mind;
        autoStart:true;
        uiScanning:false;
        uiLoading:false;
        uiError:false;
    "

    color-space="sRGB"

    renderer="
        colorManagement:true;
        antialias:true;
        alpha:true;
    "

    vr-mode-ui="enabled:false"

    device-orientation-permission-ui="
        enabled:false
    "

    loading-screen="
        enabled:false
    "
>

    <a-camera
        position="0 0 0"
        look-controls="enabled:false">
    </a-camera>

</a-scene>


<script>

const scene =
    document.getElementById("scene");

const status =
    document.getElementById("status");

const details =
    document.getElementById("details");

const bottom =
    document.getElementById("bottom");


/*
 * Scene loaded
 */

scene.addEventListener(
    "loaded",
    () => {

        status.textContent =
            "MINDAR STARTING...";

        status.className = "";

        details.innerHTML =
            "A-Frame scene loaded.<br>" +
            "Waiting for MindAR camera.";

        console.log(
            "v65.5 scene loaded"
        );

    }
);


/*
 * AR ready
 */

scene.addEventListener(
    "arReady",
    () => {

        status.textContent =
            "CAMERA FEED READY ✓";

        status.className =
            "ok";

        details.innerHTML =
            "MindAR camera initialized.<br>" +
            "If you can see the live camera now, camera rendering is OK.";

        bottom.textContent =
            "✅ Camera test passed — live feed should be visible.";

        console.log(
            "v65.5 arReady"
        );

    }
);


/*
 * AR error
 */

scene.addEventListener(
    "arError",
    event => {

        status.textContent =
            "CAMERA / MINDAR ERROR";

        status.className =
            "error";

        details.innerHTML =
            "MindAR reported an error.<br>" +
            "Check browser camera permission and HTTPS.";

        bottom.textContent =
            "❌ Camera initialization failed.";

        console.error(
            "v65.5 arError",
            event
        );

    }
);


/*
 * Extra browser-level diagnostics.
 * Does not modify camera/video rendering.
 */

window.addEventListener(
    "error",
    event => {

        console.error(
            "Browser error:",
            event.error || event.message
        );

    }
);

</script>

</body>
</html>
