<!doctype html>
<html lang="ms">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Card Beast AR — Step 2.7</title>

<!-- A-FRAME -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<!-- MINDAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* =====================================================
   CAMERA VIDEO
===================================================== */

video{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;
}

/* =====================================================
   A-FRAME
===================================================== */

a-scene{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;
}

.a-canvas,
canvas{
  background:transparent!important;
}

/* =====================================================
   TOP UI
===================================================== */

#ui{
  position:fixed;

  z-index:20;

  top:18px;
  left:0;

  width:100%;

  text-align:center;

  pointer-events:none;
}

.logo{
  font-size:28px;

  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px #000;
}

.logo span{
  color:#b75cff;
}

#status{
  display:inline-block;

  margin-top:12px;

  padding:10px 20px;

  border:1px solid #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.72);

  font-weight:800;
}

/* =====================================================
   INFO
===================================================== */

#info{
  position:fixed;

  z-index:20;

  left:5%;
  right:5%;

  bottom:20px;

  padding:14px 18px;

  border:1px solid #7d35b8;

  border-radius:24px;

  background:rgba(5,0,12,.78);

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;
}

.ok{
  color:#68ff9b!important;
}

.err{
  color:#ff6b6b!important;
}

</style>
</head>


<body>

<!-- =====================================================
     UI
===================================================== -->

<div id="ui">

  <div class="logo">
    CARD <span>BEAST</span> AR
  </div>

  <div id="status">
    INITIALISING CAMERA…
  </div>

</div>


<!-- =====================================================
     INFO
===================================================== -->

<div id="info">

  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.

</div>


<!-- =====================================================
     MINDAR SCENE
===================================================== -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  color-space="sRGB"

  loading-screen="enabled:false"

  mindar-image="
    imageTargetSrc:./targets.mind;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

>


<!-- =====================================================
     CAMERA
===================================================== -->

<a-camera

  position="0 0 0"

  look-controls="enabled:false">

</a-camera>


<!-- =====================================================
     MINDAR TARGET
===================================================== -->

<a-entity

  id="target"

  mindar-image-target="targetIndex:0">

  
  <!-- ===================================================
       EMBER DRAGON MODEL

       ROTATION UPDATED:
       -90 180 180

       SCALE:
       2.5
       (SIZE KEKAL SEPERTI SEKARANG)
  ==================================================== -->

  <a-entity

    id="beast"

    gltf-model="./models/ember-dragon.glb"

    position="0 0 0"

    rotation="-90 180 180"

    scale="2.5 2.5 2.5"

    visible="false">

  </a-entity>


</a-entity>


</a-scene>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

(function(){

  const scene =
    document.getElementById('scene');

  const target =
    document.getElementById('target');

  const beast =
    document.getElementById('beast');

  const status =
    document.getElementById('status');

  const info =
    document.getElementById('info');


  /* ===================================================
     STATUS
  =================================================== */

  function setStatus(text, cls){

    status.textContent = text;

    status.className = cls || '';

  }


  /* ===================================================
     INFO
  =================================================== */

  function setInfo(html){

    info.innerHTML = html;

  }


  /* ===================================================
     A-FRAME LOADED
  =================================================== */

  scene.addEventListener('loaded', function(){

    setStatus(
      'CAMERA / AR INITIALISING…'
    );

    setInfo(
      'Loading MindAR target <b>DR-001</b>…'
    );

  });


  /* ===================================================
     AR READY
  =================================================== */

  scene.addEventListener('arReady', function(){

    setStatus(
      'CAMERA ACTIVE ✓',
      'ok'
    );

    setInfo(
      'Point the rear camera at ' +
      '<b>DR-001 Ember Dragon</b>.'
    );

  });


  /* ===================================================
     GLB LOADED
  =================================================== */

  beast.addEventListener(
    'model-loaded',
    function(){

      console.log(
        'ember-dragon.glb loaded successfully.'
      );

      setInfo(
        '🔥 <b>EMBER DRAGON READY</b><br>' +
        '3D model loaded successfully.'
      );

    }
  );


  /* ===================================================
     GLB ERROR
  =================================================== */

  beast.addEventListener(
    'model-error',
    function(e){

      console.error(
        'GLB MODEL ERROR:',
        e
      );

      setStatus(
        'MODEL ERROR',
        'err'
      );

      setInfo(
        '❌ Gagal memuatkan ' +
        '<b>ember-dragon.glb</b>.<br>' +
        'Semak folder <b>models</b>.'
      );

    }
  );


  /* ===================================================
     TARGET FOUND
  =================================================== */

  target.addEventListener(
    'targetFound',
    function(){

      beast.setAttribute(
        'visible',
        'true'
      );

      setStatus(
        'CARD CONFIRMED • DR-001',
        'ok'
      );

      setInfo(
        '🔥 <b>EMBER DRAGON DETECTED</b><br>' +
        '🟣 3D Ember Dragon active.'
      );

      console.log(
        'DR-001 targetFound.'
      );

    }
  );


  /* ===================================================
     TARGET LOST
  =================================================== */

  target.addEventListener(
    'targetLost',
    function(){

      beast.setAttribute(
        'visible',
        'false'
      );

      setStatus(
        'CAMERA ACTIVE ✓',
        'ok'
      );

      setInfo(
        'Point the rear camera at ' +
        '<b>DR-001 Ember Dragon</b>.'
      );

      console.log(
        'DR-001 targetLost.'
      );

    }
  );


  /* ===================================================
     AR ERROR
  =================================================== */

  scene.addEventListener(
    'arError',
    function(e){

      console.error(
        'MindAR error:',
        e
      );

      setStatus(
        'AR ERROR',
        'err'
      );

      setInfo(
        '❌ MindAR gagal dimulakan.<br>' +
        'Kamera mungkin masih tersedia, ' +
        'tetapi AR tidak aktif.'
      );

    }
  );


  /* ===================================================
     CAMERA VIDEO SAFEGUARD
  =================================================== */

  function fixVideoLayer(){

    document
      .querySelectorAll('video')
      .forEach(function(video){

        video.setAttribute(
          'playsinline',
          ''
        );

        video.setAttribute(
          'autoplay',
          ''
        );

        video.muted = true;

        Object.assign(
          video.style,
          {

            position:'fixed',

            inset:'0',

            width:'100%',

            height:'100%',

            objectFit:'cover',

            zIndex:'0',

            display:'block',

            background:'#000'

          }
        );

      });

  }


  /* ===================================================
     OBSERVE CAMERA VIDEO
  =================================================== */

  new MutationObserver(
    fixVideoLayer
  ).observe(
    document.documentElement,
    {
      childList:true,
      subtree:true
    }
  );


  fixVideoLayer();


})();

</script>

</body>

</html>
