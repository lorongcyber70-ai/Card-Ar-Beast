<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Card Beast AR — DR-001 v58</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    position:fixed;

    inset:0;
}


/* =====================================================
   CAMERA VIDEO
===================================================== */

video{
    position:fixed !important;

    inset:0 !important;

    width:100% !important;
    height:100% !important;

    object-fit:cover !important;

    z-index:0 !important;

    display:block !important;

    background:#000 !important;
}


/* =====================================================
   A-FRAME
===================================================== */

a-scene{
    position:fixed !important;

    inset:0 !important;

    width:100% !important;
    height:100% !important;

    z-index:1 !important;

    background:transparent !important;
}


/* =====================================================
   TOP HEADER
===================================================== */

#topUI{

    position:fixed;

    z-index:20;

    top:18px;

    left:0;

    width:100%;

    text-align:center;

    pointer-events:none;
}


.logo{

    font-size:30px;

    font-weight:900;

    color:#fff;

    letter-spacing:-1px;

    text-shadow:
        0 3px 8px rgba(0,0,0,.95),
        0 0 15px rgba(0,0,0,.8);
}


.logo span{

    color:#b84cff;
}


#status{

    display:inline-block;

    margin-top:12px;

    padding:10px 22px;

    border-radius:30px;

    border:1px solid #b84cff;

    background:
        rgba(5,0,12,.84);

    color:#68ff9b;

    font-size:17px;

    font-weight:900;

    box-shadow:
        0 0 15px
        rgba(184,76,255,.35);
}


/* =====================================================
   DEBUG PANEL
===================================================== */

#debugPanel{

    position:fixed;

    z-index:25;

    top:105px;

    left:14px;

    min-width:260px;

    max-width:330px;

    padding:14px 16px;

    border-radius:16px;

    border:
        1px solid
        rgba(255,255,255,.35);

    background:
        rgba(0,0,0,.82);

    color:#fff;

    font-size:13px;

    line-height:1.55;

    pointer-events:none;

    backdrop-filter:blur(8px);

    box-shadow:
        0 0 20px
        rgba(0,0,0,.35);
}


.debugTitle{

    color:#d06aff;

    font-size:16px;

    font-weight:900;

    margin-bottom:7px;
}


.locked{

    color:#68ff9b;

    font-weight:600;
}


.test{

    margin-top:8px;

    color:#ffd84d;

    font-weight:900;
}


.rotation{

    color:#fff;

    font-size:16px;

    font-weight:900;

    margin-top:2px;
}


.forward{

    margin-top:8px;

    color:#ff6868;

    font-weight:900;
}


.axis{

    margin-top:7px;

    font-weight:700;
}


.axisX{
    color:#ff4141;
}


.axisY{
    color:#73e34a;
}


.axisZ{
    color:#4d9dff;
}


/* =====================================================
   BOTTOM INFO
===================================================== */

#info{

    position:fixed;

    z-index:20;

    left:5%;

    right:5%;

    bottom:20px;

    padding:16px 18px;

    border-radius:24px;

    border:
        1px solid
        #8d32ca;

    background:
        rgba(5,0,12,.90);

    color:#fff;

    text-align:center;

    font-size:17px;

    line-height:1.5;

    pointer-events:none;

    box-shadow:
        0 0 18px
        rgba(141,50,202,.25);
}


.ok{
    color:#68ff9b !important;
}


.error{
    color:#ff6868 !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .logo{
        font-size:28px;
    }

    #status{

        font-size:15px;

        padding:
            10px 18px;
    }

    #debugPanel{

        top:104px;

        left:9px;

        min-width:235px;

        max-width:285px;

        font-size:12px;

        padding:
            11px 12px;
    }

    .rotation{
        font-size:15px;
    }

    #info{

        left:4%;

        right:4%;

        bottom:18px;

        font-size:16px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     TOP UI
===================================================== -->

<div id="topUI">

    <div class="logo">
        CARD <span>BEAST</span> AR
    </div>

    <div id="status">
        INITIALISING CAMERA…
    </div>

</div>


<!-- =====================================================
     DEBUG PANEL — v58
===================================================== -->

<div id="debugPanel">

    <div class="debugTitle">
        DR-001 • PATCH v58
    </div>

    <div class="locked">
        ✓ Position locked
    </div>

    <div class="locked">
        ✓ Parent rotation locked
    </div>

    <div class="locked">
        ✓ Scale locked
    </div>

    <div class="locked">
        ✓ Tracking locked
    </div>

    <div class="locked">
        ✓ Epic Emergence locked
    </div>

    <div class="test">
        ONLY CHANGE
    </div>

    <div class="rotation">
        Rotation:
        90 315 0
    </div>

    <div class="axis">

        <span class="axisX">● +X</span>

        &nbsp;

        <span class="axisY">● +Y</span>

        &nbsp;

        <span class="axisZ">● +Z</span>

    </div>

    <div class="forward">
        Forward / Head = local -X
    </div>

</div>


<!-- =====================================================
     BOTTOM INFO
===================================================== -->

<div id="info">

    Point camera at
    <b>DR-001 Ember Dragon</b>.

</div>


<!-- =====================================================
     AR SCENE
===================================================== -->

<a-scene

    id="scene"

    embedded

    vr-mode-ui="
        enabled:false
    "

    device-orientation-permission-ui="
        enabled:false
    "

    renderer="
        alpha:true;
        colorManagement:true;
        physicallyCorrectLights:true
    "

    mindar-image="
        imageTargetSrc:./targets.mind;
        autoStart:true;
        uiScanning:false;
        uiLoading:false;
        uiError:false
    "

    color-space="sRGB"

    loading-screen="
        enabled:false
    "

>


    <!-- =================================================
         CAMERA
    ================================================== -->

    <a-camera

        position="0 0 0"

        look-controls="
            enabled:false
        "

    ></a-camera>


    <!-- =================================================
         DR-001 TARGET
    ================================================== -->

    <a-entity

        id="target"

        mindar-image-target="
            targetIndex:0
        "

    >


        <!-- =============================================
             DRAGON PARENT

             LOCKED BASELINE
        ============================================== -->

        <a-entity

            id="beast"

            visible="false"

            position="
                0 -0.25 0
            "

            rotation="
                0 0 0
            "

            scale="
                2.5 2.5 2.5
            "

        >


            <!-- =========================================
                 EMBER DRAGON

                 v58 ROTATION TEST

                 X = 90
                 Y = 315
                 Z = 0

                 Forward / Head = LOCAL -X
            ========================================== -->

            <a-entity

                id="dragonModel"

                gltf-model="
                    ./models/ember-dragon.glb
                "

                position="
                    0 0 0
                "

                rotation="
                    90 315 0
                "

                scale="
                    1 1 1
                "

            ></a-entity>


        </a-entity>


    </a-entity>


</a-scene>


<script>

/* =====================================================
   CARD BEAST AR
   DR-001
   PATCH v58
===================================================== */

(function(){

    'use strict';


    /* =================================================
       ELEMENTS
    ================================================= */

    const scene =
        document.getElementById(
            'scene'
        );

    const target =
        document.getElementById(
            'target'
        );

    const beast =
        document.getElementById(
            'beast'
        );

    const dragon =
        document.getElementById(
            'dragonModel'
        );

    const status =
        document.getElementById(
            'status'
        );

    const info =
        document.getElementById(
            'info'
        );


    /* =================================================
       BASELINE v58

       Position:
       0 -0.25 0

       Parent:
       0 0 0

       Dragon:
       90 315 0

       Scale:
       2.5

       Forward:
       local -X
    ================================================= */

    const BASELINE = {

        position:{

            x:0,

            y:-0.25,

            z:0

        },


        parentRotation:{

            x:0,

            y:0,

            z:0

        },


        dragonRotation:{

            x:90,

            y:315,

            z:0

        },


        scale:2.5

    };


    /* =================================================
       EMERGENCE
    ================================================= */

    const EMERGENCE = {

        startScale:0.35,

        overshootScale:2.72,

        duration:800,

        bounce:220

    };


    /* =================================================
       STATE
    ================================================= */

    let modelLoaded =
        false;

    let emergencePlayed =
        false;

    let growTimer =
        null;

    let bounceTimer =
        null;


    /* =================================================
       STATUS
    ================================================= */

    function setStatus(
        text,
        type=''
    ){

        status.textContent =
            text;

        status.className =
            type;

    }


    /* =================================================
       INFO
    ================================================= */

    function setInfo(
        html
    ){

        info.innerHTML =
            html;

    }


    /* =================================================
       APPLY POSITION
    ================================================= */

    function applyPosition(){

        beast.object3D.position.set(

            BASELINE.position.x,

            BASELINE.position.y,

            BASELINE.position.z

        );

    }


    /* =================================================
       APPLY PARENT ROTATION
    ================================================= */

    function applyParentRotation(){

        beast.object3D.rotation.set(

            THREE.MathUtils.degToRad(
                BASELINE.parentRotation.x
            ),

            THREE.MathUtils.degToRad(
                BASELINE.parentRotation.y
            ),

            THREE.MathUtils.degToRad(
                BASELINE.parentRotation.z
            )

        );

    }


    /* =================================================
       APPLY DRAGON ROTATION

       v58:
       90 315 0
    ================================================= */

    function applyDragonRotation(){

        dragon.object3D.rotation.set(

            THREE.MathUtils.degToRad(
                BASELINE.dragonRotation.x
            ),

            THREE.MathUtils.degToRad(
                BASELINE.dragonRotation.y
            ),

            THREE.MathUtils.degToRad(
                BASELINE.dragonRotation.z
            )

        );

    }


    /* =================================================
       APPLY SCALE
    ================================================= */

    function applyFinalScale(){

        beast.object3D.scale.set(

            BASELINE.scale,

            BASELINE.scale,

            BASELINE.scale

        );

    }


    /* =================================================
       CLEAR ANIMATIONS
    ================================================= */

    function clearAnimations(){

        beast.removeAttribute(
            'animation__emerge'
        );

        beast.removeAttribute(
            'animation__bounce'
        );


        if(
            growTimer !== null
        ){

            clearTimeout(
                growTimer
            );

            growTimer =
                null;

        }


        if(
            bounceTimer !== null
        ){

            clearTimeout(
                bounceTimer
            );

            bounceTimer =
                null;

        }

    }


    /* =================================================
       RESTORE BASELINE
    ================================================= */

    function restoreBaseline(){

        clearAnimations();

        applyPosition();

        applyParentRotation();

        applyDragonRotation();

        applyFinalScale();


        dragon.object3D.updateMatrixWorld(
            true
        );

    }


    /* =================================================
       SCALE
    ================================================= */

    function setScale(
        value
    ){

        beast.object3D.scale.set(

            value,
            value,
            value

        );

    }


    /* =================================================
       EPIC EMERGENCE
    ================================================= */

    function playEpicEmergence(){

        if(
            emergencePlayed
        ){

            return;

        }


        emergencePlayed =
            true;


        clearAnimations();


        /* ---------------------------------------------
           IMPORTANT

           Restore exact baseline first.
        --------------------------------------------- */

        applyPosition();

        applyParentRotation();

        applyDragonRotation();


        /* ---------------------------------------------
           START
        --------------------------------------------- */

        setScale(
            EMERGENCE.startScale
        );


        /* ---------------------------------------------
           GROW
        --------------------------------------------- */

        beast.setAttribute(

            'animation__emerge',

            {

                property:'scale',

                from:
                    EMERGENCE.startScale +
                    ' ' +
                    EMERGENCE.startScale +
                    ' ' +
                    EMERGENCE.startScale,

                to:
                    EMERGENCE.overshootScale +
                    ' ' +
                    EMERGENCE.overshootScale +
                    ' ' +
                    EMERGENCE.overshootScale,

                dur:
                    EMERGENCE.duration,

                easing:
                    'easeOutCubic'

            }

        );


        setInfo(

            '🔥 <b>EMBER DRAGON EMERGING</b><br>' +

            'DR-001 • PATCH v58<br>' +

            'Rotation: 90 315 0'

        );


        /* ---------------------------------------------
           BOUNCE
        --------------------------------------------- */

        growTimer =
            setTimeout(

                function(){

                    beast.setAttribute(

                        'animation__bounce',

                        {

                            property:'scale',

                            from:
                                EMERGENCE.overshootScale +
                                ' ' +
                                EMERGENCE.overshootScale +
                                ' ' +
                                EMERGENCE.overshootScale,

                            to:
                                BASELINE.scale +
                                ' ' +
                                BASELINE.scale +
                                ' ' +
                                BASELINE.scale,

                            dur:
                                EMERGENCE.bounce,

                            easing:
                                'easeOutCubic'

                        }

                    );

                },

                EMERGENCE.duration

            );


        /* ---------------------------------------------
           FINAL LOCK
        --------------------------------------------- */

        bounceTimer =
            setTimeout(

                function(){

                    clearAnimations();

                    restoreBaseline();


                    setInfo(

                        '🔥 <b>EMBER DRAGON ACTIVE</b><br>' +

                        'Position: 0 -0.25 0<br>' +

                        'Rotation: 90 315 0<br>' +

                        'Scale: 2.5'

                    );

                },

                EMERGENCE.duration +
                EMERGENCE.bounce +
                100

            );

    }


    /* =================================================
       SCENE LOADED
    ================================================= */

    scene.addEventListener(

        'loaded',

        function(){

            setStatus(
                'CAMERA / AR INITIALISING…'
            );

        }

    );


    /* =================================================
       AR READY
    ================================================= */

    scene.addEventListener(

        'arReady',

        function(){

            setStatus(

                'CAMERA ACTIVE ✓',

                'ok'

            );


            setInfo(

                'Point camera at ' +

                '<b>DR-001 Ember Dragon</b>.'

            );

        }

    );


    /* =================================================
       MODEL LOADED
    ================================================= */

    dragon.addEventListener(

        'model-loaded',

        function(){

            modelLoaded =
                true;


            restoreBaseline();


            console.log(
                '===================================='
            );

            console.log(
                'CARD BEAST AR — DR-001 v58'
            );

            console.log(
                'Position: 0 -0.25 0'
            );

            console.log(
                'Parent Rotation: 0 0 0'
            );

            console.log(
                'Dragon Rotation: 90 315 0'
            );

            console.log(
                'Scale: 2.5'
            );

            console.log(
                'Forward / Head: local -X'
            );

            console.log(
                'ONLY TEST CHANGE: Heading Y = 315°'
            );

            console.log(
                '===================================='
            );


            setInfo(

                '🐉 <b>EMBER DRAGON READY</b><br>' +

                'v58 • Rotation Y = 315°'

            );

        }

    );


    /* =================================================
       MODEL ERROR
    ================================================= */

    dragon.addEventListener(

        'model-error',

        function(
            event
        ){

            console.error(
                'EMBER DRAGON GLB ERROR:',
                event
            );


            setStatus(

                'MODEL ERROR',

                'error'

            );


            setInfo(

                '❌ Gagal load ' +

                '<b>ember-dragon.glb</b>.'

            );

        }

    );


    /* =================================================
       TARGET FOUND
    ================================================= */

    target.addEventListener(

        'targetFound',

        function(){

            console.log(
                'DR-001 targetFound — v58'
            );


            if(
                !modelLoaded
            ){

                console.warn(
                    'Target found tetapi GLB belum ready.'
                );

                return;

            }


            /*
             * Reset semua baseline
             * sebelum emergence.
             */

            restoreBaseline();


            beast.setAttribute(
                'visible',
                'true'
            );


            playEpicEmergence();


            setStatus(

                'CARD CONFIRMED • DR-001',

                'ok'

            );

        }

    );


    /* =================================================
       TARGET LOST
    ================================================= */

    target.addEventListener(

        'targetLost',

        function(){

            console.log(
                'DR-001 targetLost'
            );


            clearAnimations();


            beast.setAttribute(
                'visible',
                'false'
            );


            emergencePlayed =
                false;


            restoreBaseline();


            setStatus(

                'CAMERA ACTIVE ✓',

                'ok'

            );


            setInfo(

                'Point camera at ' +

                '<b>DR-001 Ember Dragon</b>.'

            );

        }

    );


    /* =================================================
       AR ERROR
    ================================================= */

    scene.addEventListener(

        'arError',

        function(
            event
        ){

            console.error(
                'MindAR AR error:',
                event
            );


            setStatus(

                'AR ERROR',

                'error'

            );


            setInfo(

                '❌ AR gagal dimulakan.<br>' +

                'Pastikan permission kamera diberikan.'

            );

        }

    );


    /* =================================================
       CAMERA VIDEO FIX
    ================================================= */

    function fixVideoLayer(){

        document
            .querySelectorAll(
                'video'
            )
            .forEach(

                function(
                    video
                ){

                    video.setAttribute(
                        'playsinline',
                        ''
                    );

                    video.setAttribute(
                        'autoplay',
                        ''
                    );

                    video.muted =
                        true;


                    Object.assign(

                        video.style,

                        {

                            position:'fixed',

                            inset:'0',

                            width:'100%',

                            height:'100%',

                            objectFit:'cover',

                            zIndex:'0',

                            display:'block',

                            background:'#000'

                        }

                    );

                }

            );

    }


    new MutationObserver(

        fixVideoLayer

    ).observe(

        document.documentElement,

        {

            childList:true,

            subtree:true

        }

    );


    fixVideoLayer();


    /* =================================================
       FINAL CONFIG LOG
    ================================================= */

    console.log(
        '------------------------------------'
    );

    console.log(
        'DR-001 v58 CONFIG'
    );

    console.log(
        'Position       = 0 -0.25 0'
    );

    console.log(
        'Parent Rotation = 0 0 0'
    );

    console.log(
        'Dragon Rotation = 90 315 0'
    );

    console.log(
        'Scale           = 2.5'
    );

    console.log(
        'Forward         = local -X'
    );

    console.log(
        'Tracking        = DR-001'
    );

    console.log(
        'Emergence       = ON'
    );

    console.log(
        'ONLY Y HEADING CHANGED'
    );

    console.log(
        '------------------------------------'
    );


})();

</script>

</body>
</html>
