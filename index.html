<script>

/* =========================================================
   CARD BEAST AR v66.1
   ELEMENT VFX

   CORE AR:
   5 TARGETS
   MAX TRACK 5
   PRELOAD ONCE
   MULTI TRACK
   INDEPENDENT TARGET LOST

   CAMERA:
   v66.0 CAMERA LAYER

   VFX:
   DR-001 FIRE
   DR-002 DARK
   DR-003 FROST
   DR-004 MIND
   DR-005 WATER

   GLB TRANSFORM UNCHANGED
========================================================= */


/* =========================================================
   BEAST DATA
========================================================= */

const beasts=[

{
id:"DR-001",
name:"Ember Dragon",
emoji:"🔥",
target:0,
model:"dragonModel",
asset:"dragonAsset",
vfx:"fire"
},

{
id:"DR-002",
name:"Abyss Tiger",
emoji:"🌑",
target:1,
model:"tigerModel",
asset:"tigerAsset",
vfx:"dark"
},

{
id:"DR-003",
name:"Frost Phoenix",
emoji:"❄️",
target:2,
model:"phoenixModel",
asset:"phoenixAsset",
vfx:"frost"
},

{
id:"DR-004",
name:"Puppet Mantis",
emoji:"🧠",
target:3,
model:"mantisModel",
asset:"mantisAsset",
vfx:"mind"
},

{
id:"DR-005",
name:"Tidal Leviathan",
emoji:"🌊",
target:4,
model:"leviathanModel",
asset:"leviathanAsset",
vfx:"water"
}

];


/* =========================================================
   STATE
========================================================= */

const state=beasts.map(()=>({

found:false,

loaded:false,

loadCount:0

}));


/* =========================================================
   DOM
========================================================= */

const scene=
document.getElementById("scene");

const mainStatus=
document.getElementById("mainStatus");

const bottom=
document.getElementById("bottom");


/* =========================================================
   VFX CONFIG
========================================================= */

const VFX_CONFIG={

fire:{
colors:[
"#ff3b00",
"#ff7a00",
"#ffd21a"
],
count:12,
radius:0.035,
spread:0.45,
height:0.75,
speed:0.55,
mode:"rise"
},

dark:{
colors:[
"#4d1aff",
"#7b2cff",
"#b95cff"
],
count:10,
radius:0.035,
spread:0.48,
height:0.55,
speed:0.35,
mode:"orbit"
},

frost:{
colors:[
"#8eeaff",
"#d9fbff",
"#ffffff"
],
count:14,
radius:0.028,
spread:0.60,
height:0.80,
speed:0.25,
mode:"snow"
},

mind:{
colors:[
"#ff45e6",
"#a93cff",
"#67d8ff"
],
count:10,
radius:0.032,
spread:0.48,
height:0.50,
speed:0.50,
mode:"orbit"
},

water:{
colors:[
"#00bfff",
"#22e6ff",
"#ffffff"
],
count:12,
radius:0.032,
spread:0.58,
height:0.70,
speed:0.38,
mode:"rise"
}

};


/* =========================================================
   RANDOM
========================================================= */

function randomRange(min,max){

return min+
Math.random()*(max-min);

}


/* =========================================================
   ELEMENT VFX COMPONENT
========================================================= */

AFRAME.registerComponent(

"element-vfx",

{

schema:{

type:{
type:"string",
default:"fire"
}

},


init:function(){

this.particles=[];

this.active=false;

this.time=0;

this.config=
VFX_CONFIG[
this.data.type
]||
VFX_CONFIG.fire;

this.createParticles();

},


createParticles:function(){

const config=this.config;


for(
let i=0;
i<config.count;
i++
){

const particle=
document.createElement(
"a-sphere"
);


const color=
config.colors[
i%config.colors.length
];


const x=
randomRange(
-config.spread,
config.spread
);


const y=
randomRange(
0.05,
config.height
);


const z=
randomRange(
-config.spread,
config.spread
);


const size=
randomRange(
config.radius*.65,
config.radius*1.35
);


particle.setAttribute(
"radius",
size
);


particle.setAttribute(
"position",
`${x} ${y} ${z}`
);


particle.setAttribute(
"material",
{

color:color,

shader:"standard",

transparent:true,

opacity:.85,

roughness:.35,

metalness:.05

}
);


particle.dataset.baseX=x;
particle.dataset.baseY=y;
particle.dataset.baseZ=z;

particle.dataset.phase=
Math.random()*
Math.PI*2;

particle.dataset.speed=
randomRange(.7,1.3);

particle.setAttribute(
"visible",
"false"
);


this.el.appendChild(
particle
);


this.particles.push(
particle
);

}

},


setActive:function(active){

this.active=active;


this.particles.forEach(
particle=>{

particle.setAttribute(
"visible",
active
);

}
);

},


tick:function(time,delta){

if(!this.active){

return;

}


const config=this.config;

this.time+=
delta*.001;


this.particles.forEach(
particle=>{

const baseX=
Number(
particle.dataset.baseX
);

const baseY=
Number(
particle.dataset.baseY
);

const baseZ=
Number(
particle.dataset.baseZ
);

const phase=
Number(
particle.dataset.phase
);

const speed=
Number(
particle.dataset.speed
);

let x=baseX;
let y=baseY;
let z=baseZ;


/* =========================================
   RISE
========================================= */

if(
config.mode==="rise"
){

const cycle=
(
this.time*
config.speed*
speed+
phase
)%1;


y=
baseY+
cycle*.35;


x=
baseX+
Math.sin(
this.time*
2.2*
speed+
phase
)*.045;


z=
baseZ+
Math.cos(
this.time*
1.8*
speed+
phase
)*.045;


if(
y>config.height
){

y=.05;

}

}


/* =========================================
   ORBIT
========================================= */

if(
config.mode==="orbit"
){

const angle=
this.time*
config.speed*
speed+
phase;


const orbit=
.18+
Math.abs(baseX)*.35;


x=
Math.cos(angle)*
orbit;


z=
Math.sin(angle)*
orbit;


y=
baseY+
Math.sin(
angle*1.7
)*.08;

}


/* =========================================
   SNOW
========================================= */

if(
config.mode==="snow"
){

const cycle=
(
this.time*
config.speed*
speed+
phase
)%1;


y=
config.height-
cycle*
config.height;


x=
baseX+
Math.sin(
this.time*1.4+
phase
)*.08;


z=
baseZ+
Math.cos(
this.time*1.2+
phase
)*.08;


if(
y<.02
){

y=config.height;

}

}


particle.object3D.position.set(
x,
y,
z
);

}
);

}

}

);


/* =========================================================
   CAMERA LAYER
   v66.0 BASELINE
========================================================= */

function forceCameraLayer(){

const videos=
document.querySelectorAll(
"video"
);


videos.forEach(
video=>{

video.classList.add(
"mindar-video"
);


video.style.setProperty(
"position",
"fixed",
"important"
);

video.style.setProperty(
"top",
"0",
"important"
);

video.style.setProperty(
"left",
"0",
"important"
);

video.style.setProperty(
"width",
"100vw",
"important"
);

video.style.setProperty(
"height",
"100vh",
"important"
);

video.style.setProperty(
"min-width",
"100vw",
"important"
);

video.style.setProperty(
"min-height",
"100vh",
"important"
);

video.style.setProperty(
"object-fit",
"cover",
"important"
);

video.style.setProperty(
"display",
"block",
"important"
);

video.style.setProperty(
"visibility",
"visible",
"important"
);

video.style.setProperty(
"opacity",
"1",
"important"
);

video.style.setProperty(
"z-index",
"0",
"important"
);

video.style.setProperty(
"pointer-events",
"none",
"important"
);


if(
video.paused &&
video.srcObject
){

video.play()
.catch(
()=>{}
);

}

}
);


const canvas=
document.querySelector(
"a-scene canvas"
);


if(canvas){

canvas.style.setProperty(
"position",
"fixed",
"important"
);

canvas.style.setProperty(
"top",
"0",
"important"
);

canvas.style.setProperty(
"left",
"0",
"important"
);

canvas.style.setProperty(
"width",
"100vw",
"important"
);

canvas.style.setProperty(
"height",
"100vh",
"important"
);

canvas.style.setProperty(
"background",
"transparent",
"important"
);

canvas.style.setProperty(
"background-color",
"transparent",
"important"
);

canvas.style.setProperty(
"z-index",
"1",
"important"
);

}


try{

if(
scene &&
scene.renderer
){

const renderer=
scene.renderer;


if(
renderer.setClearColor
){

renderer.setClearColor(
0x000000,
0
);

}


if(
renderer.setClearAlpha
){

renderer.setClearAlpha(
0
);

}

}

}

catch(error){

console.warn(
"Renderer transparency patch:",
error
);

}

}


/* =========================================================
   VIDEO OBSERVER
========================================================= */

const videoObserver=
new MutationObserver(
()=>{

forceCameraLayer();

}
);


videoObserver.observe(

document.body,

{
childList:true,
subtree:true
}

);


/* =========================================================
   BADGE
========================================================= */

function setBadge(
index,
text,
className
){

const element=
document.getElementById(
"target"+index
);


if(!element){

return;

}


element.textContent=
text;

element.className=
className;

}


/* =========================================================
   VFX CONTROL
========================================================= */

function setVFX(
index,
active
){

const vfx=
document.getElementById(
"vfx"+index
);


if(
!vfx ||
!vfx.components ||
!vfx.components[
"element-vfx"
]
){

return;

}


vfx.components[
"element-vfx"
].setActive(
active
);

}


/* =========================================================
   UPDATE UI
========================================================= */

function updateUI(){

const active=
beasts.filter(
(beast,index)=>
state[index].found
);


if(
active.length===0
){

mainStatus.textContent=
"CAMERA READY • SEARCHING";

bottom.textContent=
"📷 Point camera at any Card Beast target.";

return;

}


if(
active.length===1
){

const beast=
active[0];


mainStatus.textContent=
`${beast.id} FOUND • ${beast.name.toUpperCase()}`;


bottom.innerHTML=
`${beast.emoji} <b>${beast.name.toUpperCase()} ACTIVE</b> • ${beast.id}`;

return;

}


mainStatus.textContent=
`${active.length} CARDS ACTIVE • `+
`${active.map(
beast=>beast.id
).join(" + ")}`;


bottom.innerHTML=
`${active.map(
beast=>
beast.emoji+
" "+
beast.id
).join(" + ")} ACTIVE`;

}


/* =========================================================
   PRELOAD ONCE
========================================================= */

function setupPreload(){

beasts.forEach(
(beast,index)=>{

const model=
document.getElementById(
beast.model
);


if(!model){

console.error(
beast.id+
" model element missing"
);

return;

}


model.addEventListener(

"model-loaded",

()=>{

if(
state[index].loaded
){

return;

}


state[index].loaded=
true;

state[index].loadCount++;


console.log(
beast.id+
" GLB PRELOADED ONCE"
);

},

{
once:true
}

);


model.addEventListener(

"model-error",

event=>{

console.error(
beast.id+
" GLB LOAD ERROR",
event
);


setBadge(
index,
"GLB ERROR",
"err"
);

}

);

}
);

}


/* =========================================================
   TARGET SETUP
========================================================= */

function setupTarget(index){

const beast=
beasts[index];


const target=
document.getElementById(
"beast"+index
);


if(!target){

console.error(
beast.id+
" target entity missing"
);

return;

}


/* =====================================================
   TARGET FOUND
===================================================== */

target.addEventListener(

"targetFound",

()=>{

state[index].found=
true;


target.setAttribute(
"visible",
"true"
);


/*
 * Activate only
 * this VFX.
 */

setVFX(
index,
true
);


setBadge(
index,
"FOUND",
"on"
);


updateUI();


console.log(
beast.id+
" targetFound"
);

}
);


/* =====================================================
   TARGET LOST
===================================================== */

target.addEventListener(

"targetLost",

()=>{

state[index].found=
false;


target.setAttribute(
"visible",
"false"
);


/*
 * Disable only
 * this VFX.
 */

setVFX(
index,
false
);


setBadge(
index,
"LOST",
"wait"
);


updateUI();


console.log(
beast.id+
" targetLost"
);

}
);

}


/* =========================================================
   SCENE LOADED
========================================================= */

scene.addEventListener(

"loaded",

()=>{

console.log(
"CARD BEAST AR v66.1 SCENE LOADED"
);


beasts.forEach(
(_,index)=>{

setupTarget(
index
);

}
);


setupPreload();


forceCameraLayer();

}
);


/* =========================================================
   AR READY
========================================================= */

scene.addEventListener(

"arReady",

()=>{

console.log(
"MINDAR CAMERA READY"
);


const cameraState=
document.getElementById(
"cameraState"
);


if(cameraState){

cameraState.textContent=
"READY";

cameraState.className=
"on";

}


mainStatus.textContent=
"CAMERA READY • SEARCHING";


bottom.textContent=
"📷 Point camera at any Card Beast target.";


forceCameraLayer();


setTimeout(
forceCameraLayer,
100
);

setTimeout(
forceCameraLayer,
300
);

setTimeout(
forceCameraLayer,
700
);

setTimeout(
forceCameraLayer,
1200
);

setTimeout(
forceCameraLayer,
2000
);

}
);


/* =========================================================
   AR ERROR
========================================================= */

scene.addEventListener(

"arError",

event=>{

console.error(
"MINDAR AR ERROR",
event
);


const cameraState=
document.getElementById(
"cameraState"
);


if(cameraState){

cameraState.textContent=
"ERROR";

cameraState.className=
"err";

}


mainStatus.textContent=
"CAMERA ERROR";


bottom.textContent=
"Camera could not start.";

}
);


/* =========================================================
   WINDOW LOAD
========================================================= */

window.addEventListener(

"load",

()=>{

forceCameraLayer();


setTimeout(
forceCameraLayer,
300
);

setTimeout(
forceCameraLayer,
800
);

setTimeout(
forceCameraLayer,
1500
);

}
);


/* =========================================================
   CONTINUOUS CAMERA PROTECTION
========================================================= */

setInterval(

()=>{

forceCameraLayer();

},

1000

);


/* =========================================================
   INITIAL UI
========================================================= */

beasts.forEach(

(_,index)=>{

setBadge(
index,
"WAIT",
"wait"
);

}

);

</script>

</body>
</html>
