<style>

/* =========================================
   GENERAL
========================================= */

}

html,
body{

  margin:0;
  padding:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  font-family:
    Arial,
    Helvetica,

}

body{

  position:fixed;

  inset:0;

}


/* =========================================
   CAMERA VIDEO
========================================= */

video{

  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  max-width:none!important;

<script>

(function(){

"use strict";


/* =========================================
   ELEMENTS
========================================= */

const scene =
  document.getElementById(
    "scene"
  );


const target =
  document.getElementById(
    "target"
  );


const beast =
  document.getElementById(
    "beast"
  );


const dragonModel =
  document.getElementById(
    "dragonModel"
  );


const status =
  document.getElementById(
    "status"
  );


const info =
  document.getElementById(
    "info"
  );


const loading =
  document.getElementById(
    "loading"
  );


const loadingText =
  document.getElementById(
    "loadingText"
  );


/* =========================================
   VERSION
========================================= */

const VERSION =
  "48";


/* =========================================
   TARGET
========================================= */

const TARGET_ID =
  "DR-001";


const TARGET_INDEX =
  0;


/* =========================================
   MODEL
========================================= */

const MODEL_PATH =
  "./models/ember-dragon.glb?v=" +
  VERSION;


/* =========================================
   LOCKED DRAGON BASELINE
========================================= */

const DRAGON_X =
  0.14;


const DRAGON_Y =
  -0.25;


const DRAGON_Z =
  0;


/*
  ROTATION JANGAN UBAH.
*/

const DRAGON_ROT_X =
  90;

const DRAGON_ROT_Y =
  0;

const DRAGON_ROT_Z =
  0;


/* =========================================
   BEAST BASELINE
========================================= */

const BEAST_ROT_X =
  0;

const BEAST_ROT_Y =
  0;

const BEAST_ROT_Z =
  0;


const BEAST_SCALE =
  2.5;


/* =========================================
   EPIC EMERGENCE
     
   X DAN Y TIDAK DIANIMATE.

   Z sahaja bergerak sedikit.
========================================= */

const START_Z =
  0;


const PEAK_Z =
  0.035;


const START_SCALE =
  0.45;


const PEAK_SCALE =
  2.65;


const FINAL_SCALE =
  2.5;


const EMERGENCE_DURATION =
  850;


/* =========================================
   STATE
========================================= */

let modelReady =
  false;


let targetFound =
  false;


let animationPlayed =
  false;


let animationRunning =
  false;


let animationFrame =
  null;


/* =========================================
   UI
========================================= */

function setStatus(
  text,
  cls
){

  status.textContent =
    text;

  status.className =
    cls || "warn";

}


function setInfo(
  html
){

  info.innerHTML =
    html;

}


function hideLoading(){

  loading.classList.add(
    "hidden"
  );

}


function showLoading(
  text
){

  loadingText.textContent =
    text;

  loading.classList.remove(
    "hidden"
  );

}


/* =========================================
   LOCK DRAGON ROTATION
     
   IMPORTANT:
   90 0 0
========================================= */

function lockDragonRotation(){

  if(
    !dragonModel ||
    !dragonModel.object3D
  ){

    return;

  }


  const obj =
    dragonModel.object3D;


  obj.rotation.set(

    THREE.MathUtils.degToRad(
      DRAGON_ROT_X
    ),

    THREE.MathUtils.degToRad(
      DRAGON_ROT_Y
    ),

    THREE.MathUtils.degToRad(
      DRAGON_ROT_Z
    )

  );


  obj.updateMatrixWorld(
    true
  );

}


/* =========================================
   RESET BASELINE
========================================= */

function resetBaseline(){

  if(
    !dragonModel ||
    !dragonModel.object3D
  ){

    return;

  }


  /*
    BEAST
  */

  beast.object3D.position.set(

    0,
    0,
    0

  );


  beast.object3D.rotation.set(

    BEAST_ROT_X,
    BEAST_ROT_Y,
    BEAST_ROT_Z

  );


  beast.object3D.scale.set(

    BEAST_SCALE,
    BEAST_SCALE,
    BEAST_SCALE

  );


  /*
    DRAGON
  */

  dragonModel.object3D.position.set(

    DRAGON_X,
    DRAGON_Y,
    DRAGON_Z

  );


  dragonModel.object3D.scale.set(

    1,
    1,
    1

  );


  lockDragonRotation();


  beast.object3D.updateMatrixWorld(
    true
  );


  dragonModel.object3D.updateMatrixWorld(
    true
  );

}


/* =========================================
   EASING
========================================= */

function easeOutCubic(
  t
){

  return 1 -
    Math.pow(
      1 - t,
      3
    );

}


function easeOutBack(
  t
){

  const c1 =
    1.70158;


  const c3 =
    c1 + 1;


  return 1 +
    c3 *
    Math.pow(
      t - 1,
      3
    ) +
    c1 *
    Math.pow(
      t - 1,
      2
    );

}


/* =========================================
   CANCEL ANIMATION
========================================= */

function cancelAnimation(){

  if(
    animationFrame !== null
  ){

    cancelAnimationFrame(
      animationFrame
    );

  }


  animationFrame =
    null;


  animationRunning =
    false;

}


/* =========================================
   EPIC EMERGENCE
     
   ONLY Z MOVEMENT
     
   X = 0.14
   Y = -0.25
     
   ROTATION = 90 0 0
========================================= */

function playEpicEmergence(){

  if(
    !modelReady ||
    !targetFound ||
    animationPlayed ||
    animationRunning
  ){

    return;

  }


  animationPlayed =
    true;


  animationRunning =
    true;


  /*
    Start state.
  */

  dragonModel.object3D.position.set(

    DRAGON_X,
    DRAGON_Y,
    START_Z

  );


  dragonModel.object3D.scale.set(

    START_SCALE,
    START_SCALE,
    START_SCALE

  );


  /*
    Rotation LOCK.
  */

  lockDragonRotation();


  const startTime =
    performance.now();


  function animate(
    now
  ){

    if(
      !targetFound ||
      !animationRunning
    ){

      return;

    }


    const elapsed =
      now -
      startTime;


    let t =
      Math.min(
        elapsed /
        EMERGENCE_DURATION,
        1
      );


    /*
      Main growth.
    */

    let growth;


    if(
      t < 0.82
    ){

      const p =
        t / 0.82;


      growth =
        easeOutCubic(
          p
        );

    }else{

      const p =
        (
          t - 0.82
        ) /
        0.18;


      growth =
        1 +
        (
          0.06 *
          Math.sin(
            p *
            Math.PI
          )
        );

    }


    let scale;


    if(
      t < 0.82
    ){

      scale =
        START_SCALE +
        (
          PEAK_SCALE -
          START_SCALE
        ) *
        growth;

    }else{

      const settle =
        (
          t - 0.82
        ) /
        0.18;


      scale =
        PEAK_SCALE +
        (
          FINAL_SCALE -
          PEAK_SCALE
        ) *
        settle;

    }


    /*
      Z hanya bergerak
      sangat sedikit.
    */

    const zProgress =
      easeOutCubic(
        t
      );


    const currentZ =
      START_Z +
      (
        PEAK_Z -
        START_Z
      ) *
      zProgress;


    /*
      X LOCK
    */

    dragonModel.object3D.position.x =
      DRAGON_X;


    /*
      Y LOCK
    */

    dragonModel.object3D.position.y =
      DRAGON_Y;


    /*
      Z ANIMATION SAHAJA
    */

    dragonModel.object3D.position.z =
      currentZ;


    /*
      SCALE
    */

    dragonModel.object3D.scale.set(

      scale,
      scale,
      scale

    );


    /*
      ROTATION LOCK
    */

    lockDragonRotation();


    /*
      BEAST LOCK
    */

    beast.object3D.position.set(
      0,
      0,
      0
    );


    beast.object3D.rotation.set(
      0,
      0,
      0
    );


    beast.object3D.scale.set(

      BEAST_SCALE,
      BEAST_SCALE,
      BEAST_SCALE

    );


    beast.object3D.updateMatrixWorld(
      true
    );


    if(
      t < 1
    ){

      animationFrame =
        requestAnimationFrame(
          animate
        );

      return;

    }


    /*
      FINAL HARD LOCK
    */

    dragonModel.object3D.position.set(

      DRAGON_X,
      DRAGON_Y,
      PEAK_Z

    );


    dragonModel.object3D.scale.set(

      1,
      1,
      1

    );


    lockDragonRotation();


    beast.object3D.scale.set(

      BEAST_SCALE,
      BEAST_SCALE,
      BEAST_SCALE

    );


    beast.object3D.updateMatrixWorld(
      true
    );


    dragonModel.object3D.updateMatrixWorld(
      true
    );


    animationFrame =
      null;


    animationRunning =
      false;


    console.log(
      "Epic Emergence completed."
    );


    console.log(
      "Final dragon position:",
      DRAGON_X,
      DRAGON_Y,
      PEAK_Z
    );


    console.log(
      "Final dragon rotation:",
      "90 0 0"
    );


    setInfo(

      "🔥 <b>EMBER DRAGON ACTIVE</b><br>" +

      "Epic Emergence complete.<br>" +

      "Center X: 0.14<br>" +

      "Y: -0.25<br>" +

      "Rotation: 90 0 0<br>" +

      "Scale: 2.5"

    );

  }


  animationFrame =
    requestAnimationFrame(
      animate
    );

}


/* =========================================
   A-FRAME LOADED
========================================= */

scene.addEventListener(

  "loaded",

  function(){

    setStatus(
      "CAMERA / AR INITIALISING…",
      "warn"
    );


    setInfo(

      "Loading MindAR target " +

      "<b>" +
      TARGET_ID +
      "</b>…"

    );


    console.log(
      "A-Frame loaded."
    );

  }

);


/* =========================================
   AR READY
========================================= */

scene.addEventListener(

  "arReady",

  function(){

    hideLoading();


    setStatus(
      "CAMERA ACTIVE ✓",
      "ok"
    );


    setInfo(

      "Point the rear camera at " +

      "<b>DR-001 Ember Dragon</b>."

    );


    console.log(
      "MindAR arReady."
    );

  }

);


/* =========================================
   MODEL LOADED
========================================= */

dragonModel.addEventListener(

  "model-loaded",

  function(){

    modelReady =
      true;


    resetBaseline();


    console.log(
      "========================================"
    );


    console.log(
      "CARD BEAST AR — DR-001 v48"
    );


    console.log(
      "========================================"
    );


    console.log(
      "Target ID:",
      TARGET_ID
    );


    console.log(
      "Target index:",
      TARGET_INDEX
    );


    console.log(
      "Target file:",
      "./targets.mind?v=48"
    );


    console.log(
      "Model:",
      MODEL_PATH
    );


    console.log(
      "Dragon position:",
      "0.14 -0.25 0"
    );


    console.log(
      "Dragon rotation:",
      "90 0 0"
    );


    console.log(
      "Beast rotation:",
      "0 0 0"
    );


    console.log(
      "Beast scale:",
      "2.5"
    );


    console.log(
      "Epic Emergence:",
      "Z only"
    );


    console.log(
      "World Y rotation:",
      "OFF"
    );


    console.log(
      "========================================"
    );


    setInfo(

      "🔥 <b>EMBER DRAGON READY</b><br>" +

      "3D model loaded successfully.<br>" +

      "Testing center X = 0.14."

    );

  }

);


/* =========================================
   MODEL ERROR
========================================= */

dragonModel.addEventListener(

  "model-error",

  function(event){

    modelReady =
      false;


    console.error(
      "GLB model error:",
      event
    );


    setStatus(
      "MODEL ERROR",
      "err"
    );


    setInfo(

      "❌ Failed to load " +

      "<b>ember-dragon.glb</b>.<br>" +

      "Check the models folder and filename."

    );


    showLoading(
      "Failed to load 3D model."
    );

  }

);


/* =========================================
   TARGET FOUND
========================================= */

target.addEventListener(

  "targetFound",

  function(){

    targetFound =
      true;


    animationPlayed =
      false;


    cancelAnimation();


    /*
      Reset sebelum emergence.
    */

    resetBaseline();


    beast.setAttribute(
      "visible",
      "true"
    );


    setStatus(

      "CARD CONFIRMED • DR-001",

      "ok"

    );


    setInfo(

      "🔥 <b>EMBER DRAGON DETECTED</b><br>" +

      "Epic Emergence starting…"

    );


    console.log(
      "DR-001 targetFound."
    );


    /*
      Main sekali setiap
      targetFound.
    */

    playEpicEmergence();

  }

);


/* =========================================
   TARGET LOST
========================================= */

target.addEventListener(

  "targetLost",

  function(){

    targetFound =
      false;


    cancelAnimation();


    animationPlayed =
      false;


    beast.setAttribute(

      "visible",

      "false"

    );


    resetBaseline();


    setStatus(

      "CAMERA ACTIVE ✓",

      "ok"

    );


    setInfo(

      "Point the rear camera at " +

      "<b>DR-001 Ember Dragon</b>."

    );


    console.log(
      "DR-001 targetLost."
    );

  }

);


/* =========================================
   AR ERROR
========================================= */

scene.addEventListener(

  "arError",

  function(event){

    console.error(
      "MindAR error:",
      event
    );


    targetFound =
      false;


    cancelAnimation();


    beast.setAttribute(

      "visible",

      "false"

    );


    setStatus(
      "AR ERROR",
      "err"
    );


    setInfo(

      "❌ MindAR gagal dimulakan.<br>" +

      "Pastikan permission kamera " +

      "diberikan."

    );

  }

);


/* =========================================
   CAMERA VIDEO
========================================= */

function fixVideoLayer(){

  document
    .querySelectorAll(
      "video"
    )
    .forEach(

      function(video){

        video.setAttribute(
          "playsinline",
          ""
        );


        video.setAttribute(
          "webkit-playsinline",
          ""
        );


        video.setAttribute(
          "autoplay",
          ""
        );


        video.muted =
          true;


        Object.assign(

          video.style,

          {

            position:
              "fixed",

            inset:
              "0",

            width:
              "100%",

            height:
              "100%",

            maxWidth:
              "none",

            maxHeight:
              "none",

            objectFit:
              "cover",

            objectPosition:
              "center center",

            zIndex:
              "0",

            display:
              "block",

            background:
              "#000"

          }

        );

      }

    );

}


/* =========================================
   VIDEO OBSERVER
========================================= */

new MutationObserver(

  function(){

    fixVideoLayer();

  }

).observe(

  document.documentElement,

  {

    childList:
      true,

    subtree:
      true

  }

);


/* =========================================
   INITIAL VIDEO FIX
========================================= */

fixVideoLayer();


/* =========================================
   RESIZE
========================================= */

function handleResize(){

  fixVideoLayer();

}


window.addEventListener(

  "resize",

  handleResize

);


window.addEventListener(

  "orientationchange",

  function(){

    setTimeout(

      handleResize,

      250

    );

  }

);


/* =========================================
   VISIBILITY
========================================= */

document.addEventListener(

  "visibilitychange",

  function(){

    if(
      document.hidden
    ){

      cancelAnimation();


      beast.setAttribute(
        "visible",
        "false"
      );

    }

  }

);


/* =========================================
   GLOBAL ERROR
========================================= */

window.addEventListener(

  "error",

  function(event){

    console.error(

      "Page error:",

      event.error ||
      event.message

    );

  }

);


window.addEventListener(

  "unhandledrejection",

  function(event){

    console.error(

      "Unhandled promise:",

      event.reason

    );

  }

);
