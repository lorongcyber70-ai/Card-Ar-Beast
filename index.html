<!doctype html>
<html lang="ms">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Card Beast AR — DR-001 v46</title>


<!-- =========================================
     A-FRAME
========================================= -->

<script
  src="https://aframe.io/releases/1.5.0/aframe.min.js">
</script>


<!-- =========================================
     MINDAR
========================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js">
</script>


<style>

/* =========================================
   RESET
========================================= */

*{
  box-sizing:border-box;
}


html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}


body{

  position:fixed;

  inset:0;

}


/* =========================================
   CAMERA VIDEO
========================================= */

video{

  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;

}


/* =========================================
   A-FRAME
========================================= */

a-scene{

  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;

}


.a-canvas,
canvas{

  background:transparent!important;

}


/* =========================================
   TOP UI
========================================= */

#ui{

  position:fixed;

  z-index:20;

  top:18px;

  left:0;

  width:100%;

  text-align:center;

  pointer-events:none;

  padding:
    0
    12px;

}


.logo{

  font-size:28px;

  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px #000;

}


.logo span{

  color:#b75cff;

}


#status{

  display:inline-block;

  margin-top:12px;

  padding:
    10px
    20px;

  border:
    1px solid
    #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:
    rgba(
      5,
      0,
      12,
      .72
    );

  font-weight:800;

  box-shadow:
    0 0 12px
    rgba(
      183,
      92,
      255,
      .25
    );

}


/* =========================================
   INFO
========================================= */

#info{

  position:fixed;

  z-index:20;

  left:5%;
  right:5%;

  bottom:
    max(
      20px,
      env(
        safe-area-inset-bottom
      )
    );

  padding:
    14px
    18px;

  border:
    1px solid
    #7d35b8;

  border-radius:24px;

  background:
    rgba(
      5,
      0,
      12,
      .84
    );

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;

  box-shadow:
    0 0 18px
    rgba(
      125,
      53,
      184,
      .2
    );

}


.ok{

  color:#68ff9b;

}


.err{

  color:#ff6b6b;

}


/* =========================================
   MOBILE
========================================= */

@media(
  max-width:600px
){

  .logo{

    font-size:28px;

  }


  #status{

    font-size:16px;

    padding:
      10px
      18px;

  }


  #info{

    font-size:17px;

    left:5%;
    right:5%;

    bottom:20px;

  }

}


/* =========================================
   VERY SMALL SCREEN
========================================= */

@media(
  max-height:650px
){

  #ui{

    top:10px;

  }


  .logo{

    font-size:24px;

  }


  #status{

    margin-top:8px;

    padding:
      8px
      16px;

  }


  #info{

    bottom:10px;

    padding:
      10px
      14px;

    font-size:15px;

  }

}

</style>

</head>


<body>


<!-- =========================================
     TOP UI
========================================= -->

<div id="ui">

  <div class="logo">

    CARD
    <span>BEAST</span>
    AR

  </div>


  <div id="status">

    INITIALISING CAMERA…

  </div>

</div>


<!-- =========================================
     INFO
========================================= -->

<div id="info">

  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.

</div>


<!-- =========================================
     A-FRAME + MINDAR
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="
    enabled:false
  "

  device-orientation-permission-ui="
    enabled:false
  "

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind?v=46;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="
    enabled:false
  "

>


  <!-- =======================================
       CAMERA
  ======================================== -->

  <a-camera

    position="0 0 0"

    look-controls="
      enabled:false
    "

  ></a-camera>


  <!-- =======================================
       DR-001 TARGET
       
       KEKAL
       
       targetIndex:0
  ======================================== -->

  <a-entity

    id="target"

    mindar-image-target="
      targetIndex:0
    "

  >


    <!-- =====================================
         BEAST PARENT
         
         BASELINE:
         rotation 0 0 0
         scale 2.5
    ====================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 0 0"

      rotation="0 0 0"

      scale="2.5 2.5 2.5"

    >


      <!-- ===================================
           DRAGON MODEL
           
           BASELINE:
           
           POSITION:
           -0.10 -0.25 0
           
           ROTATION:
           90 0 0
           
           LOCAL SCALE:
           1 1 1
           
           PARENT SCALE:
           2.5
      ==================================== -->

      <a-entity

        id="dragonModel"

        gltf-model="
          ./models/ember-dragon.glb?v=46
        "

        position="
          -0.10 -0.25 0
        "

        rotation="
          90 0 0
        "

        scale="
          1 1 1
        "

      ></a-entity>


    </a-entity>


  </a-entity>


</a-scene>


<script>

(function(){


  /* =========================================
     ELEMENTS
  ========================================= */

  const scene =
    document.getElementById(
      'scene'
    );


  const target =
    document.getElementById(
      'target'
    );


  const beast =
    document.getElementById(
      'beast'
    );


  const dragonModel =
    document.getElementById(
      'dragonModel'
    );


  const status =
    document.getElementById(
      'status'
    );


  const info =
    document.getElementById(
      'info'
    );


  /* =========================================
     BASELINE
  ========================================= */

  const BASE_X =
    -0.10;


  const BASE_Y =
    -0.25;


  const BASE_Z =
    0;


  const BASE_ROTATION_X =
    90;


  const BASE_ROTATION_Y =
    0;


  const BASE_ROTATION_Z =
    0;


  const BEAST_SCALE =
    2.5;


  const EMERGENCE_START_SCALE =
    0.28;


  const EMERGENCE_START_Y =
    -0.45;


  const EMERGENCE_LIFT =
    0.20;


  const EMERGENCE_DURATION =
    900;


  /* =========================================
     STATE
  ========================================= */

  let animationFrame =
    null;


  let emergenceRunning =
    false;


  let targetCurrentlyFound =
    false;


  let modelReady =
    false;


  /* =========================================
     STATUS
  ========================================= */

  function setStatus(
    text,
    cls
  ){

    status.textContent =
      text;


    status.className =
      cls || '';

  }


  /* =========================================
     INFO
  ========================================= */

  function setInfo(
    html
  ){

    info.innerHTML =
      html;

  }


  /* =========================================
     BASELINE RESET
     
     IMPORTANT:
     ROTATION TIDAK DIUBAH
     
     90 0 0
  ========================================= */

  function resetDragonBaseline(){

    if(
      !dragonModel ||
      !dragonModel.object3D
    ){

      return;

    }


    const obj =
      dragonModel.object3D;


    /*
      Position baseline
    */

    obj.position.set(

      BASE_X,

      BASE_Y,

      BASE_Z

    );


    /*
      Rotation baseline
       
      KEKAL:
      90 0 0
    */

    obj.rotation.set(

      THREE.MathUtils.degToRad(
        BASE_ROTATION_X
      ),

      THREE.MathUtils.degToRad(
        BASE_ROTATION_Y
      ),

      THREE.MathUtils.degToRad(
        BASE_ROTATION_Z
      )

    );


    /*
      Local model scale.
      
      Parent beast kekal 2.5.
    */

    obj.scale.set(
      1,
      1,
      1
    );


    obj.updateMatrixWorld(
      true
    );

  }


  /* =========================================
     EASING
  ========================================= */

  function easeOutCubic(
    t
  ){

    return 1 -
      Math.pow(
        1 - t,
        3
      );

  }


  function easeOutBack(
    t
  ){

    const c1 =
      1.70158;


    const c3 =
      c1 + 1;


    return 1 +
      c3 *
      Math.pow(
        t - 1,
        3
      ) +
      c1 *
      Math.pow(
        t - 1,
        2
      );

  }


  /* =========================================
     CANCEL EMERGENCE
  ========================================= */

  function cancelEmergence(){

    if(
      animationFrame !== null
    ){

      cancelAnimationFrame(
        animationFrame
      );

    }


    animationFrame =
      null;


    emergenceRunning =
      false;

  }


  /* =========================================
     EPIC EMERGENCE
     
     FLOW:
     
     SMALL
       ↓
     RISE
       ↓
     GROW
       ↓
     BOUNCE
       ↓
     FINAL
     
     FINAL:
     
     position:
     -0.10 -0.25 0
     
     rotation:
     90 0 0
     
     scale:
     1 1 1
     
     Parent:
     2.5
  ========================================= */

  function playEpicEmergence(){

    if(
      !modelReady
    ){

      console.warn(
        'Model belum ready.'
      );

      return;

    }


    cancelEmergence();


    const obj =
      dragonModel.object3D;


    /*
      Pastikan baseline
      sebelum animation.
    */

    resetDragonBaseline();


    /*
      Start position
      sedikit di bawah kad.
    */

    obj.position.set(

      BASE_X,

      EMERGENCE_START_Y,

      BASE_Z

    );


    /*
      Start kecil.
    */

    obj.scale.set(

      EMERGENCE_START_SCALE,

      EMERGENCE_START_SCALE,

      EMERGENCE_START_SCALE

    );


    /*
      ROTATION KEKAL.
      
      JANGAN SENTUH.
    */

    obj.rotation.set(

      THREE.MathUtils.degToRad(90),

      0,

      0

    );


    obj.updateMatrixWorld(
      true
    );


    emergenceRunning =
      true;


    const startTime =
      performance.now();


    function animate(
      now
    ){

      if(
        !targetCurrentlyFound
      ){

        cancelEmergence();

        return;

      }


      const elapsed =
        now -
        startTime;


      let t =
        Math.min(
          elapsed /
          EMERGENCE_DURATION,
          1
        );


      /*
        GROW + RISE
      */

      const growth =
        easeOutBack(t);


      const currentScale =
        EMERGENCE_START_SCALE +
        (
          1 -
          EMERGENCE_START_SCALE
        ) *
        growth;


      /*
        Lift dari bawah
        menuju baseline Y.
      */

      const liftProgress =
        easeOutCubic(t);


      const currentY =
        EMERGENCE_START_Y +
        (
          BASE_Y -
          EMERGENCE_START_Y
        ) *
        liftProgress;


      obj.position.set(

        BASE_X,

        currentY,

        BASE_Z

      );


      obj.scale.set(

        currentScale,

        currentScale,

        currentScale

      );


      /*
        Rotation sentiasa
        90 0 0.
      */

      obj.rotation.set(

        THREE.MathUtils.degToRad(90),

        0,

        0

      );


      obj.updateMatrixWorld(
        true
      );


      if(
        t < 1
      ){

        animationFrame =
          requestAnimationFrame(
            animate
          );

        return;

      }


      /*
        FINAL SNAP
        untuk memastikan
        tiada floating
        atau rounding error.
      */

      obj.position.set(

        BASE_X,

        BASE_Y,

        BASE_Z

      );


      obj.scale.set(

        1,
        1,
        1

      );


      obj.rotation.set(

        THREE.MathUtils.degToRad(90),

        0,

        0

      );


      obj.updateMatrixWorld(
        true
      );


      animationFrame =
        null;


      emergenceRunning =
        false;


      console.log(
        'Epic Emergence complete.'
      );


      setInfo(

        '🔥 <b>EMBER DRAGON ACTIVE</b><br>' +

        'Epic Emergence complete.<br>' +

        'Position X: -0.10<br>' +

        'Position Y: -0.25<br>' +

        'Rotation: 90 0 0<br>' +

        'Scale: 2.5'

      );

    }


    animationFrame =
      requestAnimationFrame(
        animate
      );

  }


  /* =========================================
     A-FRAME LOADED
  ========================================= */

  scene.addEventListener(

    'loaded',

    function(){

      setStatus(
        'CAMERA / AR INITIALISING…'
      );


      setInfo(

        'Loading MindAR target ' +

        '<b>DR-001</b>…'

      );


      console.log(
        'A-Frame loaded.'
      );

    }

  );


  /* =========================================
     AR READY
  ========================================= */

  scene.addEventListener(

    'arReady',

    function(){

      setStatus(

        'CAMERA ACTIVE ✓',

        'ok'

      );


      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );


      console.log(
        'MindAR arReady.'
      );

    }

  );


  /* =========================================
     MODEL LOADED
  ========================================= */

  dragonModel.addEventListener(

    'model-loaded',

    function(){

      modelReady =
        true;


      /*
        Pastikan baseline
        betul selepas GLB load.
      */

      resetDragonBaseline();


      console.log(
        '========================================'
      );


      console.log(
        'CARD BEAST AR — DR-001 v46'
      );


      console.log(
        '========================================'
      );


      console.log(
        'Target: DR-001'
      );


      console.log(
        'Target index: 0'
      );


      console.log(
        'Target file: ./targets.mind?v=46'
      );


      console.log(
        'Model: ./models/ember-dragon.glb?v=46'
      );


      console.log(
        'Position:',
        BASE_X,
        BASE_Y,
        BASE_Z
      );


      console.log(
        'Rotation:',
        BASE_ROTATION_X,
        BASE_ROTATION_Y,
        BASE_ROTATION_Z
      );


      console.log(
        'Beast rotation: 0 0 0'
      );


      console.log(
        'Beast scale:',
        BEAST_SCALE
      );


      console.log(
        'Epic Emergence: ENABLED'
      );


      console.log(
        '========================================'
      );


      setInfo(

        '🔥 <b>EMBER DRAGON READY</b><br>' +

        '🟣 3D model loaded successfully.<br>' +

        'Epic Emergence ready.'

      );

    }

  );


  /* =========================================
     MODEL ERROR
  ========================================= */

  dragonModel.addEventListener(

    'model-error',

    function(event){

      modelReady =
        false;


      console.error(
        'GLB model error:',
        event
      );


      setStatus(

        'MODEL ERROR',

        'err'

      );


      setInfo(

        '❌ Failed to load ' +

        '<b>ember-dragon.glb</b>.<br>' +

        'Check the <b>models</b> folder and ' +

        'filename.'

      );

    }

  );


  /* =========================================
     TARGET FOUND
     
     ANIMATION ONCE
     SETIAP TARGET FOUND
  ========================================= */

  target.addEventListener(

    'targetFound',

    function(){

      targetCurrentlyFound =
        true;


      console.log(
        'DR-001 targetFound.'
      );


      /*
        Beast hidup.
      */

      beast.setAttribute(

        'visible',

        'true'

      );


      /*
        Kalau model sudah ready,
        mainkan Epic Emergence.
      */

      if(
        modelReady
      ){

        playEpicEmergence();

      }else{

        /*
          Tunggu model-loaded.
        */

        setInfo(

          '🔥 <b>EMBER DRAGON DETECTED</b><br>' +

          'Loading 3D model…'

        );

      }


      setStatus(

        'CARD CONFIRMED • DR-001',

        'ok'

      );

    }

  );


  /* =========================================
     TARGET LOST
  ========================================= */

  target.addEventListener(

    'targetLost',

    function(){

      targetCurrentlyFound =
        false;


      cancelEmergence();


      /*
        Sembunyikan beast.
      */

      beast.setAttribute(

        'visible',

        'false'

      );


      /*
        Reset kepada baseline
        supaya detection seterusnya
        bermula dari keadaan yang sama.
      */

      if(
        modelReady
      ){

        resetDragonBaseline();

      }


      setStatus(

        'CAMERA ACTIVE ✓',

        'ok'

      );


      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );


      console.log(
        'DR-001 targetLost.'
      );

    }

  );


  /* =========================================
     AR ERROR
  ========================================= */

  scene.addEventListener(

    'arError',

    function(event){

      console.error(
        'MindAR error:',
        event
      );


      setStatus(

        'AR ERROR',

        'err'

      );


      setInfo(

        '❌ MindAR gagal dimulakan.<br>' +

        'Pastikan permission kamera ' +

        'dibenarkan.'

      );

    }

  );


  /* =========================================
     CAMERA VIDEO FIX
  ========================================= */

  function fixVideoLayer(){

    document
      .querySelectorAll(
        'video'
      )
      .forEach(

        function(video){

          video.setAttribute(
            'playsinline',
            ''
          );


          video.setAttribute(
            'autoplay',
            ''
          );


          video.muted =
            true;


          Object.assign(

            video.style,

            {

              position:
                'fixed',

              inset:
                '0',

              width:
                '100%',

              height:
                '100%',

              objectFit:
                'cover',

              zIndex:
                '0',

              display:
                'block',

              background:
                '#000'

            }

          );

        }

      );

  }


  /* =========================================
     WATCH MINDAR VIDEO
  ========================================= */

  new MutationObserver(

    fixVideoLayer

  ).observe(

    document.documentElement,

    {

      childList:
        true,

      subtree:
        true

    }

  );


  /* =========================================
     INITIAL VIDEO FIX
  ========================================= */

  fixVideoLayer();


  /* =========================================
     DEBUG
  ========================================= */

  console.log(
    '========================================'
  );


  console.log(
    'CARD BEAST AR — DR-001 v46'
  );


  console.log(
    '========================================'
  );


  console.log(
    'Tracking: MindAR'
  );


  console.log(
    'Target ID: DR-001'
  );


  console.log(
    'targetIndex: 0'
  );


  console.log(
    'Target: ./targets.mind?v=46'
  );


  console.log(
    'GLB: ./models/ember-dragon.glb?v=46'
  );


  console.log(
    'Dragon position: -0.10 -0.25 0'
  );


  console.log(
    'Dragon rotation: 90 0 0'
  );


  console.log(
    'Beast rotation: 0 0 0'
  );


  console.log(
    'Beast scale: 2.5'
  );


  console.log(
    'Epic Emergence: ON'
  );


  console.log(
    'Animation: once per targetFound'
  );


  console.log(
    'targetLost: hide + reset'
  );


  console.log(
    'Cache bust: v46'
  );


  console.log(
    '========================================'
  );


})();

</script>

</body>

</html>
