<script>

(function(){

'use strict';


/* =========================================
   CONSTANTS
========================================= */

const VERSION = '46';

const TARGET_ID = 'DR-001';

const TARGET_FILE =
  './targets.mind?v=' +
  VERSION;

const MODEL_FILE =
  './models/ember-dragon.glb?v=' +
  VERSION;


/*
  Final visible scale comes from:

  beast scale = 2.5

  emergence scale animation:
  0.12 → 1

  Jadi final model tetap 2.5.
*/


/* =========================================
   ELEMENTS
========================================= */

const scene =
  document.getElementById(
    'scene'
  );


const target =
  document.getElementById(
    'target'
  );


const beast =
  document.getElementById(
    'beast'
  );


const emergence =
  document.getElementById(
    'emergence'
  );


const dragonModel =
  document.getElementById(
    'dragonModel'
  );


const status =
  document.getElementById(
    'status'
  );


const info =
  document.getElementById(
    'info'
  );


const loading =
  document.getElementById(
    'loading'
  );


const loadingText =
  document.getElementById(
    'loadingText'
  );


/* =========================================
   STATE
========================================= */

let modelReady = false;

let targetFound = false;

let animationRunning = false;

let animationToken = 0;


/* =========================================
   HELPERS
========================================= */

function setStatus(
  text,
  type
){

  status.textContent =
    text;

  status.className =
    type || 'warn';

}


function setInfo(
  html
){

  info.innerHTML =
    html;

}


function showLoading(
  text
){

  loadingText.textContent =
    text;

  loading.classList.remove(
    'hidden'
  );

}


function hideLoading(){

  loading.classList.add(
    'hidden'
  );

}


/* =========================================
   MODEL VISIBILITY
========================================= */

function setVisible(
  visible
){

  beast.setAttribute(
    'visible',
    visible
  );

}


/* =========================================
   RESET EMERGENCE
========================================= */

function resetEmergence(){

  animationToken++;

  animationRunning =
    false;


  /*
    Hide dahulu.
  */

  setVisible(
    false
  );


  /*
    Reset emergence position.

    Mula sedikit di bawah
    daripada final position.

    Final dragonModel:
    Y = -0.25

    Emergence:
    Y = -0.12

    Jadi semasa summon ia naik
    sedikit ke atas.
  */

  emergence.setAttribute(
    'position',
    '0 -0.12 0'
  );


  /*
    Start kecil.

    Final:
    1 1 1

    Beast parent:
    2.5

    Jadi final:
    2.5
  */

  emergence.setAttribute(
    'scale',
    '0.12 0.12 0.12'
  );


  /*
    PENTING:

    Rotation model langsung
    tidak disentuh.

    dragonModel:
    90 0 0
  */

}


/* =========================================
   ANIMATION EASING
========================================= */

function easeOutCubic(t){

  return 1 -
    Math.pow(
      1 - t,
      3
    );

}


function easeOutBack(t){

  const c1 = 1.70158;

  const c3 =
    c1 + 1;

  return 1 +
    c3 *
    Math.pow(
      t - 1,
      3
    ) +
    c1 *
    Math.pow(
      t - 1,
      2
    );

}


/* =========================================
   EPIC EMERGENCE
========================================= */

function playEmergence(){

  /*
    Pastikan model memang sudah
    loaded.
  */

  if(!modelReady){

    console.warn(
      'Model belum ready.'
    );

    return;

  }


  /*
    Jika animation sedang berjalan,
    jangan restart.
  */

  if(animationRunning){

    return;

  }


  animationRunning =
    true;


  const myToken =
    ++animationToken;


  /*
    ========================================
    PHASE 0
    ========================================

    Start:
    kecil + sedikit rendah.
  */

  setVisible(
    true
  );


  emergence.setAttribute(
    'position',
    '0 -0.12 0'
  );


  emergence.setAttribute(
    'scale',
    '0.12 0.12 0.12'
  );


  /*
    ========================================
    PHASE 1
    ========================================

    0 → 650ms

    Naga naik sedikit
    dan membesar.
  */

  const startTime =
    performance.now();


  const phase1Duration =
    650;


  function phase1(
    now
  ){

    if(
      myToken !==
      animationToken
    ){

      return;

    }


    if(
      !targetFound
    ){

      return;

    }


    const elapsed =
      now -
      startTime;


    let t =
      Math.min(
        elapsed /
        phase1Duration,
        1
      );


    const eased =
      easeOutCubic(
        t
      );


    /*
      Position:

      -0.12 → 0

      Ini naik sedikit dari kad.
    */

    const y =
      -0.12 +
      (
        0.12 *
        eased
      );


    emergence.setAttribute(

      'position',

      '0 ' +
      y.toFixed(4) +
      ' 0'

    );


    /*
      Scale:

      0.12 → 1.08

      Overshoot sedikit.
    */

    const scale =
      0.12 +
      (
        0.96 *
        eased
      );


    emergence.setAttribute(

      'scale',

      scale.toFixed(4) +
      ' ' +
      scale.toFixed(4) +
      ' ' +
      scale.toFixed(4)

    );


    if(
      t < 1
    ){

      requestAnimationFrame(
        phase1
      );

      return;

    }


    /*
      ======================================
      PHASE 2
      ======================================

      Bounce:

      1.08 → 0.94
    */

    const bounceStart =
      performance.now();


    const bounceDuration =
      220;


    function bounceDown(
      current
    ){

      if(
        myToken !==
        animationToken
      ){

        return;

      }


      if(
        !targetFound
      ){

        return;

      }


      const elapsed =
        current -
        bounceStart;


      let t =
        Math.min(
          elapsed /
          bounceDuration,
          1
        );


      const eased =
        easeOutCubic(
          t
        );


      const scale =
        1.08 -
        (
          0.14 *
          eased
        );


      emergence.setAttribute(

        'scale',

        scale.toFixed(4) +
        ' ' +
        scale.toFixed(4) +
        ' ' +
        scale.toFixed(4)

      );


      if(
        t < 1
      ){

        requestAnimationFrame(
          bounceDown
        );

        return;

      }


      /*
        ==================================
        PHASE 3
        ==================================

        Bounce kembali:

        0.94 → 1.00
      */

      const settleStart =
        performance.now();


      const settleDuration =
        180;


      function settle(
        currentTime
      ){

        if(
          myToken !==
          animationToken
        ){

          return;

        }


        if(
          !targetFound
        ){

          return;

        }


        const elapsed =
          currentTime -
          settleStart;


        let t =
          Math.min(
            elapsed /
            settleDuration,
            1
          );


        const eased =
          easeOutBack(
            t
          );


        /*
          Final:
          exactly 1.0

          Beast parent scale:
          2.5
        */

        let scale =
          0.94 +
          (
            0.06 *
            eased
          );


        if(
          t >= 1
        ){

          scale =
            1;

        }


        emergence.setAttribute(

          'scale',

          scale.toFixed(4) +
          ' ' +
          scale.toFixed(4) +
          ' ' +
          scale.toFixed(4)

        );


        /*
          Final position:

          0 0 0

          Dragon sendiri:

          0 -0.25 0
        */

        if(
          t >= 1
        ){

          emergence.setAttribute(

            'position',

            '0 0 0'

          );


          emergence.setAttribute(

            'scale',

            '1 1 1'

          );


          animationRunning =
            false;


          console.log(
            'Epic Emergence completed.'
          );


          setInfo(

            '🔥 <b>EMBER DRAGON ACTIVE</b><br>' +

            'Epic Emergence complete.<br>' +

            'Scale: 2.5'

          );


          return;

        }


        requestAnimationFrame(
          settle
        );

      }


      requestAnimationFrame(
        settle
      );

    }


    requestAnimationFrame(
      bounceDown
    );

  }


  requestAnimationFrame(
    phase1
  );

}


/* =========================================
   A-FRAME LOADED
========================================= */

scene.addEventListener(

  'loaded',

  function(){

    setStatus(
      'AR INITIALISING…',

      TARGET_ID +

    );

    );

  }

);


/* =========================================
   AR READY
========================================= */

scene.addEventListener(

    console.log(

    );


    console.log(

    console.log(

    );


    console.log(

    );

    );


    console.log(

    console.log(

);


/* =========================================
   MODEL ERROR
========================================= */

dragonModel.addEventListener(

  'model-error',

  function(event){

    modelReady =
      false;


    animationToken++;


    animationRunning =
      false;


    setVisible(
      false
    );


    console.error(
      'GLB model error:',
      event
    );


    setStatus(
      'MODEL ERROR',
      'err'
    );


    setInfo(

      '❌ <b>EMBER DRAGON FAILED</b><br>' +

      'Cannot load ' +

      '<b>ember-dragon.glb</b>.<br>' +

      'Check the models folder and filename.'

    );


    showLoading(
      'Failed to load 3D model.'
    );

  }

);


/* =========================================
   TARGET FOUND
========================================= */

target.addEventListener(

  'targetFound',

  function(){

    /*
      Set target state dahulu.
    */

    targetFound =
      true;


    /*
      Reset supaya setiap targetFound
      mempunyai emergence baru.

      targetFound selepas targetLost
      akan play semula.
    */

    animationToken++;


    animationRunning =
      false;


    /*
      Reset ke starting position.
    */

    resetEmergence();


    setStatus(

      'CARD CONFIRMED • DR-001',

      'ok'

    );


    setInfo(

      '🔥 <b>EMBER DRAGON SUMMONING</b><br>' +

      'Epic Emergence…'

    );


    console.log(
      'DR-001 targetFound.'
    );


    /*
      Play hanya sekali.
    */

    playEmergence();

  }

);


/* =========================================
   TARGET LOST
========================================= */

target.addEventListener(

  'targetLost',

  function(){

    targetFound =
      false;


    /*
      Cancel animation.
    */

    animationToken++;


    animationRunning =
      false;


    /*
      Hide immediately.
    */

    setVisible(
      false
    );


    /*
      Reset untuk summon seterusnya.
    */

    emergence.setAttribute(

      'position',

      '0 -0.12 0'

    );


    emergence.setAttribute(

      'scale',

      '0.12 0.12 0.12'

    );


    setStatus(

      'CAMERA ACTIVE ✓',

      'ok'

    );


    setInfo(

      'Point the rear camera at ' +

      '<b>DR-001 Ember Dragon</b>.'

    );


    console.log(
      'DR-001 targetLost.'
    );


    console.log(
      'Epic Emergence reset.'
    );

  }

);


/* =========================================
   AR ERROR
========================================= */

scene.addEventListener(

  'arError',

  function(event){

    targetFound =
      false;


    animationToken++;


    animationRunning =
      false;


    setVisible(
      false
    );


    console.error(
      'MindAR error:',
      event
    );


    setStatus(
      'AR ERROR',
      'err'
    );


    setInfo(

      '❌ MindAR gagal dimulakan.<br>' +

      'Semak permission kamera dan URL.'

    );


    showLoading(

    );

  }

);


/* =========================================
   CAMERA VIDEO
========================================= */

function inspectVideo(){

  document
    .querySelectorAll('video')
    .forEach(

      function(video){

        video.setAttribute(
          'playsinline',
          ''
        );


        video.setAttribute(
          'webkit-playsinline',
          ''
        );


        video.setAttribute(
          'autoplay',
          ''
        );


        video.muted =
          true;


        Object.assign(

          video.style,

          {

            position:'fixed',

            inset:'0',

            width:'100%',

            height:'100%',

            maxWidth:'none',

            maxHeight:'none',

            objectFit:'cover',

            objectPosition:'center center',

            zIndex:'0',

            display:'block',

            background:'#000'

          }

        );

      }

    );

}


/* =========================================
   VIDEO OBSERVER
========================================= */

const videoObserver =
  new MutationObserver(

    function(){

      inspectVideo();

    }

  );


videoObserver.observe(

  document.documentElement,

  {

    childList:true,

    subtree:true

  }

);


/* =========================================
   INITIAL VIDEO
========================================= */

inspectVideo();


/* =========================================
   RESPONSIVE RESIZE
========================================= */

function handleResize(){

  inspectVideo();


  console.log(

    'Viewport:',

    window.innerWidth,

    'x',

    window.innerHeight

  );

}


window.addEventListener(

  'resize',

  handleResize

);


window.addEventListener(

  'orientationchange',

  function(){

    setTimeout(

      handleResize,

      250

    );

  }

);


/* =========================================
   VISIBILITY CHANGE
========================================= */

document.addEventListener(

  'visibilitychange',

  function(){

    if(
      document.hidden
    ){

      /*
        Hide model while page is
        backgrounded.
      */

      setVisible(
        false
      );

    }else{

      /*
        If target is still found,
        restore according to state.

        We intentionally do NOT
        restart animation here.
      */

      if(
        targetFound &&
        modelReady &&
        !animationRunning
      ){

        setVisible(
          true
        );

      }

    }

  }

);


/* =========================================
   GLOBAL ERROR HANDLING
========================================= */

window.addEventListener(

  'error',

  function(event){

    console.error(

      'Page error:',

      event.error ||
      event.message

    );

  }

);


window.addEventListener(

  'unhandledrejection',

  function(event){

    console.error(

      'Unhandled promise:',

      event.reason

    );

  }

);
