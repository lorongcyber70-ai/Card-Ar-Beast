<!doctype html>
<html lang="ms">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Card Beast AR — DR-001 Center Baseline v47</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

/* =========================================
   GENERAL
========================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}


/* =========================================
   CAMERA VIDEO
========================================= */

video{
  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;
}


/* =========================================
   A-FRAME
========================================= */

a-scene{

  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;

}

.a-canvas,
canvas{

  background:transparent!important;

}


/* =========================================
   TOP UI
========================================= */

#ui{

  position:fixed;

  z-index:20;

  top:18px;

  left:0;

  width:100%;

  padding:0 12px;

  text-align:center;

  pointer-events:none;

}

.logo{

  font-size:28px;

  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px #000,
    0 0 12px rgba(255,255,255,.15);

}

.logo span{

  color:#b75cff;

}


#status{

  display:inline-block;

  max-width:90%;

  margin-top:12px;

  padding:10px 20px;

  border:1px solid #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.78);

  font-weight:800;

  box-shadow:
    0 0 12px rgba(183,92,255,.25);

}


/* =========================================
   INFO
========================================= */

#info{

  position:fixed;

  z-index:20;

  left:5%;

  right:5%;

  bottom:20px;

  padding:14px 18px;

  border:1px solid #7d35b8;

  border-radius:24px;

  background:rgba(5,0,12,.84);

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;

  box-shadow:
    0 0 18px rgba(125,53,184,.20);

}

.ok{
  color:#68ff9b;
}

.err{
  color:#ff6b6b;
}


/* =========================================
   MOBILE RESPONSIVE
========================================= */

@media(max-width:600px){

  .logo{
    font-size:28px;
  }

  #status{
    font-size:15px;
    padding:9px 17px;
  }

  #info{

    left:5%;

    right:5%;

    bottom:
      calc(
        18px +
        env(safe-area-inset-bottom)
      );

    font-size:17px;

    padding:14px 15px;

  }

}


/* =========================================
   SMALL HEIGHT DEVICES
========================================= */

@media(max-height:650px){

  #ui{
    top:10px;
  }

  .logo{
    font-size:24px;
  }

  #status{
    margin-top:8px;
    padding:8px 15px;
  }

  #info{
    bottom:10px;
    font-size:15px;
    padding:10px 13px;
  }

}

</style>

</head>


<body>


<!-- =========================================
     TOP UI
========================================= -->

<div id="ui">

  <div class="logo">

    CARD
    <span>BEAST</span>
    AR

  </div>


  <div id="status">

    INITIALISING CAMERA…

  </div>

</div>



<!-- =========================================
     INFO
========================================= -->

<div id="info">

  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.

</div>



<!-- =========================================
     A-FRAME + MINDAR
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind?v=47;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="
    enabled:false
  "

>


  <!-- =======================================
       CAMERA
       KEKAL
  ======================================== -->

  <a-camera

    position="0 0 0"

    look-controls="enabled:false"

  >
  </a-camera>



  <!-- =======================================
       DR-001 TARGET
       
       targetIndex:
       0
  ======================================== -->

  <a-entity

    id="target"

    mindar-image-target="targetIndex:0"

  >


    <!-- =====================================
         BEAST
         
         CENTER BASELINE
         
         X = 0
         Y = -0.25
         Z = 0
         
         ROTATION = 0 0 0
         SCALE = 2.5
    ====================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 -0.25 0"

      rotation="0 0 0"

      scale="2.5 2.5 2.5"

    >


      <!-- ===================================
           DRAGON MODEL
           
           ROTATION WAJIB KEKAL:
           90 0 0
           
           SCALE MODEL:
           1 1 1
           
           Parent beast:
           2.5
      ==================================== -->

      <a-entity

        id="dragonModel"

        gltf-model="./models/ember-dragon.glb?v=47"

        position="0 0 0"

        rotation="90 0 0"

        scale="1 1 1"

      >
      </a-entity>


    </a-entity>


  </a-entity>


</a-scene>



<script>

(function(){


  /* =========================================
     ELEMENTS
  ========================================= */

  const scene =
    document.getElementById('scene');


  const target =
    document.getElementById('target');


  const beast =
    document.getElementById('beast');


  const dragonModel =
    document.getElementById('dragonModel');


  const status =
    document.getElementById('status');


  const info =
    document.getElementById('info');


  /* =========================================
     BASELINE
     
     JANGAN UBAH ROTATION NAGA
  ========================================= */

  const BASE_X = 0;

  const BASE_Y = -0.25;

  const BASE_Z = 0;


  const DRAGON_ROTATION =
    '90 0 0';


  const FINAL_SCALE = 2.5;


  /* =========================================
     EPIC EMERGENCE
     
     Z SAHAJA DIGUNAKAN
     
     Rotation tidak disentuh.
     
     Animation hanya sekali
     untuk setiap targetFound.
  ========================================= */

  const EMERGE_START_Z = 0;

  const EMERGE_PEAK_Z = 0.035;

  const EMERGE_START_SCALE = 0.45;

  const EMERGE_PEAK_SCALE = 2.65;

  const EMERGE_FINAL_SCALE = 2.5;


  let animationPlayed = false;

  let animationRunning = false;


  /* =========================================
     STATUS
  ========================================= */

  function setStatus(
    text,
    cls
  ){

    status.textContent =
      text;

    status.className =
      cls || '';

  }


  /* =========================================
     INFO
  ========================================= */

  function setInfo(
    html
  ){

    info.innerHTML =
      html;

  }


  /* =========================================
     RESET BASELINE
     
     Ini memastikan setiap kali
     target baru dikesan,
     posisi kembali tepat.
  ========================================= */

  function resetBaseline(){

    beast.object3D.position.set(

      BASE_X,

      BASE_Y,

      BASE_Z

    );


    beast.object3D.rotation.set(

      0,

      0,

      0

    );


    beast.object3D.scale.set(

      FINAL_SCALE,

      FINAL_SCALE,

      FINAL_SCALE

    );


    /*
      PASTIKAN DRAGON ROTATION
      KEKAL 90 0 0.
    */

    dragonModel.object3D.rotation.set(

      THREE.MathUtils.degToRad(90),

      0,

      0

    );


    dragonModel.object3D.position.set(

      0,

      0,

      0

    );


    dragonModel.object3D.scale.set(

      1,

      1,

      1

    );


    beast.object3D.updateMatrixWorld(
      true
    );


    dragonModel.object3D.updateMatrixWorld(
      true
    );

  }


  /* =========================================
     EPIC EMERGENCE
     
     Naga bermula kecil
     kemudian naik sedikit
     kemudian membesar
     kemudian bounce ringkas.
     
     Z sahaja bergerak.
     
     Y KEKAL -0.25.
     
     ROTATION KEKAL 90 0 0.
  ========================================= */

  function playEpicEmergence(){

    if(
      animationPlayed ||
      animationRunning
    ){

      return;

    }


    animationPlayed =
      true;

    animationRunning =
      true;


    const startTime =
      performance.now();


    const duration =
      850;


    const startZ =
      EMERGE_START_Z;


    const peakZ =
      EMERGE_PEAK_Z;


    /*
      Mulakan kecil.
    */

    beast.object3D.position.set(

      BASE_X,

      BASE_Y,

      startZ

    );


    beast.object3D.scale.set(

      EMERGE_START_SCALE,

      EMERGE_START_SCALE,

      EMERGE_START_SCALE

    );


    /*
      Pastikan rotation parent
      tidak berubah.
    */

    beast.object3D.rotation.set(

      0,

      0,

      0

    );


    /*
      Pastikan dragon rotation
      masih 90 0 0.
    */

    dragonModel.object3D.rotation.set(

      THREE.MathUtils.degToRad(90),

      0,

      0

    );


    function easeOutBack(t){

      const c1 =
        1.70158;

      const c3 =
        c1 + 1;

      return (

        1 +

        c3 *
        Math.pow(t - 1,3) +

        c1 *
        Math.pow(t - 1,2)

      );

    }


    function animate(
      currentTime
    ){

      if(
        !animationRunning
      ){

        return;

      }


      const elapsed =
        currentTime -
        startTime;


      let t =
        Math.min(
          elapsed / duration,
          1
        );


      /*
        Ease-out-back
        memberikan sedikit bounce.
      */

      const eased =
        easeOutBack(t);


      /*
        Z bergerak sedikit sahaja.
      */

      const currentZ =
        startZ +
        (
          peakZ -
          startZ
        ) *
        eased;


      /*
        Scale:
        kecil → besar → sedikit overshoot
      */

      let currentScale;


      if(t < 0.82){

        const grow =
          t / 0.82;


        const smoothGrow =
          1 -
          Math.pow(
            1 - grow,
            3
          );


        currentScale =
          EMERGE_START_SCALE +

          (
            EMERGE_PEAK_SCALE -
            EMERGE_START_SCALE
          ) *
          smoothGrow;

      }else{

        const settle =
          (
            t - 0.82
          ) /
          0.18;


        currentScale =
          EMERGE_PEAK_SCALE +

          (
            EMERGE_FINAL_SCALE -
            EMERGE_PEAK_SCALE
          ) *
          settle;

      }


      /*
        X KEKAL 0.
        
        Y KEKAL -0.25.
        
        HANYA Z BERGERAK.
      */

      beast.object3D.position.set(

        BASE_X,

        BASE_Y,

        currentZ

      );


      beast.object3D.scale.set(

        currentScale,

        currentScale,

        currentScale

      );


      /*
        Jangan sesekali rotate beast.
      */

      beast.object3D.rotation.set(

        0,

        0,

        0

      );


      /*
        Jangan sesekali ubah
        dragonModel rotation.
      */

      dragonModel.object3D.rotation.set(

        THREE.MathUtils.degToRad(90),

        0,

        0

      );


      beast.object3D.updateMatrixWorld(
        true
      );


      if(t < 1){

        requestAnimationFrame(
          animate
        );

      }else{

        /*
          FINAL BASELINE
        */

        beast.object3D.position.set(

          BASE_X,

          BASE_Y,

          peakZ

        );


        beast.object3D.scale.set(

          FINAL_SCALE,

          FINAL_SCALE,

          FINAL_SCALE

        );


        beast.object3D.rotation.set(

          0,

          0,

          0

        );


        dragonModel.object3D.rotation.set(

          THREE.MathUtils.degToRad(90),

          0,

          0

        );


        beast.object3D.updateMatrixWorld(
          true
        );


        animationRunning =
          false;


        setInfo(

          '🔥 <b>EMBER DRAGON ACTIVE</b><br>' +

          'Epic Emergence complete.<br>' +

          'Position X: 0<br>' +

          'Position Y: -0.25<br>' +

          'Position Z: 0.035<br>' +

          'Rotation: 90 0 0<br>' +

          'Scale: 2.5'

        );

      }

    }


    requestAnimationFrame(
      animate
    );

  }


  /* =========================================
     A-FRAME LOADED
  ========================================= */

  scene.addEventListener(

    'loaded',

    function(){

      setStatus(
        'CAMERA / AR INITIALISING…'
      );


      setInfo(

        'Loading MindAR target ' +

        '<b>DR-001</b>…'

      );


      console.log(
        'A-Frame loaded.'
      );

    }

  );


  /* =========================================
     AR READY
  ========================================= */

  scene.addEventListener(

    'arReady',

    function(){

      setStatus(

        'CAMERA ACTIVE ✓',

        'ok'

      );


      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );


      console.log(
        'MindAR arReady.'
      );

    }

  );


  /* =========================================
     MODEL LOADED
  ========================================= */

  dragonModel.addEventListener(

    'model-loaded',

    function(){

      console.log(
        '================================'
      );


      console.log(
        'CARD BEAST AR — v47'
      );


      console.log(
        '================================'
      );


      console.log(
        'Target ID: DR-001'
      );


      console.log(
        'Target file: ./targets.mind?v=47'
      );


      console.log(
        'Target index: 0'
      );


      console.log(
        'Model: ./models/ember-dragon.glb?v=47'
      );


      console.log(
        'Beast position:',
        '0 -0.25 0'
      );


      console.log(
        'Beast rotation:',
        '0 0 0'
      );


      console.log(
        'Dragon rotation:',
        '90 0 0'
      );


      console.log(
        'Scale:',
        '2.5'
      );


      console.log(
        'X CENTER BASELINE: 0'
      );


      console.log(
        'Epic emergence:',
        'Z axis only'
      );


      resetBaseline();


      setInfo(

        '🔥 <b>EMBER DRAGON READY</b><br>' +

        '🟣 3D model loaded successfully.<br>' +

        'Center baseline ready.'

      );

    }

  );


  /* =========================================
     MODEL ERROR
  ========================================= */

  dragonModel.addEventListener(

    'model-error',

    function(event){

      console.error(
        'GLB model error:',
        event
      );


      setStatus(

        'MODEL ERROR',

        'err'

      );


      setInfo(

        '❌ Failed to load ' +

        '<b>ember-dragon.glb</b>.<br>' +

        'Check the models folder and filename.'

      );

    }

  );


  /* =========================================
     TARGET FOUND
  ========================================= */

  target.addEventListener(

    'targetFound',

    function(){

      console.log(
        'DR-001 targetFound.'
      );


      /*
        Reset setiap kali
        target dikesan semula.
      */

      animationPlayed =
        false;


      animationRunning =
        false;


      resetBaseline();


      beast.setAttribute(
        'visible',
        'true'
      );


      setStatus(

        'CARD CONFIRMED • DR-001',

        'ok'

      );


      setInfo(

        '🔥 <b>EMBER DRAGON DETECTED</b><br>' +

        '🟣 Epic Emergence starting...'

      );


      /*
        Play sekali untuk
        targetFound ini.
      */

      playEpicEmergence();

    }

  );


  /* =========================================
     TARGET LOST
  ========================================= */

  target.addEventListener(

    'targetLost',

    function(){

      console.log(
        'DR-001 targetLost.'
      );


      animationRunning =
        false;


      beast.setAttribute(

        'visible',

        'false'

      );


      /*
        Reset animation state
        supaya targetFound
        seterusnya boleh main
        sekali lagi.
      */

      animationPlayed =
        false;


      resetBaseline();


      setStatus(

        'CAMERA ACTIVE ✓',

        'ok'

      );


      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );

    }

  );


  /* =========================================
     AR ERROR
  ========================================= */

  scene.addEventListener(

    'arError',

    function(event){

      console.error(

        'MindAR error:',

        event

      );


      setStatus(

        'AR ERROR',

        'err'

      );


      setInfo(

        'MindAR gagal dimulakan. ' +

        'Kamera mungkin tersedia, ' +

        'tetapi AR tidak aktif.'

      );

    }

  );


  /* =========================================
     CAMERA VIDEO FIX
  ========================================= */

  function fixVideoLayer(){

    document
      .querySelectorAll('video')
      .forEach(

        function(video){

          video.setAttribute(
            'playsinline',
            ''
          );


          video.setAttribute(
            'autoplay',
            ''
          );


          video.muted =
            true;


          Object.assign(

            video.style,

            {

              position:'fixed',

              inset:'0',

              width:'100%',

              height:'100%',

              objectFit:'cover',

              zIndex:'0',

              display:'block',

              background:'#000'

            }

          );

        }

      );

  }


  /* =========================================
     WATCH MINDAR VIDEO
  ========================================= */

  new MutationObserver(

    fixVideoLayer

  ).observe(

    document.documentElement,

    {

      childList:true,

      subtree:true

    }

  );


  /* =========================================
     INITIAL VIDEO FIX
  ========================================= */

  fixVideoLayer();


  /* =========================================
     DEBUG
  ========================================= */

  console.log(
    '================================'
  );

  console.log(
    'CARD BEAST AR — CENTER BASELINE v47'
  );

  console.log(
    '================================'
  );

  console.log(
    'DR-001'
  );

  console.log(
    'targets.mind'
  );

  console.log(
    'targetIndex: 0'
  );

  console.log(
    'Model: ember-dragon.glb'
  );

  console.log(
    'Position X: 0'
  );

  console.log(
    'Position Y: -0.25'
  );

  console.log(
    'Position Z: 0'
  );

  console.log(
    'Beast rotation: 0 0 0'
  );

  console.log(
    'Dragon rotation: 90 0 0'
  );

  console.log(
    'Scale: 2.5'
  );

  console.log(
    'Epic emergence: Z only'
  );

  console.log(
    'Tracking: MindAR'
  );

  console.log(
    'Cache bust: v47'
  );

  console.log(
    '================================'
  );


})();

</script>

</body>

</html>
