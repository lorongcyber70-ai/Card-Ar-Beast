<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Card Beast AR - DR-001 Baseline</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    position:fixed;
    inset:0;
}


/* =====================================================
   CAMERA
===================================================== */

video{
    position:fixed !important;

    inset:0 !important;

    width:100% !important;
    height:100% !important;

    object-fit:cover !important;

    z-index:0 !important;

    display:block !important;

    background:#000 !important;
}


/* =====================================================
   AR SCENE
===================================================== */

a-scene{
    position:fixed !important;

    inset:0 !important;

    width:100% !important;
    height:100% !important;

    z-index:1 !important;

    background:transparent !important;
}


/* =====================================================
   TOP
===================================================== */

#topUI{

    position:fixed;

    z-index:20;

    top:18px;

    left:0;

    width:100%;

    text-align:center;

    pointer-events:none;
}

.logo{

    font-size:30px;

    font-weight:900;

    color:#fff;

    text-shadow:
        0 3px 8px rgba(0,0,0,.95),
        0 0 15px rgba(0,0,0,.8);
}

.logo span{
    color:#b84cff;
}

#status{

    display:inline-block;

    margin-top:12px;

    padding:10px 22px;

    border-radius:30px;

    border:1px solid #b84cff;

    background:
        rgba(5,0,12,.86);

    color:#68ff9b;

    font-size:17px;

    font-weight:900;

    box-shadow:
        0 0 15px
        rgba(184,76,255,.35);
}


/* =====================================================
   DEBUG PANEL
===================================================== */

#debugPanel{

    position:fixed;

    z-index:25;

    top:105px;

    left:14px;

    min-width:260px;

    max-width:340px;

    padding:15px 16px;

    border-radius:16px;

    border:
        1px solid
        rgba(255,255,255,.35);

    background:
        rgba(0,0,0,.84);

    color:#fff;

    font-size:13px;

    line-height:1.55;

    pointer-events:none;

    backdrop-filter:blur(8px);
}

.debugTitle{

    color:#d06aff;

    font-size:17px;

    font-weight:900;

    margin-bottom:8px;
}

.locked{

    color:#68ff9b;

    font-weight:600;
}

.rotation{

    margin-top:10px;

    color:#ffd84d;

    font-size:19px;

    font-weight:900;
}

.forward{

    margin-top:9px;

    color:#ff5757;

    font-weight:900;
}

.note{

    margin-top:6px;

    color:#ddd;
}

.axis{

    margin-top:9px;

    line-height:1.7;
}

.x{
    color:#ff4141;
}

.y{
    color:#73e34a;
}

.z{
    color:#4d9dff;
}


/* =====================================================
   BOTTOM INFO
===================================================== */

#info{

    position:fixed;

    z-index:20;

    left:5%;

    right:5%;

    bottom:20px;

    padding:17px 18px;

    border-radius:24px;

    border:
        1px solid
        #8d32ca;

    background:
        rgba(5,0,12,.90);

    color:#fff;

    text-align:center;

    font-size:17px;

    line-height:1.5;

    pointer-events:none;

    box-shadow:
        0 0 18px
        rgba(141,50,202,.25);
}

.ok{
    color:#68ff9b !important;
}

.error{
    color:#ff6868 !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .logo{
        font-size:28px;
    }

    #status{

        font-size:15px;

        padding:10px 18px;
    }

    #debugPanel{

        top:104px;

        left:9px;

        min-width:235px;

        max-width:300px;

        font-size:12px;

        padding:11px 12px;
    }

    .rotation{
        font-size:17px;
    }

    #info{

        left:4%;

        right:4%;

        bottom:18px;

        font-size:16px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div id="topUI">

    <div class="logo">
        CARD <span>BEAST</span> AR
    </div>

    <div id="status">
        INITIALISING CAMERA…
    </div>

</div>


<!-- =====================================================
     DEBUG PANEL
===================================================== -->

<div id="debugPanel">

    <div class="debugTitle">
        DR-001 • BASELINE TEST
    </div>

    <div class="locked">
        ✓ Position locked
    </div>

    <div class="locked">
        ✓ Parent rotation locked
    </div>

    <div class="locked">
        ✓ Scale locked
    </div>

    <div class="locked">
        ✓ Tracking locked
    </div>

    <div class="locked">
        ✓ Epic Emergence locked
    </div>

    <div class="rotation">
        Rotation: 90 0 0
    </div>

    <div class="axis">

        <span class="x">● +X</span>
        &nbsp;
        <span class="y">● +Y</span>
        &nbsp;
        <span class="z">● +Z</span>

    </div>

    <div class="forward">
        🔴 Forward / Head = local -X
    </div>

    <div class="note">
        Baseline sahaja — tiada yaw tambahan.
    </div>

</div>


<!-- =====================================================
     BOTTOM INFO
===================================================== -->

<div id="info">

    Point camera at
    <b>DR-001 Ember Dragon</b>.

</div>


<!-- =====================================================
     AR SCENE
===================================================== -->

<a-scene

    id="scene"

    embedded

    vr-mode-ui="
        enabled:false
    "

    device-orientation-permission-ui="
        enabled:false
    "

    renderer="
        alpha:true;
        colorManagement:true;
        physicallyCorrectLights:true
    "

    mindar-image="
        imageTargetSrc:./targets.mind;
        autoStart:true;
        uiScanning:false;
        uiLoading:false;
        uiError:false
    "

    color-space="sRGB"

    loading-screen="
        enabled:false
    "

>


    <!-- =================================================
         CAMERA
    ================================================== -->

    <a-camera

        position="0 0 0"

        look-controls="
            enabled:false
        "

    ></a-camera>


    <!-- =================================================
         DR-001 TARGET
    ================================================== -->

    <a-entity

        id="target"

        mindar-image-target="
            targetIndex:0
        "

    >


        <!-- =============================================
             DRAGON CONTAINER

             LOCKED:
             Position = 0 -0.25 0
             Parent Rotation = 0 0 0
             Scale = 2.5
        ============================================== -->

        <a-entity

            id="beast"

            visible="false"

            position="
                0 -0.25 0
            "

            rotation="
                0 0 0
            "

            scale="
                2.5 2.5 2.5
            "

        >


            <!-- =========================================
                 EMBER DRAGON

                 ONLY ROTATION:

                 90 0 0

                 DO NOT ADD YAW.
                 DO NOT ADD Z ROTATION.
            ========================================== -->

            <a-entity

                id="dragonModel"

                gltf-model="
                    ./models/ember-dragon.glb
                "

                position="
                    0 0 0
                "

                rotation="
                    90 0 0
                "

                scale="
                    1 1 1
                "

            ></a-entity>


            <!-- =========================================
                 FORWARD MARKER

                 LOCAL -X

                 RED = HEAD/FORWARD

                 This marker is ONLY for checking direction.
                 It does NOT rotate the dragon.
            ========================================== -->

            <a-entity

                id="forwardMarker"

                position="
                    -0.55 0 0
                "

            >

                <!-- Marker sphere -->

                <a-sphere

                    radius="0.055"

                    color="#ff2020"

                    material="
                        shader:standard;
                        emissive:#ff0000;
                        emissiveIntensity:3
                    "

                ></a-sphere>


                <!-- Direction line -->

                <a-cylinder

                    position="
                        -0.27 0 0
                    "

                    rotation="
                        0 0 90
                    "

                    radius="
                        0.018
                    "

                    height="
                        0.55
                    "

                    color="#ff2020"

                    material="
                        shader:standard;
                        emissive:#ff0000;
                        emissiveIntensity:2
                    "

                ></a-cylinder>


                <!-- Arrow tip -->

                <a-cone

                    position="
                        -0.57 0 0
                    "

                    rotation="
                        0 0 -90
                    "

                    radius-bottom="
                        0.075
                    "

                    radius-top="
                        0
                    "

                    height="
                        0.18
                    "

                    color="#ff2020"

                    material="
                        shader:standard;
                        emissive:#ff0000;
                        emissiveIntensity:2
                    "

                ></a-cone>

            </a-entity>


        </a-entity>


    </a-entity>


</a-scene>


<script>

/* =====================================================
   CARD BEAST AR
   DR-001 BASELINE
   ROTATION = 90 0 0
===================================================== */

(function(){

    'use strict';


    /* =================================================
       ELEMENTS
    ================================================= */

    const scene =
        document.getElementById(
            'scene'
        );

    const target =
        document.getElementById(
            'target'
        );

    const beast =
        document.getElementById(
            'beast'
        );

    const dragon =
        document.getElementById(
            'dragonModel'
        );

    const forwardMarker =
        document.getElementById(
            'forwardMarker'
        );

    const status =
        document.getElementById(
            'status'
        );

    const info =
        document.getElementById(
            'info'
        );


    /* =================================================
       LOCKED BASELINE
    ================================================= */

    const BASELINE = {

        position:{

            x:0,

            y:-0.25,

            z:0

        },

        parentRotation:{

            x:0,

            y:0,

            z:0

        },

        scale:2.5,

        dragonRotation:{

            x:90,

            y:0,

            z:0

        }

    };


    /* =================================================
       EMERGENCE
    ================================================= */

    const EMERGENCE = {

        startScale:0.35,

        overshootScale:2.72,

        duration:800,

        bounce:220

    };


    let modelLoaded =
        false;

    let emergencePlayed =
        false;

    let growTimer =
        null;

    let bounceTimer =
        null;


    /* =================================================
       STATUS
    ================================================= */

    function setStatus(
        text,
        type=''
    ){

        status.textContent =
            text;

        status.className =
            type;

    }


    /* =================================================
       INFO
    ================================================= */

    function setInfo(
        html
    ){

        info.innerHTML =
            html;

    }


    /* =================================================
       BASELINE POSITION
    ================================================= */

    function applyPosition(){

        beast.object3D.position.set(

            BASELINE.position.x,

            BASELINE.position.y,

            BASELINE.position.z

        );

    }


    /* =================================================
       BASELINE PARENT ROTATION
    ================================================= */

    function applyParentRotation(){

        beast.object3D.rotation.set(

            THREE.MathUtils.degToRad(
                BASELINE.parentRotation.x
            ),

            THREE.MathUtils.degToRad(
                BASELINE.parentRotation.y
            ),

            THREE.MathUtils.degToRad(
                BASELINE.parentRotation.z
            )

        );

    }


    /* =================================================
       DRAGON ROTATION
       
       EXACTLY:

       90 0 0

    ================================================= */

    function applyDragonRotation(){

        dragon.object3D.rotation.set(

            THREE.MathUtils.degToRad(
                BASELINE.dragonRotation.x
            ),

            THREE.MathUtils.degToRad(
                BASELINE.dragonRotation.y
            ),

            THREE.MathUtils.degToRad(
                BASELINE.dragonRotation.z
            )

        );

    }


    /* =================================================
       SCALE
    ================================================= */

    function applyScale(){

        beast.object3D.scale.set(

            BASELINE.scale,

            BASELINE.scale,

            BASELINE.scale

        );

    }


    /* =================================================
       CLEAR ANIMATIONS
    ================================================= */

    function clearAnimations(){

        beast.removeAttribute(
            'animation__emerge'
        );

        beast.removeAttribute(
            'animation__bounce'
        );


        if(
            growTimer !== null
        ){

            clearTimeout(
                growTimer
            );

            growTimer =
                null;

        }


        if(
            bounceTimer !== null
        ){

            clearTimeout(
                bounceTimer
            );

            bounceTimer =
                null;

        }

    }


    /* =================================================
       RESTORE BASELINE
    ================================================= */

    function restoreBaseline(){

        clearAnimations();

        applyPosition();

        applyParentRotation();

        applyDragonRotation();

        applyScale();


        /*
         * IMPORTANT:
         *
         * No Yaw.
         * No extra rotation.
         */

        forwardMarker.object3D.position.set(

            -0.55,

            0,

            0

        );


        beast.object3D.updateMatrixWorld(
            true
        );

    }


    /* =================================================
       EMERGENCE
    ================================================= */

    function playEpicEmergence(){

        if(
            emergencePlayed
        ){

            return;

        }


        emergencePlayed =
            true;


        clearAnimations();


        restoreBaseline();


        /*
         * Start small.
         */

        beast.object3D.scale.set(
            EMERGENCE.startScale,
            EMERGENCE.startScale,
            EMERGENCE.startScale
        );


        /* ---------------------------------------------
           GROW
        --------------------------------------------- */

        beast.setAttribute(

            'animation__emerge',

            {

                property:'scale',

                from:
                    EMERGENCE.startScale +
                    ' ' +
                    EMERGENCE.startScale +
                    ' ' +
                    EMERGENCE.startScale,

                to:
                    EMERGENCE.overshootScale +
                    ' ' +
                    EMERGENCE.overshootScale +
                    ' ' +
                    EMERGENCE.overshootScale,

                dur:
                    EMERGENCE.duration,

                easing:
                    'easeOutCubic'

            }

        );


        setInfo(

            '🔥 <b>EMBER DRAGON EMERGING</b><br>' +

            'DR-001 • BASELINE 90 0 0<br>' +

            '🔴 Marker = local -X'

        );


        /* ---------------------------------------------
           BOUNCE
        --------------------------------------------- */

        growTimer =
            setTimeout(

                function(){

                    beast.setAttribute(

                        'animation__bounce',

                        {

                            property:'scale',

                            from:
                                EMERGENCE.overshootScale +
                                ' ' +
                                EMERGENCE.overshootScale +
                                ' ' +
                                EMERGENCE.overshootScale,

                            to:
                                BASELINE.scale +
                                ' ' +
                                BASELINE.scale +
                                ' ' +
                                BASELINE.scale,

                            dur:
                                EMERGENCE.bounce,

                            easing:
                                'easeOutCubic'

                        }

                    );

                },

                EMERGENCE.duration

            );


        /* ---------------------------------------------
           FINAL LOCK
        --------------------------------------------- */

        bounceTimer =
            setTimeout(

                function(){

                    clearAnimations();

                    restoreBaseline();


                    setInfo(

                        '🔥 <b>EMBER DRAGON ACTIVE</b><br>' +

                        'Position: 0 -0.25 0<br>' +

                        'Rotation: 90 0 0<br>' +

                        'Scale: 2.5<br>' +

                        '🔴 Forward / Head = local -X'

                    );

                },

                EMERGENCE.duration +
                EMERGENCE.bounce +
                100

            );

    }


    /* =================================================
       SCENE READY
    ================================================= */

    scene.addEventListener(

        'loaded',

        function(){

            setStatus(
                'CAMERA / AR INITIALISING…'
            );

        }

    );


    /* =================================================
       AR READY
    ================================================= */

    scene.addEventListener(

        'arReady',

        function(){

            setStatus(

                'CAMERA ACTIVE ✓',

                'ok'

            );


            setInfo(

                'Point camera at ' +

                '<b>DR-001 Ember Dragon</b>.'

            );

        }

    );


    /* =================================================
       MODEL LOADED
    ================================================= */

    dragon.addEventListener(

        'model-loaded',

        function(){

            modelLoaded =
                true;


            restoreBaseline();


            console.log(
                '================================'
            );

            console.log(
                'CARD BEAST AR'
            );

            console.log(
                'DR-001 BASELINE TEST'
            );

            console.log(
                '================================'
            );

            console.log(
                'Position: 0 -0.25 0'
            );

            console.log(
                'Parent Rotation: 0 0 0'
            );

            console.log(
                'Dragon Rotation: 90 0 0'
            );

            console.log(
                'Scale: 2.5'
            );

            console.log(
                'Forward: local -X'
            );

            console.log(
                'Yaw: NONE'
            );

            console.log(
                'Z Rotation: NONE'
            );

            console.log(
                '================================'
            );


            setInfo(

                '🐉 <b>EMBER DRAGON READY</b><br>' +

                'Rotation = 90 0 0<br>' +

                '🔴 Red marker = local -X'

            );

        }

    );


    /* =================================================
       MODEL ERROR
    ================================================= */

    dragon.addEventListener(

        'model-error',

        function(
            event
        ){

            console.error(
                'EMBER DRAGON GLB ERROR:',
                event
            );


            setStatus(

                'MODEL ERROR',

                'error'

            );


            setInfo(

                '❌ Gagal load ' +

                '<b>ember-dragon.glb</b>.'

            );

        }

    );


    /* =================================================
       TARGET FOUND
    ================================================= */

    target.addEventListener(

        'targetFound',

        function(){

            console.log(
                'DR-001 targetFound'
            );


            if(
                !modelLoaded
            ){

                console.warn(
                    'Target found tetapi GLB belum ready.'
                );

                return;

            }


            restoreBaseline();


            beast.setAttribute(
                'visible',
                'true'
            );


            playEpicEmergence();


            setStatus(

                'CARD CONFIRMED • DR-001',

                'ok'

            );

        }

    );


    /* =================================================
       TARGET LOST
    ================================================= */

    target.addEventListener(

        'targetLost',

        function(){

            console.log(
                'DR-001 targetLost'
            );


            clearAnimations();


            beast.setAttribute(
                'visible',
                'false'
            );


            emergencePlayed =
                false;


            restoreBaseline();


            setStatus(

                'CAMERA ACTIVE ✓',

                'ok'

            );


            setInfo(

                'Point camera at ' +

                '<b>DR-001 Ember Dragon</b>.'

            );

        }

    );


    /* =================================================
       AR ERROR
    ================================================= */

    scene.addEventListener(

        'arError',

        function(
            event
        ){

            console.error(
                'MindAR AR error:',
                event
            );


            setStatus(

                'AR ERROR',

                'error'

            );


            setInfo(

                '❌ AR gagal dimulakan.<br>' +

                'Pastikan permission kamera diberikan.'

            );

        }

    );


    /* =================================================
       VIDEO FIX
    ================================================= */

    function fixVideoLayer(){

        document
            .querySelectorAll(
                'video'
            )
            .forEach(

                function(
                    video
                ){

                    video.setAttribute(
                        'playsinline',
                        ''
                    );

                    video.setAttribute(
                        'autoplay',
                        ''
                    );

                    video.muted =
                        true;


                    Object.assign(

                        video.style,

                        {

                            position:'fixed',

                            inset:'0',

                            width:'100%',

                            height:'100%',

                            objectFit:'cover',

                            zIndex:'0',

                            display:'block',

                            background:'#000'

                        }

                    );

                }

            );

    }


    new MutationObserver(

        fixVideoLayer

    ).observe(

        document.documentElement,

        {

            childList:true,

            subtree:true

        }

    );


    fixVideoLayer();


    /* =================================================
       FINAL DEBUG
    ================================================= */

    console.log(
        '--------------------------------'
    );

    console.log(
        'FINAL LOCKED CONFIGURATION'
    );

    console.log(
        'DR-001'
    );

    console.log(
        'Position       = 0 -0.25 0'
    );

    console.log(
        'Parent Rotation = 0 0 0'
    );

    console.log(
        'Dragon Rotation = 90 0 0'
    );

    console.log(
        'Scale           = 2.5'
    );

    console.log(
        'Forward         = local -X'
    );

    console.log(
        'Yaw Pivot       = NONE'
    );

    console.log(
        'Extra Rotation  = NONE'
    );

    console.log(
        'Tracking        = LOCKED'
    );

    console.log(
        'Emergence       = LOCKED'
    );

    console.log(
        '--------------------------------'
    );


})();

</script>

</body>
</html>
