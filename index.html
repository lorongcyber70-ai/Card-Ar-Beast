<script>

/* =========================================================
   CARD BEAST AR v66.5

   ABYSS TIGER FOOT VFX

   CORE AR:
   - 5 TARGETS
   - MAX TRACK 5
   - PRELOAD ONCE
   - MULTI TRACK
   - INDEPENDENT TARGET LOST
   - CAMERA LAYER FIX

   ONLY DR-002 VFX ADDED
========================================================= */


/* =========================================================
   DATA
========================================================= */

const beasts = [

    {
        id:"DR-001",
        name:"Ember Dragon",
        emoji:"🔥",
        target:0,
        model:"dragonModel"
    },

    {
        id:"DR-002",
        name:"Abyss Tiger",
        emoji:"🐯",
        target:1,
        model:"tigerModel"
    },

    {
        id:"DR-003",
        name:"Frost Phoenix",
        emoji:"❄️",
        target:2,
        model:"phoenixModel"
    },

    {
        id:"DR-004",
        name:"Puppet Mantis",
        emoji:"🦗",
        target:3,
        model:"mantisModel"
    },

    {
        id:"DR-005",
        name:"Tidal Leviathan",
        emoji:"🌊",
        target:4,
        model:"leviathanModel"
    }

];


/* =========================================================
   STATE
========================================================= */

const state =
    beasts.map(
        () => ({

            found:false,

            loaded:false,

            loadCount:0

        })
    );


/* =========================================================
   DOM
========================================================= */

const scene =
    document.getElementById(
        "scene"
    );

const mainStatus =
    document.getElementById(
        "mainStatus"
    );

const bottom =
    document.getElementById(
        "bottom"
    );


/* =========================================================
   ABYSS TIGER VFX
========================================================= */

AFRAME.registerComponent(

    "abyss-fire-swirl",

    {

        init:function(){

            this.active =
                false;

            this.time =
                0;

            this.layers =
                [];

            this.sparks =
                [];

            this.build();

        },


        /* =================================================
           BUILD VFX
        ================================================= */

        build:function(){

            /*
             * Central orange glow
             */

            this.core =
                this.createDisc(
                    0.24,
                    "#ff5a00",
                    0.35
                );


            /*
             * White hot center
             */

            this.hotCore =
                this.createDisc(
                    0.12,
                    "#fff3c4",
                    0.75
                );


            /*
             * Main fire layers
             */

            this.createLayer(
                0.65,
                1.0,
                "#ff5a00",
                0.90
            );

            this.createLayer(
                0.78,
                -1.25,
                "#ff9a1f",
                0.75
            );

            this.createLayer(
                0.90,
                0.75,
                "#ffd36a",
                0.48
            );

            this.createLayer(
                1.05,
                -0.48,
                "#ff3d00",
                0.38
            );


            /*
             * Small energy fragments
             */

            for(
                let i=0;
                i<20;
                i++
            ){

                const spark =
                    this.createSpark(
                        i
                    );

                this.sparks.push(
                    spark
                );

            }

        },


        /* =================================================
           DISC
        ================================================= */

        createDisc:function(
            radius,
            color,
            opacity
        ){

            const mesh =
                new THREE.Mesh(

                    new THREE.CircleGeometry(
                        radius,
                        48
                    ),

                    new THREE.MeshBasicMaterial({

                        color:color,

                        transparent:true,

                        opacity:opacity,

                        depthWrite:false,

                        depthTest:false,

                        blending:
                            THREE.AdditiveBlending,

                        side:
                            THREE.DoubleSide

                    })
                );


            /*
             * Horizontal surface.
             *
             * Camera sees it from above.
             */

            mesh.rotation.x =
                -Math.PI/2;


            mesh.position.y =
                0.015;


            mesh.visible =
                false;


            this.el.object3D.add(
                mesh
            );


            return mesh;

        },


        /* =================================================
           FIRE LAYER
        ================================================= */

        createLayer:function(
            size,
            speed,
            color,
            opacity
        ){

            const group =
                new THREE.Group();


            const geometry =
                new THREE.RingGeometry(
                    0.22,
                    0.50,
                    48,
                    2
                );


            const material =
                new THREE.MeshBasicMaterial({

                    color:color,

                    transparent:true,

                    opacity:opacity,

                    depthWrite:false,

                    depthTest:false,

                    blending:
                        THREE.AdditiveBlending,

                    side:
                        THREE.DoubleSide

                });


            const mesh =
                new THREE.Mesh(
                    geometry,
                    material
                );


            mesh.rotation.x =
                -Math.PI/2;


            mesh.scale.set(
                size,
                size,
                size
            );


            mesh.userData.speed =
                speed;


            mesh.userData.baseScale =
                size;


            mesh.userData.phase =
                Math.random()*
                Math.PI*2;


            /*
             * Break the perfect circle
             * by scaling the ring unevenly.
             */

            mesh.scale.x *=
                1.0+
                Math.random()*.18;


            mesh.scale.y *=
                0.85+
                Math.random()*.15;


            mesh.position.y =
                0.02+
                Math.random()*.02;


            mesh.visible =
                false;


            this.el.object3D.add(
                mesh
            );


            this.layers.push(
                mesh
            );

        },


        /* =================================================
           SPARK
        ================================================= */

        createSpark:function(
            index
        ){

            const geometry =
                new THREE.SphereGeometry(
                    0.006+
                    Math.random()*.012,
                    5,
                    5
                );


            const material =
                new THREE.MeshBasicMaterial({

                    color:
                        index%4===0
                        ?0xffffff
                        :0xff7b14,

                    transparent:true,

                    opacity:
                        0.4+
                        Math.random()*.5,

                    depthWrite:false,

                    depthTest:false,

                    blending:
                        THREE.AdditiveBlending

                });


            const spark =
                new THREE.Mesh(
                    geometry,
                    material
                );


            spark.userData.angle =
                Math.random()*
                Math.PI*2;


            spark.userData.radius =
                0.18+
                Math.random()*.52;


            spark.userData.height =
                0.025+
                Math.random()*.13;


            spark.userData.speed =
                0.3+
                Math.random()*1.4;


            spark.userData.phase =
                Math.random()*
                Math.PI*2;


            spark.visible =
                false;


            this.el.object3D.add(
                spark
            );


            return spark;

        },


        /* =================================================
           ACTIVE
        ================================================= */

        setActive:function(
            active
        ){

            this.active =
                active;


            this.el.object3D.visible =
                active;


            this.layers.forEach(
                layer=>{
                    layer.visible =
                        active;
                }
            );


            this.sparks.forEach(
                spark=>{
                    spark.visible =
                        active;
                }
            );


            this.core.visible =
                active;


            this.hotCore.visible =
                active;

        },


        /* =================================================
           ANIMATION
        ================================================= */

        tick:function(
            time,
            delta
        ){

            if(!this.active)
                return;


            this.time +=
                delta*0.001;


            const t =
                this.time;


            /*
             * Fire ring rotation
             */

            this.layers.forEach(
                layer=>{

                    layer.rotation.z +=
                        layer.userData.speed*
                        delta*
                        0.001;


                    const pulse =
                        1+
                        Math.sin(
                            t*3+
                            layer.userData.phase
                        )*
                        0.055;


                    const base =
                        layer.userData.baseScale;


                    layer.scale.x =
                        base*
                        pulse;


                    layer.scale.y =
                        base*
                        pulse;

                }
            );


            /*
             * Core pulse
             */

            const corePulse =
                1+
                Math.sin(
                    t*5
                )*.12;


            this.core.scale.set(
                corePulse,
                corePulse,
                corePulse
            );


            const hotPulse =
                1+
                Math.sin(
                    t*7
                )*.16;


            this.hotCore.scale.set(
                hotPulse,
                hotPulse,
                hotPulse
            );


            /*
             * Sparks orbit around feet
             */

            this.sparks.forEach(
                spark=>{

                    const d =
                        spark.userData;


                    const angle =
                        d.angle+
                        t*d.speed;


                    const radius =
                        d.radius+
                        Math.sin(
                            t*2+
                            d.phase
                        )*.025;


                    spark.position.x =
                        Math.cos(angle)*
                        radius;


                    spark.position.z =
                        Math.sin(angle)*
                        radius;


                    /*
                     * Rising from card
                     */

                    spark.position.y =
                        d.height+
                        (
                            Math.sin(
                                t*2.5+
                                d.phase
                            )+1
                        )*.08;


                    const scale =
                        0.7+
                        (
                            Math.sin(
                                t*6+
                                d.phase
                            )+1
                        )*.3;


                    spark.scale.set(
                        scale,
                        scale,
                        scale
                    );

                }
            );

        }

    }

);


/* =========================================================
   CAMERA LAYER
========================================================= */

function forceCameraLayer(){

    const videos =
        document.querySelectorAll(
            "video"
        );


    videos.forEach(
        video=>{

            video.classList.add(
                "mindar-video"
            );


            video.style.setProperty(
                "position",
                "fixed",
                "important"
            );


            video.style.setProperty(
                "top",
                "0",
                "important"
            );


            video.style.setProperty(
                "left",
                "0",
                "important"
            );


            video.style.setProperty(
                "width",
                "100vw",
                "important"
            );


            video.style.setProperty(
                "height",
                "100vh",
                "important"
            );


            video.style.setProperty(
                "min-width",
                "100vw",
                "important"
            );


            video.style.setProperty(
                "min-height",
                "100vh",
                "important"
            );


            video.style.setProperty(
                "object-fit",
                "cover",
                "important"
            );


            video.style.setProperty(
                "display",
                "block",
                "important"
            );


            video.style.setProperty(
                "visibility",
                "visible",
                "important"
            );


            video.style.setProperty(
                "opacity",
                "1",
                "important"
            );


            video.style.setProperty(
                "z-index",
                "0",
                "important"
            );


            video.style.setProperty(
                "pointer-events",
                "none",
                "important"
            );


            if(
                video.paused &&
                video.srcObject
            ){

                video.play()
                .catch(
                    ()=>{}
                );

            }

        }
    );


    const canvas =
        document.querySelector(
            "a-scene canvas"
        );


    if(canvas){

        canvas.style.setProperty(
            "position",
            "fixed",
            "important"
        );


        canvas.style.setProperty(
            "top",
            "0",
            "important"
        );


        canvas.style.setProperty(
            "left",
            "0",
            "important"
        );


        canvas.style.setProperty(
            "width",
            "100vw",
            "important"
        );


        canvas.style.setProperty(
            "height",
            "100vh",
            "important"
        );


        canvas.style.setProperty(
            "background",
            "transparent",
            "important"
        );


        canvas.style.setProperty(
            "background-color",
            "transparent",
            "important"
        );


        canvas.style.setProperty(
            "z-index",
            "1",
            "important"
        );

    }


    try{

        if(
            scene &&
            scene.renderer
        ){

            scene.renderer.setClearColor(
                0x000000,
                0
            );


            if(
                scene.renderer.setClearAlpha
            ){

                scene.renderer.setClearAlpha(
                    0
                );

            }

        }

    }
    catch(error){

        console.warn(
            "Camera layer:",
            error
        );

    }

}


/* =========================================================
   VIDEO OBSERVER
========================================================= */

const videoObserver =
    new MutationObserver(
        ()=>{
            forceCameraLayer();
        }
    );


videoObserver.observe(

    document.body,

    {
        childList:true,
        subtree:true
    }

);


/* =========================================================
   BADGE
========================================================= */

function setBadge(
    index,
    text,
    className
){

    const element =
        document.getElementById(
            "target"+index
        );


    if(!element)
        return;


    element.textContent =
        text;


    element.className =
        className;

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    const active =
        beasts.filter(
            (beast,index)=>
                state[index].found
        );


    if(
        active.length===0
    ){

        mainStatus.textContent =
            "CAMERA READY • SEARCHING";


        bottom.textContent =
            "📷 Point camera at any Card Beast target.";


        return;

    }


    if(
        active.length===1
    ){

        const beast =
            active[0];


        mainStatus.textContent =
            `${beast.id} FOUND • ${beast.name.toUpperCase()}`;


        bottom.innerHTML =
            `${beast.emoji} <b>${beast.name.toUpperCase()} ACTIVE</b> • ${beast.id}`;


        return;

    }


    mainStatus.textContent =
        `${active.length} CARDS ACTIVE • `+
        `${active.map(
            beast=>beast.id
        ).join(" + ")}`;


    bottom.innerHTML =
        `${active.map(
            beast=>
                beast.emoji+
                " "+
                beast.id
        ).join(" + ")} ACTIVE`;

}


/* =========================================================
   PRELOAD ONCE
========================================================= */

function setupPreload(){

    beasts.forEach(
        (beast,index)=>{

            const model =
                document.getElementById(
                    beast.model
                );


            if(!model){

                console.error(
                    beast.id+
                    " model element missing"
                );

                return;

            }


            model.addEventListener(

                "model-loaded",

                ()=>{

                    if(
                        state[index].loaded
                    ){

                        return;

                    }


                    state[index].loaded =
                        true;


                    state[index].loadCount++;


                    console.log(
                        beast.id+
                        " GLB PRELOADED ONCE"
                    );

                },

                {
                    once:true
                }

            );


            model.addEventListener(

                "model-error",

                event=>{

                    console.error(
                        beast.id+
                        " GLB LOAD ERROR",
                        event
                    );


                    setBadge(
                        index,
                        "GLB ERROR",
                        "err"
                    );

                }

            );

        }
    );

}


/* =========================================================
   TARGET SETUP
========================================================= */

function setupTarget(
    index
){

    const beast =
        beasts[index];


    const target =
        document.getElementById(
            "beast"+index
        );


    if(!target){

        console.error(
            beast.id+
            " target entity missing"
        );

        return;

    }


    /* =====================================================
       TARGET FOUND
    ===================================================== */

    target.addEventListener(

        "targetFound",

        ()=>{

            state[index].found =
                true;


            target.setAttribute(
                "visible",
                "true"
            );


            /*
             * ABYSS TIGER ONLY
             */

            if(
                index===1
            ){

                const vfx =
                    document.getElementById(
                        "abyssVFX"
                    );


                if(
                    vfx &&
                    vfx.components &&
                    vfx.components[
                        "abyss-fire-swirl"
                    ]
                ){

                    vfx.components[
                        "abyss-fire-swirl"
                    ].setActive(
                        true
                    );

                }

            }


            setBadge(
                index,
                "FOUND",
                "on"
            );


            updateUI();


            console.log(
                beast.id+
                " targetFound"
            );

        }

    );


    /* =====================================================
       TARGET LOST
    ===================================================== */

    target.addEventListener(

        "targetLost",

        ()=>{

            state[index].found =
                false;


            target.setAttribute(
                "visible",
                "false"
            );


            /*
             * ABYSS TIGER ONLY
             */

            if(
                index===1
            ){

                const vfx =
                    document.getElementById(
                        "abyssVFX"
                    );


                if(
                    vfx &&
                    vfx.components &&
                    vfx.components[
                        "abyss-fire-swirl"
                    ]
                ){

                    vfx.components[
                        "abyss-fire-swirl"
                    ].setActive(
                        false
                    );

                }

            }


            setBadge(
                index,
                "LOST",
                "wait"
            );


            updateUI();


            console.log(
                beast.id+
                " targetLost"
            );

        }

    );

}


/* =========================================================
   SCENE LOADED
========================================================= */

scene.addEventListener(

    "loaded",

    ()=>{

        console.log(
            "CARD BEAST AR v66.5 SCENE LOADED"
        );


        beasts.forEach(
            (_,index)=>{

                setupTarget(
                    index
                );

            }
        );


        setupPreload();


        forceCameraLayer();

    }

);


/* =========================================================
   AR READY
========================================================= */

scene.addEventListener(

    "arReady",

    ()=>{

        console.log(
            "MINDAR CAMERA READY"
        );


        const cameraState =
            document.getElementById(
                "cameraState"
            );


        if(cameraState){

            cameraState.textContent =
                "READY";


            cameraState.className =
                "on";

        }


        mainStatus.textContent =
            "CAMERA READY • SEARCHING";


        bottom.textContent =
            "📷 Point camera at any Card Beast target.";


        forceCameraLayer();


        setTimeout(
            forceCameraLayer,
            100
        );


        setTimeout(
            forceCameraLayer,
            300
        );


        setTimeout(
            forceCameraLayer,
            700
        );


        setTimeout(
            forceCameraLayer,
            1200
        );


        setTimeout(
            forceCameraLayer,
            2000
        );

    }

);


/* =========================================================
   AR ERROR
========================================================= */

scene.addEventListener(

    "arError",

    event=>{

        console.error(
            "MINDAR AR ERROR",
            event
        );


        const cameraState =
            document.getElementById(
                "cameraState"
            );


        if(cameraState){

            cameraState.textContent =
                "ERROR";


            cameraState.className =
                "err";

        }


        mainStatus.textContent =
            "CAMERA ERROR";


        bottom.textContent =
            "Camera could not start.";

    }

);


/* =========================================================
   WINDOW LOAD
========================================================= */

window.addEventListener(

    "load",

    ()=>{

        forceCameraLayer();


        setTimeout(
            forceCameraLayer,
            300
        );


        setTimeout(
            forceCameraLayer,
            800
        );


        setTimeout(
            forceCameraLayer,
            1500
        );

    }

);


/* =========================================================
   CONTINUOUS CAMERA PROTECTION
========================================================= */

setInterval(

    ()=>{

        forceCameraLayer();

    },

    1000

);


/* =========================================================
   INITIAL TARGET UI
========================================================= */

beasts.forEach(

    (_,index)=>{

        setBadge(
            index,
            "WAIT",
            "wait"
        );

    }

);

</script>
