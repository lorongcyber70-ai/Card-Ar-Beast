<!doctype html>
<html lang="ms">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Card Beast AR — DR-001 v55</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* =========================================
   CAMERA
========================================= */

video{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;
  display:block!important;

  background:#000!important;
}

/* =========================================
   A-FRAME
========================================= */

a-scene{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;
}

.a-canvas,
canvas{
  background:transparent!important;
}

/* =========================================
   TOP UI
========================================= */

#ui{
  position:fixed;
  z-index:20;

  top:18px;
  left:0;

  width:100%;

  text-align:center;
  pointer-events:none;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:#fff;

  text-shadow:
    0 2px 8px #000,
    0 0 10px rgba(0,0,0,.8);
}

.logo span{
  color:#b75cff;
}

#status{
  display:inline-block;

  margin-top:12px;
  padding:10px 20px;

  border:1px solid #b75cff;
  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.78);

  font-weight:800;

  box-shadow:
    0 0 12px rgba(183,92,255,.25);
}

/* =========================================
   INFO
========================================= */

#info{
  position:fixed;
  z-index:20;

  left:5%;
  right:5%;
  bottom:20px;

  padding:15px 18px;

  border:1px solid #7d35b8;
  border-radius:24px;

  background:rgba(5,0,12,.88);

  color:#fff;

  text-align:center;

  font-size:17px;
  line-height:1.45;

  pointer-events:none;

  box-shadow:
    0 0 18px rgba(125,53,184,.2);
}

.ok{
  color:#68ff9b;
}

.err{
  color:#ff6b6b;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

  .logo{
    font-size:27px;
  }

  #status{
    font-size:15px;
    padding:10px 18px;
  }

  #info{
    font-size:16px;
    bottom:18px;
  }

}

</style>

</head>

<body>


<!-- =========================================
     TOP UI
========================================= -->

<div id="ui">

  <div class="logo">
    CARD <span>BEAST</span> AR
  </div>

  <div id="status">
    INITIALISING CAMERA…
  </div>

</div>


<!-- =========================================
     INFO
========================================= -->

<div id="info">
  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.
</div>


<!-- =========================================
     A-FRAME + MINDAR
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind?v55;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="enabled:false"
>


  <!-- =======================================
       CAMERA
  ======================================== -->

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>


  <!-- =======================================
       DR-001 TARGET
  ======================================== -->

  <a-entity
    id="target"
    mindar-image-target="targetIndex:0"
  >


    <!-- =====================================
         BEAST

         LOCKED BASELINE

         X = 0
         Y = -0.25
         Z = 0

         Parent Rotation = 0 0 0

         Scale = 2.5
    ====================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 -0.25 0"

      rotation="0 0 0"

      scale="2.5 2.5 2.5"

    >


      <!-- ===================================
           EMBER DRAGON

           v55 TEST ONLY

           Rotation = 90 180 0

           Position = 0 0 0
           Scale = 1 1 1
      ==================================== -->

      <a-entity

        id="dragonModel"

        gltf-model="./models/ember-dragon.glb?v55"

        position="0 0 0"

        rotation="90 180 0"

        scale="1 1 1"

      >
      </a-entity>


    </a-entity>


  </a-entity>


</a-scene>


<script>

(function(){


  /* =========================================
     ELEMENTS
  ========================================= */

  const scene =
    document.getElementById('scene');

  const target =
    document.getElementById('target');

  const beast =
    document.getElementById('beast');

  const dragonModel =
    document.getElementById('dragonModel');

  const status =
    document.getElementById('status');

  const info =
    document.getElementById('info');


  /* =========================================
     LOCKED POSITION
  ========================================= */

  const BASE_X = 0;
  const BASE_Y = -0.25;
  const BASE_Z = 0;


  /* =========================================
     v55 ROTATION TEST

     ONLY THIS IS CHANGED

     Previous:
     90 0 0
     90 0 180
     90 0 90
     90 0 135

     Current:
     90 180 0
  ========================================= */

  const DRAGON_ROTATION = {
    x:90,
    y:180,
    z:0
  };


  /* =========================================
     SCALE
  ========================================= */

  const FINAL_SCALE = 2.5;


  /* =========================================
     EPIC EMERGENCE

     UNCHANGED
  ========================================= */

  const START_SCALE = 0.35;

  const OVERSHOOT_SCALE = 2.72;

  const GROW_DURATION = 800;

  const BOUNCE_DURATION = 220;


  /* =========================================
     STATE
  ========================================= */

  let modelLoaded = false;

  let emergencePlayed = false;

  let emergenceTimer1 = null;

  let emergenceTimer2 = null;


  /* =========================================
     STATUS
  ========================================= */

  function setStatus(text, cls){

    status.textContent = text;

    status.className = cls || '';

  }


  /* =========================================
     INFO
  ========================================= */

  function setInfo(html){

    info.innerHTML = html;

  }


  /* =========================================
     POSITION
  ========================================= */

  function applyBasePosition(){

    beast.object3D.position.set(

      BASE_X,
      BASE_Y,
      BASE_Z

    );

  }


  /* =========================================
     PARENT ROTATION

     LOCKED TO ZERO
  ========================================= */

  function applyParentRotation(){

    beast.object3D.rotation.set(
      0,
      0,
      0
    );

  }


  /* =========================================
     DRAGON ROTATION

     v55 ONLY
  ========================================= */

  function applyDragonRotation(){

    dragonModel.object3D.rotation.set(

      THREE.MathUtils.degToRad(
        DRAGON_ROTATION.x
      ),

      THREE.MathUtils.degToRad(
        DRAGON_ROTATION.y
      ),

      THREE.MathUtils.degToRad(
        DRAGON_ROTATION.z
      )

    );

  }


  /* =========================================
     SCALE
  ========================================= */

  function applyFinalScale(){

    beast.object3D.scale.set(

      FINAL_SCALE,
      FINAL_SCALE,
      FINAL_SCALE

    );

  }


  /* =========================================
     CLEAR ANIMATIONS
  ========================================= */

  function clearAnimations(){

    beast.removeAttribute(
      'animation__emerge'
    );

    beast.removeAttribute(
      'animation__bounce'
    );


    if(emergenceTimer1){

      clearTimeout(
        emergenceTimer1
      );

      emergenceTimer1 = null;

    }


    if(emergenceTimer2){

      clearTimeout(
        emergenceTimer2
      );

      emergenceTimer2 = null;

    }

  }


  /* =========================================
     BASELINE RESET

     NO ROTATION ANIMATION
  ========================================= */

  function restoreBaseline(){

    clearAnimations();

    applyBasePosition();

    applyParentRotation();

    applyDragonRotation();

    applyFinalScale();

    beast.object3D.updateMatrixWorld(
      true
    );

  }


  /* =========================================
     SET SCALE
  ========================================= */

  function setScale(value){

    beast.object3D.scale.set(

      value,
      value,
      value

    );

  }


  /* =========================================
     EPIC EMERGENCE

     ONLY SCALE CHANGES
  ========================================= */

  function playEpicEmergence(){

    if(emergencePlayed){

      return;

    }


    emergencePlayed = true;


    clearAnimations();


    /*
      LOCK POSITION + ROTATION
    */

    applyBasePosition();

    applyParentRotation();

    applyDragonRotation();


    /*
      START SMALL
    */

    setScale(
      START_SCALE
    );


    /* =====================================
       GROW
    ===================================== */

    beast.setAttribute(

      'animation__emerge',

      {

        property:'scale',

        from:
          START_SCALE + ' ' +
          START_SCALE + ' ' +
          START_SCALE,

        to:
          OVERSHOOT_SCALE + ' ' +
          OVERSHOOT_SCALE + ' ' +
          OVERSHOOT_SCALE,

        dur:GROW_DURATION,

        easing:'easeOutCubic'

      }

    );


    setInfo(

      '🔥 <b>EMBER DRAGON EMERGING</b><br>' +

      '🟣 Epic Emergence active.<br>' +

      'Position: Center of card<br>' +

      'Rotation test: 90 180 0'

    );


    /* =====================================
       BOUNCE
    ===================================== */

    emergenceTimer1 = setTimeout(

      function(){

        beast.setAttribute(

          'animation__bounce',

          {

            property:'scale',

            from:
              OVERSHOOT_SCALE + ' ' +
              OVERSHOOT_SCALE + ' ' +
              OVERSHOOT_SCALE,

            to:
              FINAL_SCALE + ' ' +
              FINAL_SCALE + ' ' +
              FINAL_SCALE,

            dur:BOUNCE_DURATION,

            easing:'easeOutCubic'

          }

        );

      },

      GROW_DURATION

    );


    /* =====================================
       FINAL LOCK
    ===================================== */

    emergenceTimer2 = setTimeout(

      function(){

        clearAnimations();


        applyBasePosition();

        applyParentRotation();

        applyDragonRotation();

        applyFinalScale();


        setInfo(

          '🔥 <b>EMBER DRAGON ACTIVE</b><br>' +

          'Epic Emergence complete.<br>' +

          'Position: 0 -0.25 0<br>' +

          'Rotation: 90 180 0<br>' +

          'Scale: 2.5'

        );


        console.log(
          '========================================'
        );

        console.log(
          'CARD BEAST AR — DR-001 v55'
        );

        console.log(
          'ROTATION TEST = 90 180 0'
        );

        console.log(
          'Position = 0 -0.25 0'
        );

        console.log(
          'Parent Rotation = 0 0 0'
        );

        console.log(
          'Scale = 2.5'
        );

        console.log(
          '========================================'
        );


      },

      GROW_DURATION +
      BOUNCE_DURATION +
      100

    );

  }


  /* =========================================
     A-FRAME LOADED
  ========================================= */

  scene.addEventListener(

    'loaded',

    function(){

      setStatus(
        'CAMERA / AR INITIALISING…'
      );


      setInfo(
        'Loading MindAR target <b>DR-001</b>…'
      );

    }

  );


  /* =========================================
     AR READY
  ========================================= */

  scene.addEventListener(

    'arReady',

    function(){

      setStatus(
        'CAMERA ACTIVE ✓',
        'ok'
      );


      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );

    }

  );


  /* =========================================
     MODEL LOADED
  ========================================= */

  dragonModel.addEventListener(

    'model-loaded',

    function(){

      modelLoaded = true;


      restoreBaseline();


      console.log(
        '========================================'
      );

      console.log(
        'DR-001 v55 MODEL READY'
      );

      console.log(
        'Position = 0 -0.25 0'
      );

      console.log(
        'Parent Rotation = 0 0 0'
      );

      console.log(
        'Dragon Rotation = 90 180 0'
      );

      console.log(
        'Scale = 2.5'
      );

      console.log(
        '========================================'
      );


      setInfo(

        '🟣 <b>DRAGON READY</b><br>' +

        'Waiting for DR-001 card…'

      );

    }

  );


  /* =========================================
     MODEL ERROR
  ========================================= */

  dragonModel.addEventListener(

    'model-error',

    function(event){

      modelLoaded = false;


      console.error(
        'GLB model error:',
        event
      );


      setStatus(
        'MODEL ERROR',
        'err'
      );


      setInfo(

        '❌ Failed to load ' +

        '<b>ember-dragon.glb</b>.<br>' +

        'Check the models folder and filename.'

      );

    }

  );


  /* =========================================
     TARGET FOUND
  ========================================= */

  target.addEventListener(

    'targetFound',

    function(){

      console.log(
        'DR-001 targetFound'
      );


      if(!modelLoaded){

        console.warn(
          'Target found but model is not ready.'
        );

        return;

      }


      /*
        Restore exact v55 state.
      */

      restoreBaseline();


      /*
        Show model only after target found.
      */

      beast.setAttribute(
        'visible',
        'true'
      );


      /*
        Epic Emergence plays once.
      */

      playEpicEmergence();


      setStatus(

        'CARD CONFIRMED • DR-001',

        'ok'

      );

    }

  );


  /* =========================================
     TARGET LOST
  ========================================= */

  target.addEventListener(

    'targetLost',

    function(){

      console.log(
        'DR-001 targetLost'
      );


      clearAnimations();


      /*
        Hide model immediately.
      */

      beast.setAttribute(
        'visible',
        'false'
      );


      /*
        Allow emergence again
        on next targetFound.
      */

      emergencePlayed = false;


      /*
        Restore exact baseline.
      */

      restoreBaseline();


      setStatus(

        'CAMERA ACTIVE ✓',

        'ok'

      );


      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );

    }

  );


  /* =========================================
     AR ERROR
  ========================================= */

  scene.addEventListener(

    'arError',

    function(event){

      console.error(
        'MindAR error:',
        event
      );


      setStatus(
        'AR ERROR',
        'err'
      );


      setInfo(

        'MindAR gagal dimulakan.<br>' +

        'Pastikan kamera dibenarkan.'

      );

    }

  );


  /* =========================================
     CAMERA VIDEO FIX
  ========================================= */

  function fixVideoLayer(){

    document
      .querySelectorAll('video')
      .forEach(

        function(video){

          video.setAttribute(
            'playsinline',
            ''
          );

          video.setAttribute(
            'autoplay',
            ''
          );

          video.muted = true;


          Object.assign(

            video.style,

            {

              position:'fixed',

              inset:'0',

              width:'100%',

              height:'100%',

              objectFit:'cover',

              zIndex:'0',

              display:'block',

              background:'#000'

            }

          );

        }

      );

  }


  /* =========================================
     CAMERA WATCHER
  ========================================= */

  new MutationObserver(

    fixVideoLayer

  ).observe(

    document.documentElement,

    {
      childList:true,
      subtree:true
    }

  );


  fixVideoLayer();


  /* =========================================
     ROTATION TEST LOG
  ========================================= */

  console.log(
    '========================================'
  );

  console.log(
    'DR-001 ROTATION TEST LOG'
  );

  console.log(
    '1. 90 0 0 = BASELINE / MELINTANG'
  );

  console.log(
    '2. Parent Y 90 = SALAH / MENEGAK'
  );

  console.log(
    '3. Parent Y 180 = SALAH / TERBONGKANG'
  );

  console.log(
    '4. 90 0 180 = MELINTANG / ARAH TERBALIK'
  );

  console.log(
    '5. 90 0 90 = SALAH'
  );

  console.log(
    '6. 90 0 135 = SALAH / TERLALU TEGAK'
  );

  console.log(
    '7. 90 180 0 = CURRENT TEST'
  );

  console.log(
    '========================================'
  );


})();

</script>

</body>
</html>
