<!doctype html>
<html lang="ms">

<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Card Beast AR — DR-001 v47</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* =========================================
   CAMERA
========================================= */

video{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;
}

/* =========================================
   A-FRAME
========================================= */

a-scene{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;
}

.a-canvas,
canvas{
  background:transparent!important;
}

/* =========================================
   TOP UI
========================================= */

#ui{
  position:fixed;
  z-index:20;

  top:18px;
  left:0;

  width:100%;

  text-align:center;

  pointer-events:none;
}

.logo{
  font-size:28px;
  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px #000;
}

.logo span{
  color:#b75cff;
}

#status{
  display:inline-block;

  margin-top:12px;

  padding:10px 20px;

  border:1px solid #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.78);

  font-weight:800;

  box-shadow:
    0 0 12px rgba(183,92,255,.25);
}

/* =========================================
   INFO
========================================= */

#info{
  position:fixed;

  z-index:20;

  left:5%;
  right:5%;

  bottom:20px;

  padding:14px 18px;

  border:1px solid #7d35b8;

  border-radius:24px;

  background:rgba(5,0,12,.86);

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;

  box-shadow:
    0 0 18px rgba(125,53,184,.2);
}

.ok{
  color:#68ff9b;
}

.err{
  color:#ff6b6b;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

  .logo{
    font-size:27px;
  }

  #status{
    font-size:15px;
    padding:10px 18px;
  }

  #info{
    font-size:16px;
    bottom:18px;
  }

}

</style>
</head>


<body>


<!-- =========================================
     TOP UI
========================================= -->

<div id="ui">

  <div class="logo">
    CARD <span>BEAST</span> AR
  </div>

  <div id="status">
    INITIALISING CAMERA…
  </div>

</div>


<!-- =========================================
     INFO
========================================= -->

<div id="info">
  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.
</div>


<!-- =========================================
     A-FRAME + MINDAR
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind?v47;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="
    enabled:false
  "

>


  <!-- =======================================
       CAMERA
  ======================================== -->

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>


  <!-- =======================================
       DR-001
  ======================================== -->

  <a-entity
    id="target"
    mindar-image-target="targetIndex:0"
  >


    <!-- =====================================
         BEAST

         POSITION LOCKED:
         X = 0
         Y = -0.25
         Z = 0

         ROTATION = 0 0 0

         FINAL SCALE = 2.5
    ====================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 -0.25 0"

      rotation="0 0 0"

      scale="2.5 2.5 2.5"

    >


      <!-- ===================================
           DRAGON MODEL

           ROTATION LOCKED:
           90 0 0

           POSITION:
           0 0 0

           SCALE:
           1 1 1
      ==================================== -->

      <a-entity

        id="dragonModel"

        gltf-model="./models/ember-dragon.glb?v47"

        position="0 0 0"

        rotation="90 0 0"

        scale="1 1 1"

      >
      </a-entity>


    </a-entity>


  </a-entity>


</a-scene>


<script>

(function(){

  /* =========================================
     ELEMENTS
  ========================================= */

  const scene =
    document.getElementById('scene');

  const target =
    document.getElementById('target');

  const beast =
    document.getElementById('beast');

  const dragonModel =
    document.getElementById('dragonModel');

  const status =
    document.getElementById('status');

  const info =
    document.getElementById('info');


  /* =========================================
     LOCKED BASELINE
  ========================================= */

  const BASE_X = 0;

  const BASE_Y = -0.25;

  const BASE_Z = 0;

  const FINAL_SCALE = 2.5;

  const DRAGON_ROTATION = "90 0 0";


  /* =========================================
     EPIC EMERGENCE
  ========================================= */

  const START_SCALE = 0.35;

  const OVERSHOOT_SCALE = 2.72;

  const GROW_DURATION = 800;

  const BOUNCE_DURATION = 220;


  let modelLoaded = false;

  let emergencePlayed = false;


  /* =========================================
     STATUS
  ========================================= */

  function setStatus(text, cls){

    status.textContent = text;

    status.className = cls || '';

  }


  /* =========================================
     INFO
  ========================================= */

  function setInfo(html){

    info.innerHTML = html;

  }


  /* =========================================
     HARD RESET POSITION
     
     X/Z TIDAK BERUBAH
  ========================================= */

  function resetPosition(){

    beast.object3D.position.set(

      BASE_X,
      BASE_Y,
      BASE_Z

    );

  }


  /* =========================================
     HARD RESET ROTATION
     
     DRAGON:
     90 0 0
  ========================================= */

  function resetRotation(){

    dragonModel.setAttribute(

      'rotation',

      DRAGON_ROTATION

    );

  }


  /* =========================================
     HARD SET SCALE
  ========================================= */

  function setScale(value){

    beast.object3D.scale.set(

      value,
      value,
      value

    );

  }


  /* =========================================
     REMOVE OLD ANIMATIONS
  ========================================= */

  function clearAnimations(){

    beast.removeAttribute(
      'animation__emerge'
    );

    beast.removeAttribute(
      'animation__bounce'
    );

  }


  /* =========================================
     EPIC EMERGENCE
     
     SMALL
       ↓
     GROW
       ↓
     OVERSHOOT
       ↓
     2.5 LOCK
  ========================================= */

  function playEpicEmergence(){

    if(emergencePlayed){

      return;

    }

    emergencePlayed = true;


    clearAnimations();


    /*
      IMPORTANT:
      Position dikunci dahulu.
    */

    resetPosition();

    resetRotation();


    /*
      Mula kecil.
    */

    setScale(
      START_SCALE
    );


    beast.setAttribute(

      'animation__emerge',

      {

        property:'scale',

        from:
          START_SCALE +
          ' ' +
          START_SCALE +
          ' ' +
          START_SCALE,

        to:
          OVERSHOOT_SCALE +
          ' ' +
          OVERSHOOT_SCALE +
          ' ' +
          OVERSHOOT_SCALE,

        dur:GROW_DURATION,

        easing:'easeOutCubic'

      }

    );


    setInfo(

      '🔥 <b>EMBER DRAGON EMERGING</b><br>' +

      '🟣 Epic Emergence active.<br>' +

      'Position: Center of card<br>' +

      'Y: -0.25'

    );


    /*
      Selepas grow,
      buat bounce kecil.
    */

    setTimeout(function(){

      if(!emergencePlayed){
        return;
      }

      beast.setAttribute(

        'animation__bounce',

        {

          property:'scale',

          from:
            OVERSHOOT_SCALE +
            ' ' +
            OVERSHOOT_SCALE +
            ' ' +
            OVERSHOOT_SCALE,

          to:
            FINAL_SCALE +
            ' ' +
            FINAL_SCALE +
            ' ' +
            FINAL_SCALE,

          dur:BOUNCE_DURATION,

          easing:'easeOutCubic'

        }

      );


    },GROW_DURATION);


    /*
      HARD LOCK FINAL SCALE
      selepas semua animation selesai.
    */

    setTimeout(function(){

      setScale(
        FINAL_SCALE
      );

      resetPosition();

      resetRotation();


      setInfo(

        '🔥 <b>EMBER DRAGON ACTIVE</b><br>' +

        'Epic Emergence complete.<br>' +

        'Position: Center of card<br>' +

        'Y: -0.25<br>' +

        'Scale: 2.5'

      );


      console.log(
        'Epic Emergence COMPLETE.'
      );


    },GROW_DURATION + BOUNCE_DURATION + 50);

  }


  /* =========================================
     A-FRAME LOADED
  ========================================= */

  scene.addEventListener(

    'loaded',

    function(){

      setStatus(
        'CAMERA / AR INITIALISING…'
      );

      setInfo(
        'Loading MindAR target <b>DR-001</b>…'
      );

    }

  );


  /* =========================================
     AR READY
  ========================================= */

  scene.addEventListener(

    'arReady',

    function(){

      setStatus(
        'CAMERA ACTIVE ✓',
        'ok'
      );

      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );

    }

  );


  /* =========================================
     MODEL LOADED
  ========================================= */

  dragonModel.addEventListener(

    'model-loaded',

    function(){

      modelLoaded = true;


      resetPosition();

      resetRotation();

      setScale(
        FINAL_SCALE
      );


      console.log(
        'DR-001 GLB loaded.'
      );

      console.log(
        'Position:',
        BASE_X,
        BASE_Y,
        BASE_Z
      );

      console.log(
        'Rotation:',
        DRAGON_ROTATION
      );

      console.log(
        'Final scale:',
        FINAL_SCALE
      );


      setInfo(

        '🟣 <b>DRAGON READY</b><br>' +

        'Waiting for DR-001 card…'

      );

    }

  );


  /* =========================================
     MODEL ERROR
  ========================================= */

  dragonModel.addEventListener(

    'model-error',

    function(event){

      modelLoaded = false;

      console.error(
        'GLB model error:',
        event
      );

      setStatus(
        'MODEL ERROR',
        'err'
      );

      setInfo(

        '❌ Failed to load ' +

        '<b>ember-dragon.glb</b>.'

      );

    }

  );


  /* =========================================
     TARGET FOUND
  ========================================= */

  target.addEventListener(

    'targetFound',

    function(){

      if(!modelLoaded){

        console.warn(
          'Target found but GLB not ready.'
        );

        return;

      }


      /*
        Reset baseline.
      */

      resetPosition();

      resetRotation();


      /*
        Show model.
      */

      beast.setAttribute(
        'visible',
        'true'
      );


      /*
        Play only once.
      */

      playEpicEmergence();


      setStatus(

        'CARD CONFIRMED • DR-001',

        'ok'

      );


      console.log(
        'DR-001 targetFound.'
      );

    }

  );


  /* =========================================
     TARGET LOST
  ========================================= */

  target.addEventListener(

    'targetLost',

    function(){

      beast.setAttribute(
        'visible',
        'false'
      );


      /*
        Reset animation.
      */

      clearAnimations();


      /*
        Reset state.
      */

      emergencePlayed = false;


      /*
        Restore baseline.
      */

      resetPosition();

      resetRotation();

      setScale(
        FINAL_SCALE
      );


      setStatus(
        'CAMERA ACTIVE ✓',
        'ok'
      );


      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );


      console.log(
        'DR-001 targetLost.'
      );

    }

  );


  /* =========================================
     AR ERROR
  ========================================= */

  scene.addEventListener(

    'arError',

    function(event){

      console.error(
        'MindAR error:',
        event
      );

      setStatus(
        'AR ERROR',
        'err'
      );

      setInfo(

        'MindAR gagal dimulakan. ' +

        'Sila pastikan kamera dibenarkan.'

      );

    }

  );


  /* =========================================
     CAMERA VIDEO FIX
  ========================================= */

  function fixVideoLayer(){

    document
      .querySelectorAll('video')
      .forEach(

        function(video){

          video.setAttribute(
            'playsinline',
            ''
          );

          video.setAttribute(
            'autoplay',
            ''
          );

          video.muted = true;

          Object.assign(

            video.style,

            {

              position:'fixed',

              inset:'0',

              width:'100%',

              height:'100%',

              objectFit:'cover',

              zIndex:'0',

              display:'block',

              background:'#000'

            }

          );

        }

      );

  }


  /* =========================================
     WATCH FOR CAMERA VIDEO
  ========================================= */

  new MutationObserver(

    fixVideoLayer

  ).observe(

    document.documentElement,

    {

      childList:true,

      subtree:true

    }

  );


  fixVideoLayer();


  /* =========================================
     DEBUG
  ========================================= */

  console.log(
    '========================================'
  );

  console.log(
    'CARD BEAST AR — DR-001 v47'
  );

  console.log(
    '========================================'
  );

  console.log(
    'Position X = 0'
  );

  console.log(
    'Position Y = -0.25'
  );

  console.log(
    'Position Z = 0'
  );

  console.log(
    'Dragon rotation = 90 0 0'
  );

  console.log(
    'Final scale = 2.5'
  );

  console.log(
    'Emergence = SCALE ONLY'
  );

  console.log(
    '========================================'
  );


})();

</script>

</body>
</html>
