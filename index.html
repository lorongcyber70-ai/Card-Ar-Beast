<!doctype html>
<html lang="ms">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#05000c"
>

<title>Card Beast AR — Stable v45</title>


<!-- =========================================
     A-FRAME
========================================= -->

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


<!-- =========================================
     MINDAR
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

/* =========================================
   GENERAL
========================================= */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

body{

  position:fixed;

  inset:0;

  width:100vw;
  height:100vh;

}


/* =========================================
   CAMERA VIDEO

   RESPONSIVE
========================================= */

video{

  position:fixed!important;

  inset:0!important;

  width:100%!important;

  height:100%!important;

  max-width:none!important;
  max-height:none!important;

  object-fit:cover!important;

  object-position:center center!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;

}


/* =========================================
   A-FRAME

   RESPONSIVE
========================================= */

a-scene{

  position:fixed!important;

  inset:0!important;

  width:100%!important;

  height:100%!important;

  max-width:none!important;
  max-height:none!important;

  z-index:1!important;

  background:transparent!important;

}

.a-canvas,
canvas{

  background:transparent!important;

}


/* =========================================
   TOP UI
========================================= */

#ui{

  position:fixed;

  z-index:20;

  top:

    max(
      14px,
      env(safe-area-inset-top)
    );

  left:0;

  width:100%;

  padding:

    0

    max(
      10px,
      env(safe-area-inset-left)
    )

    0

    max(
      10px,
      env(safe-area-inset-right)
    );

  text-align:center;

  pointer-events:none;

}


.logo{

  font-size:clamp(
    22px,
    7vw,
    30px
  );

  font-weight:900;

  color:#fff;

  line-height:1.1;

  text-shadow:
    0 2px 8px #000;

}


.logo span{

  color:#b75cff;

}


/* =========================================
   STATUS
========================================= */

#status{

  display:inline-block;

  max-width:90vw;

  margin-top:10px;

  padding:

    9px

    17px;

  border:

    1px

    solid

    #b75cff;

  border-radius:30px;

  color:#ffd86b;

  background:

    rgba(
      5,
      0,
      12,
      .78
    );

  font-size:

    clamp(
      12px,
      3.5vw,
      15px
    );

  font-weight:800;

  line-height:1.2;

  box-shadow:

    0 0 12px

    rgba(
      183,
      92,
      255,
      .25
    );

}


/* =========================================
   STATUS STATES
========================================= */

#status.ok{

  color:#68ff9b;

}


#status.err{

  color:#ff6b6b;

}


#status.warn{

  color:#ffd86b;

}


/* =========================================
   INFO
========================================= */

#info{

  position:fixed;

  z-index:20;

  left:

    max(
      14px,
      env(safe-area-inset-left)
    );

  right:

    max(
      14px,
      env(safe-area-inset-right)
    );

  bottom:

    max(
      16px,
      env(safe-area-inset-bottom)
    );

  padding:

    13px

    17px;

  border:

    1px

    solid

    #7d35b8;

  border-radius:22px;

  background:

    rgba(
      5,
      0,
      12,
      .84
    );

  color:#fff;

  text-align:center;

  font-size:

    clamp(
      13px,
      4vw,
      17px
    );

  line-height:1.45;

  pointer-events:none;

  box-shadow:

    0 0 18px

    rgba(
      125,
      53,
      184,
      .2
    );

  max-height:30vh;

  overflow:hidden;

}


.ok-text{

  color:#68ff9b;

}


.err-text{

  color:#ff6b6b;

}


/* =========================================
   LOADING OVERLAY
========================================= */

#loading{

  position:fixed;

  inset:0;

  z-index:30;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:30px;

  background:

    rgba(
      0,
      0,
      0,
      .72
    );

  color:#fff;

  text-align:center;

  transition:

    opacity .25s ease;

  pointer-events:none;

}


#loading.hidden{

  opacity:0;

}


.loading-box{

  width:min(
    360px,
    90vw
  );

  padding:25px 20px;

  border:

    1px

    solid

    #7d35b8;

  border-radius:22px;

  background:

    rgba(
      5,
      0,
      12,
      .94
    );

  box-shadow:

    0 0 30px

    rgba(
      183,
      92,
      255,
      .2
    );

}


.loading-title{

  font-size:20px;

  font-weight:900;

  margin-bottom:10px;

}


.loading-text{

  font-size:14px;

  line-height:1.5;

  color:#ccc;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width:600px){

  #info{

    border-radius:18px;

  }

}


/* =========================================
   LANDSCAPE
========================================= */

@media (
  orientation:landscape
) and (max-height:500px){

  #ui{

    top:8px;

  }

  .logo{

    font-size:22px;

  }

  #status{

    margin-top:5px;

    padding:7px 14px;

  }

  #info{

    bottom:8px;

    padding:8px 12px;

    font-size:13px;

  }

}


/* =========================================
   REDUCED MOTION
========================================= */

@media (
  prefers-reduced-motion:reduce
){

  #loading{

    transition:none;

  }

}

</style>

</head>


<body>


<!-- =========================================
     LOADING
========================================= -->

<div id="loading">

  <div class="loading-box">

    <div class="loading-title">
      CARD BEAST AR
    </div>

    <div
      id="loadingText"
      class="loading-text"
    >
      Initialising camera and AR…
    </div>

  </div>

</div>


<!-- =========================================
     TOP UI
========================================= -->

<div id="ui">

  <div class="logo">

    CARD <span>BEAST</span> AR

  </div>


  <div
    id="status"
    class="warn"
  >

    INITIALISING CAMERA…

  </div>

</div>


<!-- =========================================
     INFO
========================================= -->

<div id="info">

  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.

</div>


<!-- =========================================
     A-FRAME + MINDAR
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="
    enabled:false
  "

  device-orientation-permission-ui="
    enabled:false
  "

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true;
    antialias:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind?v=45;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="
    enabled:false
  "

>


  <!-- =======================================
       CAMERA
  ======================================== -->

  <a-camera

    id="camera"

    position="0 0 0"

    look-controls="
      enabled:false
    "

  ></a-camera>


  <!-- =======================================
       DR-001 TARGET
       
       KEKAL
  ======================================== -->

  <a-entity

    id="target"

    mindar-image-target="
      targetIndex:0
    "

  >


    <!-- =====================================
         BEAST
         
         ROTATION KEKAL
         0 0 0

         SCALE KEKAL
         2.5
    ====================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 0 0"

      rotation="0 0 0"

      scale="2.5 2.5 2.5"

    >


      <!-- ===================================
           DRAGON MODEL
           
           ROTATION KEKAL
           90 0 0
           
           JANGAN UBAH
      ==================================== -->

      <a-entity

        id="dragonModel"

        gltf-model="./models/ember-dragon.glb?v=45"

        position="0 0 0"

        rotation="90 0 0"

        scale="1 1 1"

      ></a-entity>


    </a-entity>


  </a-entity>


</a-scene>


<script>

(function(){


  'use strict';


  /* =========================================
     CONSTANTS
  ========================================= */

  const VERSION =
    '45';


  const TARGET_ID =
    'DR-001';


  const TARGET_FILE =
    './targets.mind?v=' +
    VERSION;


  const MODEL_FILE =
    './models/ember-dragon.glb?v=' +
    VERSION;


  /* =========================================
     ELEMENTS
  ========================================= */

  const scene =
    document.getElementById(
      'scene'
    );


  const target =
    document.getElementById(
      'target'
    );


  const beast =
    document.getElementById(
      'beast'
    );


  const dragonModel =
    document.getElementById(
      'dragonModel'
    );


  const status =
    document.getElementById(
      'status'
    );


  const info =
    document.getElementById(
      'info'
    );


  const loading =
    document.getElementById(
      'loading'
    );


  const loadingText =
    document.getElementById(
      'loadingText'
    );


  /* =========================================
     STATE
  ========================================= */

  let arReady =
    false;


  let modelReady =
    false;


  let targetFound =
    false;


  let cameraError =
    false;


  /* =========================================
     STATUS
  ========================================= */

  function setStatus(
    text,
    type
  ){

    status.textContent =
      text;


    status.className =
      type || 'warn';

  }


  /* =========================================
     INFO
  ========================================= */

  function setInfo(
    html
  ){

    info.innerHTML =
      html;

  }


  /* =========================================
     LOADING
  ========================================= */

  function showLoading(
    text
  ){

    loadingText.textContent =
      text;


    loading.classList.remove(
      'hidden'
    );

  }


  function hideLoading(){

    loading.classList.add(
      'hidden'
    );

  }


  /* =========================================
     MODEL VISIBILITY
     
     IMPORTANT:
     Model ONLY appears when:
     
     targetFound === true
     
     AND
     
     modelReady === true
  ========================================= */

  function updateModelVisibility(){

    const shouldShow =
      targetFound &&
      modelReady;


    beast.setAttribute(

      'visible',

      shouldShow

    );

  }


  /* =========================================
     INITIAL STATE
  ========================================= */

  beast.setAttribute(
    'visible',
    'false'
  );


  /* =========================================
     A-FRAME LOADED
  ========================================= */

  scene.addEventListener(

    'loaded',

    function(){

      console.log(
        'A-Frame loaded.'
      );


      setStatus(
        'AR INITIALISING…',
        'warn'
      );


      setInfo(

        'Loading target ' +

        '<b>' +

        TARGET_ID +

        '</b>…'

      );

    }

  );


  /* =========================================
     AR READY
  ========================================= */

  scene.addEventListener(

    'arReady',

    function(){

      arReady =
        true;


      hideLoading();


      setStatus(
        'CAMERA ACTIVE ✓',
        'ok'
      );


      setInfo(

        'Point the rear camera at ' +

        '<b>' +

        TARGET_ID +

        ' Ember Dragon</b>.'

      );


      console.log(
        'MindAR arReady.'
      );


      console.log(
        'Camera ready.'
      );

    }

  );


  /* =========================================
     GLB MODEL LOADED
  ========================================= */

  dragonModel.addEventListener(

    'model-loaded',

    function(){

      modelReady =
        true;


      updateModelVisibility();


      console.log(
        '========================================'
      );


      console.log(
        'CARD BEAST AR — STABLE v45'
      );


      console.log(
        '========================================'
      );


      console.log(
        'Target:',
        TARGET_ID
      );


      console.log(
        'Target file:',
        TARGET_FILE
      );


      console.log(
        'Target index:',
        '0'
      );


      console.log(
        'Model:',
        MODEL_FILE
      );


      console.log(
        'Beast position:',
        '0 0 0'
      );


      console.log(
        'Beast rotation:',
        '0 0 0'
      );


      console.log(
        'Beast scale:',
        '2.5 2.5 2.5'
      );


      console.log(
        'Dragon rotation:',
        '90 0 0'
      );


      console.log(
        'Tracking:',
        'MindAR'
      );


      console.log(
        'Model visibility:',
        targetFound
      );


      console.log(
        '========================================'
      );


      if(targetFound){

        setInfo(

          '🔥 <b>EMBER DRAGON DETECTED</b><br>' +

          '🟣 3D model active.<br>' +

          'Scale: 2.5'

        );

      }else{

        setInfo(

          '🔥 <b>EMBER DRAGON READY</b><br>' +

          'Model loaded successfully.<br>' +

          'Point camera at DR-001.'

        );

      }

    }

  );


  /* =========================================
     GLB ERROR
  ========================================= */

  dragonModel.addEventListener(

    'model-error',

    function(event){

      modelReady =
        false;


      beast.setAttribute(
        'visible',
        'false'
      );


      console.error(
        'GLB model error:',
        event
      );


      setStatus(
        'MODEL ERROR',
        'err'
      );


      setInfo(

        '❌ <b>EMBER DRAGON FAILED</b><br>' +

        'Cannot load ' +

        '<b>ember-dragon.glb</b>.<br>' +

        'Check the models folder and filename.'

      );


      showLoading(
        'Failed to load 3D model.'
      );

    }

  );


  /* =========================================
     TARGET FOUND
     
     MODEL APPEARS HERE ONLY
  ========================================= */

  target.addEventListener(

    'targetFound',

    function(){

      targetFound =
        true;


      updateModelVisibility();


      setStatus(

        'CARD CONFIRMED • DR-001',

        'ok'

      );


      if(modelReady){

        setInfo(

          '🔥 <b>EMBER DRAGON DETECTED</b><br>' +

          '🟣 3D Ember Dragon active.<br>' +

          'Scale: 2.5'

        );

      }else{

        setInfo(

          '🎯 <b>DR-001 DETECTED</b><br>' +

          'Loading Ember Dragon…'

        );

      }


      console.log(
        'DR-001 targetFound.'
      );


      console.log(
        'Model ready:',
        modelReady
      );

    }

  );


  /* =========================================
     TARGET LOST
     
     MODEL DISAPPEARS HERE
  ========================================= */

  target.addEventListener(

    'targetLost',

    function(){

      targetFound =
        false;


      updateModelVisibility();


      setStatus(

        'CAMERA ACTIVE ✓',

        'ok'

      );


      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );


      console.log(
        'DR-001 targetLost.'
      );


      console.log(
        'Model hidden.'
      );

    }

  );


  /* =========================================
     AR ERROR
  ========================================= */

  scene.addEventListener(

    'arError',

    function(event){

      arReady =
        false;


      console.error(
        'MindAR error:',
        event
      );


      setStatus(
        'AR ERROR',
        'err'
      );


      setInfo(

        '❌ MindAR gagal dimulakan.<br>' +

        'Semak permission kamera dan URL.'

      );


      showLoading(
        'AR failed to initialise.'
      );

    }

  );


  /* =========================================
     CAMERA VIDEO ERROR CHECK
  ========================================= */

  function inspectVideo(){

    const videos =
      document.querySelectorAll(
        'video'
      );


    if(!videos.length){

      return;

    }


    videos.forEach(

      function(video){

        video.setAttribute(
          'playsinline',
          ''
        );


        video.setAttribute(
          'webkit-playsinline',
          ''
        );


        video.setAttribute(
          'autoplay',
          ''
        );


        video.muted =
          true;


        Object.assign(

          video.style,

          {

            position:'fixed',

            inset:'0',

            width:'100%',

            height:'100%',

            maxWidth:'none',

            maxHeight:'none',

            objectFit:'cover',

            objectPosition:'center center',

            zIndex:'0',

            display:'block',

            background:'#000'

          }

        );


        video.addEventListener(

          'error',

          function(event){

            cameraError =
              true;


            console.error(
              'Camera video error:',
              event
            );


            setStatus(
              'CAMERA ERROR',
              'err'
            );


            setInfo(

              '❌ Kamera tidak dapat digunakan.<br>' +

              'Pastikan permission kamera diberikan.'

            );

          }

        );

      }

    );

  }


  /* =========================================
     WATCH FOR MINDAR VIDEO
  ========================================= */

  const videoObserver =
    new MutationObserver(

      function(){

        inspectVideo();

      }

    );


  videoObserver.observe(

    document.documentElement,

    {

      childList:true,

      subtree:true

    }

  );


  /* =========================================
     INITIAL VIDEO CHECK
  ========================================= */

  inspectVideo();


  /* =========================================
     WINDOW RESIZE
     
     CAMERA RESPONSIVE
  ========================================= */

  function handleResize(){

    const width =
      window.innerWidth;


    const height =
      window.innerHeight;


    console.log(
      'Viewport:',
      width,
      'x',
      height
    );


    inspectVideo();


    /*
      A-Frame akan mengurus
      canvas resize sendiri.
    */

    if(
      scene &&
      scene.renderer
    ){

      scene.renderer.setSize(

        width,

        height,

        false

      );

    }

  }


  window.addEventListener(

    'resize',

    handleResize

  );


  window.addEventListener(

    'orientationchange',

    function(){

      setTimeout(

        handleResize,

        250

      );

    }

  );


  /* =========================================
     VISIBILITY CHANGE
     
     PHONE TAB / SCREEN LOCK
  ========================================= */

  document.addEventListener(

    'visibilitychange',

    function(){

      if(
        document.hidden
      ){

        beast.setAttribute(
          'visible',
          'false'
        );

      }else{

        updateModelVisibility();

      }

    }

  );


  /* =========================================
     PAGE ERROR
  ========================================= */

  window.addEventListener(

    'error',

    function(event){

      console.error(
        'Page error:',
        event.error || event.message
      );

    }

  );


  /* =========================================
     UNHANDLED PROMISE
  ========================================= */

  window.addEventListener(

    'unhandledrejection',

    function(event){

      console.error(
        'Unhandled promise:',
        event.reason
      );

    }

  );


  /* =========================================
     FINAL DEBUG
  ========================================= */

  console.log(
    '========================================'
  );


  console.log(
    'CARD BEAST AR — STABLE v45'
  );


  console.log(
    '========================================'
  );


  console.log(
    'Target ID:',
    TARGET_ID
  );


  console.log(
    'Target:',
    TARGET_FILE
  );


  console.log(
    'targetIndex:',
    '0'
  );


  console.log(
    'Model:',
    MODEL_FILE
  );


  console.log(
    'Beast rotation:',
    '0 0 0'
  );


  console.log(
    'Dragon rotation:',
    '90 0 0'
  );


  console.log(
    'Beast scale:',
    '2.5'
  );


  console.log(
    'Tracking:',
    'MindAR'
  );


  console.log(
    'Model visible:',
    'targetFound && modelReady'
  );


  console.log(
    'World-Y rotation:',
    'OFF'
  );


  console.log(
    'Quaternion rotation:',
    'OFF'
  );


  console.log(
    '========================================'
  );


})();

</script>


</body>

</html>
