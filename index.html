<!doctype html>
<html lang="ms">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Card Beast AR — Epic Emergence v46</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

/* =========================================
   GENERAL
========================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* =========================================
   CAMERA
========================================= */

video{
  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  display:block!important;

  z-index:0!important;

  background:#000!important;
}

/* =========================================
   A-FRAME
========================================= */

a-scene{
  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;
}

canvas,
.a-canvas{
  background:transparent!important;
}

/* =========================================
   TOP UI
========================================= */

#ui{

  position:fixed;

  z-index:20;

  top:18px;

  left:0;

  width:100%;

  text-align:center;

  pointer-events:none;
}

.logo{

  font-size:28px;

  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px #000;
}

.logo span{
  color:#b75cff;
}

#status{

  display:inline-block;

  margin-top:12px;

  padding:10px 20px;

  border:1px solid #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.72);

  font-weight:800;

  box-shadow:
    0 0 12px rgba(183,92,255,.25);
}

/* =========================================
   INFO
========================================= */

#info{

  position:fixed;

  z-index:20;

  left:5%;

  right:5%;

  bottom:20px;

  padding:14px 18px;

  border:1px solid #7d35b8;

  border-radius:24px;

  background:rgba(5,0,12,.84);

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;

  box-shadow:
    0 0 18px rgba(125,53,184,.2);
}

.ok{
  color:#68ff9b;
}

.err{
  color:#ff6b6b;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

  .logo{
    font-size:28px;
  }

  #status{
    font-size:16px;
    padding:9px 18px;
  }

  #info{
    font-size:17px;
    bottom:18px;
  }

}

</style>

</head>


<body>


<!-- =========================================
     TOP UI
========================================= -->

<div id="ui">

  <div class="logo">
    CARD <span>BEAST</span> AR
  </div>

  <div id="status">
    INITIALISING CAMERA…
  </div>

</div>


<!-- =========================================
     INFO
========================================= -->

<div id="info">

  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.

</div>


<!-- =========================================
     A-FRAME + MINDAR
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind?v=46;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="
    enabled:false
  "

>


  <!-- =======================================
       CAMERA
       KEKAL
  ======================================== -->

  <a-camera

    position="0 0 0"

    look-controls="enabled:false">

  </a-camera>


  <!-- =======================================
       DR-001
       KEKAL
  ======================================== -->

  <a-entity

    id="target"

    mindar-image-target="targetIndex:0"

  >


    <!-- =====================================
         BEAST PARENT

         FINAL POSITION:
         0 -0.25 0

         ROTATION:
         0 0 0

         SCALE:
         2.5
    ====================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 -0.25 0"

      rotation="0 0 0"

      scale="2.5 2.5 2.5"

    >


      <!-- ===================================
           DRAGON MODEL

           IMPORTANT:

           ROTATION KEKAL
           90 0 0

           X = 0
           Y = -0.25 melalui BEAST
           Z = 0
      ==================================== -->

      <a-entity

        id="dragonModel"

        gltf-model="./models/ember-dragon.glb?v=46"

        position="0 0 0"

        rotation="90 0 0"

        scale="1 1 1"

      >

      </a-entity>


    </a-entity>


  </a-entity>


</a-scene>


<script>

(function(){

  "use strict";


  /* =========================================
     ELEMENTS
  ========================================= */

  const scene =
    document.getElementById("scene");

  const target =
    document.getElementById("target");

  const beast =
    document.getElementById("beast");

  const dragonModel =
    document.getElementById("dragonModel");

  const status =
    document.getElementById("status");

  const info =
    document.getElementById("info");


  /* =========================================
     LOCKED BASELINE
     
     JANGAN UBAH
  ========================================= */

  const FINAL_X = 0;

  const FINAL_Y = -0.25;

  const FINAL_Z = 0;


  /*
     Dragon rotation:

     90 0 0

     KEKAL.
  */

  const DRAGON_ROTATION = {
    x:90,
    y:0,
    z:0
  };


  /*
     Beast final scale.

     KEKAL 2.5
  */

  const FINAL_SCALE = 2.5;


  /* =========================================
     EPIC EMERGENCE SETTINGS
  ========================================= */

  /*
     Naga bermula sedikit
     di dalam / bawah kad.
  */

  const START_Y = -0.42;


  /*
     Scale awal kecil.
  */

  const START_SCALE = 0.08;


  /*
     Bounce pertama.

     Tidak terlalu tinggi supaya
     naga tidak nampak terapung.
  */

  const BOUNCE_Y = -0.23;


  /*
     Tempoh animation.
  */

  const RISE_DURATION = 520;

  const BOUNCE_DURATION = 180;

  const SETTLE_DURATION = 140;


  /* =========================================
     STATE
  ========================================= */

  let modelLoaded = false;

  let targetVisible = false;

  let emergencePlayed = false;

  let animationToken = 0;


  /* =========================================
     STATUS
  ========================================= */

  function setStatus(text, cls){

    status.textContent = text;

    status.className = cls || "";

  }


  /* =========================================
     INFO
  ========================================= */

  function setInfo(html){

    info.innerHTML = html;

  }


  /* =========================================
     FORCE BASE ROTATION
     
     IMPORTANT:
     TIDAK BUAT WORLD-Y ROTATION
     
     ROTATION KEKAL 90 0 0
  ========================================= */

  function lockDragonRotation(){

    if(
      !dragonModel ||
      !dragonModel.object3D
    ){
      return;
    }


    const obj =
      dragonModel.object3D;


    obj.rotation.set(

      THREE.MathUtils.degToRad(
        DRAGON_ROTATION.x
      ),

      THREE.MathUtils.degToRad(
        DRAGON_ROTATION.y
      ),

      THREE.MathUtils.degToRad(
        DRAGON_ROTATION.z
      )

    );


    obj.updateMatrixWorld(true);

  }


  /* =========================================
     RESET BEAST
     
     BASELINE:
     POSITION 0 -0.25 0
     SCALE 2.5
  ========================================= */

  function resetBeast(){

    animationToken++;


    /*
      Beast position.
    */

    beast.object3D.position.set(

      FINAL_X,

      FINAL_Y,

      FINAL_Z

    );


    /*
      Beast rotation.

      KEKAL 0 0 0
    */

    beast.object3D.rotation.set(

      0,
      0,
      0

    );


    /*
      Final scale.
    */

    beast.object3D.scale.set(

      FINAL_SCALE,
      FINAL_SCALE,
      FINAL_SCALE

    );


    /*
      Dragon rotation.

      KEKAL 90 0 0
    */

    lockDragonRotation();


    beast.object3D.updateMatrixWorld(true);

  }


  /* =========================================
     SET EMERGENCE START
  ========================================= */

  function setEmergenceStart(){

    beast.object3D.position.set(

      FINAL_X,

      START_Y,

      FINAL_Z

    );


    beast.object3D.scale.set(

      START_SCALE,
      START_SCALE,
      START_SCALE

    );


    beast.object3D.rotation.set(

      0,
      0,
      0

    );


    lockDragonRotation();


    beast.object3D.updateMatrixWorld(true);

  }


  /* =========================================
     EASING
  ========================================= */

  function easeOutCubic(t){

    return 1 -
      Math.pow(
        1 - t,
        3
      );

  }


  function easeOutBack(t){

    const c1 = 1.70158;

    const c3 = c1 + 1;

    return 1 +
      c3 *
      Math.pow(
        t - 1,
        3
      ) +
      c1 *
      Math.pow(
        t - 1,
        2
      );

  }


  /* =========================================
     ANIMATE VALUE
  ========================================= */

  function animateValue(

    duration,

    update,

    easing,

    token

  ){

    return new Promise(

      function(resolve){

        const start =
          performance.now();


        function frame(now){

          /*
            Animation dibatalkan
            jika target hilang atau
            animation baru bermula.
          */

          if(token !== animationToken){

            resolve(false);

            return;

          }


          let t =
            (now - start) /
            duration;


          t =
            Math.max(
              0,
              Math.min(
                1,
                t
              )
            );


          const e =
            easing
              ? easing(t)
              : t;


          update(e);


          if(t < 1){

            requestAnimationFrame(frame);

          }else{

            resolve(true);

          }

        }


        requestAnimationFrame(frame);

      }

    );

  }


  /* =========================================
     EPIC EMERGENCE
     
     ONLY ONCE PER TARGET FOUND
  ========================================= */

  async function playEpicEmergence(){

    if(
      !modelLoaded ||
      !targetVisible ||
      emergencePlayed
    ){

      return;

    }


    emergencePlayed = true;


    const token =
      ++animationToken;


    console.log(
      "Epic Emergence START"
    );


    /*
      STEP 1
      Start kecil di bawah
      permukaan kad.
    */

    setEmergenceStart();


    /*
      Pastikan visible.
    */

    beast.setAttribute(
      "visible",
      "true"
    );


    /*
      STEP 2
      Naik sedikit sambil membesar.

      FINAL Y:
      -0.25
    */

    const riseDone =
      await animateValue(

        RISE_DURATION,

        function(e){

          if(token !== animationToken){
            return;
          }


          /*
            Y:

            -0.42
              ↓
            -0.25
          */

          beast.object3D.position.y =

            START_Y +

            (
              FINAL_Y -
              START_Y
            ) * e;


          /*
            Scale:

            0.08
              ↓
            2.5
          */

          const scale =

            START_SCALE +

            (
              FINAL_SCALE -
              START_SCALE
            ) * easeOutCubic(e);


          beast.object3D.scale.set(

            scale,
            scale,
            scale

          );


          /*
            Rotation naga sentiasa
            dikunci 90 0 0.
          */

          lockDragonRotation();

        },

        easeOutCubic,

        token

      );


    if(!riseDone){
      return;
    }


    /*
      STEP 3
      Bounce kecil.

      Naik ke -0.23 sahaja.

      Ini cukup untuk nampak
      hidup tetapi TIDAK terapung.
    */

    const bounceDone =
      await animateValue(

        BOUNCE_DURATION,

        function(e){

          if(token !== animationToken){
            return;
          }


          beast.object3D.position.y =

            FINAL_Y +

            (
              BOUNCE_Y -
              FINAL_Y
            ) * e;


          beast.object3D.scale.set(

            FINAL_SCALE,
            FINAL_SCALE,
            FINAL_SCALE

          );


          lockDragonRotation();

        },

        easeOutBack,

        token

      );


    if(!bounceDone){
      return;
    }


    /*
      STEP 4
      Settle balik tepat
      pada Y -0.25.
    */

    const settleDone =
      await animateValue(

        SETTLE_DURATION,

        function(e){

          if(token !== animationToken){
            return;
          }


          beast.object3D.position.y =

            BOUNCE_Y +

            (
              FINAL_Y -
              BOUNCE_Y
            ) * e;


          beast.object3D.scale.set(

            FINAL_SCALE,
            FINAL_SCALE,
            FINAL_SCALE

          );


          lockDragonRotation();

        },

        easeOutCubic,

        token

      );


    if(!settleDone){
      return;
    }


    /*
      FINAL HARD LOCK
    */

    beast.object3D.position.set(

      FINAL_X,
      FINAL_Y,
      FINAL_Z

    );


    beast.object3D.rotation.set(

      0,
      0,
      0

    );


    beast.object3D.scale.set(

      FINAL_SCALE,
      FINAL_SCALE,
      FINAL_SCALE

    );


    lockDragonRotation();


    beast.object3D.updateMatrixWorld(true);


    console.log(
      "Epic Emergence COMPLETE"
    );


    console.log(
      "Final position:",
      FINAL_X,
      FINAL_Y,
      FINAL_Z
    );


    console.log(
      "Dragon rotation:",
      "90 0 0"
    );


    console.log(
      "Final scale:",
      FINAL_SCALE
    );


    setInfo(

      "🔥 <b>EMBER DRAGON ACTIVE</b><br>" +

      "Epic Emergence complete.<br>" +

      "Position Y: -0.25<br>" +

      "Scale: 2.5"

    );

  }


  /* =========================================
     A-FRAME LOADED
  ========================================= */

  scene.addEventListener(

    "loaded",

    function(){

      setStatus(
        "CAMERA / AR INITIALISING…"
      );


      setInfo(
        "Loading MindAR target <b>DR-001</b>…"
      );


      console.log(
        "A-Frame loaded."
      );

    }

  );


  /* =========================================
     AR READY
  ========================================= */

  scene.addEventListener(

    "arReady",

    function(){

      setStatus(
        "CAMERA ACTIVE ✓",
        "ok"
      );


      setInfo(

        "Point the rear camera at " +

        "<b>DR-001 Ember Dragon</b>."

      );


      console.log(
        "MindAR arReady."
      );

    }

  );


  /* =========================================
     MODEL LOADED
  ========================================= */

  dragonModel.addEventListener(

    "model-loaded",

    function(){

      modelLoaded = true;


      /*
        Jangan ubah orientation GLB.
      */

      lockDragonRotation();


      /*
        Pastikan baseline.
      */

      resetBeast();


      console.log(
        "================================"
      );

      console.log(
        "CARD BEAST AR — EPIC v46"
      );

      console.log(
        "================================"
      );

      console.log(
        "Target: DR-001"
      );

      console.log(
        "targetIndex: 0"
      );

      console.log(
        "targets.mind?v=46"
      );

      console.log(
        "ember-dragon.glb?v=46"
      );

      console.log(
        "Beast rotation: 0 0 0"
      );

      console.log(
        "Beast scale: 2.5"
      );

      console.log(
        "Final position:",
        "0 -0.25 0"
      );

      console.log(
        "Dragon rotation:",
        "90 0 0"
      );

      console.log(
        "Epic Emergence: ON"
      );

      console.log(
        "================================"
      );


      setInfo(

        "🟣 <b>3D EMBER DRAGON READY</b><br>" +

        "Point camera at DR-001."

      );

    }

  );


  /* =========================================
     MODEL ERROR
  ========================================= */

  dragonModel.addEventListener(

    "model-error",

    function(event){

      modelLoaded = false;


      console.error(
        "GLB model error:",
        event
      );


      setStatus(
        "MODEL ERROR",
        "err"
      );


      setInfo(

        "❌ Failed to load " +

        "<b>ember-dragon.glb</b>.<br>" +

        "Check /models/ember-dragon.glb."

      );

    }

  );


  /* =========================================
     TARGET FOUND
     
     EPIC EMERGENCE:
     ONCE PER TARGET FOUND
  ========================================= */

  target.addEventListener(

    "targetFound",

    function(){

      console.log(
        "DR-001 TARGET FOUND"
      );


      targetVisible = true;


      /*
        New targetFound =
        allow one new animation.
      */

      emergencePlayed = false;


      /*
        Cancel previous animation.
      */

      animationToken++;


      /*
        Jangan ubah rotation.
      */

      lockDragonRotation();


      /*
        Start hidden dahulu.
      */

      beast.setAttribute(
        "visible",
        "true"
      );


      /*
        Pastikan final baseline
        sebelum animation bermula.
      */

      setEmergenceStart();


      setStatus(

        "CARD CONFIRMED • DR-001",

        "ok"

      );


      setInfo(

        "🔥 <b>EMBER DRAGON DETECTED</b><br>" +

        "Epic Emergence starting…"

      );


      /*
        Main sekali sahaja.
      */

      playEpicEmergence();

    }

  );


  /* =========================================
     TARGET LOST
  ========================================= */

  target.addEventListener(

    "targetLost",

    function(){

      console.log(
        "DR-001 TARGET LOST"
      );


      targetVisible = false;


      /*
        Cancel animation.
      */

      animationToken++;


      /*
        Reset supaya targetFound
        seterusnya boleh main semula.
      */

      emergencePlayed = false;


      /*
        Hide model.
      */

      beast.setAttribute(

        "visible",

        "false"

      );


      /*
        Reset baseline.
      */

      resetBeast();


      setStatus(

        "CAMERA ACTIVE ✓",

        "ok"

      );


      setInfo(

        "Point the rear camera at " +

        "<b>DR-001 Ember Dragon</b>."

      );

    }

  );


  /* =========================================
     AR ERROR
  ========================================= */

  scene.addEventListener(

    "arError",

    function(event){

      console.error(
        "MindAR error:",
        event
      );


      setStatus(
        "AR ERROR",
        "err"
      );


      setInfo(

        "MindAR gagal dimulakan.<br>" +

        "Pastikan permission kamera diberikan."

      );

    }

  );


  /* =========================================
     CAMERA VIDEO FIX
  ========================================= */

  function fixVideoLayer(){

    document
      .querySelectorAll("video")
      .forEach(

        function(video){

          video.setAttribute(
            "playsinline",
            ""
          );


          video.setAttribute(
            "autoplay",
            ""
          );


          video.muted = true;


          Object.assign(

            video.style,

            {

              position:"fixed",

              inset:"0",

              width:"100%",

              height:"100%",

              objectFit:"cover",

              zIndex:"0",

              display:"block",

              background:"#000"

            }

          );

        }

      );

  }


  /* =========================================
     WATCH VIDEO
  ========================================= */

  new MutationObserver(

    fixVideoLayer

  ).observe(

    document.documentElement,

    {

      childList:true,

      subtree:true

    }

  );


  /* =========================================
     INITIAL VIDEO
  ========================================= */

  fixVideoLayer();


  /* =========================================
     FINAL DEBUG
  ========================================= */

  console.log(
    "================================"
  );

  console.log(
    "CARD BEAST AR v46"
  );

  console.log(
    "Epic Emergence"
  );

  console.log(
    "Target: DR-001"
  );

  console.log(
    "targetIndex: 0"
  );

  console.log(
    "Beast: rotation 0 0 0"
  );

  console.log(
    "Beast scale: 2.5"
  );

  console.log(
    "Final position: 0 -0.25 0"
  );

  console.log(
    "Dragon rotation: 90 0 0"
  );

  console.log(
    "X/Z offset: 0 / 0"
  );

  console.log(
    "Cache: v46"
  );

  console.log(
    "================================"
  );


})();

</script>


</body>

</html>
