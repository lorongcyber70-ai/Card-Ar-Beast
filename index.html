<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Beast AR — Step 2.1.1 Diagnostic</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050308;color:#fff;font-family:Arial,sans-serif}
#cameraTest{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
#arRoot{display:none;position:fixed;inset:0;z-index:2}
a-scene{position:fixed!important;inset:0!important}
#ui{position:fixed;top:0;left:0;right:0;z-index:20;padding:18px 16px 12px;
background:linear-gradient(#07050b,rgba(7,5,11,.82),transparent);pointer-events:none}
.logo{font-size:25px;font-weight:900}.logo span{color:#b75cff}
.badge{display:inline-block;margin-top:10px;padding:10px 16px;border:1px solid #9c3dff;border-radius:999px;font-weight:800}
#log{position:fixed;left:16px;right:16px;bottom:90px;z-index:25;max-height:34vh;overflow:auto;
background:rgba(8,6,12,.88);border:1px solid #5e277e;border-radius:16px;padding:12px;font-size:13px;line-height:1.45}
.ok{color:#68ff9b}.warn{color:#ffcc66}.err{color:#ff6b6b}
button{position:fixed;left:16px;right:16px;bottom:20px;z-index:30;border:0;border-radius:18px;padding:17px;
font-size:17px;font-weight:900;color:white;background:linear-gradient(90deg,#7b2cff,#bd4dff)}
#fallback{position:fixed;inset:0;z-index:0;display:grid;place-items:center;color:#aaa;text-align:center;padding:30px}
</style>
</head>

<body>
<div id="fallback">CARD BEAST AR<br>Step 2.1.1 Diagnostic</div>

<video id="cameraTest" autoplay playsinline muted></video>

<div id="arRoot">
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no"
  color-space="sRGB"
  renderer="colorManagement: true"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity id="beast" visible="false" position="0 0 0">
      <a-sphere radius=".48" color="#7b2cff"
        material="shader:flat;opacity:.92"
        animation="property:rotation;to:0 360 0;loop:true;dur:2200">
      </a-sphere>
      <a-ring radius-inner=".58" radius-outer=".66" color="#d58cff"
        rotation="-90 0 0"
        animation="property:scale;from:1 1 1;to:1.25 1.25 1.25;dir:alternate;loop:true;dur:700">
      </a-ring>
    </a-entity>
  </a-entity>
</a-scene>
</div>

<div id="ui">
  <div class="logo">CARD <span>BEAST</span> AR</div>
  <div id="status" class="badge">DIAGNOSTIC READY</div>
</div>

<div id="log"></div>
<button id="action">1 — TEST CAMERA</button>

<script>
const video=document.getElementById('cameraTest');
const arRoot=document.getElementById('arRoot');
const status=document.getElementById('status');
const log=document.getElementById('log');
const action=document.getElementById('action');
const fallback=document.getElementById('fallback');
let stream=null, arStarted=false;

function write(msg, cls=''){
  const d=document.createElement('div');
  d.className=cls;
  d.textContent=msg;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}
function setStatus(msg, cls=''){status.textContent=msg;status.className='badge '+cls}
function fail(msg){write('ERROR: '+msg,'err');setStatus('DIAGNOSTIC ERROR','err')}

write('Step 2.1.1 diagnostic loaded.','ok');
write('targets.mind will NOT be modified.','ok');
write('Browser: '+navigator.userAgent);

async function testCamera(){
  action.disabled=true;
  try{
    if(!window.isSecureContext) throw new Error('Page is not HTTPS / secure context.');
    write('HTTPS / secure context: PASS','ok');

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error('getUserMedia is unavailable in this browser.');

    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    fallback.style.display='none';
    write('Camera permission: PASS','ok');
    write('Rear camera stream: PASS','ok');
    setStatus('CAMERA WORKING ✓','ok');

    action.textContent='2 — START AR DIAGNOSTIC';
    action.disabled=false;
    action.onclick=startAR;
  }catch(e){
    fail(e.name+': '+e.message);
    action.disabled=false;
    action.textContent='RETRY CAMERA';
    action.onclick=testCamera;
  }
}

async function startAR(){
  action.disabled=true;
  write('Starting MindAR/A-Frame...','warn');

  // Stop the standalone camera first so MindAR can acquire it cleanly.
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.style.display='none';
  arRoot.style.display='block';

  const scene=document.querySelector('a-scene');
  scene.addEventListener('arReady',()=>{
    arStarted=true;
    setStatus('MINDAR READY ✓','ok');
    write('MindAR initialization: PASS','ok');
    write('Point rear camera at DR-001.','ok');
    action.textContent='AR RUNNING — SCAN DR-001';
    action.disabled=false;
    action.onclick=()=>{};
  },{once:true});

  scene.addEventListener('arError',e=>{
    fail('MindAR/A-Frame camera or initialization failed.');
    write('Try Chrome Incognito after confirming Camera test passes.','warn');
    action.textContent='RELOAD TEST';
    action.disabled=false;
    action.onclick=()=>location.reload();
  },{once:true});

  const target=document.getElementById('target');
  target.addEventListener('targetFound',()=>{
    setStatus('DR-001 FOUND ✓','ok');
    write('DR-001 tracking: PASS','ok');
    document.getElementById('beast').setAttribute('visible','true');
    write('Purple AR placeholder: VISIBLE ✓','ok');
  });
  target.addEventListener('targetLost',()=>{
    setStatus('DR-001 LOST','warn');
    write('Target lost — move card back into view.','warn');
    document.getElementById('beast').setAttribute('visible','false');
  });

  try{
    scene.components['mindar-image-system'].start();
  }catch(e){
    fail('Could not start MindAR: '+e.message);
    action.disabled=false;
  }
}
action.onclick=testCamera;
</script>
</body>
</html>
