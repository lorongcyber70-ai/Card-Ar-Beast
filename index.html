<!doctype html>
<html lang="ms">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Card Beast AR — Step 2.4</title>


<!-- =========================================
     A-FRAME
========================================= -->

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}


/* =========================================
   REAL CAMERA VIDEO
========================================= */

video{
  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;
}


/* =========================================
   A-FRAME / AR CANVAS
========================================= */

a-scene{

  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;

}


.a-canvas,
canvas{

  background:transparent!important;

}


/* =========================================
   TOP UI
========================================= */

#ui{

  position:fixed;

  z-index:20;

  top:18px;

  left:0;

  width:100%;

  text-align:center;

  pointer-events:none;

}


.logo{

  font-size:28px;

  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px #000,
    0 0 12px rgba(0,0,0,.8);

}


.logo span{

  color:#b75cff;

}


/* =========================================
   STATUS
========================================= */

#status{

  display:inline-block;

  margin-top:12px;

  padding:10px 20px;

  border:1px solid #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.72);

  font-weight:800;

  font-size:18px;

  box-shadow:
    0 0 15px rgba(183,92,255,.18);

}


#status.err{

  color:#ff6b6b;

}


/* =========================================
   BOTTOM INFO
========================================= */

#info{

  position:fixed;

  z-index:20;

  left:5%;

  right:5%;

  bottom:20px;

  padding:14px 18px;

  border:1px solid #7d35b8;

  border-radius:24px;

  background:rgba(5,0,12,.78);

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;

  box-shadow:
    0 0 20px rgba(125,53,184,.12);

}


.ok{
  color:#68ff9b;
}


.err{
  color:#ff6b6b;
}


.purple{
  color:#c56cff;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

  .logo{
    font-size:27px;
  }

  #status{
    font-size:17px;
  }

  #info{
    font-size:16px;
    bottom:18px;
  }

}

</style>

</head>


<body>


<!-- =========================================
     UI
========================================= -->

<div id="ui">

  <div class="logo">
    CARD <span>BEAST</span> AR
  </div>

  <div id="status">
    INITIALISING CAMERA…
  </div>

</div>


<!-- =========================================
     INFORMATION
========================================= -->

<div id="info">

  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.

</div>



<!-- =========================================
     MINDAR SCENE
     DO NOT CHANGE TARGET SETTINGS
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="enabled:false">


  <!-- =======================================
       CAMERA
  ======================================== -->

  <a-camera

    position="0 0 0"

    look-controls="enabled:false">

  </a-camera>



  <!-- =======================================
       DR-001 TARGET
       DO NOT CHANGE targetIndex
  ======================================== -->

  <a-entity

    id="target"

    mindar-image-target="targetIndex:0">



    <!-- =====================================
         STEP 2.4
         EMBER DRAGON — STANDING
    ====================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 -0.65 0.05"

      rotation="0 0 0"

      scale="1 1 1">



      <!-- =================================
           GROUND AURA
      ================================== -->

      <a-cylinder

        position="0 0.01 0"

        radius="0.58"

        height="0.025"

        color="#7b2cff"

        opacity="0.35"

        material="
          transparent:true;
          shader:flat
        "

        animation="
          property:scale;
          to:1.15 1 1.15;
          dir:alternate;
          dur:900;
          loop:true
        ">

      </a-cylinder>



      <!-- =================================
           LEFT FOOT
      ================================== -->

      <a-sphere

        position="-0.22 0.10 0"

        radius="0.13"

        color="#32105f">

      </a-sphere>


      <a-sphere

        position="-0.22 0.05 0.10"

        radius="0.09"

        color="#8e4cff">

      </a-sphere>



      <!-- =================================
           RIGHT FOOT
      ================================== -->

      <a-sphere

        position="0.22 0.10 0"

        radius="0.13"

        color="#32105f">

      </a-sphere>


      <a-sphere

        position="0.22 0.05 0.10"

        radius="0.09"

        color="#8e4cff">

      </a-sphere>



      <!-- =================================
           LEFT LEG
      ================================== -->

      <a-cylinder

        position="-0.22 0.36 0"

        radius="0.105"

        height="0.55"

        color="#4b1b9c"

        segments-radial="8">

      </a-cylinder>



      <!-- =================================
           RIGHT LEG
      ================================== -->

      <a-cylinder

        position="0.22 0.36 0"

        radius="0.105"

        height="0.55"

        color="#4b1b9c"

        segments-radial="8">

      </a-cylinder>



      <!-- =================================
           LEFT LEG ARMOUR
      ================================== -->

      <a-cone

        position="-0.22 0.61 0"

        radius-bottom="0.13"

        radius-top="0.07"

        height="0.25"

        color="#7629d9">

      </a-cone>



      <!-- =================================
           RIGHT LEG ARMOUR
      ================================== -->

      <a-cone

        position="0.22 0.61 0"

        radius-bottom="0.13"

        radius-top="0.07"

        height="0.25"

        color="#7629d9">

      </a-cone>



      <!-- =================================
           MAIN BODY
      ================================== -->

      <a-sphere

        position="0 0.82 0"

        radius="0.43"

        scale="1 1.35 .82"

        color="#32105f">

      </a-sphere>



      <!-- =================================
           BODY PURPLE GLOW
      ================================== -->

      <a-sphere

        position="0 0.82 0.34"

        radius="0.28"

        color="#7a2cff"

        opacity="0.55"

        material="
          transparent:true;
          shader:flat
        ">

      </a-sphere>



      <!-- =================================
           CHEST CORE
      ================================== -->

      <a-sphere

        position="0 0.82 0.39"

        radius="0.16"

        color="#b75cff"

        opacity="0.9"

        material="
          transparent:true;
          shader:flat
        "

        animation="
          property:scale;
          to:1.18 1.18 1.18;
          dir:alternate;
          dur:650;
          loop:true
        ">

      </a-sphere>



      <!-- =================================
           NECK
      ================================== -->

      <a-cylinder

        position="0 1.18 0"

        radius="0.18"

        height="0.55"

        color="#4b1b9c"

        segments-radial="8">

      </a-cylinder>



      <!-- =================================
           HEAD
      ================================== -->

      <a-sphere

        position="0 1.52 0.02"

        radius="0.29"

        scale="1.08 .90 .96"

        color="#6122c5">

      </a-sphere>



      <!-- =================================
           HEAD ARMOUR
      ================================== -->

      <a-sphere

        position="0 1.57 0.17"

        radius="0.18"

        color="#8e4cff"

        opacity="0.85"

        material="
          transparent:true;
          shader:flat
        ">

      </a-sphere>



      <!-- =================================
           SNOUT
      ================================== -->

      <a-sphere

        position="0 1.44 0.27"

        radius="0.16"

        scale="1 .72 1.15"

        color="#7b35e8">

      </a-sphere>



      <!-- =================================
           LEFT HORN
      ================================== -->

      <a-cone

        position="-0.16 1.79 0"

        radius-bottom="0.085"

        radius-top="0.012"

        height="0.34"

        color="#d5a4ff"

        rotation="0 0 -18">

      </a-cone>



      <!-- =================================
           RIGHT HORN
      ================================== -->

      <a-cone

        position="0.16 1.79 0"

        radius-bottom="0.085"

        radius-top="0.012"

        height="0.34"

        color="#d5a4ff"

        rotation="0 0 18">

      </a-cone>



      <!-- =================================
           LEFT EYE
      ================================== -->

      <a-sphere

        position="-0.105 1.54 0.275"

        radius="0.047"

        color="#f1c8ff"

        animation="
          property=scale;
          to=1.3 1.3 1.3;
          dir=alternate;
          dur=700;
          loop=true
        ">

      </a-sphere>



      <!-- =================================
           RIGHT EYE
      ================================== -->

      <a-sphere

        position="0.105 1.54 0.275"

        radius="0.047"

        color="#f1c8ff"

        animation="
          property=scale;
          to=1.3 1.3 1.3;
          dir=alternate;
          dur=700;
          loop=true
        ">

      </a-sphere>



      <!-- =================================
           MOUTH / FIRE
      ================================== -->

      <a-sphere

        position="0 1.40 0.42"

        radius="0.075"

        color="#ff43ff"

        opacity="0.95"

        material="shader:flat"

        animation="
          property:scale;
          to:1.35 1.35 1.35;
          dir:alternate;
          dur:450;
          loop:true
        ">

      </a-sphere>



      <!-- =================================
           LEFT WING
      ================================== -->

      <a-entity

        id="leftWing"

        position="-0.32 1.12 0"

        rotation="0 0 0">


        <!-- wing membrane -->

        <a-triangle

          vertex-a="0 0.38 0"

          vertex-b="-0.82 0.68 0"

          vertex-c="-0.68 -0.20 0"

          color="#7025d9"

          opacity="0.88"

          material="
            side:double;
            transparent:true
          ">

        </a-triangle>



        <!-- wing upper bone -->

        <a-cylinder

          position="-0.40 0.38 0.04"

          radius="0.035"

          height="0.78"

          color="#b75cff"

          rotation="0 0 -58">

        </a-cylinder>



        <!-- wing lower bone -->

        <a-cylinder

          position="-0.54 0.48 0.05"

          radius="0.025"

          height="0.48"

          color="#c56cff"

          rotation="0 0 -78">

        </a-cylinder>


      </a-entity>



      <!-- =================================
           RIGHT WING
      ================================== -->

      <a-entity

        id="rightWing"

        position="0.32 1.12 0"

        rotation="0 0 0">


        <!-- wing membrane -->

        <a-triangle

          vertex-a="0 0.38 0"

          vertex-b="0.82 0.68 0"

          vertex-c="0.68 -0.20 0"

          color="#7025d9"

          opacity="0.88"

          material="
            side:double;
            transparent:true
          ">

        </a-triangle>



        <!-- wing upper bone -->

        <a-cylinder

          position="0.40 0.38 0.04"

          radius="0.035"

          height="0.78"

          color="#b75cff"

          rotation="0 0 58">

        </a-cylinder>



        <!-- wing lower bone -->

        <a-cylinder

          position="0.54 0.48 0.05"

          radius="0.025"

          height="0.48"

          color="#c56cff"

          rotation="0 0 78">

        </a-cylinder>


      </a-entity>



      <!-- =================================
           LEFT ARM
      ================================== -->

      <a-cylinder

        position="-0.48 0.85 0"

        radius="0.065"

        height="0.48"

        color="#5220a8"

        rotation="0 0 -30">

      </a-cylinder>



      <!-- =================================
           RIGHT ARM
      ================================== -->

      <a-cylinder

        position="0.48 0.85 0"

        radius="0.065"

        height="0.48"

        color="#5220a8"

        rotation="0 0 30">

      </a-cylinder>



      <!-- =================================
           LEFT CLAW
      ================================== -->

      <a-cone

        position="-0.60 0.63 0.02"

        radius-bottom="0.07"

        radius-top="0"

        height="0.20"

        color="#b75cff"

        rotation="0 0 -25">

      </a-cone>



      <!-- =================================
           RIGHT CLAW
      ================================== -->

      <a-cone

        position="0.60 0.63 0.02"

        radius-bottom="0.07"

        radius-top="0"

        height="0.20"

        color="#b75cff"

        rotation="0 0 25">

      </a-cone>



      <!-- =================================
           TAIL
      ================================== -->

      <a-entity

        position="0 0.55 -0.28"

        rotation="-55 0 0">


        <a-cone

          radius-bottom="0.20"

          radius-top="0.055"

          height="0.75"

          color="#45128f">

        </a-cone>


        <a-cone

          position="0 0.40 0"

          radius-bottom="0.11"

          radius-top="0"

          height="0.35"

          color="#8e4cff">

        </a-cone>


      </a-entity>



      <!-- =================================
           PURPLE AURA
      ================================== -->

      <a-sphere

        position="0 0.85 -0.08"

        radius="0.95"

        color="#6f25ff"

        opacity="0.10"

        material="
          transparent:true;
          shader:flat
        "

        animation="
          property=scale;
          to=1.10 1.10 1.10;
          dir=alternate;
          dur=900;
          loop=true
        ">

      </a-sphere>



      <!-- =================================
           IDLE FLOAT
           Kaki tetap dekat anchor.
      ================================== -->

      <a-entity

        animation="
          property=position;
          from=0 0 0;
          to=0 0.045 0;
          dir=alternate;
          dur=1100;
          loop:true
        ">

      </a-entity>


    </a-entity>

  </a-entity>

</a-scene>



<script>

(function(){

  "use strict";


  /* ======================================
     ELEMENTS
  ====================================== */

  const scene =
    document.getElementById("scene");

  const target =
    document.getElementById("target");

  const beast =
    document.getElementById("beast");

  const status =
    document.getElementById("status");

  const info =
    document.getElementById("info");


  /* ======================================
     STATUS
  ====================================== */

  function setStatus(text, cls){

    status.textContent = text;

    status.className = cls || "";

  }


  /* ======================================
     INFO
  ====================================== */

  function setInfo(html){

    info.innerHTML = html;

  }


  /* ======================================
     A-FRAME LOADED
  ====================================== */

  scene.addEventListener(
    "loaded",
    function(){

      setStatus(
        "CAMERA / AR INITIALISING…"
      );

      setInfo(
        "Loading MindAR target <b>DR-001</b>…"
      );

    }
  );


  /* ======================================
     MINDAR READY
  ====================================== */

  scene.addEventListener(
    "arReady",
    function(){

      setStatus(
        "CAMERA ACTIVE ✓",
        "ok"
      );

      setInfo(
        "Point the rear camera at <b>DR-001 Ember Dragon</b>."
      );

    }
  );


  /* ======================================
     TARGET FOUND
  ====================================== */

  target.addEventListener(
    "targetFound",
    function(){

      beast.setAttribute(
        "visible",
        "true"
      );


      setStatus(
        "CARD CONFIRMED • DR-001",
        "ok"
      );


      setInfo(
        "🔥 <b>EMBER DRAGON DETECTED</b><br>" +
        "<span class='purple'>🟣 Step 2.4 — Standing AR monster active.</span>"
      );

    }
  );


  /* ======================================
     TARGET LOST
  ====================================== */

  target.addEventListener(
    "targetLost",
    function(){

      beast.setAttribute(
        "visible",
        "false"
      );


      setStatus(
        "CAMERA ACTIVE ✓",
        "ok"
      );


      setInfo(
        "Point the rear camera at <b>DR-001 Ember Dragon</b>."
      );

    }
  );


  /* ======================================
     AR ERROR
  ====================================== */

  scene.addEventListener(
    "arError",
    function(e){

      console.error(
        "MindAR error:",
        e
      );


      setStatus(
        "AR ERROR",
        "err"
      );


      setInfo(
        "MindAR gagal dimulakan. " +
        "Kamera mungkin masih tersedia, " +
        "tetapi AR tidak aktif."
      );

    }
  );


  /* ======================================
     CAMERA VIDEO SAFEGUARD
  ====================================== */

  function fixVideoLayer(){

    document
      .querySelectorAll("video")
      .forEach(function(video){

        video.setAttribute(
          "playsinline",
          ""
        );

        video.setAttribute(
          "autoplay",
          ""
        );

        video.muted = true;


        Object.assign(
          video.style,
          {

            position:"fixed",

            inset:"0",

            width:"100%",

            height:"100%",

            objectFit:"cover",

            zIndex:"0",

            display:"block",

            background:"#000"

          }
        );

      });

  }


  /* ======================================
     WATCH FOR MINDAR VIDEO
  ====================================== */

  const observer =
    new MutationObserver(
      fixVideoLayer
    );


  observer.observe(
    document.documentElement,
    {
      childList:true,
      subtree:true
    }
  );


  /* ======================================
     INITIAL VIDEO CHECK
  ====================================== */

  fixVideoLayer();


})();

</script>


</body>
</html>
