<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Card Beast AR — v65.6 Camera Layer Fix</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:relative;
}

/* =========================================
   HEADER
========================================= */

#header{
    position:fixed;
    top:12px;
    left:0;
    width:100%;
    z-index:20;
    text-align:center;
    pointer-events:none;
}

#title{
    font-size:clamp(28px,7vw,52px);
    font-weight:900;
    color:#fff;
    text-shadow:0 0 8px rgba(255,255,255,.5),0 4px 12px #000;
}

#title span{
    color:#b83cff;
}

#build{
    position:absolute;
    right:12px;
    top:0;
    padding:8px 12px;
    border:1px solid #42ff91;
    border-radius:16px;
    color:#55ff9b;
    background:rgba(0,0,0,.55);
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
}

/* =========================================
   STATUS
========================================= */

#mainStatus{
    position:fixed;
    top:76px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;

    min-width:250px;
    max-width:90%;

    padding:8px 16px;

    text-align:center;

    color:#58ff9c;

    border:1px solid #a93cff;
    border-radius:22px;

    background:rgba(0,0,0,.55);

    box-shadow:0 0 12px rgba(168,60,255,.35);

    font-weight:900;
    font-size:14px;

    pointer-events:none;
}

/* =========================================
   COMPACT DEBUG
========================================= */

#debug{
    position:fixed;
    top:128px;
    left:12px;
    z-index:20;

    padding:8px 11px;

    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;

    background:rgba(0,0,0,.38);

    backdrop-filter:blur(5px);

    color:#fff;

    font-size:11px;
    line-height:1.45;

    pointer-events:none;

    min-width:150px;
    max-width:calc(100vw - 24px);
}

.debug-head{
    color:#d05cff;
    font-weight:900;
    margin-bottom:3px;
}

.debug-line{
    display:flex;
    gap:10px;
    justify-content:space-between;
}

.on{
    color:#59ff9b;
    font-weight:900;
}

.off{
    color:#aaa;
}

.wait{
    color:#ffd84a;
}

.err{
    color:#ff6565;
    font-weight:900;
}

/* =========================================
   BOTTOM
========================================= */

#bottom{
    position:fixed;
    left:50%;
    bottom:14px;

    transform:translateX(-50%);

    z-index:20;

    width:min(560px,calc(100vw - 40px));

    padding:10px 14px;

    text-align:center;

    color:#fff;

    background:rgba(0,0,0,.48);

    border:1px solid #a93cff;
    border-radius:18px;

    backdrop-filter:blur(6px);

    font-size:13px;

    pointer-events:none;
}

/* =========================================
   A-FRAME / MINDAR
   IMPORTANT:
   Do NOT override MindAR video/canvas layers.
========================================= */

/* =========================================
   CAMERA / A-FRAME LAYER FIX v65.6
   Video = behind transparent AR canvas
========================================= */

a-scene{
    position:fixed !important;
    inset:0 !important;
    width:100vw !important;
    height:100vh !important;
    z-index:1 !important;
    background:transparent !important;
}

a-scene canvas,
canvas.a-canvas{
    position:fixed !important;
    inset:0 !important;
    width:100vw !important;
    height:100vh !important;
    z-index:2 !important;
    background:transparent !important;
    pointer-events:none !important;
}

body > video,
body video.mindar-video,
body video[class*="mindar"],
video[id*="mindar"]{
    position:fixed !important;
    inset:0 !important;
    width:100vw !important;
    height:100vh !important;
    min-width:100vw !important;
    min-height:100vh !important;
    max-width:none !important;
    max-height:none !important;
    object-fit:cover !important;
    object-position:center center !important;
    z-index:0 !important;
    display:block !important;
    visibility:visible !important;
    opacity:1 !important;
    pointer-events:none !important;
    background:#000 !important;
}

/* Any video MindAR creates dynamically gets fixed by JS too. */


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    #build{
        font-size:9px;
        padding:6px 8px;
        right:7px;
    }

    #debug{
        top:124px;
        font-size:10px;
        padding:7px 9px;
    }

    #bottom{
        font-size:12px;
        padding:8px 11px;
    }
}
</style>
</head>

<body>

<!-- =========================================
     HEADER
========================================= -->

<div id="header">

    <div id="title">
        CARD <span>BEAST</span> AR
    </div>

    <div id="build">
        v65.6 • CAMERA LAYER FIX • 5-BEAST
    </div>

</div>


<div id="mainStatus">
    CAMERA STARTING...
</div>


<!-- =========================================
     COMPACT DEBUG
========================================= -->

<div id="debug">

    <div class="debug-head">
        TRACKING DEBUG
    </div>

    <div class="debug-line">
        <span>CAMERA</span>
        <span id="cameraState" class="wait">STARTING</span>
    </div>

    <div class="debug-line">
        <span>DR-001</span>
        <span id="target0" class="wait">WAIT</span>
    </div>

    <div class="debug-line">
        <span>DR-002</span>
        <span id="target1" class="wait">WAIT</span>
    </div>

    <div class="debug-line">
        <span>DR-003</span>
        <span id="target2" class="wait">WAIT</span>
    </div>

    <div class="debug-line">
        <span>DR-004</span>
        <span id="target3" class="wait">WAIT</span>
    </div>

    <div class="debug-line">
        <span>DR-005</span>
        <span id="target4" class="wait">WAIT</span>
    </div>

</div>


<!-- =========================================
     BOTTOM MESSAGE
========================================= -->

<div id="bottom">
    📷 Point camera at any Card Beast target.
</div>


<!-- =========================================
     AR SCENE
========================================= -->

<a-scene
    id="scene"

    embedded

    mindar-image="
        imageTargetSrc:./targets.mind;
        maxTrack:5;
        filterMinCF:0.0001;
        filterBeta:0.01;
        warmupTolerance:5;
        missTolerance:5;
        uiScanning:false;
        uiLoading:false;
        uiError:false;
    "

    color-space="sRGB"

    renderer="
        colorManagement:true;
        physicallyCorrectLights:true;
        antialias:true;
        alpha:true;
    "

    vr-mode-ui="
        enabled:false
    "

    device-orientation-permission-ui="
        enabled:true
    "

    loading-screen="
        enabled:false
    "
>


<!-- =========================================
     ASSETS
========================================= -->

<a-assets
    id="assets"
    timeout="30000"
>

    <!-- DR-001 -->
    <a-asset-item
        id="dragonAsset"
        src="./models/ember-dragon.glb">
    </a-asset-item>

    <!-- DR-002 -->
    <a-asset-item
        id="tigerAsset"
        src="./models/abyss-tiger.glb">
    </a-asset-item>

    <!-- DR-003 -->
    <a-asset-item
        id="phoenixAsset"
        src="./models/Frost-phoenix.glb">
    </a-asset-item>

    <!-- DR-004 -->
    <a-asset-item
        id="mantisAsset"
        src="./models/puppet-mantis.glb">
    </a-asset-item>

    <!-- DR-005 -->
    <a-asset-item
        id="leviathanAsset"
        src="./models/tidal-leviathan.glb">
    </a-asset-item>

</a-assets>


<!-- =========================================
     CAMERA
========================================= -->

<a-camera
    position="0 0 0"
    look-controls="enabled:false">
</a-camera>


<!-- =========================================
     DR-001 EMBER DRAGON
     TARGET INDEX 0
========================================= -->

<a-entity
    id="beast0"
    mindar-image-target="targetIndex:0"
    visible="false"
>

    <a-entity
        id="dragonModel"
        gltf-model="#dragonAsset"
        position="0 -0.25 0"
        rotation="90 0 0"
        scale="2.5 2.5 2.5">
    </a-entity>

</a-entity>


<!-- =========================================
     DR-002 ABYSS TIGER
     TARGET INDEX 1
========================================= -->

<a-entity
    id="beast1"
    mindar-image-target="targetIndex:1"
    visible="false"
>

    <a-entity
        id="tigerModel"
        gltf-model="#tigerAsset"
        position="0 -0.25 0"
        rotation="90 0 0"
        scale="1.5 1.5 1.5">
    </a-entity>

</a-entity>


<!-- =========================================
     DR-003 FROST PHOENIX
     TARGET INDEX 2
========================================= -->

<a-entity
    id="beast2"
    mindar-image-target="targetIndex:2"
    visible="false"
>

    <a-entity
        id="phoenixModel"
        gltf-model="#phoenixAsset"
        position="0 -0.25 0"
        rotation="90 0 0"
        scale="1.6 1.6 1.6">
    </a-entity>

</a-entity>


<!-- =========================================
     DR-004 PUPPET MANTIS
     TARGET INDEX 3
========================================= -->

<a-entity
    id="beast3"
    mindar-image-target="targetIndex:3"
    visible="false"
>

    <a-entity
        id="mantisModel"
        gltf-model="#mantisAsset"
        position="0 -0.25 0"
        rotation="90 0 0"
        scale="1.3 1.3 1.3">
    </a-entity>

</a-entity>


<!-- =========================================
     DR-005 TIDAL LEVIATHAN
     TARGET INDEX 4
========================================= -->

<a-entity
    id="beast4"
    mindar-image-target="targetIndex:4"
    visible="false"
>

    <a-entity
        id="leviathanModel"
        gltf-model="#leviathanAsset"
        position="0 -0.25 0"
        rotation="90 0 0"
        scale="1.2 1.2 1.2">
    </a-entity>

</a-entity>


</a-scene>


<script>

/* =========================================================
   CARD BEAST AR v65.6

   5 TARGETS
   maxTrack: 5
   PRELOAD ONCE
   MULTI-TRACK
   INDEPENDENT targetLost

   Camera rendering intentionally left to
   MindAR + A-Frame.
========================================================= */


/* =========================================
   CAMERA VIDEO LAYER FIX
========================================= */

function applyCameraVideoLayer(video){

    if(!video || video.tagName !== "VIDEO") return;

    video.classList.add("mindar-video");

    video.style.position = "fixed";
    video.style.inset = "0";
    video.style.width = "100vw";
    video.style.height = "100vh";
    video.style.minWidth = "100vw";
    video.style.minHeight = "100vh";
    video.style.maxWidth = "none";
    video.style.maxHeight = "none";
    video.style.objectFit = "cover";
    video.style.objectPosition = "center center";
    video.style.zIndex = "0";
    video.style.display = "block";
    video.style.visibility = "visible";
    video.style.opacity = "1";
    video.style.pointerEvents = "none";
}

function applyCameraLayer(){

    /* MindAR may create the video after A-Frame starts. */
    document.querySelectorAll("video").forEach(
        applyCameraVideoLayer
    );

    const canvas =
        document.querySelector("a-scene canvas");

    if(canvas){

        canvas.style.position = "fixed";
        canvas.style.inset = "0";
        canvas.style.width = "100vw";
        canvas.style.height = "100vh";
        canvas.style.zIndex = "2";
        canvas.style.background = "transparent";
        canvas.style.pointerEvents = "none";
    }

    const sceneEl =
        document.getElementById("scene");

    if(sceneEl){

        sceneEl.style.position = "fixed";
        sceneEl.style.inset = "0";
        sceneEl.style.width = "100vw";
        sceneEl.style.height = "100vh";
        sceneEl.style.zIndex = "1";
        sceneEl.style.background = "transparent";
    }
}

/*
 * Watch for the MindAR video being inserted/replaced.
 * This does not reload the camera or touch AR targets.
 */
const cameraObserver =
    new MutationObserver(() => {

        document.querySelectorAll("video").forEach(
            applyCameraVideoLayer
        );

        const canvas =
            document.querySelector("a-scene canvas");

        if(canvas){

            canvas.style.background =
                "transparent";

            canvas.style.zIndex =
                "2";
        }
    });

cameraObserver.observe(
    document.documentElement,
    {
        childList:true,
        subtree:true
    }
);

window.addEventListener(
    "resize",
    applyCameraLayer
);

/* =========================================
   BEAST DATA
========================================= */

const beasts = [

    {
        id:"DR-001",
        name:"Ember Dragon",
        emoji:"🔥",
        target:0,
        model:"dragonModel",
        asset:"dragonAsset"
    },

    {
        id:"DR-002",
        name:"Abyss Tiger",
        emoji:"🐯",
        target:1,
        model:"tigerModel",
        asset:"tigerAsset"
    },

    {
        id:"DR-003",
        name:"Frost Phoenix",
        emoji:"❄️",
        target:2,
        model:"phoenixModel",
        asset:"phoenixAsset"
    },

    {
        id:"DR-004",
        name:"Puppet Mantis",
        emoji:"🦗",
        target:3,
        model:"mantisModel",
        asset:"mantisAsset"
    },

    {
        id:"DR-005",
        name:"Tidal Leviathan",
        emoji:"🌊",
        target:4,
        model:"leviathanModel",
        asset:"leviathanAsset"
    }

];


/* =========================================
   STATE
========================================= */

const state =
    beasts.map(() => ({

        found:false,

        loaded:false,

        loadCount:0

    }));


/* =========================================
   DOM
========================================= */

const scene =
    document.getElementById("scene");

const mainStatus =
    document.getElementById("mainStatus");

const bottom =
    document.getElementById("bottom");

const cameraState =
    document.getElementById("cameraState");


/* =========================================
   BADGE
========================================= */

function badge(index,text,cls){

    const el =
        document.getElementById(
            "target" + index
        );

    if(!el) return;

    el.textContent = text;

    el.className = cls;

}


/* =========================================
   UI UPDATE
========================================= */

function updateUI(){

    const active =
        beasts.filter(
            (b,index) =>
                state[index].found
        );


    if(active.length === 0){

        mainStatus.textContent =
            "CAMERA READY • SEARCHING";

        bottom.textContent =
            "📷 Point camera at any Card Beast target.";

        return;
    }


    if(active.length === 1){

        const beast =
            active[0];

        mainStatus.textContent =
            `${beast.id} FOUND • ${beast.name.toUpperCase()}`;

        bottom.innerHTML =
            `${beast.emoji} <b>${beast.name.toUpperCase()} ACTIVE</b> • ${beast.id}`;

        return;
    }


    mainStatus.textContent =
        `${active.length} CARDS ACTIVE • ` +
        active
            .map(b => b.id)
            .join(" + ");


    bottom.innerHTML =
        active
            .map(
                b =>
                    `${b.emoji} ${b.id}`
            )
            .join(" + ") +
        " ACTIVE";

}


/* =========================================
   TARGET SETUP
========================================= */

function setupTarget(index){

    const beast =
        beasts[index];

    const target =
        document.getElementById(
            "beast" + index
        );


    if(!target){

        console.error(
            beast.id +
            " target entity missing"
        );

        return;
    }


    /* =====================================
       FOUND
    ===================================== */

    target.addEventListener(
        "targetFound",
        () => {

            state[index].found =
                true;


            /*
             * Show ONLY this target.
             * No hideAllBeasts().
             */

            target.setAttribute(
                "visible",
                "true"
            );


            badge(
                index,
                "FOUND",
                "on"
            );


            updateUI();


            console.log(
                `[${beast.id}] targetFound`
            );

        }
    );


    /* =====================================
       LOST
    ===================================== */

    target.addEventListener(
        "targetLost",
        () => {

            state[index].found =
                false;


            /*
             * Hide ONLY this target.
             * Other targets remain active.
             */

            target.setAttribute(
                "visible",
                "false"
            );


            badge(
                index,
                "LOST",
                "wait"
            );


            updateUI();


            console.log(
                `[${beast.id}] targetLost`
            );

        }
    );

}


/* =========================================
   PRELOAD ONCE
========================================= */

function setupPreload(){

    beasts.forEach(
        (beast,index) => {

            const model =
                document.getElementById(
                    beast.model
                );


            if(!model){

                console.error(
                    beast.id +
                    " model entity missing"
                );

                return;
            }


            /*
             * model-loaded is registered once.
             * No GLB load is triggered by
             * targetFound.
             */

            model.addEventListener(
                "model-loaded",
                () => {

                    if(
                        !state[index].loaded
                    ){

                        state[index].loaded =
                            true;

                        state[index].loadCount =
                            1;

                        console.log(
                            `[${beast.id}] GLB loaded once`
                        );

                    }

                },
                {
                    once:true
                }
            );


            model.addEventListener(
                "model-error",
                event => {

                    console.error(
                        `[${beast.id}] GLB LOAD ERROR`,
                        event
                    );

                    badge(
                        index,
                        "GLB ERROR",
                        "err"
                    );

                }
            );

        }
    );

}


/* =========================================
   SCENE LOADED
========================================= */

scene.addEventListener(
    "loaded",
    () => {

        console.log(
            "CARD BEAST AR v65.6 SCENE LOADED"
        );


        /*
         * Register all five targets.
         */

        beasts.forEach(
            (_,index) => {

                setupTarget(index);

            }
        );


        /*
         * Register GLB load tracking.
         */

        setupPreload();

    }
);


/* =========================================
   AR READY
========================================= */

scene.addEventListener(
    "arReady",
    () => {

        /*
         * Camera is already initialized here.
         * Only fix the visual layer; do not restart AR.
         */
        applyCameraLayer();

        requestAnimationFrame(() => {
            applyCameraLayer();
        });

        setTimeout(
            applyCameraLayer,
            250
        );

        setTimeout(
            applyCameraLayer,
            1000
        );

        cameraState.textContent =
            "READY";

        cameraState.className =
            "on";


        mainStatus.textContent =
            "CAMERA READY • SEARCHING";


        bottom.textContent =
            "📷 Point camera at any Card Beast target.";


        console.log(
            "CARD BEAST AR CAMERA READY"
        );

    }
);


/* =========================================
   AR ERROR
========================================= */

scene.addEventListener(
    "arError",
    event => {

        cameraState.textContent =
            "ERROR";

        cameraState.className =
            "err";


        mainStatus.textContent =
            "CAMERA ERROR";


        bottom.textContent =
            "Camera could not start.";


        console.error(
            "CARD BEAST AR ERROR",
            event
        );

    }
);


/* =========================================
   INITIAL TARGET STATES
========================================= */

beasts.forEach(
    (_,index) => {

        badge(
            index,
            "WAIT",
            "wait"
        );

    }
);


window.addEventListener(
    "load",
    () => {
        setTimeout(
            applyCameraLayer,
            100
        );
    }
);

/* =========================================
   DEBUG
========================================= */

console.log(
    "======================================"
);

console.log(
    "CARD BEAST AR v65.6"
);

console.log(
    "CAMERA VIDEO LAYER FIX = ENABLED"
);

console.log(
    "5 TARGETS"
);

console.log(
    "TARGET 0 = DR-001 Ember Dragon"
);

console.log(
    "TARGET 1 = DR-002 Abyss Tiger"
);

console.log(
    "TARGET 2 = DR-003 Frost Phoenix"
);

console.log(
    "TARGET 3 = DR-004 Puppet Mantis"
);

console.log(
    "TARGET 4 = DR-005 Tidal Leviathan"
);

console.log(
    "maxTrack = 5"
);

console.log(
    "MULTI-TRACK = ENABLED"
);

console.log(
    "PRELOAD = ONCE"
);

console.log(
    "targetLost = INDEPENDENT"
);

console.log(
    "======================================"
);

</script>

</body>
</html>
