<!doctype html>
<html lang="ms">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Card Beast AR — Ember Dragon GLB</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* =========================================
   CAMERA
========================================= */

video{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;
}

/* =========================================
   A-FRAME
========================================= */

a-scene{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;
}

.a-canvas,
canvas{
  background:transparent!important;
}

/* =========================================
   TOP UI
========================================= */

#ui{
  position:fixed;

  z-index:20;

  top:18px;
  left:0;

  width:100%;

  text-align:center;

  pointer-events:none;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:#fff;

  text-shadow:
    0 2px 8px #000;
}

.logo span{
  color:#b75cff;
}

#status{

  display:inline-block;

  margin-top:12px;

  padding:10px 20px;

  border:1px solid #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.72);

  font-weight:800;
}

/* =========================================
   BOTTOM INFO
========================================= */

#info{

  position:fixed;

  z-index:20;

  left:5%;
  right:5%;

  bottom:20px;

  padding:14px 18px;

  border:1px solid #7d35b8;

  border-radius:24px;

  background:rgba(5,0,12,.78);

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;
}

.ok{
  color:#68ff9b!important;
}

.err{
  color:#ff6b6b!important;
}

.warn{
  color:#ffcc66!important;
}

</style>
</head>


<body>

<!-- =========================================
     UI
========================================= -->

<div id="ui">

  <div class="logo">
    CARD <span>BEAST</span> AR
  </div>

  <div id="status">
    INITIALISING CAMERA…
  </div>

</div>


<!-- =========================================
     INFO
========================================= -->

<div id="info">

  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.

</div>


<!-- =========================================
     A-FRAME + MINDAR
     
     TRACKING CONFIGURATION KEPT UNCHANGED
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="enabled:false"
>


  <!-- =======================================
       GLB ASSET
       
       NEW:
       models/ember-dragon.glb
  ======================================== -->

  <a-assets>

    <a-asset-item
      id="emberDragonModel"
      src="./models/ember-dragon.glb">
    </a-asset-item>

  </a-assets>


  <!-- =======================================
       CAMERA
       
       KEPT
  ======================================== -->

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>


  <!-- =======================================
       MINDAR TARGET
       
       KEPT UNCHANGED
  ======================================== -->

  <a-entity
    id="target"
    mindar-image-target="targetIndex:0">


    <!-- =====================================
         BEAST CONTAINER
         
         Tracking anchor remains here.
         Only model content is changed.
    ====================================== -->

    <a-entity
      id="beast"
      visible="false"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.5 0.5 0.5">


      <!-- ===================================
           EMBER DRAGON GLB
           
           IMPORTANT:
           Initial rotation is deliberately
           neutral so we can determine the
           model's native orientation first.
      ==================================== -->

      <a-gltf-model

        id="emberDragon"

        src="#emberDragonModel"

        position="0 0 0"

        rotation="0 0 0"

        scale="1 1 1">

      </a-gltf-model>


      <!-- ===================================
           PURPLE GLOW
           
           Decorative AR effect only.
           Does NOT affect tracking.
      ==================================== -->

      <a-sphere

        radius="0.75"

        color="#6f25ff"

        opacity="0.10"

        material="
          transparent:true;
          shader:flat
        "

        animation="
          property:scale;
          to:1.08 1.08 1.08;
          dir:alternate;
          dur:1000;
          loop:true
        ">

      </a-sphere>


    </a-entity>


  </a-entity>

</a-scene>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>

(function(){

  const scene =
    document.getElementById('scene');

  const target =
    document.getElementById('target');

  const beast =
    document.getElementById('beast');

  const status =
    document.getElementById('status');

  const info =
    document.getElementById('info');

  const dragon =
    document.getElementById('emberDragon');


  /* ========================================
     STATUS
  ======================================== */

  function setStatus(text, cls){

    status.textContent = text;

    status.className = cls || '';

  }


  /* ========================================
     INFO
  ======================================== */

  function setInfo(html){

    info.innerHTML = html;

  }


  /* ========================================
     A-FRAME LOADED
  ======================================== */

  scene.addEventListener('loaded', function(){

    setStatus(
      'CAMERA / AR INITIALISING…'
    );

    setInfo(
      'Loading MindAR target <b>DR-001</b>…'
    );

  });


  /* ========================================
     MINDAR READY
     
     KEPT
  ======================================== */

  scene.addEventListener('arReady', function(){

    setStatus(
      'CAMERA ACTIVE ✓',
      'ok'
    );

    setInfo(
      'Point the rear camera at ' +
      '<b>DR-001 Ember Dragon</b>.'
    );

  });


  /* ========================================
     TARGET FOUND
     
     KEPT
  ======================================== */

  target.addEventListener(
    'targetFound',
    function(){

      beast.setAttribute(
        'visible',
        'true'
      );

      setStatus(
        'CARD CONFIRMED • DR-001',
        'ok'
      );

      setInfo(
        '🔥 <b>EMBER DRAGON DETECTED</b>' +
        '<br>🟣 Ember Dragon GLB active.'
      );

    }
  );


  /* ========================================
     TARGET LOST
     
     KEPT
  ======================================== */

  target.addEventListener(
    'targetLost',
    function(){

      beast.setAttribute(
        'visible',
        'false'
      );

      setStatus(
        'CAMERA ACTIVE ✓',
        'ok'
      );

      setInfo(
        'Point the rear camera at ' +
        '<b>DR-001 Ember Dragon</b>.'
      );

    }
  );


  /* ========================================
     AR ERROR
  ======================================== */

  scene.addEventListener(
    'arError',
    function(e){

      console.error(
        'MindAR error',
        e
      );

      setStatus(
        'AR ERROR',
        'err'
      );

      setInfo(
        'MindAR gagal dimulakan. ' +
        'Kamera mungkin masih tersedia, ' +
        'tetapi AR tidak aktif.'
      );

    }
  );


  /* ========================================
     GLB LOADING
  ======================================== */

  if(dragon){

    dragon.addEventListener(
      'model-loaded',
      function(){

        console.log(
          'EMBER DRAGON GLB LOADED'
        );

        setInfo(
          '🟣 Ember Dragon model loaded. ' +
          'Point camera at <b>DR-001</b>.'
        );

      }
    );


    dragon.addEventListener(
      'model-error',
      function(e){

        console.error(
          'EMBER DRAGON GLB ERROR',
          e
        );

        setStatus(
          'GLB ERROR',
          'err'
        );

        setInfo(
          '❌ Tidak dapat memuat ' +
          '<b>models/ember-dragon.glb</b>. ' +
          'Semak nama fail dan folder.'
        );

      }
    );

  }


  /* ========================================
     CAMERA VIDEO SAFEGUARD
  ======================================== */

  function fixVideoLayer(){

    document
      .querySelectorAll('video')
      .forEach(function(v){

        v.setAttribute(
          'playsinline',
          ''
        );

        v.setAttribute(
          'autoplay',
          ''
        );

        v.muted = true;

        Object.assign(
          v.style,
          {

            position:'fixed',

            inset:'0',

            width:'100%',

            height:'100%',

            objectFit:'cover',

            zIndex:'0',

            display:'block',

            background:'#000'

          }
        );

      });

  }


  /* ========================================
     OBSERVE MINDAR VIDEO
  ======================================== */

  new MutationObserver(
    fixVideoLayer
  ).observe(
    document.documentElement,
    {
      childList:true,
      subtree:true
    }
  );


  fixVideoLayer();


})();

</script>

</body>
</html>
