<!doctype html>
<html lang="ms">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Card Beast AR — Step 2.6 GLB Diagnostic</title>

<!-- ==============================
     A-FRAME
================================== -->

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<!-- ==============================
     MINDAR
================================== -->

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

/* ==============================
   GENERAL
================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}


/* ==============================
   CAMERA VIDEO
================================== */

video{
  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;
}


/* ==============================
   AR SCENE
================================== */

a-scene{

  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;
}


canvas,
.a-canvas{

  background:transparent!important;

}


/* ==============================
   UI
================================== */

#ui{

  position:fixed;

  z-index:20;

  top:18px;

  left:0;

  width:100%;

  text-align:center;

  pointer-events:none;

}


.logo{

  font-size:28px;

  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px #000;

}


.logo span{

  color:#b75cff;

}


#status{

  display:inline-block;

  margin-top:12px;

  padding:10px 20px;

  border:1px solid #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.78);

  font-weight:800;

}


.ok{

  color:#68ff9b!important;

}


.warn{

  color:#ffcc66!important;

}


.err{

  color:#ff6b6b!important;

}


/* ==============================
   INFO
================================== */

#info{

  position:fixed;

  z-index:20;

  left:5%;

  right:5%;

  bottom:20px;

  padding:15px 18px;

  border:1px solid #7d35b8;

  border-radius:24px;

  background:rgba(5,0,12,.82);

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;

}


/* ==============================
   DEBUG PANEL
================================== */

#debug{

  position:fixed;

  z-index:21;

  top:120px;

  left:10px;

  right:10px;

  max-height:150px;

  overflow:hidden;

  padding:10px;

  border:1px solid rgba(183,92,255,.5);

  border-radius:12px;

  background:rgba(0,0,0,.55);

  color:#cfa7ff;

  font-size:12px;

  line-height:1.35;

  text-align:left;

  pointer-events:none;

  display:none;

}

</style>

</head>


<body>


<!-- ==============================
     UI
================================== -->

<div id="ui">

  <div class="logo">
    CARD <span>BEAST</span> AR
  </div>

  <div id="status">
    INITIALISING CAMERA…
  </div>

</div>


<!-- ==============================
     INFORMATION
================================== -->

<div id="info">

  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.

</div>


<!-- ==============================
     DEBUG
================================== -->

<div id="debug"></div>


<!-- ==============================
     A-FRAME / MINDAR
================================== -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  color-space="sRGB"

  loading-screen="enabled:false"

  mindar-image="
    imageTargetSrc:./targets.mind;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

>


  <!-- ==============================
       CAMERA
  ================================== -->

  <a-camera

    position="0 0 0"

    look-controls="enabled:false">

  </a-camera>


  <!-- ==============================
       TARGET
       
       IMPORTANT:
       JANGAN UBAH
  ================================== -->

  <a-entity

    id="target"

    mindar-image-target="targetIndex:0">


    <!-- ==============================
         BEAST CONTAINER
         
         TRACKING TIDAK BERUBAH
    ================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 0 0"

      rotation="0 0 0"

      scale="1 1 1">


      <!-- ==============================
           PURPLE GLOW
      ================================== -->

      <a-sphere

        radius="0.85"

        color="#7b2cff"

        opacity="0.18"

        material="
          transparent:true;
          shader:flat
        "

        animation="
          property:scale;
          to:1.15 1.15 1.15;
          dir:alternate;
          dur:900;
          loop:true
        ">

      </a-sphere>


      <!-- ==============================
           GLB MODEL
           
           STEP 2.6
      ================================== -->

      <a-entity

        id="dragonModel"

        gltf-model="./models/ember-dragon.glb"

        visible="true"

        position="0 0 0"

        rotation="0 0 0"

        scale="1 1 1">

      </a-entity>


    </a-entity>


  </a-entity>


</a-scene>



<script>

(function(){

  /* ==============================
     ELEMENTS
  ================================== */

  const scene =
    document.getElementById("scene");

  const target =
    document.getElementById("target");

  const beast =
    document.getElementById("beast");

  const dragon =
    document.getElementById("dragonModel");

  const status =
    document.getElementById("status");

  const info =
    document.getElementById("info");

  const debug =
    document.getElementById("debug");


  /* ==============================
     STATUS
  ================================== */

  function setStatus(text, cls){

    status.textContent = text;

    status.className = cls || "";

  }


  /* ==============================
     INFO
  ================================== */

  function setInfo(html){

    info.innerHTML = html;

  }


  /* ==============================
     DEBUG
  ================================== */

  function logDebug(text){

    console.log("[CARD BEAST]",text);

    debug.style.display = "block";

    debug.innerHTML +=
      text + "<br>";

  }


  /* ==============================
     SCENE LOADED
  ================================== */

  scene.addEventListener(
    "loaded",
    function(){

      setStatus(
        "CAMERA / AR INITIALISING…",
        "warn"
      );

      setInfo(
        "Loading MindAR target <b>DR-001</b>…"
      );

      logDebug(
        "A-Frame loaded."
      );

    }
  );


  /* ==============================
     AR READY
  ================================== */

  scene.addEventListener(
    "arReady",
    function(){

      setStatus(
        "CAMERA ACTIVE ✓",
        "ok"
      );

      setInfo(
        "Point the rear camera at " +
        "<b>DR-001 Ember Dragon</b>."
      );

      logDebug(
        "MindAR arReady."
      );

    }
  );


  /* ==============================
     GLB LOADED
  ================================== */

  dragon.addEventListener(
    "model-loaded",
    function(){

      setStatus(
        "GLB LOADED ✓",
        "ok"
      );

      setInfo(
        "<b>Ember Dragon GLB loaded.</b><br>" +
        "Sekarang point camera pada DR-001."
      );

      logDebug(
        "ember-dragon.glb loaded successfully."
      );

      /*
       * Model loaded.
       *
       * Untuk diagnostic pertama,
       * kita kekalkan:
       *
       * position = 0 0 0
       * rotation = 0 0 0
       * scale    = 1 1 1
       */

    }
  );


  /* ==============================
     GLB ERROR
  ================================== */

  dragon.addEventListener(
    "model-error",
    function(e){

      setStatus(
        "GLB ERROR",
        "err"
      );

      setInfo(
        "<b>GLB gagal dimuatkan.</b><br>" +
        "Semak path: models/ember-dragon.glb"
      );

      logDebug(
        "ERROR loading ember-dragon.glb."
      );

      console.error(
        "GLB ERROR:",
        e
      );

    }
  );


  /* ==============================
     TARGET FOUND
     
     IMPORTANT:
     TRACKING KEKAL
  ================================== */

  target.addEventListener(
    "targetFound",
    function(){

      beast.setAttribute(
        "visible",
        "true"
      );

      setStatus(
        "CARD CONFIRMED • DR-001",
        "ok"
      );

      setInfo(
        "🔥 <b>EMBER DRAGON DETECTED</b><br>" +
        "🟣 Ember Dragon GLB active."
      );

      logDebug(
        "DR-001 targetFound."
      );

    }
  );


  /* ==============================
     TARGET LOST
     
     IMPORTANT:
     TRACKING KEKAL
  ================================== */

  target.addEventListener(
    "targetLost",
    function(){

      beast.setAttribute(
        "visible",
        "false"
      );

      setStatus(
        "CAMERA ACTIVE ✓",
        "ok"
      );

      setInfo(
        "Point the rear camera at " +
        "<b>DR-001 Ember Dragon</b>."
      );

      logDebug(
        "DR-001 targetLost."
      );

    }
  );


  /* ==============================
     AR ERROR
  ================================== */

  scene.addEventListener(
    "arError",
    function(e){

      setStatus(
        "AR ERROR",
        "err"
      );

      setInfo(
        "MindAR gagal dimulakan."
      );

      logDebug(
        "MindAR error."
      );

      console.error(
        "MindAR error:",
        e
      );

    }
  );


  /* ==============================
     FORCE CAMERA VIDEO
  ================================== */

  function fixVideoLayer(){

    document
      .querySelectorAll("video")
      .forEach(function(v){

        v.setAttribute(
          "playsinline",
          ""
        );

        v.setAttribute(
          "autoplay",
          ""
        );

        v.muted = true;

        Object.assign(
          v.style,
          {

            position:"fixed",

            inset:"0",

            width:"100%",

            height:"100%",

            objectFit:"cover",

            zIndex:"0",

            display:"block",

            background:"#000"

          }
        );

      });

  }


  /* ==============================
     OBSERVE VIDEO
  ================================== */

  new MutationObserver(
    fixVideoLayer
  ).observe(
    document.documentElement,
    {
      childList:true,
      subtree:true
    }
  );


  fixVideoLayer();


})();

</script>

</body>
</html>
