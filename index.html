<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Beast AR — Step 2.1.3</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
body{position:fixed;inset:0}

/* Keep the real camera video visible behind the transparent AR canvas. */
video{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  z-index:0!important;
  display:block!important;
  background:#000!important;
}
a-scene{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  z-index:1!important;
  background:transparent!important;
}
.a-canvas,canvas{
  background:transparent!important;
}
#ui{
  position:fixed;
  z-index:20;
  top:18px;
  left:0;
  width:100%;
  text-align:center;
  pointer-events:none;
}
.logo{font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000}
.logo span{color:#b75cff}
#status{
  display:inline-block;
  margin-top:12px;
  padding:10px 20px;
  border:1px solid #b75cff;
  border-radius:30px;
  color:#68ff9b;
  background:rgba(5,0,12,.72);
  font-weight:800;
}
#info{
  position:fixed;
  z-index:20;
  left:5%;
  right:5%;
  bottom:20px;
  padding:14px 18px;
  border:1px solid #7d35b8;
  border-radius:24px;
  background:rgba(5,0,12,.78);
  color:#fff;
  text-align:center;
  font-size:17px;
  line-height:1.45;
  pointer-events:none;
}
.ok{color:#68ff9b}
.err{color:#ff6b6b}
</style>
</head>

<body>

<div id="ui">
  <div class="logo">CARD <span>BEAST</span> AR</div>
  <div id="status">INITIALISING CAMERA…</div>
</div>

<div id="info">
  Point the rear camera at <b>DR-001 Ember Dragon</b>.
</div>

<a-scene
  id="scene"
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true; colorManagement:true; physicallyCorrectLights:true"
  mindar-image="imageTargetSrc:./targets.mind; autoStart:true; uiScanning:false; uiLoading:false; uiError:false"
  color-space="sRGB"
  loading-screen="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex:0">

    <!-- Step 2.1.3 purple AR beast -->
    <a-entity id="beast" visible="false" position="0 0 0">

      <a-sphere
        radius="0.72"
        color="#6f25ff"
        opacity="0.16"
        material="transparent:true;shader:flat"
        animation="property:scale;to:1.12 1.12 1.12;dir:alternate;dur:900;loop:true">
      </a-sphere>

      <a-sphere
        position="0 0 0.02"
        radius="0.43"
        color="#24104d"
        opacity="0.88"
        material="transparent:true;shader:flat">
      </a-sphere>

      <a-cone
        position="0 0.34 0.02"
        radius-bottom="0.23"
        radius-top="0.02"
        height="0.42"
        color="#8e4cff"
        opacity="0.95">
      </a-cone>

      <a-cone
        position="-0.25 0.18 0.02"
        rotation="0 0 -38"
        radius-bottom="0.14"
        radius-top="0.02"
        height="0.32"
        color="#8e4cff">
      </a-cone>

      <a-cone
        position="0.25 0.18 0.02"
        rotation="0 0 38"
        radius-bottom="0.14"
        radius-top="0.02"
        height="0.32"
        color="#8e4cff">
      </a-cone>

      <a-sphere position="-0.16 0.10 0.39" radius="0.045" color="#f1c8ff"></a-sphere>
      <a-sphere position="0.16 0.10 0.39" radius="0.045" color="#f1c8ff"></a-sphere>

    </a-entity>
  </a-entity>
</a-scene>

<script>
(function(){
  const scene = document.getElementById('scene');
  const target = document.getElementById('target');
  const beast = document.getElementById('beast');
  const status = document.getElementById('status');
  const info = document.getElementById('info');

  function setStatus(text, cls){
    status.textContent = text;
    status.className = cls || '';
  }

  function setInfo(html){
    info.innerHTML = html;
  }

  scene.addEventListener('loaded', ()=>{
    setStatus('CAMERA / AR INITIALISING…');
    setInfo('Loading MindAR target <b>DR-001</b>…');
  });

  scene.addEventListener('arReady', ()=>{
    setStatus('CAMERA ACTIVE ✓','ok');
    setInfo('Point the rear camera at <b>DR-001 Ember Dragon</b>.');
  });

  target.addEventListener('targetFound', ()=>{
    beast.setAttribute('visible','true');
    setStatus('CARD CONFIRMED • DR-001','ok');
    setInfo('✓ <b>EMBER DRAGON DETECTED</b><br>🟣 Purple AR overlay active.');
  });

  target.addEventListener('targetLost', ()=>{
    beast.setAttribute('visible','false');
    setStatus('CAMERA ACTIVE ✓','ok');
    setInfo('Point the rear camera at <b>DR-001 Ember Dragon</b>.');
  });

  scene.addEventListener('arError', e=>{
    console.error('MindAR error',e);
    setStatus('AR ERROR','err');
    setInfo('MindAR gagal dimulakan. Kamera mungkin masih tersedia, tetapi AR tidak aktif.');
  });

  // Extra safeguard: if MindAR inserts the camera video, force it behind the AR canvas.
  function fixVideoLayer(){
    document.querySelectorAll('video').forEach(v=>{
      v.setAttribute('playsinline','');
      v.setAttribute('autoplay','');
      v.muted=true;
      Object.assign(v.style,{
        position:'fixed',
        inset:'0',
        width:'100%',
        height:'100%',
        objectFit:'cover',
        zIndex:'0',
        display:'block',
        background:'#000'
      });
    });
  }

  new MutationObserver(fixVideoLayer).observe(document.documentElement,{childList:true,subtree:true});
  fixVideoLayer();
})();
</script>

</body>
</html>
