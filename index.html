<!doctype html>
<html lang="ms">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Card Beast AR — Ember Dragon</title>


<!-- =========================================
     A-FRAME
========================================= -->

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


<!-- =========================================
     MINDAR
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

*{
  box-sizing:border-box;
}


html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  font-family:Arial,sans-serif;

}


body{

  position:fixed;

  inset:0;

}


/* =========================================
   CAMERA VIDEO
========================================= */

video{

  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;

}


/* =========================================
   A-FRAME SCENE
========================================= */

a-scene{

  position:fixed!important;

  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;

}


canvas,
.a-canvas{

  background:transparent!important;

}


/* =========================================
   TOP UI
========================================= */

#ui{

  position:fixed;

  z-index:20;

  top:18px;

  left:0;

  width:100%;

  text-align:center;

  pointer-events:none;

}


.logo{

  font-size:28px;

  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px #000;

}


.logo span{

  color:#b75cff;

}


#status{

  display:inline-block;

  margin-top:12px;

  padding:10px 20px;

  border:1px solid #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.78);

  font-weight:800;

}


.ok{

  color:#68ff9b!important;

}


.err{

  color:#ff6b6b!important;

}


.warn{

  color:#ffcc66!important;

}


/* =========================================
   BOTTOM INFO
========================================= */

#info{

  position:fixed;

  z-index:20;

  left:5%;

  right:5%;

  bottom:20px;

  padding:15px 18px;

  border:1px solid #7d35b8;

  border-radius:24px;

  background:rgba(5,0,12,.82);

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;

}


/* =========================================
   MODEL ERROR
========================================= */

#modelError{

  display:none;

  position:fixed;

  z-index:50;

  left:8%;

  right:8%;

  top:42%;

  padding:18px;

  border:1px solid #ff5555;

  border-radius:18px;

  background:rgba(20,0,0,.92);

  color:#ff7777;

  text-align:center;

  font-weight:bold;

}

</style>

</head>


<body>


<!-- =========================================
     TOP UI
========================================= -->

<div id="ui">

  <div class="logo">

    CARD <span>BEAST</span> AR

  </div>


  <div id="status">

    INITIALISING CAMERA…

  </div>

</div>



<!-- =========================================
     INFO
========================================= -->

<div id="info">

  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.

</div>



<!-- =========================================
     MODEL ERROR
========================================= -->

<div id="modelError">

  ❌ Ember Dragon GLB gagal dimuat.

  <br><br>

  Semak:

  <br>

  <b>models/ember-dragon.glb</b>

</div>



<!-- =========================================
     A-FRAME + MINDAR

     TRACKING KEKAL
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="enabled:false"

>


  <!-- =======================================
       GLB ASSET
  ======================================== -->

  <a-assets>

    <a-asset-item

      id="emberDragonAsset"

      src="./models/ember-dragon.glb">

    </a-asset-item>

  </a-assets>



  <!-- =======================================
       CAMERA
       
       KEKAL
  ======================================== -->

  <a-camera

    position="0 0 0"

    look-controls="enabled:false">

  </a-camera>



  <!-- =======================================
       MINDAR TARGET
       
       KEKAL
  ======================================== -->

  <a-entity

    id="target"

    mindar-image-target="targetIndex:0">




    <!-- =====================================
         BEAST
         
         TRACKING CONTAINER
         
         KEKAL
    ====================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 0 0"

    >



      <!-- ===================================
           DRAGON MODEL
           
           UPDATED:
           
           rotation = 180 180 0
           scale    = 2.5 2.5 2.5
      ==================================== -->

      <a-entity

        id="dragonModel"

        gltf-model="./models/ember-dragon.glb"

        visible="true"

        position="0 0 0"

        rotation="180 180 0"

        scale="2.5 2.5 2.5"

      >

      </a-entity>



      <!-- ===================================
           PURPLE GLOW
      ==================================== -->

      <a-sphere

        id="dragonGlow"

        position="0 0.55 0"

        radius="0.75"

        color="#7b2cff"

        opacity="0.10"

        material="
          transparent:true;
          shader:flat;
          side:double
        "

        animation="
          property:scale;
          from:0.92 0.92 0.92;
          to:1.08 1.08 1.08;
          dir:alternate;
          dur:900;
          loop:true
        "

      >

      </a-sphere>



    </a-entity>


  </a-entity>


</a-scene>



<script>

(function(){


  /* =========================================
     ELEMENTS
  ========================================= */

  const scene =
    document.getElementById(
      "scene"
    );


  const target =
    document.getElementById(
      "target"
    );


  const beast =
    document.getElementById(
      "beast"
    );


  const dragon =
    document.getElementById(
      "dragonModel"
    );


  const status =
    document.getElementById(
      "status"
    );


  const info =
    document.getElementById(
      "info"
    );


  const modelError =
    document.getElementById(
      "modelError"
    );



  /* =========================================
     STATUS
  ========================================= */

  function setStatus(
    text,
    cls
  ){

    status.textContent =
      text;

    status.className =
      cls || "";

  }



  /* =========================================
     INFO
  ========================================= */

  function setInfo(
    html
  ){

    info.innerHTML =
      html;

  }



  /* =========================================
     A-FRAME LOADED
  ========================================= */

  scene.addEventListener(
    "loaded",
    function(){

      setStatus(
        "CAMERA / AR INITIALISING…",
        "warn"
      );


      setInfo(
        "Loading MindAR target " +
        "<b>DR-001</b>…"
      );

    }
  );



  /* =========================================
     MINDAR READY
     
     KEKAL
  ========================================= */

  scene.addEventListener(
    "arReady",
    function(){

      setStatus(
        "CAMERA ACTIVE ✓",
        "ok"
      );


      setInfo(
        "Point the rear camera at " +
        "<b>DR-001 Ember Dragon</b>."
      );

    }
  );



  /* =========================================
     GLB LOADED
  ========================================= */

  dragon.addEventListener(
    "model-loaded",
    function(){

      console.log(
        "EMBER DRAGON GLB LOADED ✓"
      );


      modelError.style.display =
        "none";


      setInfo(
        "🟣 <b>Ember Dragon GLB loaded.</b>" +
        "<br>Point camera at <b>DR-001</b>."
      );

    }
  );



  /* =========================================
     GLB ERROR
  ========================================= */

  dragon.addEventListener(
    "model-error",
    function(event){

      console.error(
        "EMBER DRAGON GLB ERROR:",
        event
      );


      modelError.style.display =
        "block";


      setStatus(
        "GLB ERROR",
        "err"
      );


      setInfo(
        "❌ Gagal memuat " +
        "<b>ember-dragon.glb</b>."
      );

    }
  );



  /* =========================================
     TARGET FOUND
     
     KEKAL
  ========================================= */

  target.addEventListener(
    "targetFound",
    function(){

      beast.setAttribute(
        "visible",
        "true"
      );


      setStatus(
        "CARD CONFIRMED • DR-001",
        "ok"
      );


      setInfo(
        "🔥 <b>EMBER DRAGON DETECTED</b>" +
        "<br>🟣 3D Ember Dragon active."
      );


      console.log(
        "DR-001 TARGET FOUND"
      );

    }
  );



  /* =========================================
     TARGET LOST
     
     KEKAL
  ========================================= */

  target.addEventListener(
    "targetLost",
    function(){

      beast.setAttribute(
        "visible",
        "false"
      );


      setStatus(
        "CAMERA ACTIVE ✓",
        "ok"
      );


      setInfo(
        "Point the rear camera at " +
        "<b>DR-001 Ember Dragon</b>."
      );


      console.log(
        "DR-001 TARGET LOST"
      );

    }
  );



  /* =========================================
     MINDAR ERROR
  ========================================= */

  scene.addEventListener(
    "arError",
    function(event){

      console.error(
        "MindAR error:",
        event
      );


      setStatus(
        "AR ERROR",
        "err"
      );


      setInfo(
        "MindAR gagal dimulakan. " +
        "Kamera mungkin masih tersedia."
      );

    }
  );



  /* =========================================
     CAMERA VIDEO SAFEGUARD
  ========================================= */

  function fixVideoLayer(){

    document
      .querySelectorAll("video")
      .forEach(
        function(video){

          video.setAttribute(
            "playsinline",
            ""
          );


          video.setAttribute(
            "autoplay",
            ""
          );


          video.muted =
            true;


          Object.assign(
            video.style,
            {

              position:"fixed",

              inset:"0",

              width:"100%",

              height:"100%",

              objectFit:"cover",

              zIndex:"0",

              display:"block",

              background:"#000"

            }
          );

        }
      );

  }



  /* =========================================
     WATCH CAMERA VIDEO
  ========================================= */

  new MutationObserver(
    fixVideoLayer
  ).observe(
    document.documentElement,
    {
      childList:true,
      subtree:true
    }
  );


  fixVideoLayer();


})();

</script>


</body>

</html>
