<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Card Beast AR — v66.0 Camera Stable</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:relative;
}


/* =========================================
   HEADER
========================================= */

#header{
    position:fixed;
    top:12px;
    left:0;
    width:100%;
    z-index:1000;

    text-align:center;

    pointer-events:none;
}

#title{
    font-size:clamp(28px,7vw,52px);
    font-weight:900;

    color:#fff;

    text-shadow:
        0 0 8px rgba(255,255,255,.5),
        0 4px 12px #000;
}

#title span{
    color:#b83cff;
}

#build{
    position:absolute;

    right:12px;
    top:0;

    padding:8px 12px;

    border:1px solid #42ff91;
    border-radius:16px;

    color:#55ff9b;

    background:rgba(0,0,0,.55);

    font-size:11px;
    font-weight:800;

    white-space:nowrap;
}


/* =========================================
   STATUS
========================================= */

#mainStatus{
    position:fixed;

    top:76px;
    left:50%;

    transform:translateX(-50%);

    z-index:1000;

    min-width:250px;
    max-width:90%;

    padding:8px 16px;

    text-align:center;

    color:#58ff9c;

    border:1px solid #a93cff;
    border-radius:22px;

    background:rgba(0,0,0,.55);

    box-shadow:
        0 0 12px rgba(168,60,255,.35);

    font-weight:900;
    font-size:14px;
}


/* =========================================
   DEBUG
========================================= */

#debug{
    position:fixed;

    top:128px;
    left:12px;

    z-index:1000;

    padding:8px 11px;

    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;

    background:rgba(0,0,0,.38);

    backdrop-filter:blur(5px);

    color:#fff;

    font-size:11px;
    line-height:1.45;

    pointer-events:none;

    min-width:150px;
}

.debug-head{
    color:#d05cff;

    font-weight:900;

    margin-bottom:3px;
}

.debug-line{
    display:flex;

    gap:6px;

    justify-content:space-between;
}

.on{
    color:#59ff9b;
    font-weight:900;
}

.wait{
    color:#ffd84a;
}

.err{
    color:#ff6565;
    font-weight:900;
}


/* =========================================
   BOTTOM
========================================= */

#bottom{
    position:fixed;

    left:50%;
    bottom:14px;

    transform:translateX(-50%);

    z-index:1000;

    width:min(560px,calc(100vw - 40px));

    padding:10px 14px;

    text-align:center;

    color:#fff;

    background:rgba(0,0,0,.48);

    border:1px solid #a93cff;

    border-radius:18px;

    backdrop-filter:blur(6px);

    font-size:13px;

    pointer-events:none;
}


/* =========================================
   CAMERA VIDEO
========================================= */

/*
   IMPORTANT:
   Video = layer paling bawah
*/

video.mindar-video,
video#mindar-video{

    position:fixed !important;

    top:0 !important;
    left:0 !important;

    width:100vw !important;
    height:100vh !important;

    min-width:100vw !important;
    min-height:100vh !important;

    object-fit:cover !important;

    display:block !important;

    opacity:1 !important;

    visibility:visible !important;

    z-index:1 !important;

    background:#000 !important;

    pointer-events:none !important;
}


/* =========================================
   A-FRAME SCENE
========================================= */

a-scene{

    position:fixed !important;

    top:0 !important;
    left:0 !important;

    width:100vw !important;
    height:100vh !important;

    z-index:2 !important;

    background:transparent !important;

    pointer-events:none !important;
}


/* =========================================
   CANVAS
========================================= */

a-scene canvas{

    position:fixed !important;

    top:0 !important;
    left:0 !important;

    width:100vw !important;
    height:100vh !important;

    z-index:2 !important;

    background:transparent !important;

    opacity:1 !important;

    pointer-events:none !important;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    #build{
        font-size:9px;
        padding:6px 8px;
        right:7px;
    }

    #debug{
        top:124px;
        font-size:10px;
        padding:7px 9px;
    }

    #bottom{
        font-size:12px;
        padding:8px 11px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<div id="header">

    <div id="title">
        CARD <span>BEAST</span> AR
    </div>

    <div id="build">
        v66.0 • CAMERA STABLE • 5-BEAST
    </div>

</div>


<!-- =========================================
     STATUS
========================================= -->

<div id="mainStatus">
    CAMERA STARTING • SEARCHING
</div>


<!-- =========================================
     DEBUG
========================================= -->

<div id="debug">

    <div class="debug-head">
        TRACKING DEBUG
    </div>

    <div class="debug-line">
        <span>CAMERA</span>
        <span id="cameraState" class="wait">
            STARTING
        </span>
    </div>

    <div class="debug-line">
        <span>DR-001</span>
        <span id="target0" class="wait">
            WAIT
        </span>
    </div>

    <div class="debug-line">
        <span>DR-002</span>
        <span id="target1" class="wait">
            WAIT
        </span>
    </div>

    <div class="debug-line">
        <span>DR-003</span>
        <span id="target2" class="wait">
            WAIT
        </span>
    </div>

    <div class="debug-line">
        <span>DR-004</span>
        <span id="target3" class="wait">
            WAIT
        </span>
    </div>

    <div class="debug-line">
        <span>DR-005</span>
        <span id="target4" class="wait">
            WAIT
        </span>
    </div>

</div>


<!-- =========================================
     BOTTOM
========================================= -->

<div id="bottom">
    📷 Point camera at any Card Beast target.
</div>


<!-- =========================================
     AR SCENE
========================================= -->

<a-scene
    id="scene"

    mindar-image="
        imageTargetSrc:./targets.mind;
        maxTrack:5;
        filterMinCF:0.0001;
        filterBeta:0.01;
        warmupTolerance:5;
        missTolerance:5;
    "

    color-space="sRGB"

    renderer="
        colorManagement:true;
        physicallyCorrectLights:true;
        antialias:true;
        alpha:true;
    "

    vr-mode-ui="
        enabled:false
    "

    device-orientation-permission-ui="
        enabled:true
    "
>


<!-- =========================================
     ASSETS
========================================= -->

<a-assets
    id="assets"
    timeout="30000"
>

    <a-asset-item
        id="dragonAsset"
        src="./models/ember-dragon.glb">
    </a-asset-item>

    <a-asset-item
        id="tigerAsset"
        src="./models/abyss-tiger.glb">
    </a-asset-item>

    <a-asset-item
        id="phoenixAsset"
        src="./models/Frost-phoenix.glb">
    </a-asset-item>

    <a-asset-item
        id="mantisAsset"
        src="./models/puppet-mantis.glb">
    </a-asset-item>

    <a-asset-item
        id="leviathanAsset"
        src="./models/tidal-leviathan.glb">
    </a-asset-item>

</a-assets>


<!-- =========================================
     CAMERA
========================================= -->

<a-camera
    position="0 0 0"
    look-controls="enabled:false">
</a-camera>


<!-- =========================================
     DR-001
     EMBER DRAGON
     SCALE 2.5
========================================= -->

<a-entity
    id="beast0"

    mindar-image-target="targetIndex:0"

    visible="false"
>

    <a-entity
        id="dragonModel"

        gltf-model="#dragonAsset"

        position="0 -0.25 0"

        rotation="90 0 0"

        scale="2.5 2.5 2.5"
    >
    </a-entity>

</a-entity>


<!-- =========================================
     DR-002
     ABYSS TIGER
     SCALE 2.1
========================================= -->

<a-entity
    id="beast1"

    mindar-image-target="targetIndex:1"

    visible="false"
>

    <a-entity
        id="tigerModel"

        gltf-model="#tigerAsset"

        position="0 -0.25 0"

        rotation="90 0 0"

        scale="2.1 2.1 2.1"
    >
    </a-entity>

</a-entity>


<!-- =========================================
     DR-003
     FROST PHOENIX
     SCALE 1.75
========================================= -->

<a-entity
    id="beast2"

    mindar-image-target="targetIndex:2"

    visible="false"
>

    <a-entity
        id="phoenixModel"

        gltf-model="#phoenixAsset"

        position="0 -0.25 0"

        rotation="90 0 0"

        scale="1.75 1.75 1.75"
    >
    </a-entity>

</a-entity>


<!-- =========================================
     DR-004
     PUPPET MANTIS
     SCALE 1.55
========================================= -->

<a-entity
    id="beast3"

    mindar-image-target="targetIndex:3"

    visible="false"
>

    <a-entity
        id="mantisModel"

        gltf-model="#mantisAsset"

        position="0 -0.25 0"

        rotation="90 0 0"

        scale="1.55 1.55 1.55"
    >
    </a-entity>

</a-entity>


<!-- =========================================
     DR-005
     TIDAL LEVIATHAN
     SCALE 1.45
========================================= -->

<a-entity
    id="beast4"

    mindar-image-target="targetIndex:4"

    visible="false"
>

    <a-entity
        id="leviathanModel"

        gltf-model="#leviathanAsset"

        position="0 -0.25 0"

        rotation="90 0 0"

        scale="1.45 1.45 1.45"
    >
    </a-entity>

</a-entity>


</a-scene>


<script>

/* =========================================================
   CARD BEAST AR v66.0
   CAMERA LAYER STABLE

   TARGETS:
   0 = DR-001
   1 = DR-002
   2 = DR-003
   3 = DR-004
   4 = DR-005

   MAX TRACK = 5
   PRELOAD ONCE
   MULTI TRACK
   INDEPENDENT TARGET LOST

   SCALE:
   DR-001 = 2.5
   DR-002 = 2.1
   DR-003 = 1.75
   DR-004 = 1.55
   DR-005 = 1.45
========================================================= */


/* =========================================
   DATA
========================================= */

const beasts = [

    {
        id:"DR-001",
        name:"Ember Dragon",
        emoji:"🔥",
        target:0,
        model:"dragonModel",
        asset:"dragonAsset"
    },

    {
        id:"DR-002",
        name:"Abyss Tiger",
        emoji:"🐯",
        target:1,
        model:"tigerModel",
        asset:"tigerAsset"
    },

    {
        id:"DR-003",
        name:"Frost Phoenix",
        emoji:"❄️",
        target:2,
        model:"phoenixModel",
        asset:"phoenixAsset"
    },

    {
        id:"DR-004",
        name:"Puppet Mantis",
        emoji:"🦗",
        target:3,
        model:"mantisModel",
        asset:"mantisAsset"
    },

    {
        id:"DR-005",
        name:"Tidal Leviathan",
        emoji:"🌊",
        target:4,
        model:"leviathanModel",
        asset:"leviathanAsset"
    }

];


/* =========================================
   STATE
========================================= */

const state =
    beasts.map(() => ({

        found:false,

        loaded:false

    }));


/* =========================================
   DOM
========================================= */

const scene =
    document.getElementById(
        "scene"
    );

const mainStatus =
    document.getElementById(
        "mainStatus"
    );

const bottom =
    document.getElementById(
        "bottom"
    );

const cameraState =
    document.getElementById(
        "cameraState"
    );


/* =========================================
   FORCE TRANSPARENT RENDERER
========================================= */

function forceTransparentRenderer(){

    try{

        if(
            scene &&
            scene.renderer
        ){

            const renderer =
                scene.renderer;


            /*
             * IMPORTANT:
             * A-Frame canvas must NOT
             * clear with opaque black.
             */

            if(
                renderer.setClearColor
            ){

                renderer.setClearColor(
                    0x000000,
                    0
                );

            }


            if(
                renderer.setClearAlpha
            ){

                renderer.setClearAlpha(
                    0
                );

            }


            if(
                renderer.domElement
            ){

                renderer.domElement.style.background =
                    "transparent";

                renderer.domElement.style.backgroundColor =
                    "transparent";

                renderer.domElement.style.opacity =
                    "1";
            }

        }

    }catch(error){

        console.warn(
            "Renderer transparency patch:",
            error
        );

    }

}


/* =========================================
   CAMERA VIDEO LAYER
========================================= */

function fixCameraLayer(){

    /*
     * Find EVERY video.
     */

    const videos =
        document.querySelectorAll(
            "video"
        );


    videos.forEach(
        video => {

            /*
             * MindAR normally creates
             * .mindar-video.
             */

            const isMindARVideo =
                video.classList.contains(
                    "mindar-video"
                ) ||
                video.id ===
                    "mindar-video";


            if(!isMindARVideo){

                return;

            }


            video.classList.add(
                "mindar-video"
            );


            video.style.position =
                "fixed";

            video.style.top =
                "0";

            video.style.left =
                "0";

            video.style.width =
                "100vw";

            video.style.height =
                "100vh";

            video.style.minWidth =
                "100vw";

            video.style.minHeight =
                "100vh";

            video.style.objectFit =
                "cover";

            video.style.display =
                "block";

            video.style.visibility =
                "visible";

            video.style.opacity =
                "1";

            video.style.zIndex =
                "1";

            video.style.pointerEvents =
                "none";


            /*
             * Make sure camera video
             * is actually playing.
             */

            if(
                video.paused &&
                video.srcObject
            ){

                video.play()
                    .catch(
                        () => {}
                    );

            }

        }
    );


    /*
     * Fix A-Frame canvas.
     */

    const canvas =
        document.querySelector(
            "a-scene canvas"
        );


    if(canvas){

        canvas.style.position =
            "fixed";

        canvas.style.top =
            "0";

        canvas.style.left =
            "0";

        canvas.style.width =
            "100vw";

        canvas.style.height =
            "100vh";

        canvas.style.zIndex =
            "2";

        canvas.style.background =
            "transparent";

        canvas.style.backgroundColor =
            "transparent";

        canvas.style.pointerEvents =
            "none";

    }


    /*
     * Re-apply transparent renderer.
     */

    forceTransparentRenderer();

}


/* =========================================
   VIDEO WATCHER
========================================= */

function startVideoWatcher(){

    /*
     * MindAR may create the video
     * after page load.
     *
     * Therefore keep checking.
     */

    let count = 0;


    const timer =
        setInterval(
            () => {

                fixCameraLayer();

                count++;


                /*
                 * 30 checks is enough
                 * for startup.
                 */

                if(count >= 30){

                    clearInterval(
                        timer
                    );

                }

            },
            250
        );

}


/* =========================================
   BADGE
========================================= */

function badge(
    index,
    text,
    className
){

    const element =
        document.getElementById(
            "target" + index
        );


    if(!element){

        return;

    }


    element.textContent =
        text;

    element.className =
        className;

}


/* =========================================
   UPDATE UI
========================================= */

function updateUI(){

    const active =
        beasts.filter(
            (beast,index) =>
                state[index].found
        );


    /*
     * NOTHING FOUND
     */

    if(
        active.length === 0
    ){

        mainStatus.textContent =
            "CAMERA READY • SEARCHING";


        bottom.textContent =
            "📷 Point camera at any Card Beast target.";


        return;

    }


    /*
     * ONE TARGET
     */

    if(
        active.length === 1
    ){

        const beast =
            active[0];


        mainStatus.textContent =
            `${beast.id} FOUND • ${beast.name.toUpperCase()}`;


        bottom.innerHTML =
            `${beast.emoji} <b>${beast.name.toUpperCase()} ACTIVE</b> • ${beast.id}`;


        return;

    }


    /*
     * MULTI TRACK
     */

    mainStatus.textContent =
        `${active.length} CARDS ACTIVE • ` +
        active
            .map(
                beast =>
                    beast.id
            )
            .join(" + ");


    bottom.innerHTML =
        active
            .map(
                beast =>
                    beast.emoji +
                    " " +
                    beast.id
            )
            .join(" + ") +
        " ACTIVE";

}


/* =========================================
   TARGET SETUP
========================================= */

function setupTarget(index){

    const beast =
        beasts[index];


    const target =
        document.getElementById(
            "beast" + index
        );


    if(!target){

        return;

    }


    /*
     * TARGET FOUND
     */

    target.addEventListener(
        "targetFound",
        () => {

            state[index].found =
                true;


            /*
             * ONLY THIS BEAST
             * becomes visible.
             */

            target.setAttribute(
                "visible",
                "true"
            );


            badge(
                index,
                "FOUND",
                "on"
            );


            updateUI();


            console.log(
                beast.id +
                " targetFound"
            );

        }
    );


    /*
     * TARGET LOST
     */

    target.addEventListener(
        "targetLost",
        () => {

            state[index].found =
                false;


            /*
             * ONLY THIS BEAST
             * is hidden.
             */

            target.setAttribute(
                "visible",
                "false"
            );


            badge(
                index,
                "LOST",
                "wait"
            );


            updateUI();


            console.log(
                beast.id +
                " targetLost"
            );

        }
    );

}


/* =========================================
   PRELOAD ONCE
========================================= */

function setupPreload(){

    beasts.forEach(
        (beast,index) => {

            const model =
                document.getElementById(
                    beast.model
                );


            if(!model){

                return;

            }


            model.addEventListener(
                "model-loaded",
                () => {

                    if(
                        !state[index].loaded
                    ){

                        state[index].loaded =
                            true;


                        console.log(
                            beast.id +
                            " GLB PRELOADED ONCE"
                        );

                    }

                },
                {
                    once:true
                }
            );


            model.addEventListener(
                "model-error",
                event => {

                    badge(
                        index,
                        "GLB ERROR",
                        "err"
                    );


                    console.error(
                        beast.id +
                        " GLB LOAD ERROR",
                        event
                    );

                }
            );

        }
    );

}


/* =========================================
   SCENE LOADED
========================================= */

scene.addEventListener(
    "loaded",
    () => {

        console.log(
            "A-FRAME SCENE LOADED"
        );


        /*
         * Fix renderer immediately.
         */

        forceTransparentRenderer();

        fixCameraLayer();


        /*
         * Setup targets.
         */

        beasts.forEach(
            (_,index) => {

                setupTarget(
                    index
                );

            }
        );


        /*
         * Setup GLB preload.
         */

        setupPreload();


        /*
         * Start repeated
         * camera layer protection.
         */

        startVideoWatcher();

    }
);


/* =========================================
   RENDERER INITIALIZED
========================================= */

scene.addEventListener(
    "renderstart",
    () => {

        console.log(
            "A-FRAME RENDER START"
        );


        forceTransparentRenderer();

        fixCameraLayer();

    }
);


/* =========================================
   AR READY
========================================= */

scene.addEventListener(
    "arReady",
    () => {

        console.log(
            "AR CAMERA READY"
        );


        cameraState.textContent =
            "READY";

        cameraState.className =
            "on";


        mainStatus.textContent =
            "CAMERA READY • SEARCHING";


        bottom.textContent =
            "📷 Point camera at any Card Beast target.";


        /*
         * Camera layer fix.
         */

        fixCameraLayer();


        setTimeout(
            fixCameraLayer,
            100
        );

        setTimeout(
            fixCameraLayer,
            300
        );

        setTimeout(
            fixCameraLayer,
            700
        );

        setTimeout(
            fixCameraLayer,
            1500
        );

        setTimeout(
            fixCameraLayer,
            3000
        );

    }
);


/* =========================================
   AR ERROR
========================================= */

scene.addEventListener(
    "arError",
    event => {

        console.error(
            "AR ERROR",
            event
        );


        cameraState.textContent =
            "ERROR";

        cameraState.className =
            "err";


        mainStatus.textContent =
            "CAMERA ERROR";


        bottom.textContent =
            "Camera could not start.";

    }
);


/* =========================================
   WINDOW LOAD
========================================= */

window.addEventListener(
    "load",
    () => {

        /*
         * Initial attempts.
         */

        fixCameraLayer();


        setTimeout(
            fixCameraLayer,
            250
        );


        setTimeout(
            fixCameraLayer,
            500
        );


        setTimeout(
            fixCameraLayer,
            1000
        );


        setTimeout(
            fixCameraLayer,
            2000
        );


        /*
         * Continue watcher.
         */

        startVideoWatcher();

    }
);


/* =========================================
   INITIAL BADGES
========================================= */

beasts.forEach(
    (_,index) => {

        badge(
            index,
            "WAIT",
            "wait"
        );

    }
);


/* =========================================
   EXTRA VIDEO OBSERVER
========================================= */

/*
 * If MindAR inserts a video after
 * startup, detect it automatically.
 */

const observer =
    new MutationObserver(
        mutations => {

            let foundVideo =
                false;


            mutations.forEach(
                mutation => {

                    mutation.addedNodes.forEach(
                        node => {

                            if(
                                node.nodeType !== 1
                            ){

                                return;

                            }


                            if(
                                node.tagName ===
                                "VIDEO"
                            ){

                                foundVideo =
                                    true;

                            }


                            if(
                                node.querySelector
                            ){

                                const video =
                                    node.querySelector(
                                        "video"
                                    );


                                if(video){

                                    foundVideo =
                                        true;

                                }

                            }

                        }
                    );

                }
            );


            if(foundVideo){

                console.log(
                    "MindAR video detected"
                );


                fixCameraLayer();

                setTimeout(
                    fixCameraLayer,
                    100
                );

                setTimeout(
                    fixCameraLayer,
                    500
                );

            }

        }
    );


observer.observe(
    document.body,
    {
        childList:true,
        subtree:true
    }
);
