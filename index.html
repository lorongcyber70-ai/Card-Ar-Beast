<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Card Beast AR — v66.0 Camera Fix</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent !important;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {

    position: relative;

    background:
        transparent !important;
}


/* =========================================================
   CAMERA VIDEO
   VIDEO MUST BE BEHIND A-FRAME
========================================================= */

video.mindar-video,
video#mindar-video {

    position: fixed !important;

    top: 0 !important;
    left: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    min-width: 100vw !important;
    min-height: 100vh !important;

    max-width: none !important;
    max-height: none !important;

    object-fit: cover !important;

    display: block !important;

    visibility: visible !important;

    opacity: 1 !important;

    z-index: 0 !important;

    background: transparent !important;

    pointer-events: none !important;
}


/* =========================================================
   A-FRAME
========================================================= */

a-scene {

    position: fixed !important;

    top: 0 !important;
    left: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    min-width: 100vw !important;
    min-height: 100vh !important;

    margin: 0 !important;
    padding: 0 !important;

    z-index: 1 !important;

    background:
        transparent !important;

    background-color:
        transparent !important;

    pointer-events: none !important;
}


/* =========================================================
   A-FRAME CANVAS
========================================================= */

a-scene canvas,
.a-canvas {

    position: fixed !important;

    top: 0 !important;
    left: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    min-width: 100vw !important;
    min-height: 100vh !important;

    margin: 0 !important;
    padding: 0 !important;

    z-index: 1 !important;

    background:
        transparent !important;

    background-color:
        transparent !important;

    opacity: 1 !important;

    pointer-events: none !important;
}


/* =========================================================
   UI
========================================================= */

#header {

    position: fixed;

    top: 12px;
    left: 0;

    width: 100%;

    z-index: 20;

    text-align: center;

    pointer-events: none;
}


#title {

    font-size:
        clamp(28px, 7vw, 52px);

    font-weight: 900;

    color: white;

    text-shadow:
        0 0 8px rgba(255,255,255,.5),
        0 4px 12px #000;
}


#title span {

    color: #b83cff;
}


#build {

    position: absolute;

    right: 12px;
    top: 0;

    padding:
        8px 12px;

    border:
        1px solid #42ff91;

    border-radius:
        16px;

    color:
        #55ff9b;

    background:
        rgba(0,0,0,.60);

    font-size:
        11px;

    font-weight:
        800;

    white-space:
        nowrap;
}


/* =========================================================
   MAIN STATUS
========================================================= */

#mainStatus {

    position: fixed;

    top: 76px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    min-width:
        250px;

    max-width:
        90%;

    padding:
        9px 17px;

    text-align:
        center;

    color:
        #58ff9c;

    border:
        1px solid #a93cff;

    border-radius:
        24px;

    background:
        rgba(0,0,0,.58);

    box-shadow:
        0 0 15px
        rgba(168,60,255,.45);

    font-weight:
        900;

    font-size:
        14px;
}


/* =========================================================
   DEBUG
========================================================= */

#debug {

    position: fixed;

    top: 128px;
    left: 12px;

    z-index: 20;

    padding:
        8px 11px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:
        12px;

    background:
        rgba(0,0,0,.42);

    backdrop-filter:
        blur(5px);

    color:
        white;

    font-size:
        11px;

    line-height:
        1.45;

    pointer-events:
        none;

    min-width:
        150px;

    max-width:
        calc(100vw - 24px);
}


.debug-head {

    color:
        #d05cff;

    font-weight:
        900;

    margin-bottom:
        3px;
}


.debug-line {

    display:
        flex;

    gap:
        6px;

    justify-content:
        space-between;
}


.on {

    color:
        #59ff9b;

    font-weight:
        900;
}


.off {

    color:
        #aaa;
}


.wait {

    color:
        #ffd84a;
}


.err {

    color:
        #ff6565;

    font-weight:
        900;
}


/* =========================================================
   BOTTOM
========================================================= */

#bottom {

    position: fixed;

    left: 50%;

    bottom: 14px;

    transform:
        translateX(-50%);

    z-index: 20;

    width:
        min(560px, calc(100vw - 40px));

    padding:
        10px 14px;

    text-align:
        center;

    color:
        white;

    background:
        rgba(0,0,0,.52);

    border:
        1px solid #a93cff;

    border-radius:
        18px;

    backdrop-filter:
        blur(6px);

    font-size:
        13px;

    pointer-events:
        none;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:600px) {

    #build {

        font-size:
            9px;

        padding:
            6px 8px;

        right:
            7px;
    }


    #debug {

        top:
            124px;

        font-size:
            10px;

        padding:
            7px 9px;
    }


    #bottom {

        font-size:
            12px;

        padding:
            8px 11px;
    }
}

</style>

</head>


<body>


<!-- =========================================================

========================================================= -->

<div id="header">

    <div id="title">
        CARD <span>BEAST</span> AR
    </div>

    <div id="build">
        v66.0 • CAMERA FIX • 5-BEAST
    </div>

</div>


<!-- =========================================================
     MAIN STATUS
========================================================= -->

<div id="mainStatus">

    CAMERA STARTING...

</div>


<!-- =========================================================
     DEBUG
========================================================= -->

<div id="debug">

    <div class="debug-head">

    </div>


    <div class="debug-line">

        <span>
            CAMERA
        </span>

        <span
            id="cameraState"
            class="wait">

        </span>

    </div>


    <div class="debug-line">

        <span>

        </span>

        <span
            id="target0"
            class="wait">

            WAIT

        </span>

    </div>


    <div class="debug-line">

        <span>
            DR-002
        </span>

        <span
            id="target1"
            class="wait">

            WAIT

        </span>

    </div>


    <div class="debug-line">

        <span>
            DR-003
        </span>

        <span
            id="target2"
            class="wait">

            WAIT

        </span>

    </div>


    <div class="debug-line">

        <span>
            DR-004
        </span>

        <span
            id="target3"
            class="wait">

            WAIT

        </span>

    </div>


    <div class="debug-line">

        <span>

        </span>

        <span

        </span>

    </div>

</div>


<!-- =========================================================

========================================================= -->

<div id="bottom">

    📷 Starting camera...

</div>



<!-- =========================================================
     AR SCENE
========================================================= -->

<a-scene

    id="scene"

    mindar-image="
        imageTargetSrc: ./targets.mind;
        maxTrack: 5;
        filterMinCF: 0.0001;
        filterBeta: 0.01;
        warmupTolerance: 5;
        missTolerance: 5;
    "

    color-space="sRGB"

    renderer="
        alpha: true;
        antialias: true;
        colorManagement: true;
        physicallyCorrectLights: true;
    "

    vr-mode-ui="
        enabled: false
    "

    device-orientation-permission-ui="
        enabled: true
    "
>


<!-- =========================================================
     ASSETS
========================================================= -->

<a-assets
    id="assets"
    timeout="30000"
>


    <!-- DR-001 -->

    <a-asset-item

        id="dragonAsset"

        src="./models/ember-dragon.glb">

    </a-asset-item>


    <!-- DR-002 -->

    <a-asset-item

        id="tigerAsset"

        src="./models/abyss-tiger.glb">

    </a-asset-item>


    <!-- DR-003 -->

    <a-asset-item

        id="phoenixAsset"

        src="./models/Frost-phoenix.glb">

    </a-asset-item>


    <!-- DR-004 -->

    <a-asset-item

        id="mantisAsset"

        src="./models/puppet-mantis.glb">

    </a-asset-item>


    <!-- DR-005 -->

    <a-asset-item

        id="leviathanAsset"

        src="./models/tidal-leviathan.glb">

    </a-asset-item>


</a-assets>



<!-- =========================================================
     CAMERA
========================================================= -->

<a-camera

    position="0 0 0"

    look-controls="
        enabled: false
    ">

</a-camera>



<!-- =========================================================
     DR-001 EMBER DRAGON
     TARGET 0
========================================================= -->

<a-entity

    id="beast0"

    mindar-image-target="
        targetIndex: 0
    "

    visible="false"
>


    <a-entity

        id="dragonModel"

        gltf-model="#dragonAsset"

        position="
            0 -0.25 0
        "

        rotation="
            90 0 0
        "

        scale="
            2.5 2.5 2.5
        ">

    </a-entity>

</a-entity>



<!-- =========================================================
     DR-002 ABYSS TIGER
     TARGET 1
========================================================= -->

<a-entity

    id="beast1"

    mindar-image-target="
        targetIndex: 1
    "

    visible="false"
>


    <a-entity

        id="tigerModel"

        gltf-model="#tigerAsset"

        position="
            0 -0.25 0
        "

        rotation="
            90 0 0
        "

        scale="
            1.5 1.5 1.5
        ">

    </a-entity>

</a-entity>



<!-- =========================================================
     DR-003 FROST PHOENIX
     TARGET 2
     BALANCED SCALE = 1.75
========================================================= -->

<a-entity

    id="beast2"

    mindar-image-target="
        targetIndex: 2
    "

    visible="false"
>


    <a-entity

        id="phoenixModel"

        gltf-model="#phoenixAsset"

        position="
            0 -0.25 0
        "

        rotation="
            90 0 0
        "

        scale="
            1.75 1.75 1.75
        ">

    </a-entity>

</a-entity>



<!-- =========================================================
     DR-004 PUPPET MANTIS
     TARGET 3
     BALANCED SCALE = 1.55
========================================================= -->

<a-entity

    id="beast3"

    mindar-image-target="
        targetIndex: 3
    "

    visible="false"
>


    <a-entity

        id="mantisModel"

        gltf-model="#mantisAsset"

        position="
            0 -0.25 0
        "

        rotation="
            90 0 0
        "

        scale="
            1.55 1.55 1.55
        ">

    </a-entity>

</a-entity>



<!-- =========================================================
     DR-005 TIDAL LEVIATHAN
     TARGET 4
     BALANCED SCALE = 1.45
========================================================= -->

<a-entity

    id="beast4"

    mindar-image-target="
        targetIndex: 4
    "

    visible="false"
>


    <a-entity

        id="leviathanModel"

        gltf-model="#leviathanAsset"

        position="
            0 -0.25 0
        "

        rotation="
            90 0 0
        "

        scale="
            1.45 1.45 1.45
        ">

    </a-entity>

</a-entity>


</a-scene>



<script>

/* =========================================================
   CARD BEAST AR v66.0
   CAMERA LAYER FIX

   5 TARGETS
   MAX TRACK = 5
   PRELOAD ONCE
   MULTI TRACK
   INDEPENDENT TARGET LOST
========================================================= */


/* =========================================================
   BEAST DATA
========================================================= */

const beasts = [

    {
        id: "DR-001",
        name: "Ember Dragon",
        emoji: "🔥",
        target: 0,
        model: "dragonModel",
        asset: "dragonAsset"
    },

    {
        id: "DR-002",
        name: "Abyss Tiger",
        emoji: "🐯",
        target: 1,
        model: "tigerModel",
        asset: "tigerAsset"
    },

    {
        id: "DR-003",
        name: "Frost Phoenix",
        emoji: "❄️",
        target: 2,
        model: "phoenixModel",
        asset: "phoenixAsset"
    },

    {
        id: "DR-004",
        name: "Puppet Mantis",
        emoji: "🦗",
        target: 3,
        model: "mantisModel",
        asset: "mantisAsset"
    },

    {
        id: "DR-005",
        name: "Tidal Leviathan",
        emoji: "🌊",
        target: 4,
        model: "leviathanModel",
        asset: "leviathanAsset"
    }

];



/* =========================================================
   STATE
========================================================= */

const state = beasts.map(() => ({

    found: false,

    loaded: false,

    loadCount: 0

}));



/* =========================================================
   DOM
========================================================= */

const scene =
    document.getElementById("scene");

const mainStatus =
    document.getElementById("mainStatus");

const bottom =
    document.getElementById("bottom");



/* =========================================================
   CAMERA LAYER FIX
========================================================= */

function forceCameraLayer() {

    /*
     * Find EVERY video.
     * MindAR creates the camera video dynamically.
     */

    const videos =
        document.querySelectorAll("video");


    videos.forEach(video => {

        video.classList.add(
            "mindar-video"
        );


        video.style.setProperty(
            "position",
            "fixed",
            "important"
        );


        video.style.setProperty(
            "top",
            "0",
            "important"
        );


        video.style.setProperty(
            "left",
            "0",
            "important"
        );


        video.style.setProperty(
            "width",
            "100vw",
            "important"
        );


        video.style.setProperty(
            "height",
            "100vh",
            "important"
        );


        video.style.setProperty(
            "min-width",
            "100vw",
            "important"
        );


        video.style.setProperty(
            "min-height",
            "100vh",
            "important"
        );


        video.style.setProperty(
            "object-fit",
            "cover",
            "important"
        );


        video.style.setProperty(
            "display",
            "block",
            "important"
        );


        video.style.setProperty(
            "visibility",
            "visible",
            "important"
        );


        video.style.setProperty(
            "opacity",
            "1",
            "important"
        );


        video.style.setProperty(
            "z-index",
            "0",
            "important"
        );


        video.style.setProperty(
            "pointer-events",
            "none",
            "important"
        );


        /*
         * Make sure camera playback continues.
         */

        if (
            video.paused &&
            video.srcObject
        ) {

            video.play()
                .catch(() => {});

        }

    });



    /*
     * A-FRAME CANVAS
     */

    const canvas =
        document.querySelector(
            "a-scene canvas"
        );


    if (canvas) {

        canvas.style.setProperty(
            "position",
            "fixed",
            "important"
        );


        canvas.style.setProperty(
            "top",
            "0",
            "important"
        );


        canvas.style.setProperty(
            "left",
            "0",
            "important"
        );


        canvas.style.setProperty(
            "width",
            "100vw",
            "important"
        );


        canvas.style.setProperty(
            "height",
            "100vh",
            "important"
        );


        canvas.style.setProperty(
            "background",
            "transparent",
            "important"
        );


        canvas.style.setProperty(
            "background-color",
            "transparent",
            "important"
        );


        canvas.style.setProperty(
            "z-index",
            "1",
            "important"
        );

    }


    /*
     * Force WebGL transparent clear.
     */

    try {

        if (
            scene &&
            scene.renderer
        ) {

            const renderer =
                scene.renderer;


            if (
                renderer.setClearColor
            ) {

                renderer.setClearColor(
                    0x000000,
                    0
                );

            }


            if (
                renderer.setClearAlpha
            ) {

                renderer.setClearAlpha(
                    0
                );

            }

        }

    }

    catch (error) {

        console.warn(
            "Renderer transparency patch:",
            error
        );

    }

}



/* =========================================================
   MUTATION OBSERVER
   MindAR VIDEO IS CREATED DYNAMICALLY
========================================================= */

const videoObserver =
    new MutationObserver(() => {

        forceCameraLayer();

    });


videoObserver.observe(

    document.body,

    {
        childList: true,
        subtree: true
    }

);



/* =========================================================
   STATUS BADGE
========================================================= */

function setBadge(
    index,
    text,
    className
) {

    const element =
        document.getElementById(
            "target" + index
        );


    if (!element) return;


    element.textContent =
        text;


    element.className =
        className;

}



/* =========================================================
   UPDATE MAIN UI
========================================================= */

function updateUI() {

    const active =
        beasts.filter(
            (beast, index) =>
                state[index].found
        );


    if (
        active.length === 0
    ) {

        mainStatus.textContent =
            "CAMERA READY • SEARCHING";


        bottom.textContent =
            "📷 Point camera at any Card Beast target.";

        return;

    }



    if (
        active.length === 1
    ) {

        const beast =
            active[0];


        mainStatus.textContent =
            `${beast.id} FOUND • ${beast.name.toUpperCase()}`;


        bottom.innerHTML =
            `${beast.emoji} <b>${beast.name.toUpperCase()} ACTIVE</b> • ${beast.id}`;

        return;

    }



    mainStatus.textContent =
        `${active.length} CARDS ACTIVE • ` +
        `${active.map(
            beast => beast.id
        ).join(" + ")}`;


    bottom.innerHTML =
        `${active.map(
            beast =>
                beast.emoji +
                " " +
                beast.id
        ).join(" + ")} ACTIVE`;

}



/* =========================================================
   PRELOAD
   LOAD EACH GLB ONLY ONCE
========================================================= */

function setupPreload() {

    beasts.forEach(
        (beast, index) => {

            const model =
                document.getElementById(
                    beast.model
                );


            if (!model) {

                console.error(
                    beast.id +
                    " model element missing"
                );

                return;

            }


            /*
             * MODEL LOADED
             */

            model.addEventListener(

                "model-loaded",

                () => {

                    /*
                     * Prevent duplicate count.
                     */

                    if (
                        state[index].loaded
                    ) {

                        return;

                    }


                    state[index].loaded =
                        true;


                    state[index].loadCount++;


                    console.log(
                        beast.id +
                        " GLB PRELOADED ONCE"
                    );

                },

                {
                    once: true
                }

            );


            /*
             * MODEL ERROR
             */

            model.addEventListener(

                "model-error",

                event => {

                    console.error(
                        beast.id +
                        " GLB LOAD ERROR",
                        event
                    );

                    setBadge(
                        index,
                        "GLB ERROR",
                        "err"
                    );

                }

            );

        }
    );

}



/* =========================================================
   TARGET SETUP
========================================================= */

function setupTarget(index) {

    const beast =
        beasts[index];


    const target =
        document.getElementById(
            "beast" + index
        );


    if (!target) {

        console.error(
            beast.id +
            " target entity missing"
        );

        return;

    }



    /* =====================================================
       TARGET FOUND
    ===================================================== */

    target.addEventListener(

        "targetFound",

        () => {

            state[index].found =
                true;


            /*
             * ONLY THIS TARGET
             * becomes visible.
             */

            target.setAttribute(
                "visible",
                "true"
            );


            setBadge(
                index,
                "FOUND",
                "on"
            );


            updateUI();


            console.log(
                beast.id +
                " targetFound"
            );

        }

    );



    /* =====================================================
       TARGET LOST
    ===================================================== */

    target.addEventListener(

        "targetLost",

        () => {

            state[index].found =
                false;


            /*
             * ONLY THIS TARGET
             * becomes invisible.
             */

            target.setAttribute(
                "visible",
                "false"
            );


            setBadge(
                index,
                "LOST",
                "wait"
            );


            updateUI();


            console.log(
                beast.id +
                " targetLost"
            );

        }

    );

}



/* =========================================================
   SCENE LOADED
========================================================= */

scene.addEventListener(

    "loaded",

    () => {

        console.log(
            "CARD BEAST AR v66.0 SCENE LOADED"
        );


        /*
         * Setup all 5 targets.
         */

        beasts.forEach(
            (_, index) => {

                setupTarget(
                    index
                );

            }
        );


        /*
         * Setup GLB preload.
         */

        setupPreload();


        /*
         * Camera layer.
         */

        forceCameraLayer();

    }

);



/* =========================================================
   AR READY
========================================================= */

scene.addEventListener(

    "arReady",

    () => {

        console.log(
            "MINDAR CAMERA READY"
        );


        const cameraState =
            document.getElementById(
                "cameraState"
            );


        if (cameraState) {

            cameraState.textContent =
                "READY";

            cameraState.className =
                "on";

        }


        mainStatus.textContent =
            "CAMERA READY • SEARCHING";


        bottom.textContent =
            "📷 Point camera at any Card Beast target.";


        /*
         * Multiple camera layer passes.
         */

        forceCameraLayer();


        setTimeout(
            forceCameraLayer,
            100
        );


        setTimeout(
            forceCameraLayer,
            300
        );


        setTimeout(
            forceCameraLayer,
            700
        );


        setTimeout(
            forceCameraLayer,
            1200
        );


        setTimeout(
            forceCameraLayer,
            2000
        );

    }

);



/* =========================================================
   AR ERROR
========================================================= */

scene.addEventListener(

    "arError",

    event => {

        console.error(
            "MINDAR AR ERROR",
            event
        );


        const cameraState =
            document.getElementById(
                "cameraState"
            );


        if (cameraState) {

            cameraState.textContent =
                "ERROR";

            cameraState.className =
                "err";

        }


        mainStatus.textContent =
            "CAMERA ERROR";


        bottom.textContent =
            "Camera could not start.";

    }

);



/* =========================================================
   WINDOW LOAD
========================================================= */

window.addEventListener(

    "load",

    () => {

        /*
         * Initial passes.
         */

        forceCameraLayer();


        setTimeout(
