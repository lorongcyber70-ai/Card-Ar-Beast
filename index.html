<script>

/* =========================================================
   CARD BEAST AR v66.2
   PREMIUM ELEMENT VFX

   CORE AR LOCKED
========================================================= */


/* =========================================================
   DATA
========================================================= */

const beasts=[

{
id:"DR-001",
name:"Ember Dragon",
emoji:"🔥",
target:0,
model:"dragonModel"
},

{
id:"DR-002",
name:"Abyss Tiger",
emoji:"🌑",
target:1,
model:"tigerModel"
},

{
id:"DR-003",
name:"Frost Phoenix",
emoji:"❄️",
target:2,
model:"phoenixModel"
},

{
id:"DR-004",
name:"Puppet Mantis",
emoji:"🧠",
target:3,
model:"mantisModel"
},

{
id:"DR-005",
name:"Tidal Leviathan",
emoji:"🌊",
target:4,
model:"leviathanModel"
}

];


const state=beasts.map(()=>({

found:false,
loaded:false,
loadCount:0

}));


const scene=
document.getElementById("scene");

const mainStatus=
document.getElementById("mainStatus");

const bottom=
document.getElementById("bottom");


/* =========================================================
   PREMIUM VFX CONFIG
========================================================= */

const VFX={

fire:{
color:"#ff6a00",
secondary:"#ffd21a",
type:"fire"
},

dark:{
color:"#7d35ff",
secondary:"#d17cff",
type:"dark"
},

frost:{
color:"#a8f5ff",
secondary:"#ffffff",
type:"frost"
},

mind:{
color:"#d04cff",
secondary:"#69dfff",
type:"mind"
},

water:{
color:"#22d9ff",
secondary:"#ffffff",
type:"water"
}

};


/* =========================================================
   PREMIUM VFX COMPONENT
========================================================= */

AFRAME.registerComponent(

"premium-vfx",

{

schema:{
type:{
type:"string",
default:"fire"
}
},


init:function(){

this.active=false;

this.time=0;

this.parts=[];

this.config=
VFX[this.data.type] ||
VFX.fire;

this.build();

},


/* =====================================================
   BUILD
===================================================== */

build:function(){

const type=this.data.type;
const cfg=this.config;


/* -----------------------------------------------------
   CENTRAL AURA RING
----------------------------------------------------- */

const ring=
document.createElement("a-ring");

ring.setAttribute(
"radius-inner",
"0.28"
);

ring.setAttribute(
"radius-outer",
"0.34"
);

ring.setAttribute(
"rotation",
"-90 0 0"
);

ring.setAttribute(
"material",
{

color:cfg.color,

transparent:true,

opacity:.42,

shader:"flat"

}
);

ring.setAttribute(
"visible",
"false"
);

this.el.appendChild(ring);

this.ring=ring;


/* -----------------------------------------------------
   SECOND RING
----------------------------------------------------- */

const ring2=
document.createElement("a-ring");

ring2.setAttribute(
"radius-inner",
"0.42"
);

ring2.setAttribute(
"radius-outer",
"0.45"
);

ring2.setAttribute(
"rotation",
"-90 0 0"
);

ring2.setAttribute(
"material",
{

color:cfg.secondary,

transparent:true,

opacity:.18,

shader:"flat"

}
);

ring2.setAttribute(
"visible",
"false"
);

this.el.appendChild(ring2);

this.ring2=ring2;


/* -----------------------------------------------------
   SMALL ENERGY POINTS
----------------------------------------------------- */

const count=
type==="frost" ? 7 :
type==="water" ? 6 :
5;


for(
let i=0;
i<count;
i++
){

const point=
document.createElement(
"a-sphere"
);


const angle=
(
Math.PI*2/count
)*i;


const radius=
type==="mind" ?
.38 :
.32;


const x=
Math.cos(angle)*radius;

const z=
Math.sin(angle)*radius;

const y=
type==="frost" ?
.32 :
.18;


point.setAttribute(
"radius",
type==="frost" ? .018 : .022
);


point.setAttribute(
"position",
`${x} ${y} ${z}`
);


point.setAttribute(
"material",
{

color:
i%2===0 ?
cfg.color :
cfg.secondary,

shader:"standard",

transparent:true,

opacity:.72,

roughness:.25,

metalness:.05

}
);


point.setAttribute(
"visible",
"false"
);


this.el.appendChild(point);

this.parts.push({

el:point,

angle:angle,

radius:radius,

phase:Math.random()*6.28

});

}


/* -----------------------------------------------------
   ELEMENT-SPECIFIC DETAIL
----------------------------------------------------- */

if(
type==="fire"
){

this.buildFire();

}

if(
type==="dark"
){

this.buildDark();

}

if(
type==="frost"
){

this.buildFrost();

}

if(
type==="mind"
){

this.buildMind();

}

if(
type==="water"
){

this.buildWater();

}

},


/* =====================================================
   FIRE
===================================================== */

buildFire:function(){

for(
let i=0;
i<3;
i++
){

const ember=
document.createElement(
"a-sphere"
);

ember.setAttribute(
"radius",
".025"
);

ember.setAttribute(
"material",
{

color:
i===0 ?
"#ff4a00" :
"#ffd21a",

transparent:true,

opacity:.8

}
);

ember.setAttribute(
"visible",
"false"
);

this.el.appendChild(
ember
);

this.parts.push({

el:ember,

fire:true,

phase:i*2

});

}

},


/* =====================================================
   DARK
===================================================== */

buildDark:function(){

const orb=
document.createElement(
"a-torus"
);

orb.setAttribute(
"radius",
".34"
);

orb.setAttribute(
"radius-tubular",
".012"
);

orb.setAttribute(
"rotation",
"90 0 0"
);

orb.setAttribute(
"material",
{

color:"#792dff",

transparent:true,

opacity:.35

}
);

orb.setAttribute(
"visible",
"false"
);

this.el.appendChild(
orb
);

this.darkOrb=orb;

},


/* =====================================================
   FROST
===================================================== */

buildFrost:function(){

for(
let i=0;
i<4;
i++
){

const snow=
document.createElement(
"a-sphere"
);

snow.setAttribute(
"radius",
".018"
);

snow.setAttribute(
"material",
{

color:"#dfffff",

transparent:true,

opacity:.65

}
);

snow.setAttribute(
"visible",
"false"
);

this.el.appendChild(
snow
);

this.parts.push({

el:snow,

snow:true,

phase:i*1.4

});

}

},


/* =====================================================
   MIND
===================================================== */

buildMind:function(){

const ring=
document.createElement(
"a-torus"
);

ring.setAttribute(
"radius",
".40"
);

ring.setAttribute(
"radius-tubular",
".008"
);

ring.setAttribute(
"rotation",
"0 0 0"
);

ring.setAttribute(
"material",
{

color:"#c64cff",

transparent:true,

opacity:.45

}
);

ring.setAttribute(
"visible",
"false"
);

this.el.appendChild(
ring
);

this.mindRing=ring;

},


/* =====================================================
   WATER
===================================================== */

buildWater:function(){

const wave=
document.createElement(
"a-ring"
);

wave.setAttribute(
"radius-inner",
".48"
);

wave.setAttribute(
"radius-outer",
".51"
);

wave.setAttribute(
"rotation",
"-90 0 0"
);

wave.setAttribute(
"material",
{

color:"#19d9ff",

transparent:true,

opacity:.30,

shader:"flat"

}
);

wave.setAttribute(
"visible",
"false"
);

this.el.appendChild(wave);

this.wave=wave;

},


/* =====================================================
   ACTIVE
===================================================== */

setActive:function(active){

this.active=active;

this.el.setAttribute(
"visible",
active
);

if(this.ring)
this.ring.setAttribute(
"visible",
active
);

if(this.ring2)
this.ring2.setAttribute(
"visible",
active
);

if(this.darkOrb)
this.darkOrb.setAttribute(
"visible",
active
);

if(this.mindRing)
this.mindRing.setAttribute(
"visible",
active
);

if(this.wave)
this.wave.setAttribute(
"visible",
active
);

this.parts.forEach(
p=>{

p.el.setAttribute(
"visible",
active
);

}
);

},


/* =====================================================
   ANIMATION
===================================================== */

tick:function(time,delta){

if(!this.active)
return;


this.time+=
delta*.001;


const t=this.time;


/* -----------------------------------------------------
   MAIN RINGS
----------------------------------------------------- */

if(this.ring){

const pulse=
1+
Math.sin(t*3)*.06;

this.ring.object3D.scale.set(
pulse,
pulse,
pulse
);

this.ring.object3D.rotation.y=
t*.25;
}


if(this.ring2){

const pulse=
1+
Math.sin(t*2.2+1)*.05;

this.ring2.object3D.scale.set(
pulse,
pulse,
pulse
);

this.ring2.object3D.rotation.y=
-t*.18;
}


/* -----------------------------------------------------
   ORBIT POINTS
----------------------------------------------------- */

this.parts.forEach(
p=>{

if(p.fire || p.snow)
return;

if(
p.angle===undefined
)
return;


const angle=
p.angle+
t*.45;


const radius=
p.radius+
Math.sin(
t*1.5+p.phase
)*.025;


p.el.object3D.position.x=
Math.cos(angle)*radius;


p.el.object3D.position.z=
Math.sin(angle)*radius;


p.el.object3D.position.y=
.18+
Math.sin(
t*2+p.phase
)*.055;

}
);


/* -----------------------------------------------------
   FIRE EMBERS
----------------------------------------------------- */

this.parts.forEach(
p=>{

if(!p.fire)
return;


const phase=p.phase;

p.el.object3D.position.x=
Math.sin(
t*2+phase
)*.12;

p.el.object3D.position.z=
Math.cos(
t*1.7+phase
)*.10;

p.el.object3D.position.y=
.12+
(
(t*.25+phase)%1
)*.45;

}
);


/* -----------------------------------------------------
   FROST SNOW
----------------------------------------------------- */

this.parts.forEach(
p=>{

if(!p.snow)
return;


const cycle=
(t*.18+p.phase)%1;

p.el.object3D.position.y=
.60-cycle*.60;

p.el.object3D.position.x=
Math.sin(
t*1.2+p.phase
)*.15;

p.el.object3D.position.z=
Math.cos(
t*1.1+p.phase
)*.15;

}
);


/* -----------------------------------------------------
   DARK ORBIT
----------------------------------------------------- */

if(this.darkOrb){

this.darkOrb.object3D.rotation.z=
t*.55;

this.darkOrb.object3D.rotation.y=
t*.30;

}


/* -----------------------------------------------------
   MIND
----------------------------------------------------- */

if(this.mindRing){

this.mindRing.object3D.rotation.x=
Math.sin(t)*.45;

this.mindRing.object3D.rotation.y=
t*.65;

}


/* -----------------------------------------------------
   WATER
----------------------------------------------------- */

if(this.wave){

const pulse=
1+
Math.sin(t*2)*.08;

this.wave.object3D.scale.set(
pulse,
pulse,
pulse
);

this.wave.object3D.rotation.z=
t*.25;

}

}

}

);


/* =========================================================
   CAMERA LAYER
   EXACT v66.0 BASELINE
========================================================= */

function forceCameraLayer(){

const videos=
document.querySelectorAll("video");


videos.forEach(
video=>{

video.classList.add(
"mindar-video"
);

video.style.setProperty(
"position",
"fixed",
"important"
);

video.style.setProperty(
"top",
"0",
"important"
);

video.style.setProperty(
"left",
"0",
"important"
);

video.style.setProperty(
"width",
"100vw",
"important"
);

video.style.setProperty(
"height",
"100vh",
"important"
);

video.style.setProperty(
"min-width",
"100vw",
"important"
);

video.style.setProperty(
"min-height",
"100vh",
"important"
);

video.style.setProperty(
"object-fit",
"cover",
"important"
);

video.style.setProperty(
"display",
"block",
"important"
);

video.style.setProperty(
"visibility",
"visible",
"important"
);

video.style.setProperty(
"opacity",
"1",
"important"
);

video.style.setProperty(
"z-index",
"0",
"important"
);

video.style.setProperty(
"pointer-events",
"none",
"important"
);


if(
video.paused &&
video.srcObject
){

video.play()
.catch(()=>{});

}

}
);


const canvas=
document.querySelector(
"a-scene canvas"
);


if(canvas){

canvas.style.setProperty(
"position",
"fixed",
"important"
);

canvas.style.setProperty(
"top",
"0",
"important"
);

canvas.style.setProperty(
"left",
"0",
"important"
);

canvas.style.setProperty(
"width",
"100vw",
"important"
);

canvas.style.setProperty(
"height",
"100vh",
"important"
);

canvas.style.setProperty(
"background",
"transparent",
"important"
);

canvas.style.setProperty(
"background-color",
"transparent",
"important"
);

canvas.style.setProperty(
"z-index",
"1",
"important"
);

}


try{

if(
scene &&
scene.renderer
){

const renderer=
scene.renderer;

if(renderer.setClearColor){

renderer.setClearColor(
0x000000,
0
);

}

if(renderer.setClearAlpha){

renderer.setClearAlpha(
0
);

}

}

}catch(error){

console.warn(
"Renderer transparency patch:",
error
);

}

}


/* =========================================================
   VIDEO OBSERVER
========================================================= */

const videoObserver=
new MutationObserver(
()=>{

forceCameraLayer();

}
);

videoObserver.observe(
document.body,
{
childList:true,
subtree:true
}
);


/* =========================================================
   BADGE
========================================================= */

function setBadge(
index,
text,
className
){

const element=
document.getElementById(
"target"+index
);

if(!element)
return;

element.textContent=text;

element.className=
className;

}


/* =========================================================
   VFX CONTROL
========================================================= */

function setVFX(
index,
active
){

const vfx=
document.getElementById(
"vfx"+index
);

if(
!vfx ||
!vfx.components ||
!vfx.components["premium-vfx"]
)
return;

vfx.components[
"premium-vfx"
].setActive(
active
);

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

const active=
beasts.filter(
(beast,index)=>
state[index].found
);


if(active.length===0){

mainStatus.textContent=
"CAMERA READY • SEARCHING";

bottom.textContent=
"📷 Point camera at any Card Beast target.";

return;

}


if(active.length===1){

const beast=
active[0];

mainStatus.textContent=
`${beast.id} FOUND • ${beast.name.toUpperCase()}`;

bottom.innerHTML=
`${beast.emoji} <b>${beast.name.toUpperCase()} ACTIVE</b> • ${beast.id}`;

return;

}


mainStatus.textContent=
`${active.length} CARDS ACTIVE • `+
active.map(
beast=>beast.id
).join(" + ");


bottom.innerHTML=
`${active.map(
beast=>
beast.emoji+
" "+
beast.id
).join(" + ")} ACTIVE`;

}


/* =========================================================
   PRELOAD ONCE
========================================================= */

function setupPreload(){

beasts.forEach(
(beast,index)=>{

const model=
document.getElementById(
beast.model
);

if(!model){

console.error(
beast.id+
" model element missing"
);

return;

}


model.addEventListener(
"model-loaded",
()=>{

if(state[index].loaded)
return;

state[index].loaded=true;

state[index].loadCount++;

console.log(
beast.id+
" GLB PRELOADED ONCE"
);

},
{
once:true
}
);


model.addEventListener(
"model-error",
event=>{

console.error(
beast.id+
" GLB LOAD ERROR",
event
);

setBadge(
index,
"GLB ERROR",
"err"
);

}
);

}
);

}


/* =========================================================
   TARGET SETUP
========================================================= */

function setupTarget(index){

const beast=
beasts[index];

const target=
document.getElementById(
"beast"+index
);

if(!target){

console.error(
beast.id+
" target entity missing"
);

return;

}


/* =====================================================
   FOUND
===================================================== */

target.addEventListener(
"targetFound",
()=>{

state[index].found=true;

target.setAttribute(
"visible",
"true"
);

setVFX(
index,
true
);

setBadge(
index,
"FOUND",
"on"
);

updateUI();

console.log(
beast.id+
" targetFound"
);

}
);


/* =====================================================
   LOST
===================================================== */

target.addEventListener(
"targetLost",
()=>{

state[index].found=false;

target.setAttribute(
"visible",
"false"
);

setVFX(
index,
false
);

setBadge(
index,
"LOST",
"wait"
);

updateUI();

console.log(
beast.id+
" targetLost"
);

}
);

}


/* =========================================================
   SCENE LOADED
========================================================= */

scene.addEventListener(
"loaded",
()=>{

console.log(
"CARD BEAST AR v66.2 SCENE LOADED"
);

beasts.forEach(
(_,index)=>{
setupTarget(index);
}
);

setupPreload();

forceCameraLayer();

}
);


/* =========================================================
   AR READY
========================================================= */

scene.addEventListener(
"arReady",
()=>{

console.log(
"MINDAR CAMERA READY"
);

const cameraState=
document.getElementById(
"cameraState"
);

if(cameraState){

cameraState.textContent=
"READY";

cameraState.className=
"on";

}

mainStatus.textContent=
"CAMERA READY • SEARCHING";

bottom.textContent=
"📷 Point camera at any Card Beast target.";

forceCameraLayer();

setTimeout(
forceCameraLayer,
100
);

setTimeout(
forceCameraLayer,
300
);

setTimeout(
forceCameraLayer,
700
);

setTimeout(
forceCameraLayer,
1200
);

setTimeout(
forceCameraLayer,
2000
);

}
);


/* =========================================================
   AR ERROR
========================================================= */

scene.addEventListener(
"arError",
event=>{

console.error(
"MINDAR AR ERROR",
event
);

const cameraState=
document.getElementById(
"cameraState"
);

if(cameraState){

cameraState.textContent=
"ERROR";

cameraState.className=
"err";

}

mainStatus.textContent=
"CAMERA ERROR";

bottom.textContent=
"Camera could not start.";

}
);


/* =========================================================
   WINDOW LOAD
========================================================= */

window.addEventListener(
"load",
()=>{

forceCameraLayer();

setTimeout(
forceCameraLayer,
300
);

setTimeout(
forceCameraLayer,
800
);

setTimeout(
forceCameraLayer,
1500
);

}
);


/* =========================================================
   CAMERA PROTECTION
========================================================= */

setInterval(
()=>{
forceCameraLayer();
},
1000
);


/* =========================================================
   INITIAL UI
========================================================= */

beasts.forEach(
(_,index)=>{

setBadge(
index,
"WAIT",
"wait"
);

}
);

</script>

</body>
</html>
