<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Beast AR — Camera Only Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#camera{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;background:#000;z-index:0}
#ui{position:fixed;z-index:10;top:0;left:0;right:0;padding:18px;text-align:center;color:#fff}
.logo{font-size:22px;font-weight:900;text-shadow:0 2px 8px #000}.logo span{color:#b75cff}
#status{display:inline-block;margin-top:10px;padding:10px 14px;border-radius:22px;background:#09060dcc;border:1px solid #b75cff;font-weight:800;font-size:13px}
#start{position:fixed;z-index:20;left:8%;right:8%;bottom:42px;width:84%;padding:17px;border:0;border-radius:15px;background:linear-gradient(135deg,#7433ad,#b75cff);color:#fff;font-size:17px;font-weight:900}
#info{position:fixed;z-index:10;left:7%;right:7%;bottom:110px;padding:13px;border-radius:15px;background:#09060dcc;border:1px solid #43275a;color:#fff;text-align:center;font-size:13px}
.ok{color:#68ff9b}.bad{color:#ff7474}
</style>
</head>
<body>
<video id="camera" autoplay muted playsinline></video>

<div id="ui">
  <div class="logo">CARD <span>BEAST</span> AR</div>
  <div id="status">CAMERA-ONLY TEST</div>
</div>

<div id="info">This test does NOT load MindAR, A-Frame, targets.mind or 3D.</div>
<button id="start">START CAMERA TEST</button>

<script>
const video = document.getElementById('camera');
const start = document.getElementById('start');
const status = document.getElementById('status');
const info = document.getElementById('info');

let stream = null;

async function startCamera(){
  try {
    start.disabled = true;
    status.textContent = 'REQUESTING CAMERA...';
    info.textContent = 'Allow camera permission if Android asks.';

    if (!window.isSecureContext) {
      throw new Error('NOT_SECURE_CONTEXT');
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('GET_USER_MEDIA_UNAVAILABLE');
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    status.textContent = 'CAMERA WORKING ✓';
    status.classList.add('ok');
    info.innerHTML = '✓ <b>Camera-only test passed.</b><br>Live rear-camera image should be visible.';
    start.style.display = 'none';

    const track = stream.getVideoTracks()[0];
    console.log('Camera:', track.getSettings());
  } catch (err) {
    console.error(err);
    status.textContent = 'CAMERA TEST FAILED';
    status.classList.add('bad');

    if (err.name === 'NotAllowedError') {
      info.innerHTML = '<b>Permission denied.</b><br>Chrome site settings → Camera → Allow, then reload.';
    } else if (err.name === 'NotFoundError') {
      info.innerHTML = '<b>No camera found.</b>';
    } else if (err.name === 'NotReadableError') {
      info.innerHTML = '<b>Camera is busy.</b><br>Close other apps using the camera and retry.';
    } else if (err.message === 'NOT_SECURE_CONTEXT') {
      info.innerHTML = '<b>HTTPS required.</b><br>Open this page through the GitHub Pages HTTPS URL.';
    } else {
      info.innerHTML = '<b>Error:</b> ' + (err.name || err.message || err);
    }
    start.disabled = false;
  }
}

start.addEventListener('click', startCamera);

window.addEventListener('pagehide', () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
});
</script>
</body>
</html>
