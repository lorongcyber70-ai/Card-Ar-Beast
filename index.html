<!doctype html>
<html lang="ms">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Card Beast AR — Clean Yaw v42</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* =========================================
   CAMERA VIDEO
========================================= */

video{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;
}

/* =========================================
   A-FRAME
========================================= */

a-scene{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;
}

.a-canvas,
canvas{
  background:transparent!important;
}

/* =========================================
   TOP UI
========================================= */

#ui{
  position:fixed;

  z-index:20;

  top:18px;
  left:0;

  width:100%;

  text-align:center;

  pointer-events:none;
}

.logo{
  font-size:28px;
  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px #000;
}

.logo span{
  color:#b75cff;
}

#status{

  display:inline-block;

  margin-top:12px;

  padding:10px 20px;

  border:1px solid #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.72);

  font-weight:800;

  box-shadow:
    0 0 12px rgba(183,92,255,.25);
}

/* =========================================
   INFO
========================================= */

#info{

  position:fixed;

  z-index:20;

  left:5%;
  right:5%;

  bottom:20px;

  padding:14px 18px;

  border:1px solid #7d35b8;

  border-radius:24px;

  background:rgba(5,0,12,.82);

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;

  box-shadow:
    0 0 18px rgba(125,53,184,.2);
}

.ok{
  color:#68ff9b;
}

.err{
  color:#ff6b6b;
}

</style>
</head>


<body>


<!-- =========================================
     TOP UI
========================================= -->

<div id="ui">

  <div class="logo">
    CARD <span>BEAST</span> AR
  </div>

  <div id="status">
    INITIALISING CAMERA…
  </div>

</div>


<!-- =========================================
     INFO
========================================= -->

<div id="info">
  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.
</div>


<!-- =========================================
     A-FRAME + MINDAR
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind?v=42;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="
    enabled:false
  "

>


  <!-- =======================================
       CAMERA
       KEKAL
  ======================================== -->

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>


  <!-- =======================================
       DR-001 TARGET
       KEKAL
  ======================================== -->

  <a-entity
    id="target"
    mindar-image-target="targetIndex:0"
  >


    <!-- =====================================
         BEAST
         
         KEKAL:
         position 0 0 0
         rotation 0 0 0
         scale 2.5
    ====================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 0 0"

      rotation="0 0 0"

      scale="2.5 2.5 2.5"

    >


      <!-- ===================================
           CLEAN YAW PIVOT

           PUSING KE KANAN PADA WORLD Y

           TIDAK SENTUH ROTATION GLB
      ==================================== -->

      <a-entity

        id="yawPivot"

        position="0 0 0"

        rotation="0 90 0"

        scale="1 1 1"

      >


        <!-- =================================
             DRAGON MODEL

             WAJIB KEKAL:
             rotation="90 0 0"
        ================================== -->

        <a-entity

          id="dragonModel"

          gltf-model="./models/ember-dragon.glb?v=42"

          position="0 0 0"

          rotation="90 0 0"

          scale="1 1 1"

        >
        </a-entity>


      </a-entity>


    </a-entity>


  </a-entity>


</a-scene>


<script>

(function(){


  /* =========================================
     ELEMENTS
  ========================================= */

  const scene =
    document.getElementById('scene');

  const target =
    document.getElementById('target');

  const beast =
    document.getElementById('beast');

  const yawPivot =
    document.getElementById('yawPivot');

  const dragonModel =
    document.getElementById('dragonModel');

  const status =
    document.getElementById('status');

  const info =
    document.getElementById('info');


  /* =========================================
     FIXED SETTINGS
  ========================================= */

  const VERSION = 'v42';

  const WORLD_Y_ROTATION = 90;


  /* =========================================
     STATUS
  ========================================= */

  function setStatus(text, cls){

    status.textContent = text;

    status.className = cls || '';

  }


  /* =========================================
     INFO
  ========================================= */

  function setInfo(html){

    info.innerHTML = html;

  }


  /* =========================================
     A-FRAME LOADED
  ========================================= */

  scene.addEventListener(

    'loaded',

    function(){

      setStatus(
        'CAMERA / AR INITIALISING…'
      );


      setInfo(
        'Loading MindAR target <b>DR-001</b>…'
      );


      console.log(
        '========================================'
      );

      console.log(
        'CARD BEAST AR — CLEAN YAW v42'
      );

      console.log(
        '========================================'
      );

      console.log(
        'A-Frame loaded.'
      );

    }

  );


  /* =========================================
     AR READY
  ========================================= */

  scene.addEventListener(

    'arReady',

    function(){

      setStatus(
        'CAMERA ACTIVE ✓',
        'ok'
      );


      setInfo(
        'Point the rear camera at ' +
        '<b>DR-001 Ember Dragon</b>.'
      );


      console.log(
        'MindAR arReady.'
      );

    }

  );


  /* =========================================
     GLB LOADED
  ========================================= */

  dragonModel.addEventListener(

    'model-loaded',

    function(){

      console.log(
        '========================================'
      );

      console.log(
        'CARD BEAST AR — CLEAN YAW v42'
      );

      console.log(
        '========================================'
      );

      console.log(
        'Target ID: DR-001'
      );

      console.log(
        'Target file: ./targets.mind?v=42'
      );

      console.log(
        'Target index: 0'
      );

      console.log(
        'Model: ./models/ember-dragon.glb?v=42'
      );

      console.log(
        'Beast position: 0 0 0'
      );

      console.log(
        'Beast rotation: 0 0 0'
      );

      console.log(
        'Beast scale: 2.5'
      );

      console.log(
        'Yaw pivot rotation:',
        '0 90 0'
      );

      console.log(
        'Dragon model rotation:',
        '90 0 0'
      );

      console.log(
        'NO quaternion manipulation'
      );

      console.log(
        'NO rotateOnWorldAxis'
      );

      console.log(
        '========================================'
      );


      setInfo(

        '🔥 <b>EMBER DRAGON READY</b><br>' +

        '🟣 3D Ember Dragon active.<br>' +

        'Rotation: Right 90°<br>' +

        'Scale: 2.5'

      );

    }

  );


  /* =========================================
     GLB ERROR
  ========================================= */

  dragonModel.addEventListener(

    'model-error',

    function(event){

      console.error(
        'GLB model error:',
        event
      );


      setStatus(
        'MODEL ERROR',
        'err'
      );


      setInfo(

        '❌ Failed to load ' +

        '<b>ember-dragon.glb</b>.<br>' +

        'Check the models folder and filename.'

      );

    }

  );


  /* =========================================
     TARGET FOUND
  ========================================= */

  target.addEventListener(

    'targetFound',

    function(){

      beast.setAttribute(
        'visible',
        'true'
      );


      setStatus(
        'CARD CONFIRMED • DR-001',
        'ok'
      );


      setInfo(

        '🔥 <b>EMBER DRAGON DETECTED</b><br>' +

        '🟣 3D Ember Dragon active.<br>' +

        'Rotation: Right 90°<br>' +

        'Scale: 2.5'

      );


      console.log(
        'DR-001 targetFound.'
      );

      console.log(
        'Yaw pivot:',
        WORLD_Y_ROTATION,
        'degrees'
      );

    }

  );


  /* =========================================
     TARGET LOST
  ========================================= */

  target.addEventListener(

    'targetLost',

    function(){

      beast.setAttribute(
        'visible',
        'false'
      );


      setStatus(
        'CAMERA ACTIVE ✓',
        'ok'
      );


      setInfo(

        'Point the rear camera at ' +

        '<b>DR-001 Ember Dragon</b>.'

      );


      console.log(
        'DR-001 targetLost.'
      );

    }

  );


  /* =========================================
     AR ERROR
  ========================================= */

  scene.addEventListener(

    'arError',

    function(event){

      console.error(
        'MindAR error:',
        event
      );


      setStatus(
        'AR ERROR',
        'err'
      );


      setInfo(

        'MindAR gagal dimulakan. ' +

        'Kamera mungkin masih tersedia, ' +

        'tetapi AR tidak aktif.'

      );

    }

  );


  /* =========================================
     CAMERA VIDEO LAYER
  ========================================= */

  function fixVideoLayer(){

    document
      .querySelectorAll('video')
      .forEach(

        function(video){

          video.setAttribute(
            'playsinline',
            ''
          );


          video.setAttribute(
            'autoplay',
            ''
          );


          video.muted = true;


          Object.assign(

            video.style,

            {

              position:'fixed',

              inset:'0',

              width:'100%',

              height:'100%',

              objectFit:'cover',

              zIndex:'0',

              display:'block',

              background:'#000'

            }

          );

        }

      );

  }


  /* =========================================
     WATCH FOR MINDAR VIDEO
  ========================================= */

  new MutationObserver(

    fixVideoLayer

  ).observe(

    document.documentElement,

    {

      childList:true,

      subtree:true

    }

  );


  /* =========================================
     INITIAL VIDEO FIX
  ========================================= */

  fixVideoLayer();


  /* =========================================
     FINAL DEBUG
  ========================================= */

  console.log(
    '========================================'
  );

  console.log(
    'CARD BEAST AR — CLEAN YAW v42'
  );

  console.log(
    '========================================'
  );

  console.log(
    'DR-001'
  );

  console.log(
    'targets.mind?v=42'
  );

  console.log(
    'targetIndex: 0'
  );

  console.log(
    'ember-dragon.glb?v=42'
  );

  console.log(
    'beast rotation: 0 0 0'
  );

  console.log(
    'beast scale: 2.5'
  );

  console.log(
    'yawPivot rotation: 0 90 0'
  );

  console.log(
    'dragonModel rotation: 90 0 0'
  );

  console.log(
    'Tracking: MindAR'
  );

  console.log(
    '========================================'
  );


})();

</script>


</body>
</html>
