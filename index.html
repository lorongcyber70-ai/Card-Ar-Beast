<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Card Beast AR — DR-001 Target 0 Test</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:fixed;
    inset:0;
}

#ui{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    width:min(420px,calc(100vw - 24px));
    padding:12px 15px;
    border:1px solid rgba(184,60,255,.75);
    border-radius:16px;
    background:rgba(0,0,0,.50);
    color:#fff;
    text-align:center;
    backdrop-filter:blur(6px);
    pointer-events:none;
}

#title{
    font-size:20px;
    font-weight:900;
}

#title span{
    color:#b83cff;
}

#status{
    margin-top:7px;
    color:#ffd84a;
    font-size:14px;
    font-weight:900;
}

#targetStatus{
    margin-top:5px;
    color:#aaa;
    font-size:12px;
}

#bottom{
    position:fixed;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    z-index:20;
    width:min(520px,calc(100vw - 30px));
    padding:10px 14px;
    border:1px solid rgba(184,60,255,.65);
    border-radius:16px;
    background:rgba(0,0,0,.50);
    color:#fff;
    text-align:center;
    font-size:13px;
    pointer-events:none;
}

.ok{
    color:#59ff9b!important;
}

.error{
    color:#ff6565!important;
}

a-scene{
    width:100vw!important;
    height:100vh!important;
}
</style>
</head>

<body>

<div id="ui">

    <div id="title">
        CARD <span>BEAST</span> AR
    </div>

    <div id="status">
        STARTING...
    </div>

    <div id="targetStatus">
        DR-001 • Target Index 0 • maxTrack 1
    </div>

</div>

<div id="bottom">
    📷 Point the camera at DR-001 Ember Dragon.
</div>


<a-scene
    id="scene"

    embedded

    mindar-image="
        imageTargetSrc:./targets.mind;
        maxTrack:1;
        filterMinCF:0.0001;
        filterBeta:0.01;
        warmupTolerance:5;
        missTolerance:5;
    "

    color-space="sRGB"

    renderer="
        colorManagement:true;
        antialias:true;
        alpha:true;
    "

    vr-mode-ui="
        enabled:false
    "

    device-orientation-permission-ui="
        enabled:true
    "

    loading-screen="
        enabled:false
    "
>

    <a-assets timeout="30000">

        <!-- DR-001 GLB ONLY -->
        <a-asset-item
            id="dragonAsset"
            src="./models/ember-dragon.glb">
        </a-asset-item>

    </a-assets>


    <a-camera
        position="0 0 0"
        look-controls="enabled:false">
    </a-camera>


    <!-- =====================================
         DR-001
         TARGET INDEX 0
         ===================================== -->

    <a-entity
        id="beast0"
        mindar-image-target="targetIndex:0"
        visible="false"
    >

        <!--
            GLB / position / rotation / scale
            copied from the working setup.
        -->

        <a-entity
            id="dragonModel"
            gltf-model="#dragonAsset"
            position="0 -0.25 0"
            rotation="90 0 0"
            scale="2.5 2.5 2.5"
        >
        </a-entity>

    </a-entity>

</a-scene>


<script>

/* =========================================================
   DR-001 ISOLATION TEST

   TARGET:
       DR-001
       targetIndex: 0
       maxTrack: 1

   PURPOSE:
       Separate image-target matching problems
       from MindAR detection problems.

   DO NOT CHANGE:
       GLB
       targetFound logic
       targetLost logic
       position
       rotation
       scale
========================================================= */


const scene =
    document.getElementById("scene");

const target =
    document.getElementById("beast0");

const dragon =
    document.getElementById("dragonModel");

const status =
    document.getElementById("status");

const bottom =
    document.getElementById("bottom");


/* =========================================
   SCENE LOADED
========================================= */

scene.addEventListener(
    "loaded",
    () => {

        status.textContent =
            "MINDAR STARTING...";

        status.className = "";

        console.log(
            "DR-001 TEST: scene loaded"
        );

    }
);


/* =========================================
   AR READY
========================================= */

scene.addEventListener(
    "arReady",
    () => {

        status.textContent =
            "CAMERA READY • SEARCHING";

        status.className =
            "ok";

        bottom.innerHTML =
            "📷 Scan the <b>DR-001 Ember Dragon</b> card.";

        console.log(
            "DR-001 TEST: arReady"
        );

    }
);


/* =========================================
   TARGET FOUND
========================================= */

target.addEventListener(
    "targetFound",
    () => {

        target.setAttribute(
            "visible",
            "true"
        );

        status.textContent =
            "DR-001 FOUND ✓";

        status.className =
            "ok";

        bottom.innerHTML =
            "🐉 <b>EMBER DRAGON DETECTED</b><br>" +
            "Target Index 0 • maxTrack 1";

        console.log(
            "DR-001 TEST: targetFound"
        );

    }
);


/* =========================================
   TARGET LOST
========================================= */

target.addEventListener(
    "targetLost",
    () => {

        target.setAttribute(
            "visible",
            "false"
        );

        status.textContent =
            "CAMERA READY • DR-001 LOST";

        status.className =
            "";

        bottom.innerHTML =
            "📷 Put DR-001 back in the camera frame.";

        console.log(
            "DR-001 TEST: targetLost"
        );

    }
);


/* =========================================
   GLB LOADED
========================================= */

dragon.addEventListener(
    "model-loaded",
    () => {

        console.log(
            "DR-001 TEST: Ember Dragon GLB loaded once"
        );

    },
    {
        once:true
    }
);


/* =========================================
   GLB ERROR
========================================= */

dragon.addEventListener(
    "model-error",
    event => {

        console.error(
            "DR-001 GLB ERROR",
            event
        );

        /*
         * This does NOT mean target detection
         * failed. It only means the model failed
         * to load.
         */

    }
);


/* =========================================
   AR ERROR
========================================= */

scene.addEventListener(
    "arError",
    event => {

        status.textContent =
            "MINDAR ERROR";

        status.className =
            "error";

        bottom.textContent =
            "MindAR failed to initialize.";

        console.error(
            "DR-001 TEST: arError",
            event
        );

    }
);


/* =========================================
   STARTUP LOG
========================================= */

console.log(
    "===================================="
);

console.log(
    "CARD BEAST AR — DR-001 TEST"
);

console.log(
    "Target Index: 0"
);

console.log(
    "maxTrack: 1"
);

console.log(
    "GLB: ember-dragon.glb"
);

console.log(
    "===================================="
);

</script>

</body>
</html>
