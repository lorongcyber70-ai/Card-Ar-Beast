<script>

/* =========================================================
   CARD BEAST AR v66.3

   SPECIAL VFX:
   DR-002 ABYSS TIGER

   CORE AR UNCHANGED
========================================================= */


/* =========================================================
   BEAST DATA
========================================================= */

const beasts=[

{
id:"DR-001",
name:"Ember Dragon",
emoji:"🔥",
target:0,
model:"dragonModel"
},

{
id:"DR-002",
name:"Abyss Tiger",
emoji:"🐯",
target:1,
model:"tigerModel"
},

{
id:"DR-003",
name:"Frost Phoenix",
emoji:"❄️",
target:2,
model:"phoenixModel"
},

{
id:"DR-004",
name:"Puppet Mantis",
emoji:"🦗",
target:3,
model:"mantisModel"
},

{
id:"DR-005",
name:"Tidal Leviathan",
emoji:"🌊",
target:4,
model:"leviathanModel"
}

];


/* =========================================================
   STATE
========================================================= */

const state=
beasts.map(
()=>({

found:false,

loaded:false,

loadCount:0

})
);


/* =========================================================
   DOM
========================================================= */

const scene=
document.getElementById(
"scene"
);

const mainStatus=
document.getElementById(
"mainStatus"
);

const bottom=
document.getElementById(
"bottom"
);


/* =========================================================
   ABYSS RING VFX
========================================================= */

AFRAME.registerComponent(

"abyss-ring-vfx",

{

schema:{

active:{
type:"boolean",
default:false
}

},


init:function(){

this.time=0;

this.parts=[];

this.buildRing();

},


/* =====================================================
   BUILD
===================================================== */

buildRing:function(){

/*
 * MAIN INNER RING
 */

this.ring1=
this.createRing(
0.28,
0.34,
"#ffb52e",
0.95
);


/*
 * WHITE HOT CORE
 */

this.ringCore=
this.createRing(
0.17,
0.205,
"#fff4cf",
0.95
);


/*
 * PURPLE INNER RING
 */

this.ringPurple=
this.createRing(
0.36,
0.385,
"#8f35ff",
0.70
);


/*
 * LARGE ORBIT RING
 */

this.ringOuter=
this.createRing(
0.47,
0.49,
"#ff7a18",
0.58
);


/*
 * SECOND OUTER ENERGY
 */

this.ringOuter2=
this.createRing(
0.55,
0.565,
"#ffca4b",
0.35
);


/*
 * SPARKS
 */

for(
let i=0;
i<18;
i++
){

const spark=
document.createElement(
"a-sphere"
);


spark.setAttribute(
"radius",
randomRange(
0.006,
0.015
)
);


spark.setAttribute(
"material",
{

color:
i%3===0
?
"#ffffff"
:
"#ff8b20",

shader:"standard",

transparent:true,

opacity:
randomRange(.45,.9),

emissive:
i%3===0
?
"#ffffff"
:
"#ff5b00",

emissiveIntensity:
2

}
);


const angle=
Math.random()*
Math.PI*2;


const radius=
randomRange(
0.25,
0.58
);


spark.dataset.angle=
angle;

spark.dataset.radius=
radius;

spark.dataset.height=
randomRange(
0.02,
0.18
);

spark.dataset.phase=
Math.random()*6.28;

spark.dataset.speed=
randomRange(
0.5,
1.25
);


spark.setAttribute(
"visible",
"false"
);


this.el.appendChild(
spark
);

this.parts.push(
spark
);

}


/*
 * DARK INNER DISC
 * very transparent
 */

this.shadow=
document.createElement(
"a-circle"
);

this.shadow.setAttribute(
"radius",
"0.32"
);

this.shadow.setAttribute(
"rotation",
"-90 0 0"
);

this.shadow.setAttribute(
"material",
{

color:"#12000d",

transparent:true,

opacity:.20,

shader:"flat"

}
);

this.shadow.setAttribute(
"visible",
"false"
);

this.el.appendChild(
this.shadow
);

},


/* =====================================================
   RING CREATOR
===================================================== */

createRing:function(
inner,
outer,
color,
opacity
){

const ring=
document.createElement(
"a-ring"
);

ring.setAttribute(
"radius-inner",
inner
);

ring.setAttribute(
"radius-outer",
outer
);

ring.setAttribute(
"rotation",
"-90 0 0"
);

ring.setAttribute(
"material",
{

color:color,

shader:"flat",

transparent:true,

opacity:opacity

}
);

ring.setAttribute(
"visible",
"false"
);

this.el.appendChild(
ring
);

return ring;

},


/* =====================================================
   ACTIVE
===================================================== */

setActive:function(
active
){

this.active=
active;

this.el.setAttribute(
"visible",
active
);

this.ring1.setAttribute(
"visible",
active
);

this.ringCore.setAttribute(
"visible",
active
);

this.ringPurple.setAttribute(
"visible",
active
);

this.ringOuter.setAttribute(
"visible",
active
);

this.ringOuter2.setAttribute(
"visible",
active
);

this.shadow.setAttribute(
"visible",
active
);


this.parts.forEach(
part=>{

part.setAttribute(
"visible",
active
);

}
);

},


/* =====================================================
   ANIMATION
===================================================== */

tick:function(
time,
delta
){

if(
!this.active
){

return;

}


this.time+=
delta*0.001;


const t=
this.time;


/*
 * Main ring
 */

this.ring1.object3D.rotation.z=
t*1.8;


this.ringCore.object3D.rotation.z=
-t*2.6;


this.ringPurple.object3D.rotation.z=
t*1.25;


this.ringOuter.object3D.rotation.z=
-t*.85;


this.ringOuter2.object3D.rotation.z=
t*.55;


/*
 * Pulse
 */

const pulse=
1+
Math.sin(
t*3.5
)*.055;


this.ring1.object3D.scale.set(
pulse,
pulse,
pulse
);


const corePulse=
1+
Math.sin(
t*5
)*.08;


this.ringCore.object3D.scale.set(
corePulse,
corePulse,
corePulse
);


/*
 * Outer pulse
 */

const outerPulse=
1+
Math.sin(
t*2.1
)*.06;


this.ringOuter.object3D.scale.set(
outerPulse,
outerPulse,
outerPulse
);


/*
 * Sparks
 */

this.parts.forEach(
spark=>{

const angle=
Number(
spark.dataset.angle
)+
t*
Number(
spark.dataset.speed
);

const radius=
Number(
spark.dataset.radius
);

const phase=
Number(
spark.dataset.phase
);

let y=
Number(
spark.dataset.height
);


/*
 * Sparks slowly rise
 */

y+=
(
Math.sin(
t*1.8+
phase
)+1
)*.11;


/*
 * Slight spiral
 */

const r=
radius+
Math.sin(
t*2+
phase
)*.025;


spark.object3D.position.x=
Math.cos(angle)*r;


spark.object3D.position.z=
Math.sin(angle)*r;


spark.object3D.position.y=
y;


/*
 * Fade/pulse
 */

const s=
0.7+
(
Math.sin(
t*4+
phase
)+1
)*.25;

spark.object3D.scale.set(
s,
s,
s
);

}
);

}

}

);


/* =========================================================
   RANDOM
========================================================= */

function randomRange(
min,
max
){

return min+
Math.random()*
(max-min);

}


/* =========================================================
   CAMERA LAYER
   v66.0 UNCHANGED
========================================================= */

function forceCameraLayer(){

const videos=
document.querySelectorAll(
"video"
);


videos.forEach(
video=>{

video.classList.add(
"mindar-video"
);


video.style.setProperty(
"position",
"fixed",
"important"
);


video.style.setProperty(
"top",
"0",
"important"
);


video.style.setProperty(
"left",
"0",
"important"
);


video.style.setProperty(
"width",
"100vw",
"important"
);


video.style.setProperty(
"height",
"100vh",
"important"
);


video.style.setProperty(
"min-width",
"100vw",
"important"
);


video.style.setProperty(
"min-height",
"100vh",
"important"
);


video.style.setProperty(
"object-fit",
"cover",
"important"
);


video.style.setProperty(
"display",
"block",
"important"
);


video.style.setProperty(
"visibility",
"visible",
"important"
);


video.style.setProperty(
"opacity",
"1",
"important"
);


video.style.setProperty(
"z-index",
"0",
"important"
);


video.style.setProperty(
"pointer-events",
"none",
"important"
);


if(
video.paused &&
video.srcObject
){

video.play()
.catch(
()=>{}
);

}

}
);


const canvas=
document.querySelector(
"a-scene canvas"
);


if(canvas){

canvas.style.setProperty(
"position",
"fixed",
"important"
);

canvas.style.setProperty(
"top",
"0",
"important"
);

canvas.style.setProperty(
"left",
"0",
"important"
);

canvas.style.setProperty(
"width",
"100vw",
"important"
);

canvas.style.setProperty(
"height",
"100vh",
"important"
);

canvas.style.setProperty(
"background",
"transparent",
"important"
);

canvas.style.setProperty(
"background-color",
"transparent",
"important"
);

canvas.style.setProperty(
"z-index",
"1",
"important"
);

}


try{

if(
scene &&
scene.renderer
){

const renderer=
scene.renderer;


if(
renderer.setClearColor
){

renderer.setClearColor(
0x000000,
0
);

}


if(
renderer.setClearAlpha
){

renderer.setClearAlpha(
0
);

}

}

}
catch(error){

console.warn(
"Renderer transparency patch:",
error
);

}

}


/* =========================================================
   VIDEO OBSERVER
========================================================= */

const videoObserver=
new MutationObserver(
()=>{

forceCameraLayer();

}
);


videoObserver.observe(

document.body,

{
childList:true,
subtree:true
}

);


/* =========================================================
   BADGE
========================================================= */

function setBadge(
index,
text,
className
){

const element=
document.getElementById(
"target"+index
);


if(!element){

return;

}


element.textContent=
text;

element.className=
className;

}


/* =========================================================
   ABYSS VFX CONTROL
========================================================= */

function setAbyssVFX(
active
){

const entity=
document.getElementById(
"abyssVFX"
);


if(
!entity ||
!entity.components ||
!entity.components[
"abyss-ring-vfx"
]
){

return;

}


entity.components[
"abyss-ring-vfx"
].setActive(
active
);

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

const active=
beasts.filter(
(beast,index)=>
state[index].found
);


if(
active.length===0
){

mainStatus.textContent=
"CAMERA READY • SEARCHING";

bottom.textContent=
"📷 Point camera at any Card Beast target.";

return;

}


if(
active.length===1
){

const beast=
active[0];


mainStatus.textContent=
`${beast.id} FOUND • ${beast.name.toUpperCase()}`;


bottom.innerHTML=
`${beast.emoji} <b>${beast.name.toUpperCase()} ACTIVE</b> • ${beast.id}`;

return;

}


mainStatus.textContent=
`${active.length} CARDS ACTIVE • `+
active.map(
beast=>beast.id
).join(" + ");


bottom.innerHTML=
`${active.map(
beast=>
beast.emoji+
" "+
beast.id
).join(" + ")} ACTIVE`;

}


/* =========================================================
   PRELOAD
========================================================= */

function setupPreload(){

beasts.forEach(
(beast,index)=>{

const model=
document.getElementById(
beast.model
);


if(!model){

console.error(
beast.id+
" model element missing"
);

return;

}


model.addEventListener(

"model-loaded",

()=>{

if(
state[index].loaded
){

return;

}


state[index].loaded=
true;

state[index].loadCount++;


console.log(
beast.id+
" GLB PRELOADED ONCE"
);

},

{
once:true
}

);


model.addEventListener(

"model-error",

event=>{

console.error(
beast.id+
" GLB LOAD ERROR",
event
);


setBadge(
index,
"GLB ERROR",
"err"
);

}

);

}
);

}


/* =========================================================
   TARGET SETUP
========================================================= */

function setupTarget(
index
){

const beast=
beasts[index];


const target=
document.getElementById(
"beast"+index
);


if(!target){

console.error(
beast.id+
" target entity missing"
);

return;

}


/* =====================================================
   TARGET FOUND
===================================================== */

target.addEventListener(

"targetFound",

()=>{

state[index].found=
true;


target.setAttribute(
"visible",
"true"
);


/*
 * DR-002 ONLY
 */

if(
index===1
){

setAbyssVFX(
true
);

}


setBadge(
index,
"FOUND",
"on"
);


updateUI();


console.log(
beast.id+
" targetFound"
);

}
);


/* =====================================================
   TARGET LOST
===================================================== */

target.addEventListener(

"targetLost",

()=>{

state[index].found=
false;


target.setAttribute(
"visible",
"false"
);


/*
 * DR-002 ONLY
 */

if(
index===1
){

setAbyssVFX(
false
);

}


setBadge(
index,
"LOST",
"wait"
);


updateUI();


console.log(
beast.id+
" targetLost"
);

}
);

}


/* =========================================================
   SCENE LOADED
========================================================= */

scene.addEventListener(

"loaded",

()=>{

console.log(
"CARD BEAST AR v66.3 SCENE LOADED"
);


beasts.forEach(
(_,index)=>{

setupTarget(
index
);

}
);


setupPreload();


forceCameraLayer();

}
);


/* =========================================================
   AR READY
========================================================= */

scene.addEventListener(

"arReady",

()=>{

console.log(
"MINDAR CAMERA READY"
);


const cameraState=
document.getElementById(
"cameraState"
);


if(cameraState){

cameraState.textContent=
"READY";

cameraState.className=
"on";

}


mainStatus.textContent=
"CAMERA READY • SEARCHING";


bottom.textContent=
"📷 Point camera at any Card Beast target.";


forceCameraLayer();


setTimeout(
forceCameraLayer,
100
);


setTimeout(
forceCameraLayer,
300
);


setTimeout(
forceCameraLayer,
700
);


setTimeout(
forceCameraLayer,
1200
);


setTimeout(
forceCameraLayer,
2000
);

}
);


/* =========================================================
   AR ERROR
========================================================= */

scene.addEventListener(

"arError",

event=>{

console.error(
"MINDAR AR ERROR",
event
);


const cameraState=
document.getElementById(
"cameraState"
);


if(cameraState){

cameraState.textContent=
"ERROR";

cameraState.className=
"err";

}


mainStatus.textContent=
"CAMERA ERROR";


bottom.textContent=
"Camera could not start.";

}
);


/* =========================================================
   WINDOW LOAD
========================================================= */

window.addEventListener(

"load",

()=>{

forceCameraLayer();


setTimeout(
forceCameraLayer,
300
);


setTimeout(
forceCameraLayer,
800
);


setTimeout(
forceCameraLayer,
1500
);

}
);


/* =========================================================
   CONTINUOUS CAMERA PROTECTION
========================================================= */

setInterval(

()=>{

forceCameraLayer();

},

1000

);


/* =========================================================
   INITIAL UI
========================================================= */

beasts.forEach(

(_,index)=>{

setBadge(
index,
"WAIT",
"wait"
);

}

);

</script>

</body>

</html>
