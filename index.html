<!doctype html>
<html lang="ms">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Card Beast AR — Diagnostic v41.1</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* =========================================
   CAMERA VIDEO
========================================= */

video{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  object-fit:cover!important;

  z-index:0!important;

  display:block!important;

  background:#000!important;
}

/* =========================================
   A-FRAME
========================================= */

a-scene{
  position:fixed!important;
  inset:0!important;

  width:100%!important;
  height:100%!important;

  z-index:1!important;

  background:transparent!important;
}

.a-canvas,
canvas{
  background:transparent!important;
}

/* =========================================
   TOP UI
========================================= */

#ui{
  position:fixed;

  z-index:20;

  top:18px;
  left:0;

  width:100%;

  text-align:center;

  pointer-events:none;
}

.logo{
  font-size:28px;
  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px #000;
}

.logo span{
  color:#b75cff;
}

#status{

  display:inline-block;

  margin-top:12px;

  padding:10px 20px;

  border:1px solid #b75cff;

  border-radius:30px;

  color:#68ff9b;

  background:rgba(5,0,12,.72);

  font-weight:800;

  box-shadow:
    0 0 12px rgba(183,92,255,.25);
}

#status.error{
  color:#ff6b6b;
}

#status.loading{
  color:#ffd76b;
}

/* =========================================
   INFO
========================================= */

#info{

  position:fixed;

  z-index:20;

  left:5%;
  right:5%;

  bottom:20px;

  padding:14px 18px;

  border:1px solid #7d35b8;

  border-radius:24px;

  background:rgba(5,0,12,.82);

  color:#fff;

  text-align:center;

  font-size:17px;

  line-height:1.45;

  pointer-events:none;

  box-shadow:
    0 0 18px rgba(125,53,184,.2);
}

.ok{
  color:#68ff9b;
}

.err{
  color:#ff6b6b;
}

</style>
</head>


<body>

<!-- =========================================
     TOP UI
========================================= -->

<div id="ui">

  <div class="logo">
    CARD <span>BEAST</span> AR
  </div>

  <div id="status">
    INITIALISING CAMERA…
  </div>

</div>


<!-- =========================================
     INFO
========================================= -->

<div id="info">

  Point the rear camera at
  <b>DR-001 Ember Dragon</b>.

</div>


<!-- =========================================
     A-FRAME + MINDAR
========================================= -->

<a-scene

  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  device-orientation-permission-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true
  "

  mindar-image="
    imageTargetSrc:./targets.mind?v=41.1;
    autoStart:true;
    uiScanning:false;
    uiLoading:false;
    uiError:false
  "

  color-space="sRGB"

  loading-screen="
    enabled:false
  "

>


  <!-- =======================================
       CAMERA
       KEKAL
  ======================================== -->

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>


  <!-- =======================================
       DR-001 TARGET
       KEKAL
  ======================================== -->

  <a-entity
    id="target"
    mindar-image-target="targetIndex:0"
  >


    <!-- =====================================
         BEAST PARENT

         KEKAL:
         rotation = 0 0 0
         scale = 2.5
    ====================================== -->

    <a-entity

      id="beast"

      visible="false"

      position="0 0 0"

      rotation="0 0 0"

      scale="2.5 2.5 2.5"

    >


      <!-- ===================================
           DRAGON MODEL

           BASE ROTATION:
           90 0 0

           WORLD Y:
           +90 DEGREE
      ==================================== -->

      <a-entity

        id="dragonModel"

        gltf-model="./models/ember-dragon.glb?v=41.1"

        position="0 0 0"

        rotation="90 0 0"

        scale="1 1 1"

      >
      </a-entity>


    </a-entity>


  </a-entity>


</a-scene>


<script>

(function(){

  /* =========================================
     ELEMENTS
  ========================================= */

  const scene =
    document.getElementById('scene');

  const target =
    document.getElementById('target');

  const beast =
    document.getElementById('beast');

  const dragonModel =
    document.getElementById('dragonModel');

  const status =
    document.getElementById('status');

  const info =
    document.getElementById('info');


  /* =========================================
     SETTINGS
  ========================================= */

  const WORLD_Y_DEGREES = 90;

  let modelLoaded = false;

  let modelError = false;

  let worldRotationApplied = false;


  /* =========================================
     STATUS
  ========================================= */

  function setStatus(text, type){

    status.textContent = text;

    status.className = type || '';

  }


  /* =========================================
     INFO
  ========================================= */

  function setInfo(html){

    info.innerHTML = html;

  }


  /* =========================================
     APPLY WORLD Y ROTATION
     
     BASE:
     90 0 0

     WORLD Y:
     +90°
  ========================================= */

  function applyWorldYRotation(){

    if(worldRotationApplied){

      return;

    }


    if(
      !dragonModel ||
      !dragonModel.object3D
    ){

      console.warn(
        'dragonModel.object3D belum tersedia.'
      );

      return;

    }


    const THREE = window.THREE;

    if(!THREE){

      console.error(
        'THREE.js tidak tersedia.'
      );

      return;

    }


    const obj =
      dragonModel.object3D;


    /*
      Pastikan base orientation
      ialah 90 0 0.
    */

    obj.rotation.set(

      THREE.MathUtils.degToRad(90),

      0,

      0

    );


    obj.updateMatrixWorld(true);


    /*
      Pusing menggunakan WORLD Y.

      Ini bukan local Y.
    */

    obj.rotateOnWorldAxis(

      new THREE.Vector3(0,1,0),

      THREE.MathUtils.degToRad(
        WORLD_Y_DEGREES
      )

    );


    obj.updateMatrixWorld(true);


    worldRotationApplied = true;


    console.log(
      '========================================'
    );

    console.log(
      'WORLD Y ROTATION APPLIED'
    );

    console.log(
      'Base model rotation: 90 0 0'
    );

    console.log(
      'World Y rotation:',
      WORLD_Y_DEGREES
    );

    console.log(
      '========================================'
    );

  }


  /* =========================================
     A-FRAME LOADED
  ========================================= */

  scene.addEventListener(

    'loaded',

    function(){

      setStatus(
        'CAMERA / AR INITIALISING…',
        'loading'
      );


      setInfo(
        'Loading MindAR target <b>DR-001</b>…'
      );


      console.log(
        'A-Frame loaded.'
      );

    }

  );


  /* =========================================
     AR READY
  ========================================= */

  scene.addEventListener(

    'arReady',

    function(){

      /*
        Jangan overwrite MODEL ERROR.
      */

      if(!modelError){

        setStatus(
          'CAMERA ACTIVE ✓',
          'ok'
        );

      }


      if(!modelLoaded){

        setInfo(
          'Camera active.<br>' +
          'Loading <b>ember-dragon.glb</b>…'
        );

      }


      console.log(
        'MindAR arReady.'
      );

    }

  );


  /* =========================================
     GLB LOADED
  ========================================= */

  dragonModel.addEventListener(

    'model-loaded',

    function(){

      modelLoaded = true;

      modelError = false;


      console.log(
        '========================================'
      );

      console.log(
        'GLB LOADED SUCCESSFULLY ✓'
      );

      console.log(
        'CARD BEAST AR — DIAGNOSTIC v41.1'
      );

      console.log(
        'Model: ./models/ember-dragon.glb'
      );

      console.log(
        'Target: DR-001'
      );

      console.log(
        'Target index: 0'
      );

      console.log(
        'Beast rotation: 0 0 0'
      );

      console.log(
        'Beast scale: 2.5'
      );

      console.log(
        'Dragon base rotation: 90 0 0'
      );

      console.log(
        'World Y rotation:',
        WORLD_Y_DEGREES
      );

      console.log(
        '========================================'
      );


      /*
        Apply rotation selepas GLB
        benar-benar siap.
      */

      applyWorldYRotation();


      setStatus(
        'GLB LOADED ✓',
        'ok'
      );


      setInfo(

        '🔥 <b>EMBER DRAGON READY</b><br>' +

        '🟢 GLB loaded successfully.<br>' +

        'Rotation: Right 90°<br>' +

        'Scale: 2.5'

      );

    }

  );


  /* =========================================
     GLB ERROR
  ========================================= */

  dragonModel.addEventListener(

    'model-error',

    function(event){

      modelError = true;

      modelLoaded = false;


      console.error(
        '========================================'
      );

      console.error(
        'GLB MODEL ERROR ✕'
      );

      console.error(
        event
      );

      console.error(
        'Model path:',
        './models/ember-dragon.glb?v=41.1'
      );

      console.error(
        '========================================'
      );


      setStatus(
        'MODEL ERROR ✕',
        'error'
      );


      setInfo(

        '❌ <b>EMBER DRAGON GLB ERROR</b><br>' +

        'Fail tidak berjaya dimuatkan.<br>' +

        '<small>' +

        './models/ember-dragon.glb' +

        '</small>'

      );

    }

  );


  /* =========================================
     TARGET FOUND
     
     IMPORTANT:
     Jangan overwrite MODEL ERROR.
  ========================================= */

  target.addEventListener(

    'targetFound',

    function(){

      console.log(
        'DR-001 targetFound.'
      );


      /*
        Kalau GLB belum loaded,
        jangan terus anggap model active.
      */

      if(!modelLoaded){

        beast.setAttribute(
          'visible',
          'false'
        );


        if(modelError){

          setStatus(
            'MODEL ERROR ✕',
            'error'
          );


          setInfo(

            '❌ <b>DR-001 DETECTED</b><br>' +

            'Tetapi Ember Dragon GLB gagal dimuatkan.'

          );

        }else{

          setStatus(
            'LOADING 3D MODEL…',
            'loading'
          );


          setInfo(

            '🔥 <b>DR-001 DETECTED</b><br>' +

            'Loading 3D Ember Dragon…'

          );

        }


        return;

      }


      /*
        GLB sudah loaded.
      */

      applyWorldYRotation();


      beast.setAttribute(
        'visible',
        'true'
      );


      setStatus(
        'CARD CONFIRMED • DR-001',
        'ok'
      );


      setInfo(

        '🔥 <b>EMBER DRAGON DETECTED</b><br>' +

        '🟣 3D Ember Dragon active.<br>' +

        'Rotation: Right 90°<br>' +

        'Scale: 2.5'

      );

    }

  );


  /* =========================================
     TARGET LOST
  ========================================= */

  target.addEventListener(

    'targetLost',

    function(){

      beast.setAttribute(
        'visible',
        'false'
      );


      if(modelError){

        setStatus(
          'MODEL ERROR ✕',
          'error'
        );

        setInfo(
          '❌ Ember Dragon GLB failed to load.'
        );

      }else{

        setStatus(
          'CAMERA ACTIVE ✓',
          'ok'
        );


        setInfo(

          'Point the rear camera at ' +

          '<b>DR-001 Ember Dragon</b>.'

        );

      }


      console.log(
        'DR-001 targetLost.'
      );

    }

  );


  /* =========================================
     AR ERROR
  ========================================= */

  scene.addEventListener(

    'arError',

    function(event){

      console.error(
        'MindAR error:',
        event
      );


      setStatus(
        'AR ERROR',
        'error'
      );


      setInfo(

        'MindAR gagal dimulakan. ' +

        'Kamera mungkin masih tersedia, ' +

        'tetapi AR tidak aktif.'

      );

    }

  );


  /* =========================================
     CAMERA VIDEO LAYER
  ========================================= */

  function fixVideoLayer(){

    document
      .querySelectorAll('video')
      .forEach(

        function(video){

          video.setAttribute(
            'playsinline',
            ''
          );


          video.setAttribute(
            'autoplay',
            ''
          );


          video.muted = true;


          Object.assign(

            video.style,

            {

              position:'fixed',

              inset:'0',

              width:'100%',

              height:'100%',

              objectFit:'cover',

              zIndex:'0',

              display:'block',

              background:'#000'

            }

          );

        }

      );

  }


  /* =========================================
     WATCH FOR MINDAR VIDEO
  ========================================= */

  new MutationObserver(

    fixVideoLayer

  ).observe(

    document.documentElement,

    {

      childList:true,

      subtree:true

    }

  );


  /* =========================================
     INITIAL VIDEO FIX
  ========================================= */

  fixVideoLayer();


  /* =========================================
     DIAGNOSTIC TIMEOUT
     
     Kalau selepas 10 saat GLB
     tak beri loaded/error event.
  ========================================= */

  setTimeout(

    function(){

      if(
        !modelLoaded &&
        !modelError
      ){

        console.warn(
          'GLB masih belum memberi model-loaded atau model-error selepas 10 saat.'
        );


        setStatus(
          'GLB LOADING…',
          'loading'
        );


        setInfo(

          '⏳ <b>EMBER DRAGON</b><br>' +

          'GLB masih loading…<br>' +

          '<small>' +

          './models/ember-dragon.glb?v=41.1' +

          '</small>'

        );

      }

    },

    10000

  );


  /* =========================================
     DEBUG
  ========================================= */

  console.log(
    '========================================'
  );

  console.log(
    'CARD BEAST AR — DIAGNOSTIC v41.1'
  );

  console.log(
    '========================================'
  );

  console.log(
    'Target ID: DR-001'
  );

  console.log(
    'Target file: ./targets.mind?v=41.1'
  );

  console.log(
    'targetIndex: 0'
  );

  console.log(
    'Model: ./models/ember-dragon.glb?v=41.1'
  );

  console.log(
    'Beast position: 0 0 0'
  );

  console.log(
    'Beast rotation: 0 0 0'
  );

  console.log(
    'Dragon model rotation: 90 0 0'
  );

  console.log(
    'World Y rotation: 90 degrees'
  );

  console.log(
    'Beast scale: 2.5'
  );

  console.log(
    'Tracking: MindAR'
  );

  console.log(
    'Cache bust: v41.1'
  );

  console.log(
    '========================================'
  );


})();

</script>

</body>

</html>
